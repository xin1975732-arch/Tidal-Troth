款簿的封皮里揭出一张当票。", "ch": 10, "who": ["linheng", "fanxiaoman"]}, {"k": "2026-02-19", "era": "now", "d": "大年初三", "t": "十碗头", "s": "范小满坐在林家父子中间，把鱼肚和蟹钳各自放回去。", "ch": 12, "who": ["fanxiaoman", "linheng", "linjianguo", "linmu"]}, {"k": "2026-02-21", "era": "now", "d": "大年初五", "t": "老先生走了", "s": "范小满本想问他认不认得沈阿根。过了年再问吧，她那天这样想。", "ch": 12, "who": ["laoxiansheng", "fanxiaoman"]}, {"k": "2026-03-02", "era": "now", "d": "三月初", "t": "三百一十二个勾", "s": "书作为遗产被拉去嘉禾。林衡答应外派马六甲。", "ch": 13, "who": ["shenhao", "fanxiaoman", "linheng", "luxingzhou"]}, {"k": "2026-03-05", "era": "now", "d": "大雾那天", "t": "龙门吊", "s": "四十米高的驾驶室里，父子把话说开。林衡给郑总发了一条消息。", "ch": 14, "who": ["linheng", "linjianguo"]}, {"k": "2026-03-06", "era": "now", "d": "第三天", "t": "存折", "s": "日记封皮里揭出秀英的存折，最后一行：阿根归，止。", "ch": 15, "who": ["fanxiaoman", "linheng"]}, {"k": "2026-03-08", "era": "now", "d": "又过两天", "t": "后人", "s": "沈浩认出存折上的户名。书不拆了，那块布不卖。", "ch": 17, "who": ["shenhao", "linheng", "fanxiaoman", "luxingzhou"]}, {"k": "2026-03-16", "era": "now", "d": "礼拜一 六点半", "t": "越级", "s": "码头上的十分钟。整批收购通过；外派一年改成三年。", "ch": 18, "who": ["linheng", "zhengzong", "hebuzhang"]}, {"k": "2026-04-04", "era": "now", "d": "清明前一天", "t": "江北老码头", "s": "吵了一架。她说不去上海了。那边的海，你帮我看看，是不是这个颜色。", "ch": 19, "who": ["linheng", "fanxiaoman", "fanmu"]}, {"k": "2026-04-05", "era": "now", "d": "清明", "t": "起飞", "s": "林衡飞往马六甲。同一时刻，范小满揭开日记的下一页。", "ch": 19, "who": ["linheng", "fanxiaoman"]}, {"k": "2026-06", "era": "now", "d": "六月", "t": "日记最后一页", "s": "马六甲那边回了四个字：船头朝里。", "ch": 20, "who": ["fanxiaoman", "linheng"]}, {"k": "2026-10", "era": "now", "d": "十月", "t": "文化馆开馆", "s": "日记、存折和修堤账并排展出。林建国的名字印在冷箱那块展板上。", "ch": 20, "who": ["linjianguo", "shenhao", "fanxiaoman"]}, {"k": "2027-04-03", "era": "now", "d": "第二年 四月三号", "t": "我在你家门口", "s": "她飞去马六甲，他回了明州。两条消息前后差了不到一分钟。", "ch": 20, "who": ["fanxiaoman", "linheng", "linmu"]}, {"k": "2027-04-07", "era": "now", "d": "四月七号", "t": "林衡归，止", "s": "机场，一本存折，一年的工资，最后一行是他自己的笔迹。", "ch": 20, "who": ["linheng", "fanxiaoman"]}]}, "chapters": [{"n": 1, "cn": "一", "title": "台风天", "era": "", "chars": 4304, "mins": 11, "html": "<p data-p=\"0\">明州人对台风的态度，跟打工人对领导画饼差不多：听得多了，就不太当回事。<\/p>\n<p data-p=\"1\">所以当气象台发布红色预警的时候，<b class=\"rn\" data-c=\"linheng\">林衡<\/b>正坐在公司十七楼，盯着屏幕上的方案，像盯着一张永远也兑不了现的汇票。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"2\">事情要从晚上八点说起。<\/p>\n<p data-p=\"3\">八点，领导说方案要改，感觉还差点意思。九点半，林衡改完了，领导说，再大气一点。十点四十，林衡把方案改得气吞山河，连他自己都快不认识了。领导看了五分钟，回复了一句话：<\/p>\n<p data-p=\"4\">“要不，还是用第一版吧。”<\/p>\n<p data-p=\"5\">林衡在财务部干了六年，早就摸清了规律：方案改到第五版，最后用的，总是第一版。中间那几版，跟账上的暂估差不多：记上去，再冲回来，账面干干净净，只有记账的人知道自己白忙了一场。<\/p>\n<p data-p=\"6\">林衡把那五个字又读了一遍，没有回。他发现，人的愤怒到了某个程度，就会自动转化成一种慈悲，像寺庙里的老和尚，看什么都觉得众生皆苦。<\/p>\n<p data-p=\"7\">部门群里，领导又发了一句：“台风来了，大家注意安全。”后面跟着一个竖大拇指的表情包。<\/p>\n<p data-p=\"8\">同事<b class=\"rn\" data-c=\"xiaozhou\">小周<\/b>回复：“老板，我家楼下已经能划船了，请问在船上改方案，算居家办公还是算出差？”<\/p>\n<p data-p=\"9\">领导没回。三十秒后，小周撤回了。又过了三十秒，他私聊林衡：<\/p>\n<p data-p=\"10\">“刚才那条，领导看见没有？”<\/p>\n<p data-p=\"11\">“看见了。”林衡回。<\/p>\n<p data-p=\"12\">“你怎么知道？”<\/p>\n<p data-p=\"13\">“他回消息，向来三秒钟一个大拇指。”林衡说，“这回过了三十秒，什么也没有。”<\/p>\n<p data-p=\"14\">小周回了一串省略号，又补了一句：“衡哥，你这双眼睛，不去当审计可惜了。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"15\">十一点，林衡打开打车软件。前面排队：三百八十七位。<\/p>\n<p data-p=\"16\">十分钟后，前面还有三百八十五位。林衡在心里算了一下：照这个速度，他能赶上后天的早饭。<\/p>\n<p data-p=\"17\">就在这时，手机连震三下，他母亲发来三条六十秒的语音。<\/p>\n<p data-p=\"18\">林衡母亲的语音，是一种自然现象，比台风准时，比潮汐规律，而且从不提前预警。他点开第一条：<\/p>\n<p data-p=\"19\">“衡衡啊，台风天千万不要出门啊！带鱼收到没有，赶紧冻起来。还有上次说的那个小姑娘，人家有编制的，你加了没有？台风天正好，大家都在家里，跑也跑不掉，你跟人家聊聊天，嘘寒问暖一下，问问她家窗户关好没有……”<\/p>\n<p data-p=\"20\">林衡没有点开第二条。根据经验，第二条会讲那位姑娘的身高和她妈妈的单位，第三条会讲他自己的年龄，并附上一个具体的数字。那个数字每年都会变大，而且永远比他自己感觉到的要大。<\/p>\n<p data-p=\"21\">林衡今年二十九岁，相过十四次亲。<\/p>\n<p data-p=\"22\">前十三次的失败，原因各不相同。第十四次的失败，原因只有一个：对方客气地问他，平时都做些什么。<\/p>\n<p data-p=\"23\">他说，他喜欢研究民国时期浙江的田赋改革。<\/p>\n<p data-p=\"24\">然后他讲了四十分钟。<\/p>\n<p data-p=\"25\">姑娘中途说去一趟洗手间，到现在也没回来。<\/p>\n<p data-p=\"26\">从那以后，林衡在相亲时只承认一项消遣：散步。<\/p>\n<p data-p=\"27\">于是他决定散步回家。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"28\">他的伞，是在第三个路口阵亡的。<\/p>\n<p data-p=\"29\">它跟了他四年，经历过梅雨、雷阵雨和一次公司团建的泼水节，从没叫过一声苦。今晚它只坚持了七分钟，就在一阵横风里翻过身去，露出全部的伞骨，像一只被掀翻的螃蟹。林衡扶了它三次，它翻了三次。他终于明白，这把伞是想辞职。<\/p>\n<p data-p=\"30\">他把伞收起来，夹在胳膊底下，像夹着一张没批下来的报销单。雨劈头盖脸地浇下来。<\/p>\n<p data-p=\"31\">淋了两分钟，他想通了一件事：人一旦湿透了，就不怕雨了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"32\">眉湖边的老街已经成了一条河。一辆共享单车从他身边漂过，车筐里坐着一只塑料袋，姿态松弛，仿佛在夜游眉湖。一家小店的卷帘门上贴着一张纸，被雨泡得字迹模糊，依稀能认出：台风天照常营业。本店海鲜，不怕水。<\/p>\n<p data-p=\"33\">林衡蹚着水往前走，经过一座老墙门的时候，看见院子深处有一束光在晃。<\/p>\n<p data-p=\"34\">深夜，暴雨，百年老宅，一束来历不明的光。<\/p>\n<p data-p=\"35\">林衡看过的恐怖片，开头都是这么拍的。他一共看过两部，两部都没看完。<\/p>\n<p data-p=\"36\">他的脑子里迅速列出了三种可能：<\/p>\n<p data-p=\"37\">一，小偷。<\/p>\n<p data-p=\"38\">二，在搞“台风夜探老宅”的直播博主。<\/p>\n<p data-p=\"39\">三，不是人。<\/p>\n<p data-p=\"40\">他掏出手机，想搜一下“台风天在老宅看见可疑光源怎么办”，发现没有信号了。<\/p>\n<p data-p=\"41\">这让他更倾向于第三种可能。<\/p>\n<p data-p=\"42\">林衡是那种打电话之前要先打草稿的人。他站在门口，在心里排练了三个版本的开场白。第一版太冷漠，第二版太热情，第三版听起来像物业通知。最后他用了第四版，也就是什么都没排练过的那一版：<\/p>\n<p data-p=\"43\">“那个……请问，需要帮您报警吗？”<\/p>\n<p data-p=\"44\">光束猛地扫过来，晃得他睁不开眼。<\/p>\n<p data-p=\"45\">“你是搬家公司的？”一个女声问。<\/p>\n<p data-p=\"46\">“我是……路过的。”<\/p>\n<p data-p=\"47\">“路过的好，”对方说，“路过的不收钱。能下来搭把手吗？”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"48\">地下室的水已经齐膝。<\/p>\n<p data-p=\"49\">女人穿着一件明黄色的雨衣，头上戴着一只头灯，怀里抱着一摞书。在这样的夜里，穿明黄色雨衣出现的人，要么是外卖骑手，要么是恐怖片女主角。<\/p>\n<p data-p=\"50\">她看出了他的犹豫，单手从雨衣里摸出一张工作证，在他眼前一亮：<\/p>\n<p data-p=\"51\">“别怕，我是一水阁的。是人。”<\/p>\n<p data-p=\"52\">林衡借着手机电筒的光一看：一水阁，古籍修复部，<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>。<\/p>\n<p data-p=\"53\">“这家<b class=\"rn\" data-c=\"laoxiansheng\">老先生<\/b>是我们的捐赠人，人在医院，托我来救书。”<\/p>\n<p data-p=\"54\">林衡看了看证件照，又看了看本人。<\/p>\n<p data-p=\"55\">“照片比本人……”<\/p>\n<p data-p=\"56\">“你最好想清楚了再说。”<\/p>\n<p data-p=\"57\">“……更干燥。”<\/p>\n<p data-p=\"58\">范小满没理他，把一摞书递过来，开始交代。她说话的速度，大约相当于正常人开了二倍速：<\/p>\n<p data-p=\"59\">“平着拿，别按，千万别翻页。湿纸比豆腐还脆。你就当自己端着一碗刚出锅的猪油汤圆，满的，烫的，一滴都不能洒。”<\/p>\n<p data-p=\"60\">林衡的手一下子稳了，稳得像端着全家人的年夜饭，从厨房走到饭桌，身后跟着他母亲的目光。<\/p>\n<p data-p=\"61\">范小满看了他一眼：“你是明州人吧？”<\/p>\n<p data-p=\"62\">“你怎么知道？”<\/p>\n<p data-p=\"63\">“外地人端汤圆，没有这么虔诚。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"64\">接下来一个多小时，两人来回搬书。<\/p>\n<p data-p=\"65\">范小满一直在说话。她从这批书是什么年代的，说到老先生年轻时怎么一本一本从旧书摊上淘来；从古人用什么药草防虫，说到她研究生论文写的是什么；从她导师有多严格，说到她导师那只猫叫什么名字，以及那只猫最近为什么不肯吃饭。<\/p>\n<p data-p=\"66\">林衡尝试插话七次，成功零次。<\/p>\n<p data-p=\"67\">第八次，他张开嘴，还没出声，范小满忽然停下来，盯着他：“你是不是嫌我话多？”<\/p>\n<p data-p=\"68\">“没有。”<\/p>\n<p data-p=\"69\">“那你为什么一直张嘴，又闭上？”<\/p>\n<p data-p=\"70\">林衡想了想，说：“我在找缝。”<\/p>\n<p data-p=\"71\">“什么缝？”<\/p>\n<p data-p=\"72\">“说话的缝。”<\/p>\n<p data-p=\"73\">范小满张着嘴停了两秒，笑出了声，头灯的光在墙上乱晃。笑完了，她接着往下说，一条缝也没给他留。<\/p>\n<p data-p=\"74\">林衡的奶奶管这种人叫“饭泡粥”，一锅饭泡成了粥，咕嘟咕嘟冒个不停。他一向怕这样的人，觉得和他们待在一起，就像站在一台永远不关机的收音机旁边。可今晚这台收音机有点不一样：它播的全是他听不懂的东西，却播得那么热烈，好像这世上除了这些泡了水的旧书，再没有更要紧的事。<\/p>\n<p data-p=\"75\">搬到一半，她的手机响了。她腾不出手，让他帮忙按了免提。<\/p>\n<p data-p=\"76\">电话那头是一个苍老的声音，气若游丝：<\/p>\n<p data-p=\"77\">“小范啊……书怎么样了？”<\/p>\n<p data-p=\"78\">“老先生您放心，正在搬呢！”<\/p>\n<p data-p=\"79\">“樟木箱里的……务必先救。别的都可以泡，那个不行。”<\/p>\n<p data-p=\"80\">“老先生，书都不能泡！”<\/p>\n<p data-p=\"81\">电话那头沉默了一下。<\/p>\n<p data-p=\"82\">“那个，”老人说，“更不行。”<\/p>\n<p data-p=\"83\">挂了电话，范小满指了指角落里一只黑沉沉的樟木箱。箱子一半泡在水里，铜扣已经锈了。两人一起把它抬上台阶，箱子出奇地沉。<\/p>\n<p data-p=\"84\">“里面装的什么？”林衡问。<\/p>\n<p data-p=\"85\">“不知道，”范小满说，“老先生不让问。”<\/p>\n<p data-p=\"86\">林衡回头看了那只箱子一眼。他对两种东西天生好奇：一是没人看得懂的旧账本，二是不让人问的箱子。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"87\">最后一摞书搬上来，已经快一点了。两人并排坐在台阶上。林衡是累得说不出话，范小满只是暂停了一下。<\/p>\n<p data-p=\"88\">“谢谢你啊，”她说，“你叫什么？”<\/p>\n<p data-p=\"89\">“林衡。”<\/p>\n<p data-p=\"90\">“在哪上班？”<\/p>\n<p data-p=\"91\">“港口集团。”<\/p>\n<p data-p=\"92\">“港口？”范小满的眼睛一下子亮了，像夜航的船看见了灯塔，“那你们，有冷库吗？”<\/p>\n<p data-p=\"93\">她说得飞快：泡了水的古书，要马上冷冻，冻住了纸就不霉，以后再一页一页解冻了修。可一水阁的冷库已经满了，还停了电。四十八小时之内找不到地方，这三百多册，就救不回来了。<\/p>\n<p data-p=\"94\">林衡知道港区有冷藏集装箱，也知道那些箱子每一只都排着货、登着记，调用一次要层层审批。<\/p>\n<p data-p=\"95\">那一刻，他脑子里自动弹出了一张审批流程图：申请人，运营部，安全科，分管领导，一共四个签字。现在是凌晨一点，四个人都在睡觉。<\/p>\n<p data-p=\"96\">他把这张流程图翻译成了人话：<\/p>\n<p data-p=\"97\">“箱子不归我管，我说了不算。私自去调，是违规的。真出了事，书坏了，或者被查出来，我担不起。”<\/p>\n<p data-p=\"98\">他说完，等着。<\/p>\n<p data-p=\"99\">他准备好了被求，也准备好了被骂。按照他二十九年的人生经验，一个人走投无路时被拒绝，通常会选这两样中的一样。<\/p>\n<p data-p=\"100\">范小满一样都没选。<\/p>\n<p data-p=\"101\">她抿了一下嘴，点点头：“也是。是我想多了，你别为难。”<\/p>\n<p data-p=\"102\">她站起来，拍了拍雨衣上的水，冲他笑了一下：“今晚已经很麻烦你了。你快回去吧，别着凉。”<\/p>\n<p data-p=\"103\">说完，她转过身，掏出手机，去打下一个电话。<\/p>\n<p data-p=\"104\">拨号的时候，她已经给这个人下好了结论。她给人下结论，向来三句话就够，很少改：一扇关得严严实实的窗。挡风，也挡光。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"105\">林衡往外走了几步，停下，又走了两步，又停下。<\/p>\n<p data-p=\"106\">一个外卖小哥推着电瓶车从水里蹚过来，看了他半天，忍不住问：“哥们，你是在走路，还是在加载？”<\/p>\n<p data-p=\"107\">林衡没理他，转身走了回去。<\/p>\n<p data-p=\"108\">“那个，”他说，“港区工会有个应急志愿者群，台风天专门对接外面的求助。有的单位走公益的路子，说不定能申请到冷库。我把群主的电话给你。”<\/p>\n<p data-p=\"109\">范小满抬起头。<\/p>\n<p data-p=\"110\">“群主姓周，脾气有点急，你跟他说清楚是一水阁的。一定要让他们走正规手续，别给人家添麻烦。”<\/p>\n<p data-p=\"111\">范小满接过他的手机，抄下号码，抬头看了他一眼。<\/p>\n<p data-p=\"112\">“林衡，”她说，“你这个人挺怪的。”<\/p>\n<p data-p=\"113\">“哪里怪？”<\/p>\n<p data-p=\"114\">“拒绝人的时候，比帮人还认真。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"115\">同一时刻，港区冷箱堆场。<\/p>\n<p data-p=\"116\">四十米高的龙门吊驾驶室里，五十八岁的<b class=\"rn\" data-c=\"linjianguo\">林建国<\/b>正在吃今晚的第二桶泡面。他的安全帽挂在一旁，帽子上贴着一张褪了色的贴纸：安全第一，老婆第二。<\/p>\n<p data-p=\"117\">这张贴纸是他老婆十年前买的，两块钱一张，一买一整版。他当时嫌丢人，骂了三天，第四天就贴上了。港区的安全标语有几十条，挂在龙门吊腿上的，刷在堆场地上的，印在饭卡背面的。工友们一致认为，最深入人心的是老林帽子上这一条，因为只有这一条，说的是实话。<\/p>\n<p data-p=\"118\">手机震了一下。港区工会应急志愿者群里，群主老周转发了一条求助，附着几张照片：一摞摞泡了水的旧书摊在老宅的台阶上，旁边坐着一个穿黄色雨衣的姑娘，抱着膝盖，头灯还亮着。<\/p>\n<p data-p=\"119\">老周写：“一水阁求助，需要冷库冻书，四十八小时内。哪位有办法？”<\/p>\n<p data-p=\"120\">群里安静了三分钟。<\/p>\n<p data-p=\"121\">然后有人发了一个“抱抱”。有人说，台风天哪还有空箱。有人问，书冻了还能看吗，能不能先拍几页发群里，他替大家看看。还有人发了一根蜡烛，被老周当场骂了回去：人家书还没死！<\/p>\n<p data-p=\"122\">林建国放下泡面，看了看窗外。<\/p>\n<p data-p=\"123\">东边第三排，有一只冷箱上周报了检修，其实早就修好了，只是单子还没走完，一直空在那里，制冷照开着。<\/p>\n<p data-p=\"124\">他在群里回了一句：“我这儿有只箱子空着，让那姑娘把书拉过来。”<\/p>\n<p data-p=\"125\">几秒钟后，一个陌生号码打了进来。电话那头的姑娘声音又急又哑，说了一长串谢谢，最后小心翼翼地问：“叔叔，这个是走正规手续的吧？会不会给您添麻烦？”<\/p>\n<p data-p=\"126\">林建国瞅了一眼那只冷箱，箱门上贴着一张“待检修”的标签，在探照灯下白得晃眼。<\/p>\n<p data-p=\"127\">“放心吧，”他说，“手续我来办。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"128\">那天夜里，林衡回到家，冲了个热水澡，在十二点五十五分准时躺下。<\/p>\n<p data-p=\"129\">从任何角度看，他今晚都没做错什么。可他闭上眼睛，眼前却是那只樟木箱，和那个转身去打电话的背影。他翻了个身，对自己说：明天还要上班。<\/p>", "paras": ["明州人对台风的态度，跟打工人对领导画饼差不多：听得多了，就不太当回事。", "所以当气象台发布红色预警的时候，林衡正坐在公司十七楼，盯着屏幕上的方案，像盯着一张永远也兑不了现的汇票。", "事情要从晚上八点说起。", "八点，领导说方案要改，感觉还差点意思。九点半，林衡改完了，领导说，再大气一点。十点四十，林衡把方案改得气吞山河，连他自己都快不认识了。领导看了五分钟，回复了一句话：", "“要不，还是用第一版吧。”", "林衡在财务部干了六年，早就摸清了规律：方案改到第五版，最后用的，总是第一版。中间那几版，跟账上的暂估差不多：记上去，再冲回来，账面干干净净，只有记账的人知道自己白忙了一场。", "林衡把那五个字又读了一遍，没有回。他发现，人的愤怒到了某个程度，就会自动转化成一种慈悲，像寺庙里的老和尚，看什么都觉得众生皆苦。", "部门群里，领导又发了一句：“台风来了，大家注意安全。”后面跟着一个竖大拇指的表情包。", "同事小周回复：“老板，我家楼下已经能划船了，请问在船上改方案，算居家办公还是算出差？”", "领导没回。三十秒后，小周撤回了。又过了三十秒，他私聊林衡：", "“刚才那条，领导看见没有？”", "“看见了。”林衡回。", "“你怎么知道？”", "“他回消息，向来三秒钟一个大拇指。”林衡说，“这回过了三十秒，什么也没有。”", "小周回了一串省略号，又补了一句：“衡哥，你这双眼睛，不去当审计可惜了。”", "十一点，林衡打开打车软件。前面排队：三百八十七位。", "十分钟后，前面还有三百八十五位。林衡在心里算了一下：照这个速度，他能赶上后天的早饭。", "就在这时，手机连震三下，他母亲发来三条六十秒的语音。", "林衡母亲的语音，是一种自然现象，比台风准时，比潮汐规律，而且从不提前预警。他点开第一条：", "“衡衡啊，台风天千万不要出门啊！带鱼收到没有，赶紧冻起来。还有上次说的那个小姑娘，人家有编制的，你加了没有？台风天正好，大家都在家里，跑也跑不掉，你跟人家聊聊天，嘘寒问暖一下，问问她家窗户关好没有……”", "林衡没有点开第二条。根据经验，第二条会讲那位姑娘的身高和她妈妈的单位，第三条会讲他自己的年龄，并附上一个具体的数字。那个数字每年都会变大，而且永远比他自己感觉到的要大。", "林衡今年二十九岁，相过十四次亲。", "前十三次的失败，原因各不相同。第十四次的失败，原因只有一个：对方客气地问他，平时都做些什么。", "他说，他喜欢研究民国时期浙江的田赋改革。", "然后他讲了四十分钟。", "姑娘中途说去一趟洗手间，到现在也没回来。", "从那以后，林衡在相亲时只承认一项消遣：散步。", "于是他决定散步回家。", "他的伞，是在第三个路口阵亡的。", "它跟了他四年，经历过梅雨、雷阵雨和一次公司团建的泼水节，从没叫过一声苦。今晚它只坚持了七分钟，就在一阵横风里翻过身去，露出全部的伞骨，像一只被掀翻的螃蟹。林衡扶了它三次，它翻了三次。他终于明白，这把伞是想辞职。", "他把伞收起来，夹在胳膊底下，像夹着一张没批下来的报销单。雨劈头盖脸地浇下来。", "淋了两分钟，他想通了一件事：人一旦湿透了，就不怕雨了。", "眉湖边的老街已经成了一条河。一辆共享单车从他身边漂过，车筐里坐着一只塑料袋，姿态松弛，仿佛在夜游眉湖。一家小店的卷帘门上贴着一张纸，被雨泡得字迹模糊，依稀能认出：台风天照常营业。本店海鲜，不怕水。", "林衡蹚着水往前走，经过一座老墙门的时候，看见院子深处有一束光在晃。", "深夜，暴雨，百年老宅，一束来历不明的光。", "林衡看过的恐怖片，开头都是这么拍的。他一共看过两部，两部都没看完。", "他的脑子里迅速列出了三种可能：", "一，小偷。", "二，在搞“台风夜探老宅”的直播博主。", "三，不是人。", "他掏出手机，想搜一下“台风天在老宅看见可疑光源怎么办”，发现没有信号了。", "这让他更倾向于第三种可能。", "林衡是那种打电话之前要先打草稿的人。他站在门口，在心里排练了三个版本的开场白。第一版太冷漠，第二版太热情，第三版听起来像物业通知。最后他用了第四版，也就是什么都没排练过的那一版：", "“那个……请问，需要帮您报警吗？”", "光束猛地扫过来，晃得他睁不开眼。", "“你是搬家公司的？”一个女声问。", "“我是……路过的。”", "“路过的好，”对方说，“路过的不收钱。能下来搭把手吗？”", "地下室的水已经齐膝。", "女人穿着一件明黄色的雨衣，头上戴着一只头灯，怀里抱着一摞书。在这样的夜里，穿明黄色雨衣出现的人，要么是外卖骑手，要么是恐怖片女主角。", "她看出了他的犹豫，单手从雨衣里摸出一张工作证，在他眼前一亮：", "“别怕，我是一水阁的。是人。”", "林衡借着手机电筒的光一看：一水阁，古籍修复部，范小满。", "“这家老先生是我们的捐赠人，人在医院，托我来救书。”", "林衡看了看证件照，又看了看本人。", "“照片比本人……”", "“你最好想清楚了再说。”", "“……更干燥。”", "范小满没理他，把一摞书递过来，开始交代。她说话的速度，大约相当于正常人开了二倍速：", "“平着拿，别按，千万别翻页。湿纸比豆腐还脆。你就当自己端着一碗刚出锅的猪油汤圆，满的，烫的，一滴都不能洒。”", "林衡的手一下子稳了，稳得像端着全家人的年夜饭，从厨房走到饭桌，身后跟着他母亲的目光。", "范小满看了他一眼：“你是明州人吧？”", "“你怎么知道？”", "“外地人端汤圆，没有这么虔诚。”", "接下来一个多小时，两人来回搬书。", "范小满一直在说话。她从这批书是什么年代的，说到老先生年轻时怎么一本一本从旧书摊上淘来；从古人用什么药草防虫，说到她研究生论文写的是什么；从她导师有多严格，说到她导师那只猫叫什么名字，以及那只猫最近为什么不肯吃饭。", "林衡尝试插话七次，成功零次。", "第八次，他张开嘴，还没出声，范小满忽然停下来，盯着他：“你是不是嫌我话多？”", "“没有。”", "“那你为什么一直张嘴，又闭上？”", "林衡想了想，说：“我在找缝。”", "“什么缝？”", "“说话的缝。”", "范小满张着嘴停了两秒，笑出了声，头灯的光在墙上乱晃。笑完了，她接着往下说，一条缝也没给他留。", "林衡的奶奶管这种人叫“饭泡粥”，一锅饭泡成了粥，咕嘟咕嘟冒个不停。他一向怕这样的人，觉得和他们待在一起，就像站在一台永远不关机的收音机旁边。可今晚这台收音机有点不一样：它播的全是他听不懂的东西，却播得那么热烈，好像这世上除了这些泡了水的旧书，再没有更要紧的事。", "搬到一半，她的手机响了。她腾不出手，让他帮忙按了免提。", "电话那头是一个苍老的声音，气若游丝：", "“小范啊……书怎么样了？”", "“老先生您放心，正在搬呢！”", "“樟木箱里的……务必先救。别的都可以泡，那个不行。”", "“老先生，书都不能泡！”", "电话那头沉默了一下。", "“那个，”老人说，“更不行。”", "挂了电话，范小满指了指角落里一只黑沉沉的樟木箱。箱子一半泡在水里，铜扣已经锈了。两人一起把它抬上台阶，箱子出奇地沉。", "“里面装的什么？”林衡问。", "“不知道，”范小满说，“老先生不让问。”", "林衡回头看了那只箱子一眼。他对两种东西天生好奇：一是没人看得懂的旧账本，二是不让人问的箱子。", "最后一摞书搬上来，已经快一点了。两人并排坐在台阶上。林衡是累得说不出话，范小满只是暂停了一下。", "“谢谢你啊，”她说，“你叫什么？”", "“林衡。”", "“在哪上班？”", "“港口集团。”", "“港口？”范小满的眼睛一下子亮了，像夜航的船看见了灯塔，“那你们，有冷库吗？”", "她说得飞快：泡了水的古书，要马上冷冻，冻住了纸就不霉，以后再一页一页解冻了修。可一水阁的冷库已经满了，还停了电。四十八小时之内找不到地方，这三百多册，就救不回来了。", "林衡知道港区有冷藏集装箱，也知道那些箱子每一只都排着货、登着记，调用一次要层层审批。", "那一刻，他脑子里自动弹出了一张审批流程图：申请人，运营部，安全科，分管领导，一共四个签字。现在是凌晨一点，四个人都在睡觉。", "他把这张流程图翻译成了人话：", "“箱子不归我管，我说了不算。私自去调，是违规的。真出了事，书坏了，或者被查出来，我担不起。”", "他说完，等着。", "他准备好了被求，也准备好了被骂。按照他二十九年的人生经验，一个人走投无路时被拒绝，通常会选这两样中的一样。", "范小满一样都没选。", "她抿了一下嘴，点点头：“也是。是我想多了，你别为难。”", "她站起来，拍了拍雨衣上的水，冲他笑了一下：“今晚已经很麻烦你了。你快回去吧，别着凉。”", "说完，她转过身，掏出手机，去打下一个电话。", "拨号的时候，她已经给这个人下好了结论。她给人下结论，向来三句话就够，很少改：一扇关得严严实实的窗。挡风，也挡光。", "林衡往外走了几步，停下，又走了两步，又停下。", "一个外卖小哥推着电瓶车从水里蹚过来，看了他半天，忍不住问：“哥们，你是在走路，还是在加载？”", "林衡没理他，转身走了回去。", "“那个，”他说，“港区工会有个应急志愿者群，台风天专门对接外面的求助。有的单位走公益的路子，说不定能申请到冷库。我把群主的电话给你。”", "范小满抬起头。", "“群主姓周，脾气有点急，你跟他说清楚是一水阁的。一定要让他们走正规手续，别给人家添麻烦。”", "范小满接过他的手机，抄下号码，抬头看了他一眼。", "“林衡，”她说，“你这个人挺怪的。”", "“哪里怪？”", "“拒绝人的时候，比帮人还认真。”", "同一时刻，港区冷箱堆场。", "四十米高的龙门吊驾驶室里，五十八岁的林建国正在吃今晚的第二桶泡面。他的安全帽挂在一旁，帽子上贴着一张褪了色的贴纸：安全第一，老婆第二。", "这张贴纸是他老婆十年前买的，两块钱一张，一买一整版。他当时嫌丢人，骂了三天，第四天就贴上了。港区的安全标语有几十条，挂在龙门吊腿上的，刷在堆场地上的，印在饭卡背面的。工友们一致认为，最深入人心的是老林帽子上这一条，因为只有这一条，说的是实话。", "手机震了一下。港区工会应急志愿者群里，群主老周转发了一条求助，附着几张照片：一摞摞泡了水的旧书摊在老宅的台阶上，旁边坐着一个穿黄色雨衣的姑娘，抱着膝盖，头灯还亮着。", "老周写：“一水阁求助，需要冷库冻书，四十八小时内。哪位有办法？”", "群里安静了三分钟。", "然后有人发了一个“抱抱”。有人说，台风天哪还有空箱。有人问，书冻了还能看吗，能不能先拍几页发群里，他替大家看看。还有人发了一根蜡烛，被老周当场骂了回去：人家书还没死！", "林建国放下泡面，看了看窗外。", "东边第三排，有一只冷箱上周报了检修，其实早就修好了，只是单子还没走完，一直空在那里，制冷照开着。", "他在群里回了一句：“我这儿有只箱子空着，让那姑娘把书拉过来。”", "几秒钟后，一个陌生号码打了进来。电话那头的姑娘声音又急又哑，说了一长串谢谢，最后小心翼翼地问：“叔叔，这个是走正规手续的吧？会不会给您添麻烦？”", "林建国瞅了一眼那只冷箱，箱门上贴着一张“待检修”的标签，在探照灯下白得晃眼。", "“放心吧，”他说，“手续我来办。”", "那天夜里，林衡回到家，冲了个热水澡，在十二点五十五分准时躺下。", "从任何角度看，他今晚都没做错什么。可他闭上眼睛，眼前却是那只樟木箱，和那个转身去打电话的背影。他翻了个身，对自己说：明天还要上班。"], "recap": ""}, {"n": 2, "cn": "二", "title": "好人好事", "era": "", "chars": 2815, "mins": 8, "html": "<p data-p=\"0\">台风过后第十三天，一水阁的公众号发了一篇文章，标题叫《台风夜，一只集装箱救下三百册古籍》。<\/p>\n<p data-p=\"1\">文章写得很好。暴雨，停电，四十八小时的生死时速，一位“港口集团工会的志愿者师傅”在凌晨一点打开冷箱，接下了三百多册泡了水的古书。配图是凌晨的冷箱堆场，灯光昏黄，一个穿反光背心的男人背对镜头，弯腰把一摞书递进箱子里。文末，一水阁向港口集团致以最诚挚的感谢。<\/p>\n<p data-p=\"2\">头一天，阅读量三千出头。在一水阁公众号的历史上，这已经算是爆款了。<\/p>\n<p data-p=\"3\">第二天，事情变了。台风才过去两个礼拜，满城还在说那场风。市里的官方号把这篇文章转了，配了一句：泡了水的古书，为什么要送进冷库？很多明州人这才头一回知道，书泡了水不能晒，得先冻起来。一个科普博主拿这件事拍了条短视频，又把原文带火了一轮。<\/p>\n<p data-p=\"4\">第三天早上，原文的阅读量过了十万。<\/p>\n<p data-p=\"5\">评论区里，有人说“这就是明州人的温度”，有人说“这才是国企该有的样子”，有人说看完就把家里的旧书箱子挪到了柜顶上，还有人建议拍成电影，片名都想好了，叫《冰冻三尺》。点赞最多的一条是：“求问这位师傅家里还缺儿媳妇吗？我自己来也行。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"6\">港口集团的宣传部高兴坏了。<\/p>\n<p data-p=\"7\">宣传部一年到头都在找正面典型。今年报上去的几个，一个是“连续加班三十天”，一个是“带病坚持工作”，还有一个是“孩子发烧也没请假”。市里看了直摇头，说你们报的这不是先进，是工伤。<\/p>\n<p data-p=\"8\">现在，一个现成的、有温度的、自带十万阅读量的好人好事，从天上掉了下来。<\/p>\n<p data-p=\"9\">当天下午就开了会。分管领导拍板：要表彰，要宣传，要报送市里的文明典型。<\/p>\n<p data-p=\"10\">宣传部长翻开材料，问了一个很自然的问题：“那只冷箱的调用审批，是谁批的？咱们把流程也写进去，体现制度和温度的结合。”<\/p>\n<p data-p=\"11\">会议室里安静了大约十秒钟。<\/p>\n<p data-p=\"12\">十秒钟里，每个人都低头看着自己面前的茶杯，好像答案就泡在茶叶里。<\/p>\n<p data-p=\"13\">运营部说，他们没批过。工会说，他们只负责转发求助。冷箱堆场说，那只箱子在系统里，显示的是“待检修”。<\/p>\n<p data-p=\"14\">领导们交换了一下眼神，达成共识：材料要完善，流程要补齐。至于由谁去补，财务部的<b class=\"rn\" data-c=\"sunzhuren\">孙主任<\/b>环顾一圈，目光像探照灯一样扫过整个会议室，最后停在了坐在最后一排的<b class=\"rn\" data-c=\"linheng\">林衡<\/b>身上。<\/p>\n<p data-p=\"15\">“小林，你细心，你去查一下，把手续理顺。”<\/p>\n<p data-p=\"16\">林衡说：“好的。”<\/p>\n<p data-p=\"17\">话一出口，他就后悔了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"18\">回到工位，林衡点开那篇文章，把配图放大。<\/p>\n<p data-p=\"19\">照片里的男人背对镜头，看不清脸。但他的安全帽挂在一旁的箱门上，帽檐上贴着一张褪色的贴纸。<\/p>\n<p data-p=\"20\">林衡把照片放大，再放大，放大到像素都成了马赛克，那几个字还是认得出来：安全第一，老婆第二。<\/p>\n<p data-p=\"21\">全港区几千顶安全帽，只有一顶贴着这句话。因为全明州，只有一个女人会花两块钱买这种贴纸，还逼着丈夫一贴就是十年。<\/p>\n<p data-p=\"22\">林衡把照片缩回原样，又放大了一遍。<\/p>\n<p data-p=\"23\"><b class=\"rn\" data-c=\"xiaozhou\">小周<\/b>端着咖啡路过，停下来看了他十秒钟。<\/p>\n<p data-p=\"24\">“衡哥，你脸色不对啊，跟被领导已读不回了一样。”<\/p>\n<p data-p=\"25\">“比那个严重。”<\/p>\n<p data-p=\"26\">“那是什么？”<\/p>\n<p data-p=\"27\">林衡想了想：“被亲爹已读不回了。”<\/p>\n<p data-p=\"28\">小周看了他一眼，端着咖啡走了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"29\">晚饭是在父母家吃的。<\/p>\n<p data-p=\"30\">他母亲做了一桌菜，一边盛饭，一边把手机推到他面前：“你看看这个，咱们港口的，多好的人啊！你爸单位的，说不定你爸还认识呢。”<\/p>\n<p data-p=\"31\">他父亲低着头剥蟹，剥得极其专注，好像那只蟹欠了他钱。<\/p>\n<p data-p=\"32\">“爸，”林衡说，“你认识吗？”<\/p>\n<p data-p=\"33\">“港口几千号人，”<b class=\"rn\" data-c=\"linjianguo\">林建国<\/b>头也不抬，“我哪认识得过来。”<\/p>\n<p data-p=\"34\">林衡点点头，转向他母亲：“妈，你买的那张贴纸，还有别人贴吗？”<\/p>\n<p data-p=\"35\">他母亲的饭勺停在半空。她拿过手机，眯着眼睛把照片放大，看了三秒钟。<\/p>\n<p data-p=\"36\">然后她放下手机，慢慢转向她的丈夫。<\/p>\n<p data-p=\"37\">林建国把剥好的蟹肉放进她碗里：“吃蟹，吃蟹，凉了就腥了。”<\/p>\n<p data-p=\"38\">“林建国。”<\/p>\n<p data-p=\"39\">“哎。”<\/p>\n<p data-p=\"40\">“你上电视了，都不跟我说？”<\/p>\n<p data-p=\"41\">“不是电视，是公众号。”<\/p>\n<p data-p=\"42\">“公众号也是号！”他母亲一拍桌子，“十万个人看过你的背影，我是第十万零一个知道的！”<\/p>\n<p data-p=\"43\">林衡低头吃饭。他觉得这顿饭的走向，已经超出了他的处理能力。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"44\">饭后，父子俩站在阳台上。楼下的广场舞换了一首歌，节奏更快了，像在催人表态。<\/p>\n<p data-p=\"45\">“手续，”林衡说，“那天晚上你说你来办。你办了吗？”<\/p>\n<p data-p=\"46\">“在办。”<\/p>\n<p data-p=\"47\">“办到哪一步了？”<\/p>\n<p data-p=\"48\">林建国想了想：“办到……想办的那一步。”<\/p>\n<p data-p=\"49\">林衡闭了闭眼。<\/p>\n<p data-p=\"50\">“那只箱子是公司的。”<\/p>\n<p data-p=\"51\">“那只箱子空着也是空着。”林建国说，“书泡烂了，就没了。几百年的东西，没了就是没了，再也找不回来。箱子明天还能装别的。”<\/p>\n<p data-p=\"52\">“可那是违规的。”<\/p>\n<p data-p=\"53\">“我知道是违规的。”他父亲说得很平静，“我在港口三十年，什么是违规，我比你清楚。”<\/p>\n<p data-p=\"54\">楼下的音乐又换了一首，更欢快了。<\/p>\n<p data-p=\"55\">“我这辈子，就请过一次长假，”林建国看着楼下，“那年我摔了腰。除了那一次，港口离了我一天都不行，我离了港口也一天都不行。”<\/p>\n<p data-p=\"56\">林衡把手搭在栏杆上，没有接话。那一年的事，家里没人提。<\/p>\n<p data-p=\"57\">“你是不知道，”林建国又说，“那天晚上那个姑娘在电话里，声音都哑了，一个劲儿地说谢谢，还怕给我添麻烦。我一听就知道，她是真着急，不是为她自己。”他在栏杆上磕了磕烟灰，“她还跟我说，是一个小伙子给她指的路。说那小伙子人挺好，就是死板了点。”<\/p>\n<p data-p=\"58\">林衡没吭声。<\/p>\n<p data-p=\"59\">“你说现在的年轻人，”他父亲感慨道，“是不是都这样？人是好人，就是不肯多走一步。”<\/p>\n<p data-p=\"60\">林衡看着楼下跳舞的人群，觉得自己应该说点什么。说“那个小伙子就是我”，太像认罪；说“你说得对”，太像投降。最后他什么也没说，跟他爸一起看楼下的人跳舞。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"61\">那天晚上，林衡把事情从头到尾想了一遍。<\/p>\n<p data-p=\"62\">如果照实上报，表彰就会变成通报，好人好事就会变成违规操作。他父亲在港口干了三十年，没出过一次差错，到头来要在档案里留下一笔。<\/p>\n<p data-p=\"63\">如果不上报，材料就必须补齐。而要补齐，只有一条路：一水阁先出一份正式的求助函，港口再补一份援助的审批，前后对得上，事情才能说圆。<\/p>\n<p data-p=\"64\">也就是说，他得去求那个姑娘。<\/p>\n<p data-p=\"65\">林衡最不擅长的事情有两件，一是拒绝别人，二是求别人。上一次，他对她做了前一件；这一次，命运要他对同一个人做后一件。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"66\">第二天上午，他去了一水阁。<\/p>\n<p data-p=\"67\">古籍修复室在一栋不起眼的小楼里。他推开门的时候，<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>正伏在桌前，手里捏着一把竹起子，对着一页发黄的纸，屏着呼吸，一动不动。<\/p>\n<p data-p=\"68\">那个在台风夜里一个半小时没停过嘴的人，此刻安静得像一幅画。<\/p>\n<p data-p=\"69\">林衡没敢出声，在门口站着等了三分钟。<\/p>\n<p data-p=\"70\">三分钟后，她直起身，长出一口气，这才看见他。她认出了他，表情从惊讶变成礼貌，又从礼貌变成一种不太明显的警惕。<\/p>\n<p data-p=\"71\">“是你啊。”她说，“你们公司派你来的？”<\/p>\n<p data-p=\"72\">“嗯。”<\/p>\n<p data-p=\"73\">“送锦旗？”<\/p>\n<p data-p=\"74\">“不是。”林衡说，“补手续。”<\/p>\n<p data-p=\"75\">范小满脸上的那点礼貌，也收了回去。<\/p>\n<p data-p=\"76\">“我就知道。”她放下竹起子，“文章一发出去，你们公司就该着急了吧？冷箱是谁开的，有没有审批，要不要有人担责任。”她看着他，“你是来查那位林师傅的？”<\/p>\n<p data-p=\"77\">“我是来请你帮个忙。”<\/p>\n<p data-p=\"78\">“帮你们查他？”<\/p>\n<p data-p=\"79\">“帮他把手续补上。”<\/p>\n<p data-p=\"80\">范小满皱起眉：“你为什么要帮他？”<\/p>\n<p data-p=\"81\">林衡来之前，在心里排练了三个版本的说辞。第一版太卑微，第二版太官方，第三版听起来像在念单位通知。此刻她看着他，那眼神像是已经替他判了刑，只等他自己认罪。<\/p>\n<p data-p=\"82\">他一个版本也没用上。<\/p>\n<p data-p=\"83\">“因为，”他说，“林师傅是我爸。”<\/p>\n<p data-p=\"84\">范小满张了张嘴，什么也没说出来。她的手指在桌沿上按了一下，像按住一张正要翘起来的纸。<\/p>", "paras": ["台风过后第十三天，一水阁的公众号发了一篇文章，标题叫《台风夜，一只集装箱救下三百册古籍》。", "文章写得很好。暴雨，停电，四十八小时的生死时速，一位“港口集团工会的志愿者师傅”在凌晨一点打开冷箱，接下了三百多册泡了水的古书。配图是凌晨的冷箱堆场，灯光昏黄，一个穿反光背心的男人背对镜头，弯腰把一摞书递进箱子里。文末，一水阁向港口集团致以最诚挚的感谢。", "头一天，阅读量三千出头。在一水阁公众号的历史上，这已经算是爆款了。", "第二天，事情变了。台风才过去两个礼拜，满城还在说那场风。市里的官方号把这篇文章转了，配了一句：泡了水的古书，为什么要送进冷库？很多明州人这才头一回知道，书泡了水不能晒，得先冻起来。一个科普博主拿这件事拍了条短视频，又把原文带火了一轮。", "第三天早上，原文的阅读量过了十万。", "评论区里，有人说“这就是明州人的温度”，有人说“这才是国企该有的样子”，有人说看完就把家里的旧书箱子挪到了柜顶上，还有人建议拍成电影，片名都想好了，叫《冰冻三尺》。点赞最多的一条是：“求问这位师傅家里还缺儿媳妇吗？我自己来也行。”", "港口集团的宣传部高兴坏了。", "宣传部一年到头都在找正面典型。今年报上去的几个，一个是“连续加班三十天”，一个是“带病坚持工作”，还有一个是“孩子发烧也没请假”。市里看了直摇头，说你们报的这不是先进，是工伤。", "现在，一个现成的、有温度的、自带十万阅读量的好人好事，从天上掉了下来。", "当天下午就开了会。分管领导拍板：要表彰，要宣传，要报送市里的文明典型。", "宣传部长翻开材料，问了一个很自然的问题：“那只冷箱的调用审批，是谁批的？咱们把流程也写进去，体现制度和温度的结合。”", "会议室里安静了大约十秒钟。", "十秒钟里，每个人都低头看着自己面前的茶杯，好像答案就泡在茶叶里。", "运营部说，他们没批过。工会说，他们只负责转发求助。冷箱堆场说，那只箱子在系统里，显示的是“待检修”。", "领导们交换了一下眼神，达成共识：材料要完善，流程要补齐。至于由谁去补，财务部的孙主任环顾一圈，目光像探照灯一样扫过整个会议室，最后停在了坐在最后一排的林衡身上。", "“小林，你细心，你去查一下，把手续理顺。”", "林衡说：“好的。”", "话一出口，他就后悔了。", "回到工位，林衡点开那篇文章，把配图放大。", "照片里的男人背对镜头，看不清脸。但他的安全帽挂在一旁的箱门上，帽檐上贴着一张褪色的贴纸。", "林衡把照片放大，再放大，放大到像素都成了马赛克，那几个字还是认得出来：安全第一，老婆第二。", "全港区几千顶安全帽，只有一顶贴着这句话。因为全明州，只有一个女人会花两块钱买这种贴纸，还逼着丈夫一贴就是十年。", "林衡把照片缩回原样，又放大了一遍。", "小周端着咖啡路过，停下来看了他十秒钟。", "“衡哥，你脸色不对啊，跟被领导已读不回了一样。”", "“比那个严重。”", "“那是什么？”", "林衡想了想：“被亲爹已读不回了。”", "小周看了他一眼，端着咖啡走了。", "晚饭是在父母家吃的。", "他母亲做了一桌菜，一边盛饭，一边把手机推到他面前：“你看看这个，咱们港口的，多好的人啊！你爸单位的，说不定你爸还认识呢。”", "他父亲低着头剥蟹，剥得极其专注，好像那只蟹欠了他钱。", "“爸，”林衡说，“你认识吗？”", "“港口几千号人，”林建国头也不抬，“我哪认识得过来。”", "林衡点点头，转向他母亲：“妈，你买的那张贴纸，还有别人贴吗？”", "他母亲的饭勺停在半空。她拿过手机，眯着眼睛把照片放大，看了三秒钟。", "然后她放下手机，慢慢转向她的丈夫。", "林建国把剥好的蟹肉放进她碗里：“吃蟹，吃蟹，凉了就腥了。”", "“林建国。”", "“哎。”", "“你上电视了，都不跟我说？”", "“不是电视，是公众号。”", "“公众号也是号！”他母亲一拍桌子，“十万个人看过你的背影，我是第十万零一个知道的！”", "林衡低头吃饭。他觉得这顿饭的走向，已经超出了他的处理能力。", "饭后，父子俩站在阳台上。楼下的广场舞换了一首歌，节奏更快了，像在催人表态。", "“手续，”林衡说，“那天晚上你说你来办。你办了吗？”", "“在办。”", "“办到哪一步了？”", "林建国想了想：“办到……想办的那一步。”", "林衡闭了闭眼。", "“那只箱子是公司的。”", "“那只箱子空着也是空着。”林建国说，“书泡烂了，就没了。几百年的东西，没了就是没了，再也找不回来。箱子明天还能装别的。”", "“可那是违规的。”", "“我知道是违规的。”他父亲说得很平静，“我在港口三十年，什么是违规，我比你清楚。”", "楼下的音乐又换了一首，更欢快了。", "“我这辈子，就请过一次长假，”林建国看着楼下，“那年我摔了腰。除了那一次，港口离了我一天都不行，我离了港口也一天都不行。”", "林衡把手搭在栏杆上，没有接话。那一年的事，家里没人提。", "“你是不知道，”林建国又说，“那天晚上那个姑娘在电话里，声音都哑了，一个劲儿地说谢谢，还怕给我添麻烦。我一听就知道，她是真着急，不是为她自己。”他在栏杆上磕了磕烟灰，“她还跟我说，是一个小伙子给她指的路。说那小伙子人挺好，就是死板了点。”", "林衡没吭声。", "“你说现在的年轻人，”他父亲感慨道，“是不是都这样？人是好人，就是不肯多走一步。”", "林衡看着楼下跳舞的人群，觉得自己应该说点什么。说“那个小伙子就是我”，太像认罪；说“你说得对”，太像投降。最后他什么也没说，跟他爸一起看楼下的人跳舞。", "那天晚上，林衡把事情从头到尾想了一遍。", "如果照实上报，表彰就会变成通报，好人好事就会变成违规操作。他父亲在港口干了三十年，没出过一次差错，到头来要在档案里留下一笔。", "如果不上报，材料就必须补齐。而要补齐，只有一条路：一水阁先出一份正式的求助函，港口再补一份援助的审批，前后对得上，事情才能说圆。", "也就是说，他得去求那个姑娘。", "林衡最不擅长的事情有两件，一是拒绝别人，二是求别人。上一次，他对她做了前一件；这一次，命运要他对同一个人做后一件。", "第二天上午，他去了一水阁。", "古籍修复室在一栋不起眼的小楼里。他推开门的时候，范小满正伏在桌前，手里捏着一把竹起子，对着一页发黄的纸，屏着呼吸，一动不动。", "那个在台风夜里一个半小时没停过嘴的人，此刻安静得像一幅画。", "林衡没敢出声，在门口站着等了三分钟。", "三分钟后，她直起身，长出一口气，这才看见他。她认出了他，表情从惊讶变成礼貌，又从礼貌变成一种不太明显的警惕。", "“是你啊。”她说，“你们公司派你来的？”", "“嗯。”", "“送锦旗？”", "“不是。”林衡说，“补手续。”", "范小满脸上的那点礼貌，也收了回去。", "“我就知道。”她放下竹起子，“文章一发出去，你们公司就该着急了吧？冷箱是谁开的，有没有审批，要不要有人担责任。”她看着他，“你是来查那位林师傅的？”", "“我是来请你帮个忙。”", "“帮你们查他？”", "“帮他把手续补上。”", "范小满皱起眉：“你为什么要帮他？”", "林衡来之前，在心里排练了三个版本的说辞。第一版太卑微，第二版太官方，第三版听起来像在念单位通知。此刻她看着他，那眼神像是已经替他判了刑，只等他自己认罪。", "他一个版本也没用上。", "“因为，”他说，“林师傅是我爸。”", "范小满张了张嘴，什么也没说出来。她的手指在桌沿上按了一下，像按住一张正要翘起来的纸。"], "recap": "台风夜，林衡路过一座老宅，帮一水阁的修复师范小满抢救泡水的古书。她问港口有没有冷库，他说私调冷箱是违规的，只给了她工会应急群的电话。同一时刻，港区龙门吊上的林建国在群里看见了求助，打开了一只“待检修”的冷箱。老先生在电话里交代：樟木箱里的，务必先救。"}, {"n": 3, "cn": "三", "title": "第三种办法", "era": "", "chars": 3358, "mins": 9, "html": "<p data-p=\"0\"><b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>盯着<b class=\"rn\" data-c=\"linheng\">林衡<\/b>看了足足五秒钟。<\/p>\n<p data-p=\"1\">“你爸？”<\/p>\n<p data-p=\"2\">“嗯。”<\/p>\n<p data-p=\"3\">“那天晚上那个叔叔，是你爸？”<\/p>\n<p data-p=\"4\">“嗯。”<\/p>\n<p data-p=\"5\">“那天晚上你给我指的路，最后指到了你爸那里？”<\/p>\n<p data-p=\"6\">“……嗯。”<\/p>\n<p data-p=\"7\">范小满忽然捂住脸，发出一声介于笑和哀嚎之间的声音。<\/p>\n<p data-p=\"8\">“我在电话里，”她从指缝里说，“跟你爸说你死板。”<\/p>\n<p data-p=\"9\">“他转告我了。”<\/p>\n<p data-p=\"10\">“原话？”<\/p>\n<p data-p=\"11\">“原话。还附赠了一句点评：现在的年轻人，人是好人，就是不肯多走一步。”<\/p>\n<p data-p=\"12\">范小满把手放下来，脸已经红到了耳根。“我背后说过的人多了，”她说，“被人家亲爹原话转回来，还是第一回。这种事写进县志，得归到灾异那一卷。”<\/p>\n<p data-p=\"13\">窗边传来一声咳嗽。一个头发花白的老太太坐在那里，戴着老花镜，正在补一本书的书角，头都没抬。<\/p>\n<p data-p=\"14\">“<b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>，”范小满有气无力地介绍，“我师父。”<\/p>\n<p data-p=\"15\">吴老师从老花镜上方看了林衡一眼，慢悠悠地说：“小满说你死板的时候，我也在旁边。”<\/p>\n<p data-p=\"16\">林衡觉得，今天也许不是一个适合出门的日子。<\/p>\n<p data-p=\"17\">“上一个来修复室找小满的男的，”吴老师接着说，“坚持了二十分钟。”<\/p>\n<p data-p=\"18\">“吴老师！”<\/p>\n<p data-p=\"19\">“我就说说。”吴老师继续补她的书角，“二十分钟以后，他说去买杯奶茶，然后就再也没回来。”<\/p>\n<p data-p=\"20\">林衡想了想，认真地说：“我不喝奶茶。”<\/p>\n<p data-p=\"21\">吴老师手上的动作停了一秒，嘴角好像动了一下，又好像没有。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"22\">尴尬过后，事情还是要谈。<\/p>\n<p data-p=\"23\">林衡把情况讲了一遍：表彰、宣传、市里的文明典型，还有那张谁也拿不出来的审批单。他讲得很平，没有一个字是在诉苦。可范小满越听，眉头皱得越紧。<\/p>\n<p data-p=\"24\">“所以，”她说，“如果手续补不上，你爸就要挨处分？”<\/p>\n<p data-p=\"25\">“有可能。”<\/p>\n<p data-p=\"26\">“就因为他帮了我？”<\/p>\n<p data-p=\"27\">林衡没有回答。<\/p>\n<p data-p=\"28\">“那要我怎么做？”<\/p>\n<p data-p=\"29\">林衡斟酌了一下：“流程上，要先有求助方的正式函件，再有审批。如果一水阁能出一份函，日期写那天晚上……”<\/p>\n<p data-p=\"30\">“不行。”<\/p>\n<p data-p=\"31\">她说得很快，说完自己先抿住了嘴。<\/p>\n<p data-p=\"32\">林衡设想过很多种反应，唯独没想过她会拒绝得这么干脆，干脆得像一刀裁下去的纸边。<\/p>\n<p data-p=\"33\">“对不起，”范小满说，“我不是不想帮。你爸帮了我那么大的忙，我现在恨不得去你们公司门口，替他站岗。可是那天晚上，我们没有写过任何函。我不能写一份那天的函。”<\/p>\n<p data-p=\"34\">她看着桌上那页刚揭开一半的旧纸。<\/p>\n<p data-p=\"35\">“我干这行五年，最怕的就是一件事：后人在古书上乱补、乱改。有人觉得缺了一个字，就照着自己的意思添上；有人觉得破了一页，就随手找张新纸糊上去。几百年后的人再看，就分不清哪些是真的，哪些是后来补的了。”她用指尖压了压那页纸的边，“一张纸上写的是哪天，就该是哪天。这是我的规矩。”<\/p>\n<p data-p=\"36\">他本来可以有一肚子委屈。他父亲是因为她才惹上的麻烦，他是因为他父亲才来求她。他求了，她却拒绝了。<\/p>\n<p data-p=\"37\">可奇怪的是，他一点也不生气。他只是忽然想起台风那天夜里，他在雨里说“我做不了主”，她抿了一下嘴，然后说“也是，你别为难”。<\/p>\n<p data-p=\"38\">现在轮到他了。<\/p>\n<p data-p=\"39\">“也是，”林衡说，“是我想岔了。你别为难。”<\/p>\n<p data-p=\"40\">范小满猛地抬起头，像是没料到自己的话会被原封不动地还回来，连标点都没改。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"41\">就在这时，门被推开了。<\/p>\n<p data-p=\"42\">进来的是一个三十出头的男人，穿一件浅灰色风衣，手里拎着一个纸袋，纸袋里插着四杯咖啡。<\/p>\n<p data-p=\"43\">“吴老师，您的美式，不加糖。”他把第一杯放在窗边，“小满，燕麦拿铁，少冰。”他转过头看见林衡，眉毛抬了一下，随即笑起来，从纸袋里拿出第四杯，“不知道您喝什么，我多买了一杯拿铁，不嫌弃的话。”<\/p>\n<p data-p=\"44\">他递咖啡的样子，像拍卖会上举号牌：不急不慢，胸有成竹，好像这间屋子里的东西，迟早都要落到他手里。<\/p>\n<p data-p=\"45\">林衡接过咖啡，说了声谢谢。他忽然意识到，自己今天来求人，两手空空。<\/p>\n<p data-p=\"46\">“<b class=\"rn\" data-c=\"luxingzhou\">陆行舟<\/b>，”那人伸出手，“嘉禾拍卖的，做古籍鉴定。”<\/p>\n<p data-p=\"47\">“林衡。”<\/p>\n<p data-p=\"48\">“陆老师是来看书的，”范小满解释，语气有点淡，“<b class=\"rn\" data-c=\"laoxiansheng\">老先生<\/b>的儿子请他来估价。”<\/p>\n<p data-p=\"49\">陆行舟一点也不在意，笑着说：“我知道你不乐意。放心，今天就是来看看，不碰，不翻，不拍照，你盯着我。”<\/p>\n<p data-p=\"50\">他说话不紧不慢，每句话都像事先熨过，平平整整，没有一丝褶子。他记得吴老师不加糖，记得范小满要少冰，还记得上次来的时候，她提过导师的猫不吃饭。<\/p>\n<p data-p=\"51\">“猫好了吗？”他问。<\/p>\n<p data-p=\"52\">“好了。”范小满的表情松动了一点，“换了猫粮。”<\/p>\n<p data-p=\"53\">“那就好。”<\/p>\n<p data-p=\"54\">林衡站在一旁，端着那杯不知道该不该喝的拿铁，觉得自己像一个误入别人家客厅的快递员：东西送到了，就该走了。<\/p>\n<p data-p=\"55\">窗边的吴老师看了看陆行舟，又看了看林衡，低头继续补书角。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"56\">陆行舟看了半个小时的书。他确实没碰，没翻，没拍照，只隔着玻璃一本一本看过去，偶尔在本子上记几个字。看完了，他对范小满说：“有几本是好东西，老先生眼光不错。”<\/p>\n<p data-p=\"57\">“你会建议他儿子卖吗？”<\/p>\n<p data-p=\"58\">“我会建议他儿子，别急着卖。”陆行舟说，“现在修了一半，品相不好，卖不上价。等你们修好了，再说。”<\/p>\n<p data-p=\"59\">“那修好了呢？”<\/p>\n<p data-p=\"60\">陆行舟笑了笑：“修好了，是你的功劳，也是这批书的造化。至于后面的事——”他合上本子，“书总要有个去处。放在一个人的地下室里，能被台风淹一次，就能被淹第二次。”<\/p>\n<p data-p=\"61\">范小满把桌上的镊子摆正了。<\/p>\n<p data-p=\"62\">林衡在一旁听着，发现自己找不到这番话的错处。这个人说的每一句都有道理，可这些道理加在一起，就是要把这批书一本一本拆开，卖到不同的地方去。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"63\">陆行舟走后，修复室里只剩透光台嗡嗡的声音。<\/p>\n<p data-p=\"64\">“函的事，”林衡终于开口，“我回去再想想别的办法。”<\/p>\n<p data-p=\"65\">他转身要走，窗边的吴老师出了声。<\/p>\n<p data-p=\"66\">“你们两个，一个说函不能写，一个说那我再想办法，听着都挺有骨气，可问题一个也没解决。”<\/p>\n<p data-p=\"67\">两个人都看向她。<\/p>\n<p data-p=\"68\">吴老师摘下老花镜，起身走到靠墙的一张透光台前，从一只夹板里抽出一页发黄的纸，放在灯上。<\/p>\n<p data-p=\"69\">“这是那批书里的，”她说，“嘉靖年间，浙西一个小县的修堤账。”<\/p>\n<p data-p=\"70\">纸上是密密麻麻的蝇头小楷。灯光从底下透上来，最后一页上，隐约现出一块长方形的影子。<\/p>\n<p data-p=\"71\">“看见没有？补纸。四百多年了，颜色做得和原纸一模一样，浆糊刷得匀，边口裁得齐，换个人来，十个有十个看不出来。要不是这回泡了水，浆糊松了，我也看不出来。”<\/p>\n<p data-p=\"72\">她用竹起子轻轻挑起补纸的一角。底下露出几个字，墨色比上面的淡，数目也不一样。<\/p>\n<p data-p=\"73\">林衡往前走了一步。旧账本，又是不让人看的东西，这页纸两样都占了。<\/p>\n<p data-p=\"74\">“补书有三种补法，”吴老师说，“第一种，假装没破，补在暗处，就像这张。那是骗人。第二种，破了就扔，那是糟蹋。”<\/p>\n<p data-p=\"75\">“第三种呢？”范小满问。<\/p>\n<p data-p=\"76\">“第三种，补在明处。新补的纸，和老纸颜色要差那么一点点。远看是一本完整的书，近看，你知道哪里是后来补的。不藏，不骗，也不扔。”<\/p>\n<p data-p=\"77\">她把那页账放回夹板，重新戴上老花镜。<\/p>\n<p data-p=\"78\">“那天晚上的事，你们别老想着把它补成没破过的样子。破了就是破了。想想怎么补在明处。”<\/p>\n<p data-p=\"79\">趁吴老师转身，他掏出手机，对着那页修堤账拍了一张照片。<\/p>\n<p data-p=\"80\">吴老师看见了，什么也没说。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"81\">那天下午，两人在修复室外面的走廊上，站了一个多小时。<\/p>\n<p data-p=\"82\">是范小满先想到的。<\/p>\n<p data-p=\"83\">她说，一水阁每年台风季都提心吊胆，馆里的冷库就那么大，民间藏书一出事，根本没处放。如果港口集团和一水阁签一份正式的合作协议，以后台风天，古籍可以应急借用港区的冷箱，那天晚上的事，就可以写成这份协议的起因：事发紧急，一线职工先行处置，事后补齐程序，由此建立长效机制。<\/p>\n<p data-p=\"84\">不藏，不骗。那天晚上就是那天晚上，一个日期也不改。<\/p>\n<p data-p=\"85\">林衡听完，把那几句话又在心里过了一遍。<\/p>\n<p data-p=\"86\">“这样，我爸还是违规了。”<\/p>\n<p data-p=\"87\">“可他违规，是为了一件对的事。”范小满说，“而且你们公司现在要表彰的，本来就是这件事。你只需要让他们明白：好事没有手续，总比好事没人做强。”<\/p>\n<p data-p=\"88\">“我只需要？”<\/p>\n<p data-p=\"89\">“对，你只需要去说服你们领导。”<\/p>\n<p data-p=\"90\">他在这家公司六年，开会从来坐最后一排，发言从来不超过三句。让他去说服领导，大概比让他父亲把那张贴纸撕下来还难。<\/p>\n<p data-p=\"91\">范小满看着他的表情，忍不住笑了：“我陪你写方案。一水阁这边的材料，我来准备。你们领导要问古籍的事，我去给他们讲。”<\/p>\n<p data-p=\"92\">“你？”<\/p>\n<p data-p=\"93\">“我讲起书来，”她说，“你也见识过的，三个小时不带停。”<\/p>\n<p data-p=\"94\">林衡想起台风那天夜里，他尝试插话七次，成功零次。<\/p>\n<p data-p=\"95\">他忽然觉得，这也许是个可行的办法。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"96\">傍晚，林衡走出一水阁，看见陆行舟靠在一辆车边，像是在等人。<\/p>\n<p data-p=\"97\">“林先生，”陆行舟冲他点点头，“顺路的话，我送你？”<\/p>\n<p data-p=\"98\">“不用了，谢谢。”<\/p>\n<p data-p=\"99\">“也好。”陆行舟拉开车门，又停了一下，像是随口一提，“对了，您是港口集团的吧？”<\/p>\n<p data-p=\"100\">“是。”<\/p>\n<p data-p=\"101\">“那真巧。”陆行舟说，“上周有人托我打听这批书，问能不能挑几十册好的估个价，说是要建一个港口文化馆。我还以为是谁，一问，是你们集团的人。”<\/p>\n<p data-p=\"102\">他坐进车里，摇下车窗。<\/p>\n<p data-p=\"103\">“您不知道？”<\/p>\n<p data-p=\"104\">车开远了。<\/p>\n<p data-p=\"105\">林衡站在一水阁门口，手里那杯拿铁早就凉透了，他一口也没喝过。<\/p>\n<p data-p=\"106\">他不知道。<\/p>\n<p data-p=\"107\">眉湖上起了一点风，把一湖的晚霞吹皱了。<\/p>", "paras": ["范小满盯着林衡看了足足五秒钟。", "“你爸？”", "“嗯。”", "“那天晚上那个叔叔，是你爸？”", "“嗯。”", "“那天晚上你给我指的路，最后指到了你爸那里？”", "“……嗯。”", "范小满忽然捂住脸，发出一声介于笑和哀嚎之间的声音。", "“我在电话里，”她从指缝里说，“跟你爸说你死板。”", "“他转告我了。”", "“原话？”", "“原话。还附赠了一句点评：现在的年轻人，人是好人，就是不肯多走一步。”", "范小满把手放下来，脸已经红到了耳根。“我背后说过的人多了，”她说，“被人家亲爹原话转回来，还是第一回。这种事写进县志，得归到灾异那一卷。”", "窗边传来一声咳嗽。一个头发花白的老太太坐在那里，戴着老花镜，正在补一本书的书角，头都没抬。", "“吴老师，”范小满有气无力地介绍，“我师父。”", "吴老师从老花镜上方看了林衡一眼，慢悠悠地说：“小满说你死板的时候，我也在旁边。”", "林衡觉得，今天也许不是一个适合出门的日子。", "“上一个来修复室找小满的男的，”吴老师接着说，“坚持了二十分钟。”", "“吴老师！”", "“我就说说。”吴老师继续补她的书角，“二十分钟以后，他说去买杯奶茶，然后就再也没回来。”", "林衡想了想，认真地说：“我不喝奶茶。”", "吴老师手上的动作停了一秒，嘴角好像动了一下，又好像没有。", "尴尬过后，事情还是要谈。", "林衡把情况讲了一遍：表彰、宣传、市里的文明典型，还有那张谁也拿不出来的审批单。他讲得很平，没有一个字是在诉苦。可范小满越听，眉头皱得越紧。", "“所以，”她说，“如果手续补不上，你爸就要挨处分？”", "“有可能。”", "“就因为他帮了我？”", "林衡没有回答。", "“那要我怎么做？”", "林衡斟酌了一下：“流程上，要先有求助方的正式函件，再有审批。如果一水阁能出一份函，日期写那天晚上……”", "“不行。”", "她说得很快，说完自己先抿住了嘴。", "林衡设想过很多种反应，唯独没想过她会拒绝得这么干脆，干脆得像一刀裁下去的纸边。", "“对不起，”范小满说，“我不是不想帮。你爸帮了我那么大的忙，我现在恨不得去你们公司门口，替他站岗。可是那天晚上，我们没有写过任何函。我不能写一份那天的函。”", "她看着桌上那页刚揭开一半的旧纸。", "“我干这行五年，最怕的就是一件事：后人在古书上乱补、乱改。有人觉得缺了一个字，就照着自己的意思添上；有人觉得破了一页，就随手找张新纸糊上去。几百年后的人再看，就分不清哪些是真的，哪些是后来补的了。”她用指尖压了压那页纸的边，“一张纸上写的是哪天，就该是哪天。这是我的规矩。”", "他本来可以有一肚子委屈。他父亲是因为她才惹上的麻烦，他是因为他父亲才来求她。他求了，她却拒绝了。", "可奇怪的是，他一点也不生气。他只是忽然想起台风那天夜里，他在雨里说“我做不了主”，她抿了一下嘴，然后说“也是，你别为难”。", "现在轮到他了。", "“也是，”林衡说，“是我想岔了。你别为难。”", "范小满猛地抬起头，像是没料到自己的话会被原封不动地还回来，连标点都没改。", "就在这时，门被推开了。", "进来的是一个三十出头的男人，穿一件浅灰色风衣，手里拎着一个纸袋，纸袋里插着四杯咖啡。", "“吴老师，您的美式，不加糖。”他把第一杯放在窗边，“小满，燕麦拿铁，少冰。”他转过头看见林衡，眉毛抬了一下，随即笑起来，从纸袋里拿出第四杯，“不知道您喝什么，我多买了一杯拿铁，不嫌弃的话。”", "他递咖啡的样子，像拍卖会上举号牌：不急不慢，胸有成竹，好像这间屋子里的东西，迟早都要落到他手里。", "林衡接过咖啡，说了声谢谢。他忽然意识到，自己今天来求人，两手空空。", "“陆行舟，”那人伸出手，“嘉禾拍卖的，做古籍鉴定。”", "“林衡。”", "“陆老师是来看书的，”范小满解释，语气有点淡，“老先生的儿子请他来估价。”", "陆行舟一点也不在意，笑着说：“我知道你不乐意。放心，今天就是来看看，不碰，不翻，不拍照，你盯着我。”", "他说话不紧不慢，每句话都像事先熨过，平平整整，没有一丝褶子。他记得吴老师不加糖，记得范小满要少冰，还记得上次来的时候，她提过导师的猫不吃饭。", "“猫好了吗？”他问。", "“好了。”范小满的表情松动了一点，“换了猫粮。”", "“那就好。”", "林衡站在一旁，端着那杯不知道该不该喝的拿铁，觉得自己像一个误入别人家客厅的快递员：东西送到了，就该走了。", "窗边的吴老师看了看陆行舟，又看了看林衡，低头继续补书角。", "陆行舟看了半个小时的书。他确实没碰，没翻，没拍照，只隔着玻璃一本一本看过去，偶尔在本子上记几个字。看完了，他对范小满说：“有几本是好东西，老先生眼光不错。”", "“你会建议他儿子卖吗？”", "“我会建议他儿子，别急着卖。”陆行舟说，“现在修了一半，品相不好，卖不上价。等你们修好了，再说。”", "“那修好了呢？”", "陆行舟笑了笑：“修好了，是你的功劳，也是这批书的造化。至于后面的事——”他合上本子，“书总要有个去处。放在一个人的地下室里，能被台风淹一次，就能被淹第二次。”", "范小满把桌上的镊子摆正了。", "林衡在一旁听着，发现自己找不到这番话的错处。这个人说的每一句都有道理，可这些道理加在一起，就是要把这批书一本一本拆开，卖到不同的地方去。", "陆行舟走后，修复室里只剩透光台嗡嗡的声音。", "“函的事，”林衡终于开口，“我回去再想想别的办法。”", "他转身要走，窗边的吴老师出了声。", "“你们两个，一个说函不能写，一个说那我再想办法，听着都挺有骨气，可问题一个也没解决。”", "两个人都看向她。", "吴老师摘下老花镜，起身走到靠墙的一张透光台前，从一只夹板里抽出一页发黄的纸，放在灯上。", "“这是那批书里的，”她说，“嘉靖年间，浙西一个小县的修堤账。”", "纸上是密密麻麻的蝇头小楷。灯光从底下透上来，最后一页上，隐约现出一块长方形的影子。", "“看见没有？补纸。四百多年了，颜色做得和原纸一模一样，浆糊刷得匀，边口裁得齐，换个人来，十个有十个看不出来。要不是这回泡了水，浆糊松了，我也看不出来。”", "她用竹起子轻轻挑起补纸的一角。底下露出几个字，墨色比上面的淡，数目也不一样。", "林衡往前走了一步。旧账本，又是不让人看的东西，这页纸两样都占了。", "“补书有三种补法，”吴老师说，“第一种，假装没破，补在暗处，就像这张。那是骗人。第二种，破了就扔，那是糟蹋。”", "“第三种呢？”范小满问。", "“第三种，补在明处。新补的纸，和老纸颜色要差那么一点点。远看是一本完整的书，近看，你知道哪里是后来补的。不藏，不骗，也不扔。”", "她把那页账放回夹板，重新戴上老花镜。", "“那天晚上的事，你们别老想着把它补成没破过的样子。破了就是破了。想想怎么补在明处。”", "趁吴老师转身，他掏出手机，对着那页修堤账拍了一张照片。", "吴老师看见了，什么也没说。", "那天下午，两人在修复室外面的走廊上，站了一个多小时。", "是范小满先想到的。", "她说，一水阁每年台风季都提心吊胆，馆里的冷库就那么大，民间藏书一出事，根本没处放。如果港口集团和一水阁签一份正式的合作协议，以后台风天，古籍可以应急借用港区的冷箱，那天晚上的事，就可以写成这份协议的起因：事发紧急，一线职工先行处置，事后补齐程序，由此建立长效机制。", "不藏，不骗。那天晚上就是那天晚上，一个日期也不改。", "林衡听完，把那几句话又在心里过了一遍。", "“这样，我爸还是违规了。”", "“可他违规，是为了一件对的事。”范小满说，“而且你们公司现在要表彰的，本来就是这件事。你只需要让他们明白：好事没有手续，总比好事没人做强。”", "“我只需要？”", "“对，你只需要去说服你们领导。”", "他在这家公司六年，开会从来坐最后一排，发言从来不超过三句。让他去说服领导，大概比让他父亲把那张贴纸撕下来还难。", "范小满看着他的表情，忍不住笑了：“我陪你写方案。一水阁这边的材料，我来准备。你们领导要问古籍的事，我去给他们讲。”", "“你？”", "“我讲起书来，”她说，“你也见识过的，三个小时不带停。”", "林衡想起台风那天夜里，他尝试插话七次，成功零次。", "他忽然觉得，这也许是个可行的办法。", "傍晚，林衡走出一水阁，看见陆行舟靠在一辆车边，像是在等人。", "“林先生，”陆行舟冲他点点头，“顺路的话，我送你？”", "“不用了，谢谢。”", "“也好。”陆行舟拉开车门，又停了一下，像是随口一提，“对了，您是港口集团的吧？”", "“是。”", "“那真巧。”陆行舟说，“上周有人托我打听这批书，问能不能挑几十册好的估个价，说是要建一个港口文化馆。我还以为是谁，一问，是你们集团的人。”", "他坐进车里，摇下车窗。", "“您不知道？”", "车开远了。", "林衡站在一水阁门口，手里那杯拿铁早就凉透了，他一口也没喝过。", "他不知道。", "眉湖上起了一点风，把一湖的晚霞吹皱了。"], "recap": "一水阁的文章阅读量过了十万，港口集团要把它报成好人好事，冷箱的审批却谁也拿不出来。补手续的活落到林衡头上。他从配图里那张“安全第一，老婆第二”的贴纸认出，开箱子的是自己的父亲。他去一水阁求范小满帮忙，开口第一句是：林师傅是我爸。"}, {"n": 4, "cn": "四", "title": "潮有信", "era": "", "chars": 3660, "mins": 10, "html": "<blockquote class=\"xin\">\n<p class=\"to\" data-p=\"0\"><b class=\"rn\" data-c=\"xiuying\">秀英<\/b>：<\/p>\n<p data-p=\"1\">见字如面。<\/p>\n<p data-p=\"2\">船过马六甲，海水比潮江蓝十倍，蓝得不讲道理。同船的阿康讲，这样的海看久了，人要发痴。我看了三天，没有发痴，只是每回一抬头，总觉得你站在码头上。<\/p>\n<p data-p=\"3\">新加坡的花布，我已托人买了，是你欢喜的那种蓝，比海水浅一点，比天深一点。<\/p>\n<p data-p=\"4\">船上有个老船工，跑了四十年海，夜里吃了老酒，对着月亮念：潮来潮去皆有信，船去船回总无期。我听了很不高兴，同他吵了一架。我不信他。我同你讲过的，明年清明，我一定回来。<\/p>\n<p class=\"sign\" data-p=\"5\"><b class=\"rn\" data-c=\"agen\">阿根<\/b>　民国二十六年三月初九　船过马六甲<\/p>\n<\/blockquote>\n<p data-p=\"6\">这一页，是<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>在十月中旬揭开的。<\/p>\n<p data-p=\"7\">揭开之后，她拍下来发给了<b class=\"rn\" data-c=\"linheng\">林衡<\/b>。发完才想起，他大概看不懂繁体的毛笔字，又一个字一个字打出来，再发了一遍。打到“我一定回来”，她的手指悬在屏幕上，没来由地有点难过，把手机扣在了桌上。<\/p>\n<p data-p=\"8\">那几周，为了那份合作方案，两人见了很多次面。文化馆的事，林衡一个字也没提。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"9\">十月下旬，最先察觉林衡不对劲的，是别人。<\/p>\n<p data-p=\"10\"><b class=\"rn\" data-c=\"xiaozhou\">小周<\/b>是第一个。<\/p>\n<p data-p=\"11\">“衡哥，”他端着咖啡在工位边上转了两圈，“你最近怎么一到六点就走？以前领导九点在群里@你，你秒回。昨天他@你，你过了半个小时才回。”<\/p>\n<p data-p=\"12\">“我在路上。”<\/p>\n<p data-p=\"13\">“你家离公司走路十五分钟，什么路要走半个小时？”<\/p>\n<p data-p=\"14\">“……绕了一下。”<\/p>\n<p data-p=\"15\">小周盯着他看了三秒，没再问。回到工位，他跟隔壁的同事嘀咕了一句：“衡哥最近不对劲。”<\/p>\n<p data-p=\"16\">第二个察觉的，是楼下咖啡店的店员。林衡在那里喝了三年美式，有一天，他站在柜台前，盯着价目表看了几秒，说：“燕麦拿铁，少冰。”<\/p>\n<p data-p=\"17\">店员的手停在半空：“先生，您换口味了？”<\/p>\n<p data-p=\"18\">“随便试试。”<\/p>\n<p data-p=\"19\">他喝了一口，觉得很难喝。第二天，他又点了一杯。<\/p>\n<p data-p=\"20\">第三个察觉的，是他母亲。一个周日，他在父母家厨房洗碗，洗着洗着，哼起了歌。他母亲站在厨房门口听了半分钟，什么也没问，转身回了客厅，给她那个相亲群里的老姐妹发了条消息：“我家那个，暂时不用介绍了。”<\/p>\n<p data-p=\"21\">林衡自己，什么也没察觉。他只是在网上买了一本《古籍版本学入门》，想着下次她讲书的时候，自己能接上一两句。他连着三个晚上睡前翻开它，连着三个晚上睡着在第十二页。书签就夹在那里，像一面插在半山腰的旗。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"22\">为了写方案，范小满要去港区看看那只冷箱。<\/p>\n<p data-p=\"23\">那是她第一次在白天见到港口。<\/p>\n<p data-p=\"24\">如果说一水阁是这座城市的记忆，港口就是这座城市的心跳。它从不睡觉。一百多台龙门吊沿着海岸线一字排开，像一群钢铁的白鹭，弯着长长的脖子，从巨轮的肚子里衔起一只只集装箱，再轻轻放到码头上。箱子红的、蓝的、绿的、灰的，层层叠叠，一眼望不到头，像整个世界的积木都倒在了这里。它们来自几十个国家，装着橡胶、咖啡、零件、红虾、玩具和成千上万人的生计，在这里停一两天，又被送往世界的另一头。<\/p>\n<p data-p=\"25\">港口不问它们装的是什么，也不问它们从哪里来、到哪里去。它只是吞，只是吐，日日夜夜，潮涨潮落，像一个巨人在呼吸。<\/p>\n<p data-p=\"26\">而在这个巨人的身体里，东边第三排，有一只小小的冷箱，装着三百多册泡过水的旧书。在这片钢铁的海里，它小得几乎看不见，却是整个港口里，唯一一只不打算去任何地方的箱子。<\/p>\n<p data-p=\"27\">范小满站在冷箱前，伸手摸了摸箱门，又缩了回来。<\/p>\n<p data-p=\"28\">“它们在这里，”她轻声说，“会不会觉得冷？”<\/p>\n<p data-p=\"29\">林衡想说，书不会觉得冷。他看了看她的表情，没说出口。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"30\"><b class=\"rn\" data-c=\"linjianguo\">林建国<\/b>是专门从龙门吊上下来的。他远远看见儿子和那个姑娘站在冷箱前，脚步顿了一下，整了整安全帽，大步走过来。<\/p>\n<p data-p=\"31\">“小范！”他的嗓门比平时大了一倍，“又见面了！”<\/p>\n<p data-p=\"32\">“叔叔！”范小满冲他深深鞠了一躬，“那天晚上真的太谢谢您了。还有……对不起，我在电话里说您儿子死板。”<\/p>\n<p data-p=\"33\">“没事没事，”林建国大手一挥，“他是死板。”<\/p>\n<p data-p=\"34\">林衡站在一旁，面无表情。<\/p>\n<p data-p=\"35\">“不过，”林建国又补了一句，“他死板，是随他妈。他妈年轻的时候，我追了她两年，她才答应跟我去看一场电影。”<\/p>\n<p data-p=\"36\">“爸。”<\/p>\n<p data-p=\"37\">“两年！”林建国伸出两根手指，在范小满面前晃了晃，“所以说，林家的男人，别的本事没有，就是有耐心。”<\/p>\n<p data-p=\"38\">“爸！”<\/p>\n<p data-p=\"39\">范小满笑得弯下了腰。林建国心满意足地回了他的龙门吊，留下他的儿子站在原地，恨不得自己也被装进一只冷箱，发往南美。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"40\">林衡一直没告诉范小满文化馆的事。<\/p>\n<p data-p=\"41\">那天从一水阁回来，他去问过了。是集团战略部<b class=\"rn\" data-c=\"hebuzhang\">何部长<\/b>的项目，计划明年开馆，主题叫“千年港城”，需要一批“有分量的展品”。战略部在台风那篇文章里看见了这批书，托<b class=\"rn\" data-c=\"luxingzhou\">陆行舟<\/b>去打听，打算挑几十册明清刻本收进来，其余的，他们不感兴趣。<\/p>\n<p data-p=\"42\">林衡知道这意味着什么。范小满拼了命要让这批书完整地留下来，而他所在的公司，正打算把它们拆开。<\/p>\n<p data-p=\"43\">他想过很多次要告诉她。每次话到嘴边，又咽了回去。他对自己说，项目还没定，说了也是让她白担心；又对自己说，等方案批下来，再说不迟。<\/p>\n<p data-p=\"44\">其实他怕的是另一件事：她知道以后，看他的眼神，又会变回台风那天夜里的样子。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"45\">方案定稿那天，两人沿着潮江往北走。<\/p>\n<p data-p=\"46\">走到江北老码头，一个背着相机的小伙子拦住了他们。<\/p>\n<p data-p=\"47\">“两位，拍照吗？情侣写真，今天打八折！”<\/p>\n<p data-p=\"48\">“我们不是……”林衡说。<\/p>\n<p data-p=\"49\">“他是我同事。”范小满说。<\/p>\n<p data-p=\"50\">两句话同时出口，又同时停住。<\/p>\n<p data-p=\"51\">摄影师看看林衡，又看看范小满，经验丰富地笑了：“同事更要拍。以后都是回忆。”<\/p>\n<p data-p=\"52\">两个人逃也似的走开了。走出去一百多米，林衡发现自己的手不知道该往哪儿放，最后插进了外套口袋。范小满一直在看江。<\/p>\n<p data-p=\"53\">傍晚的江面是灰蓝色的，像一块洗旧的布。对岸亮起了灯，一盏，两盏，然后是一整排。江风有点咸，带着海的味道。有轮渡从江心开过去，突突突的，开得很慢。<\/p>\n<p data-p=\"54\">“一百年前，”范小满说，“明州帮的人，就是从这里上船的。去上海，去南洋，去日本。一走就是好几年，有的人一走就是一辈子。”<\/p>\n<p data-p=\"55\">“写日记的那个阿根，也是从这里走的？”<\/p>\n<p data-p=\"56\">“大概是吧。”她看着江面，“那时候的女人，就站在这里送。船开远了，看不见了，也不走，还站着。”<\/p>\n<p data-p=\"57\">“后来呢？”<\/p>\n<p data-p=\"58\">“后来，”她说，“有的人等回来了，有的人没等回来。”<\/p>\n<p data-p=\"59\">她没有再说下去。<\/p>\n<p data-p=\"60\">江水涨了一点，又退了一点。一只白鹭从水面上掠过去，飞到对岸去了。<\/p>\n<p data-p=\"61\">林衡有好几次想开口。他想说文化馆的事，想说他早就知道了，想说对不起。可每一次，他看着她望着江面的侧脸，那些话就沉了下去，像石子沉进江底，连一点涟漪也没有。<\/p>\n<p data-p=\"62\">那天晚上，他什么也没说。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"63\">方案汇报定在十一月初。<\/p>\n<p data-p=\"64\">头一天晚上，小周给林衡做了紧急培训。<\/p>\n<p data-p=\"65\">“哥，你就记住一条：把台下的领导都当成冬瓜。”<\/p>\n<p data-p=\"66\">“<b class=\"rn\" data-c=\"zhengzong\">郑总<\/b>也是冬瓜？”<\/p>\n<p data-p=\"67\">“郑总是最大的那个冬瓜。”<\/p>\n<p data-p=\"68\">林衡想了想：“那我是什么？”<\/p>\n<p data-p=\"69\">“你是……”小周卡住了，“你是切冬瓜的。”<\/p>\n<p data-p=\"70\">这个比喻没有起任何作用。第二天，林衡第一次坐到了会议桌的前排。汇报刚开始，他手里的翻页笔不知出了什么毛病，他按“下一页”，屏幕却跳回了封面。他又按，又跳回了封面。<\/p>\n<p data-p=\"71\">分管的郑总五十多岁，听汇报时喜欢转笔。他转着笔，慢悠悠地说：“小林，封面我们看过了，印象很深。”<\/p>\n<p data-p=\"72\">会议室里笑成一片。范小满坐在后排，低着头，肩膀抖个不停。<\/p>\n<p data-p=\"73\">林衡放下翻页笔，走过去手动点鼠标。说也奇怪，被这么一笑，他反倒不那么紧张了。<\/p>\n<p data-p=\"74\">他讲得并不好。声音有点抖，一处数字念错了，还被郑总纠正了一次。但他把最后一段说完了，那是他在心里背了一个星期的话：<\/p>\n<p data-p=\"75\">“那天晚上，一线的师傅没走手续，是不对的。可如果他那天晚上去走手续，那批书就没了。我想，好事不能没有手续，但手续也不该让人不敢做好事。我们这份方案，就是想让以后再碰到这样的事，大家不用在这两样里面挑一样。”<\/p>\n<p data-p=\"76\">会议室里安静了几秒。<\/p>\n<p data-p=\"77\">郑总重新转起笔，转向范小满：“小范是吧？一水阁的。我问一个外行的问题，你别介意。”<\/p>\n<p data-p=\"78\">“您说。”<\/p>\n<p data-p=\"79\">“你们修书，一年能修几本？”<\/p>\n<p data-p=\"80\">“顺利的话，十几本。”<\/p>\n<p data-p=\"81\">“十几本，”郑总笑了笑，“说实话，现在扫描技术这么发达，拍个照，存个电子版，内容都在，省时省力。你们一页一页地修，修一辈子也修不了多少。年轻人，图什么呢？”<\/p>\n<p data-p=\"82\">会议室里有人跟着笑了。<\/p>\n<p data-p=\"83\">范小满没有笑。她坐得很直，两只手平放在桌上。<\/p>\n<p data-p=\"84\">“郑总，您说得对。我一年修不了几本书，一辈子也修不了多少。我挣得不多，也不出名，大概过不了几年，就没人记得一水阁有过一个叫范小满的修复师。”<\/p>\n<p data-p=\"85\">她把两只手从桌上收回来，又放了回去。<\/p>\n<p data-p=\"86\">“可是我修过的每一页纸，都会比我活得久。扫描能留下字，留不下纸。留不下那个人写字的时候，墨是浓了还是淡了，手是稳的还是抖的。我图的不是这些书值多少钱，我图它们还在。”<\/p>\n<p data-p=\"87\">她看着郑总，声音不大，一个字一个字都很清楚。<\/p>\n<p data-p=\"88\">“您可以觉得我做的事没有用。但是请您不要觉得，做这件事的人，不值得被认真对待。”<\/p>\n<p data-p=\"89\">会议室里没有人再笑了。<\/p>\n<p data-p=\"90\">郑总看着她，那支笔停在指间，没再转。过了几秒，他点了点头：“方案我同意。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"91\">散会的时候，郑总叫住了林衡。<\/p>\n<p data-p=\"92\">“小林，讲得不错。”他拍了拍林衡的肩膀，又像是想起了什么，转向正在收拾材料的范小满，“对了，正好人都在。战略部在搞的港口文化馆，看中了你们那批书里的几本，想收过来做镇馆的展品。小林，你熟悉情况，这件事你也一起牵个头，跟一水阁对接一下。”<\/p>\n<p data-p=\"93\">范小满收拾材料的手停住了。<\/p>\n<p data-p=\"94\">她慢慢抬起头，看向林衡。<\/p>\n<p data-p=\"95\">那不是台风那天夜里的眼神。那天夜里她看他，客客气气，隔着一层。现在那一层没了。<\/p>\n<p data-p=\"96\">“你知道？”她问。<\/p>\n<p data-p=\"97\">林衡站在那里。他想说项目还没定，想说他本来打算告诉她的，想说他是怕。<\/p>\n<p data-p=\"98\">最后，他只说出了三个字。<\/p>\n<p data-p=\"99\">“我知道。”<\/p>\n<p data-p=\"100\">窗外，一艘巨轮正缓缓驶出港口。汽笛响了一声，很长，很低，像有人在很远的地方，叹了一口气。<\/p>", "paras": ["秀英：", "见字如面。", "船过马六甲，海水比潮江蓝十倍，蓝得不讲道理。同船的阿康讲，这样的海看久了，人要发痴。我看了三天，没有发痴，只是每回一抬头，总觉得你站在码头上。", "新加坡的花布，我已托人买了，是你欢喜的那种蓝，比海水浅一点，比天深一点。", "船上有个老船工，跑了四十年海，夜里吃了老酒，对着月亮念：潮来潮去皆有信，船去船回总无期。我听了很不高兴，同他吵了一架。我不信他。我同你讲过的，明年清明，我一定回来。", "阿根　民国二十六年三月初九　船过马六甲", "这一页，是范小满在十月中旬揭开的。", "揭开之后，她拍下来发给了林衡。发完才想起，他大概看不懂繁体的毛笔字，又一个字一个字打出来，再发了一遍。打到“我一定回来”，她的手指悬在屏幕上，没来由地有点难过，把手机扣在了桌上。", "那几周，为了那份合作方案，两人见了很多次面。文化馆的事，林衡一个字也没提。", "十月下旬，最先察觉林衡不对劲的，是别人。", "小周是第一个。", "“衡哥，”他端着咖啡在工位边上转了两圈，“你最近怎么一到六点就走？以前领导九点在群里@你，你秒回。昨天他@你，你过了半个小时才回。”", "“我在路上。”", "“你家离公司走路十五分钟，什么路要走半个小时？”", "“……绕了一下。”", "小周盯着他看了三秒，没再问。回到工位，他跟隔壁的同事嘀咕了一句：“衡哥最近不对劲。”", "第二个察觉的，是楼下咖啡店的店员。林衡在那里喝了三年美式，有一天，他站在柜台前，盯着价目表看了几秒，说：“燕麦拿铁，少冰。”", "店员的手停在半空：“先生，您换口味了？”", "“随便试试。”", "他喝了一口，觉得很难喝。第二天，他又点了一杯。", "第三个察觉的，是他母亲。一个周日，他在父母家厨房洗碗，洗着洗着，哼起了歌。他母亲站在厨房门口听了半分钟，什么也没问，转身回了客厅，给她那个相亲群里的老姐妹发了条消息：“我家那个，暂时不用介绍了。”", "林衡自己，什么也没察觉。他只是在网上买了一本《古籍版本学入门》，想着下次她讲书的时候，自己能接上一两句。他连着三个晚上睡前翻开它，连着三个晚上睡着在第十二页。书签就夹在那里，像一面插在半山腰的旗。", "为了写方案，范小满要去港区看看那只冷箱。", "那是她第一次在白天见到港口。", "如果说一水阁是这座城市的记忆，港口就是这座城市的心跳。它从不睡觉。一百多台龙门吊沿着海岸线一字排开，像一群钢铁的白鹭，弯着长长的脖子，从巨轮的肚子里衔起一只只集装箱，再轻轻放到码头上。箱子红的、蓝的、绿的、灰的，层层叠叠，一眼望不到头，像整个世界的积木都倒在了这里。它们来自几十个国家，装着橡胶、咖啡、零件、红虾、玩具和成千上万人的生计，在这里停一两天，又被送往世界的另一头。", "港口不问它们装的是什么，也不问它们从哪里来、到哪里去。它只是吞，只是吐，日日夜夜，潮涨潮落，像一个巨人在呼吸。", "而在这个巨人的身体里，东边第三排，有一只小小的冷箱，装着三百多册泡过水的旧书。在这片钢铁的海里，它小得几乎看不见，却是整个港口里，唯一一只不打算去任何地方的箱子。", "范小满站在冷箱前，伸手摸了摸箱门，又缩了回来。", "“它们在这里，”她轻声说，“会不会觉得冷？”", "林衡想说，书不会觉得冷。他看了看她的表情，没说出口。", "林建国是专门从龙门吊上下来的。他远远看见儿子和那个姑娘站在冷箱前，脚步顿了一下，整了整安全帽，大步走过来。", "“小范！”他的嗓门比平时大了一倍，“又见面了！”", "“叔叔！”范小满冲他深深鞠了一躬，“那天晚上真的太谢谢您了。还有……对不起，我在电话里说您儿子死板。”", "“没事没事，”林建国大手一挥，“他是死板。”", "林衡站在一旁，面无表情。", "“不过，”林建国又补了一句，“他死板，是随他妈。他妈年轻的时候，我追了她两年，她才答应跟我去看一场电影。”", "“爸。”", "“两年！”林建国伸出两根手指，在范小满面前晃了晃，“所以说，林家的男人，别的本事没有，就是有耐心。”", "“爸！”", "范小满笑得弯下了腰。林建国心满意足地回了他的龙门吊，留下他的儿子站在原地，恨不得自己也被装进一只冷箱，发往南美。", "林衡一直没告诉范小满文化馆的事。", "那天从一水阁回来，他去问过了。是集团战略部何部长的项目，计划明年开馆，主题叫“千年港城”，需要一批“有分量的展品”。战略部在台风那篇文章里看见了这批书，托陆行舟去打听，打算挑几十册明清刻本收进来，其余的，他们不感兴趣。", "林衡知道这意味着什么。范小满拼了命要让这批书完整地留下来，而他所在的公司，正打算把它们拆开。", "他想过很多次要告诉她。每次话到嘴边，又咽了回去。他对自己说，项目还没定，说了也是让她白担心；又对自己说，等方案批下来，再说不迟。", "其实他怕的是另一件事：她知道以后，看他的眼神，又会变回台风那天夜里的样子。", "方案定稿那天，两人沿着潮江往北走。", "走到江北老码头，一个背着相机的小伙子拦住了他们。", "“两位，拍照吗？情侣写真，今天打八折！”", "“我们不是……”林衡说。", "“他是我同事。”范小满说。", "两句话同时出口，又同时停住。", "摄影师看看林衡，又看看范小满，经验丰富地笑了：“同事更要拍。以后都是回忆。”", "两个人逃也似的走开了。走出去一百多米，林衡发现自己的手不知道该往哪儿放，最后插进了外套口袋。范小满一直在看江。", "傍晚的江面是灰蓝色的，像一块洗旧的布。对岸亮起了灯，一盏，两盏，然后是一整排。江风有点咸，带着海的味道。有轮渡从江心开过去，突突突的，开得很慢。", "“一百年前，”范小满说，“明州帮的人，就是从这里上船的。去上海，去南洋，去日本。一走就是好几年，有的人一走就是一辈子。”", "“写日记的那个阿根，也是从这里走的？”", "“大概是吧。”她看着江面，“那时候的女人，就站在这里送。船开远了，看不见了，也不走，还站着。”", "“后来呢？”", "“后来，”她说，“有的人等回来了，有的人没等回来。”", "她没有再说下去。", "江水涨了一点，又退了一点。一只白鹭从水面上掠过去，飞到对岸去了。", "林衡有好几次想开口。他想说文化馆的事，想说他早就知道了，想说对不起。可每一次，他看着她望着江面的侧脸，那些话就沉了下去，像石子沉进江底，连一点涟漪也没有。", "那天晚上，他什么也没说。", "方案汇报定在十一月初。", "头一天晚上，小周给林衡做了紧急培训。", "“哥，你就记住一条：把台下的领导都当成冬瓜。”", "“郑总也是冬瓜？”", "“郑总是最大的那个冬瓜。”", "林衡想了想：“那我是什么？”", "“你是……”小周卡住了，“你是切冬瓜的。”", "这个比喻没有起任何作用。第二天，林衡第一次坐到了会议桌的前排。汇报刚开始，他手里的翻页笔不知出了什么毛病，他按“下一页”，屏幕却跳回了封面。他又按，又跳回了封面。", "分管的郑总五十多岁，听汇报时喜欢转笔。他转着笔，慢悠悠地说：“小林，封面我们看过了，印象很深。”", "会议室里笑成一片。范小满坐在后排，低着头，肩膀抖个不停。", "林衡放下翻页笔，走过去手动点鼠标。说也奇怪，被这么一笑，他反倒不那么紧张了。", "他讲得并不好。声音有点抖，一处数字念错了，还被郑总纠正了一次。但他把最后一段说完了，那是他在心里背了一个星期的话：", "“那天晚上，一线的师傅没走手续，是不对的。可如果他那天晚上去走手续，那批书就没了。我想，好事不能没有手续，但手续也不该让人不敢做好事。我们这份方案，就是想让以后再碰到这样的事，大家不用在这两样里面挑一样。”", "会议室里安静了几秒。", "郑总重新转起笔，转向范小满：“小范是吧？一水阁的。我问一个外行的问题，你别介意。”", "“您说。”", "“你们修书，一年能修几本？”", "“顺利的话，十几本。”", "“十几本，”郑总笑了笑，“说实话，现在扫描技术这么发达，拍个照，存个电子版，内容都在，省时省力。你们一页一页地修，修一辈子也修不了多少。年轻人，图什么呢？”", "会议室里有人跟着笑了。", "范小满没有笑。她坐得很直，两只手平放在桌上。", "“郑总，您说得对。我一年修不了几本书，一辈子也修不了多少。我挣得不多，也不出名，大概过不了几年，就没人记得一水阁有过一个叫范小满的修复师。”", "她把两只手从桌上收回来，又放了回去。", "“可是我修过的每一页纸，都会比我活得久。扫描能留下字，留不下纸。留不下那个人写字的时候，墨是浓了还是淡了，手是稳的还是抖的。我图的不是这些书值多少钱，我图它们还在。”", "她看着郑总，声音不大，一个字一个字都很清楚。", "“您可以觉得我做的事没有用。但是请您不要觉得，做这件事的人，不值得被认真对待。”", "会议室里没有人再笑了。", "郑总看着她，那支笔停在指间，没再转。过了几秒，他点了点头：“方案我同意。”", "散会的时候，郑总叫住了林衡。", "“小林，讲得不错。”他拍了拍林衡的肩膀，又像是想起了什么，转向正在收拾材料的范小满，“对了，正好人都在。战略部在搞的港口文化馆，看中了你们那批书里的几本，想收过来做镇馆的展品。小林，你熟悉情况，这件事你也一起牵个头，跟一水阁对接一下。”", "范小满收拾材料的手停住了。", "她慢慢抬起头，看向林衡。", "那不是台风那天夜里的眼神。那天夜里她看他，客客气气，隔着一层。现在那一层没了。", "“你知道？”她问。", "林衡站在那里。他想说项目还没定，想说他本来打算告诉她的，想说他是怕。", "最后，他只说出了三个字。", "“我知道。”", "窗外，一艘巨轮正缓缓驶出港口。汽笛响了一声，很长，很低，像有人在很远的地方，叹了一口气。"], "recap": "范小满不肯倒签那天晚上的求助函。吴老师用一页嘉靖年间的修堤账讲了三种补法：补在暗处是骗人，破了就扔是糟蹋，第三种是补在明处。两人决定写一份港口和一水阁的应急合作方案。临走时，嘉禾拍卖的陆行舟告诉林衡：港口集团想从这批书里挑几十册，建一个文化馆。"}, {"n": 5, "cn": "五", "title": "潮江", "era": "民国二十六年", "chars": 1241, "mins": 4, "html": "<p data-p=\"0\">民国二十六年，正月十八。<\/p>\n<p data-p=\"1\">天还没亮透，潮江上起了雾。雾是白的，江是灰的，江北码头上挂着几盏马灯，灯也被雾裹着，一团一团，像没睡醒的眼睛。<\/p>\n<p data-p=\"2\">码头上已经有了人。挑担的，推车的，卖油赞子的，喊着号子搬货的。一条往上海的小火轮靠在岸边，烟囱里冒着黑烟。<b class=\"rn\" data-c=\"agen\">阿根<\/b>要先坐它到上海，再从上海换大船，去南洋。<\/p>\n<p data-p=\"3\"><b class=\"rn\" data-c=\"xiuying\">秀英<\/b>来得早。她穿一件半旧的棉袄，围一条灰围巾，手里攥着一个小布包，站在码头边上，不说话。<\/p>\n<p data-p=\"4\"><b class=\"rn\" data-c=\"abao\">阿宝<\/b>站在她旁边，一边跺脚，一边搓手。他是腊月里从上海回来过年的，钱庄放假晚，他赶在除夕前一天才进的家门。过完年本该初十就回去，他硬是跟掌柜多告了几天假，说要送一个人。<\/p>\n<p data-p=\"5\">“姐，”阿宝说，“你冷不冷？”<\/p>\n<p data-p=\"6\">“不冷。”<\/p>\n<p data-p=\"7\">“那你抖什么？”<\/p>\n<p data-p=\"8\">秀英没理他。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"9\">阿根是挑着一副铺盖来的。铺盖卷得紧紧的，上面捆着一只搪瓷缸，一走一晃，叮叮当当，老远就听得见。<\/p>\n<p data-p=\"10\">他走到跟前，把担子放下，看看秀英，又看看阿宝，搓了搓手，半天才说出一句：<\/p>\n<p data-p=\"11\">“来了啊。”<\/p>\n<p data-p=\"12\">“来了。”秀英说。<\/p>\n<p data-p=\"13\">然后两个人都不说话了。<\/p>\n<p data-p=\"14\">阿宝在旁边看着，急得想替他们说。他在钱庄里当了三年伙计，见过的生意人多了，谈一笔几百块的买卖，嘴都比这两个人利索。<\/p>\n<p data-p=\"15\">“阿根哥，”阿宝说，“你这一趟，要多久？”<\/p>\n<p data-p=\"16\">“跑完这一趟，”阿根说，“明年清明就回来。”<\/p>\n<p data-p=\"17\">“明年清明，”阿宝掰着手指算，“那就是……”<\/p>\n<p data-p=\"18\">“阿宝。”秀英说。<\/p>\n<p data-p=\"19\">阿宝闭了嘴。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"20\">小火轮拉了第一声汽笛，催人上船。<\/p>\n<p data-p=\"21\">阿根挑起担子，又放下。他从怀里摸出一张折得方方正正的纸，塞到秀英手里。<\/p>\n<p data-p=\"22\">“船上的地址，”他说，“写信寄到这里，转得到。”<\/p>\n<p data-p=\"23\">秀英接过来，攥在手心里。然后她把那个小布包递给他。<\/p>\n<p data-p=\"24\">阿根打开一看，是一个荷包。蓝底，上面用白线绣了一只小船，船头朝里。<\/p>\n<p data-p=\"25\">他用拇指在那只小船上摸了一下。<\/p>\n<p data-p=\"26\">“船头怎么朝里？”<\/p>\n<p data-p=\"27\">“往家开的船，船头就朝里。”<\/p>\n<p data-p=\"28\">阿根把荷包揣进怀里，揣得很深。他张了张嘴，像是有很多话要说。最后，他只说了一句：<\/p>\n<p data-p=\"29\">“你……多吃点。”<\/p>\n<p data-p=\"30\">“嗯。”<\/p>\n<p data-p=\"31\">“南洋有好看的花布，”阿根又想起来，“你要什么颜色？”<\/p>\n<p data-p=\"32\">秀英想了想：“你看着买。”<\/p>\n<p data-p=\"33\">“我看着买，”阿根说，“买错了，你莫怪我。”<\/p>\n<p data-p=\"34\">“不怪你。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"35\">阿宝把阿根送到跳板边上。<\/p>\n<p data-p=\"36\">“阿根哥，”他压低声音，“我姐不说话，不是不想说。”<\/p>\n<p data-p=\"37\">“我晓得。”<\/p>\n<p data-p=\"38\">“你晓得就好。”阿宝从口袋里摸出两块钱，硬塞进阿根手里，“路上用。家里你放心，有我。”<\/p>\n<p data-p=\"39\">阿根推回去，阿宝又塞回来，两个人在跳板边上推了三个来回，最后还是阿根收下了。<\/p>\n<p data-p=\"40\">“阿宝，”阿根说，“你也多吃点。”<\/p>\n<p data-p=\"41\">阿宝噗地笑了：“你们两个，怎么只会讲这一句。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"42\">小火轮离岸了。<\/p>\n<p data-p=\"43\">汽笛又响了一声，很长，在雾里传得很远。阿根站在船尾，一只手扶着栏杆，另一只手按在胸口，按着那个荷包。<\/p>\n<p data-p=\"44\">秀英站在码头上，看着船一点一点开进雾里。船越来越小，人也越来越小，最后只剩一个模模糊糊的影子；再后来，连影子也看不见了。<\/p>\n<p data-p=\"45\">码头上的人散了。挑担的挑走了，卖油赞子的收了摊，马灯一盏一盏地灭了。<\/p>\n<p data-p=\"46\">“姐，”阿宝说，“回吧。”<\/p>\n<p data-p=\"47\">“再站一会儿。”<\/p>\n<p data-p=\"48\">阿宝没有再劝。他把自己的围巾解下来，围在姐姐的脖子上，然后陪她站着。<\/p>\n<p data-p=\"49\">太阳出来了，雾慢慢散了。潮江上的水，涨了一点，又退了一点。<\/p>", "paras": ["民国二十六年，正月十八。", "天还没亮透，潮江上起了雾。雾是白的，江是灰的，江北码头上挂着几盏马灯，灯也被雾裹着，一团一团，像没睡醒的眼睛。", "码头上已经有了人。挑担的，推车的，卖油赞子的，喊着号子搬货的。一条往上海的小火轮靠在岸边，烟囱里冒着黑烟。阿根要先坐它到上海，再从上海换大船，去南洋。", "秀英来得早。她穿一件半旧的棉袄，围一条灰围巾，手里攥着一个小布包，站在码头边上，不说话。", "阿宝站在她旁边，一边跺脚，一边搓手。他是腊月里从上海回来过年的，钱庄放假晚，他赶在除夕前一天才进的家门。过完年本该初十就回去，他硬是跟掌柜多告了几天假，说要送一个人。", "“姐，”阿宝说，“你冷不冷？”", "“不冷。”", "“那你抖什么？”", "秀英没理他。", "阿根是挑着一副铺盖来的。铺盖卷得紧紧的，上面捆着一只搪瓷缸，一走一晃，叮叮当当，老远就听得见。", "他走到跟前，把担子放下，看看秀英，又看看阿宝，搓了搓手，半天才说出一句：", "“来了啊。”", "“来了。”秀英说。", "然后两个人都不说话了。", "阿宝在旁边看着，急得想替他们说。他在钱庄里当了三年伙计，见过的生意人多了，谈一笔几百块的买卖，嘴都比这两个人利索。", "“阿根哥，”阿宝说，“你这一趟，要多久？”", "“跑完这一趟，”阿根说，“明年清明就回来。”", "“明年清明，”阿宝掰着手指算，“那就是……”", "“阿宝。”秀英说。", "阿宝闭了嘴。", "小火轮拉了第一声汽笛，催人上船。", "阿根挑起担子，又放下。他从怀里摸出一张折得方方正正的纸，塞到秀英手里。", "“船上的地址，”他说，“写信寄到这里，转得到。”", "秀英接过来，攥在手心里。然后她把那个小布包递给他。", "阿根打开一看，是一个荷包。蓝底，上面用白线绣了一只小船，船头朝里。", "他用拇指在那只小船上摸了一下。", "“船头怎么朝里？”", "“往家开的船，船头就朝里。”", "阿根把荷包揣进怀里，揣得很深。他张了张嘴，像是有很多话要说。最后，他只说了一句：", "“你……多吃点。”", "“嗯。”", "“南洋有好看的花布，”阿根又想起来，“你要什么颜色？”", "秀英想了想：“你看着买。”", "“我看着买，”阿根说，“买错了，你莫怪我。”", "“不怪你。”", "阿宝把阿根送到跳板边上。", "“阿根哥，”他压低声音，“我姐不说话，不是不想说。”", "“我晓得。”", "“你晓得就好。”阿宝从口袋里摸出两块钱，硬塞进阿根手里，“路上用。家里你放心，有我。”", "阿根推回去，阿宝又塞回来，两个人在跳板边上推了三个来回，最后还是阿根收下了。", "“阿宝，”阿根说，“你也多吃点。”", "阿宝噗地笑了：“你们两个，怎么只会讲这一句。”", "小火轮离岸了。", "汽笛又响了一声，很长，在雾里传得很远。阿根站在船尾，一只手扶着栏杆，另一只手按在胸口，按着那个荷包。", "秀英站在码头上，看着船一点一点开进雾里。船越来越小，人也越来越小，最后只剩一个模模糊糊的影子；再后来，连影子也看不见了。", "码头上的人散了。挑担的挑走了，卖油赞子的收了摊，马灯一盏一盏地灭了。", "“姐，”阿宝说，“回吧。”", "“再站一会儿。”", "阿宝没有再劝。他把自己的围巾解下来，围在姐姐的脖子上，然后陪她站着。", "太阳出来了，雾慢慢散了。潮江上的水，涨了一点，又退了一点。"], "recap": "范小满揭开了樟木箱里日记的第一页：阿根写给秀英，船过马六甲，明年清明一定回来。林衡瞒着文化馆的事，跟她一起写方案。汇报会上方案通过了，郑总却当场点名让林衡牵头文化馆收书。范小满问：你知道？他说：我知道。"}, {"n": 6, "cn": "六", "title": "旧账本", "era": "", "chars": 2722, "mins": 7, "html": "<p data-p=\"0\">冷战的第十四天，<b class=\"rn\" data-c=\"xiaozhou\">小周<\/b>发现<b class=\"rn\" data-c=\"linheng\">林衡<\/b>又不绕路了，中午也点回了美式。他对着手机看了一个中午，屏幕始终停在同一个聊天框，一个字也没打。<\/p>\n<p data-p=\"1\">“衡哥，”小周把椅子滑过来，“你这是把自己也送进冷箱了？”<\/p>\n<p data-p=\"2\">小周说得没错。<\/p>\n<p data-p=\"3\">汇报会之后，<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>再没有联系过林衡。合作协议按流程往下走，一水阁那边对接的人换成了办公室主任。港区冷箱的事，<b class=\"rn\" data-c=\"linjianguo\">林建国<\/b>在电话里说，那个姑娘来过两回，看看书，跟他道了谢，问起林衡，她什么也没说。<\/p>\n<p data-p=\"4\">“你们俩怎么了？”林建国问。<\/p>\n<p data-p=\"5\">“没怎么。”<\/p>\n<p data-p=\"6\">“没怎么就好。”他父亲说，“我还以为你又死板了。”<\/p>\n<p data-p=\"7\">林衡没有反驳。他在心里给自己算过：瞒了一件事，被当面揭穿，对方没骂他一句，只是从此不再说话。这种处罚，比骂一顿重得多，而且没有上诉的渠道。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"8\">范小满那边，也不好过。<\/p>\n<p data-p=\"9\">那本航海日记，她揭到民国二十六年秋天，就揭不下去了。不是纸粘住了，是字没了。<\/p>\n<blockquote class=\"xin\">\n<p data-p=\"10\"><b class=\"rn\" data-c=\"xiuying\">秀英<\/b>：八月里，船在新加坡，听讲上海打起来了。船东讲，北边的航路断了，叫我们莫急，等。我等了一个月，又一个月。你那边可好？<b class=\"rn\" data-c=\"abao\">阿宝<\/b>可好？钱我照旧托人汇，你照旧收。<\/p>\n<p class=\"sign\" data-p=\"11\"><b class=\"rn\" data-c=\"agen\">阿根<\/b>　九月廿二<\/p>\n<\/blockquote>\n<p data-p=\"12\">这是最后一篇。再往后翻，全是空白页。<\/p>\n<p data-p=\"13\">一个人写了大半年日记，每一篇都写给同一个人，然后在某一天，忽然不写了。范小满把那些空白页一张一张对着灯照过去。她修过很多书，知道纸会说话：哪里有水渍，哪里被虫蛀过，哪里被人翻得最勤。可空白页什么也不说。<\/p>\n<p data-p=\"14\">她查了县志，查了民国报纸的索引，查了明州帮的同乡名录。日记封里写着“沈阿根记”，名录里叫阿根的人有十几个，姓沈的有三个，没有一个对得上。<\/p>\n<p data-p=\"15\">她甚至在医院的走廊里，问过<b class=\"rn\" data-c=\"laoxiansheng\">老先生<\/b>的儿子<b class=\"rn\" data-c=\"shenhao\">沈浩<\/b>。老先生也姓沈，她总觉得哪里不对。<\/p>\n<p data-p=\"16\">沈浩正在打电话，跟谁说着还款的事。他捂住话筒听完她的问题，皱着眉头说：“我爷爷？种地的，一辈子没出过明州。跑船？没听说过。”说完又去打电话了。<\/p>\n<p data-p=\"17\">范小满把这条线划掉了。<\/p>\n<p data-p=\"18\">“查不下去了？”<b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>在窗边问。<\/p>\n<p data-p=\"19\">“查不下去了。”<\/p>\n<p data-p=\"20\">“这个年代的事，”吴老师头也不抬，“你去问那个读旧账本的。”<\/p>\n<p data-p=\"21\">“我不认识什么读旧账本的。”<\/p>\n<p data-p=\"22\">“那个不喝奶茶的。”<\/p>\n<p data-p=\"23\">范小满手里的喷壶停了：“他？他是做财务的。”<\/p>\n<p data-p=\"24\">“他看那页修堤账的眼神，”吴老师说，“跟你看书的眼神，一模一样。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"25\">范小满不知道林衡住在哪里。她犹豫了两天，给林建国打了个电话。<\/p>\n<p data-p=\"26\">电话那头的大嗓门一听是她，音量又提高了一倍，像是要让整个冷箱堆场都听见。他不但报了地址，还报了楼层、门牌号，和楼下哪家早餐店的生煎最好吃。最后，他压低声音，郑重地叮嘱了一句：<\/p>\n<p data-p=\"27\">“别提前跟他说。他会跑。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"28\">周六上午十点，林衡打开门，看见范小满站在门口，手里拎着一袋生煎。<\/p>\n<p data-p=\"29\">他的第一反应是关门。第二反应是，自己居然有这种反应，太不像话了。第三反应是，门已经关了一半。<\/p>\n<p data-p=\"30\">“你家楼下这家，”范小满说，“你爸说最好吃。”<\/p>\n<p data-p=\"31\">林衡把门重新打开。<\/p>\n<p data-p=\"32\">“我爸，”他说，“还说什么了？”<\/p>\n<p data-p=\"33\">“说别提前告诉你，你会跑。”<\/p>\n<p data-p=\"34\">林衡没有否认。<\/p>\n<p data-p=\"35\">范小满走进屋，第一眼就看见了那面墙。<\/p>\n<p data-p=\"36\">整整一面墙的书架，从地板顶到天花板，上面没有一本小说，全是一排一排的档案盒。每个盒子上都贴着手写的标签：民国十八年，钱庄往来折；民国二十二年，田赋串票；民国二十五年，汇款簿；民国三十七年，金圆券兑换单……<\/p>\n<p data-p=\"37\">范小满站在书架前，眼睛都直了。<\/p>\n<p data-p=\"38\">“这些都是什么？”<\/p>\n<p data-p=\"39\">“旧账本。”林衡说，“旧书市场淘的，不值钱。”<\/p>\n<p data-p=\"40\">“你一个港口的财务，家里怎么跟档案馆似的？”<\/p>\n<p data-p=\"41\">林衡没接话。<\/p>\n<p data-p=\"42\">他还在想怎么回答，范小满已经自己抽出了一盒，打开，小心翼翼地翻开最上面那本。泛黄的纸上，是密密麻麻的毛笔小字，一行一行，全是数目和人名。<\/p>\n<p data-p=\"43\">“你看这一页，”林衡不知不觉凑了过去，“这是一家钱庄的汇款簿。这个人姓周，在上海的钱庄做事，每个月初五往明州老家汇两块钱，从民国二十三年起，一个月都没断过。”<\/p>\n<p data-p=\"44\">“学徒？”<\/p>\n<p data-p=\"45\">“不是学徒，是伙计。学徒三年满师，没有工钱，只管吃住，寄不出钱来。他能每月寄两块，说明已经满师了。你看他的字，”林衡指着那一行签名，“一笔一画，工工整整，是钱庄里练出来的。那时候钱庄的伙计，字写歪了是要挨骂的。”<\/p>\n<p data-p=\"46\">然后，林衡就停不下来了。<\/p>\n<p data-p=\"47\">他从钱庄伙计怎么记账，讲到那个年代的明州人在上海怎么讨生活；从一笔汇款要经过几道手，讲到为什么钱庄的汇票比邮局还靠得住；从一个伙计的薪水能买几斗米，讲到他自己是怎么在旧书市场的一堆废纸里，花三十块钱淘到了这本汇款簿。<\/p>\n<p data-p=\"48\">范小满尝试插话七次，成功零次。<\/p>\n<p data-p=\"49\">第八次，她张开嘴，还没出声，林衡忽然停下来，看着她：“你是不是嫌我话多？”<\/p>\n<p data-p=\"50\">“没有。”<\/p>\n<p data-p=\"51\">“那你为什么一直张嘴，又闭上？”<\/p>\n<p data-p=\"52\">范小满抿着嘴，没忍住，笑了。<\/p>\n<p data-p=\"53\">“我在找缝。”<\/p>\n<p data-p=\"54\">林衡先是没反应过来，跟着也笑了，笑得有点不好意思。那是范小满第一次见他笑。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"55\">“你再看这一笔。”林衡翻到后面，指着一行字，“民国二十七年冬，腊月初五，他寄了二十块。”<\/p>\n<p data-p=\"56\">“二十块很多吗？”<\/p>\n<p data-p=\"57\">“很多。钱庄伙计吃住在店里，一个月的薪水不过三四块，大头指望年底那份花红。他每个月寄两块，寄了好几年，忽然有一个月，寄了二十块。小半年的薪水。”<\/p>\n<p data-p=\"58\">“为什么？”<\/p>\n<p data-p=\"59\">“不知道。”林衡说，“我猜，是家里出了事。账本不会告诉你为什么，它只告诉你，一个人在某一天，忽然拼尽了全力。”<\/p>\n<p data-p=\"60\">范小满的指尖悬在那行字上方，慢慢划了过去。<\/p>\n<p data-p=\"61\">“后来呢？”<\/p>\n<p data-p=\"62\">“民国二十九年以后，就没有了。”<\/p>\n<p data-p=\"63\">“为什么？”<\/p>\n<p data-p=\"64\">“账本也不知道。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"65\">就在这时，林衡的手机响了。<\/p>\n<p data-p=\"66\">是视频通话。他母亲。<\/p>\n<p data-p=\"67\">林衡手忙脚乱地想挂掉，手一滑，按成了接听，还按成了外放。<\/p>\n<p data-p=\"68\">他母亲的脸出现在屏幕上，背景是她家的厨房：“衡衡啊，你爸说今天……”她的目光越过儿子的肩膀，落在了后面那个捧着账本的姑娘身上。<\/p>\n<p data-p=\"69\">她停顿了一秒。<\/p>\n<p data-p=\"70\">然后，手机里传来一声尖叫。那声音的穿透力，大约相当于港区所有集卡同时鸣笛。<\/p>\n<p data-p=\"71\">“同事。”林衡说。<\/p>\n<p data-p=\"72\">“同事好！同事好！”他母亲的声音高了八度，“同事更要多来往！你们忙，你们忙，我不打扰了，我什么都没看见！”<\/p>\n<p data-p=\"73\">视频挂断了。<\/p>\n<p data-p=\"74\">屋子里安静了大约五秒钟。<\/p>\n<p data-p=\"75\">“你妈，”范小满说，“跟你爸挺像的。”<\/p>\n<p data-p=\"76\">“他们是夫妻。”<\/p>\n<p data-p=\"77\">“我是说，嗓门。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"78\">正事是在第二袋生煎吃完以后才谈的。<\/p>\n<p data-p=\"79\">范小满把日记最后几页的照片给他看，又把她查过的路一条一条讲给他听：县志，报纸，同乡名录，老先生的儿子。<\/p>\n<p data-p=\"80\">“查不到了，”她说，“他就像掉进了海里。”<\/p>\n<p data-p=\"81\">林衡把那几张照片放大，一张一张往后划，又划回来。<\/p>\n<p data-p=\"82\">“日记断了，”他说，“不等于人断了。”<\/p>\n<p data-p=\"83\">“什么意思？”<\/p>\n<p data-p=\"84\">“他在最后一篇里写：钱我照旧托人汇，你照旧收。”林衡指着那一行，“那个年代跑船的人，钱都是托钱庄往家里汇的。人会不写信，钱不会不寄。只要他还活着，还记得那个人，钱庄的账上，就一定有他。”<\/p>\n<p data-p=\"85\">范小满盯着他。<\/p>\n<p data-p=\"86\">“你能找到那家钱庄？”<\/p>\n<p data-p=\"87\">“不一定。”林衡说，“但我知道该去哪儿找。”<\/p>\n<p data-p=\"88\">范小满站起来，拍了拍衣服上的生煎渣，把手机收回口袋。<\/p>\n<p data-p=\"89\">“文化馆的事，”她说，“我还没原谅你。”<\/p>\n<p data-p=\"90\">“我知道。”<\/p>\n<p data-p=\"91\">“可你得帮我找到沈阿根。”<\/p>\n<p data-p=\"92\">林衡说：“好。”<\/p>", "paras": ["冷战的第十四天，小周发现林衡又不绕路了，中午也点回了美式。他对着手机看了一个中午，屏幕始终停在同一个聊天框，一个字也没打。", "“衡哥，”小周把椅子滑过来，“你这是把自己也送进冷箱了？”", "小周说得没错。", "汇报会之后，范小满再没有联系过林衡。合作协议按流程往下走，一水阁那边对接的人换成了办公室主任。港区冷箱的事，林建国在电话里说，那个姑娘来过两回，看看书，跟他道了谢，问起林衡，她什么也没说。", "“你们俩怎么了？”林建国问。", "“没怎么。”", "“没怎么就好。”他父亲说，“我还以为你又死板了。”", "林衡没有反驳。他在心里给自己算过：瞒了一件事，被当面揭穿，对方没骂他一句，只是从此不再说话。这种处罚，比骂一顿重得多，而且没有上诉的渠道。", "范小满那边，也不好过。", "那本航海日记，她揭到民国二十六年秋天，就揭不下去了。不是纸粘住了，是字没了。", "秀英：八月里，船在新加坡，听讲上海打起来了。船东讲，北边的航路断了，叫我们莫急，等。我等了一个月，又一个月。你那边可好？阿宝可好？钱我照旧托人汇，你照旧收。", "阿根　九月廿二", "这是最后一篇。再往后翻，全是空白页。", "一个人写了大半年日记，每一篇都写给同一个人，然后在某一天，忽然不写了。范小满把那些空白页一张一张对着灯照过去。她修过很多书，知道纸会说话：哪里有水渍，哪里被虫蛀过，哪里被人翻得最勤。可空白页什么也不说。", "她查了县志，查了民国报纸的索引，查了明州帮的同乡名录。日记封里写着“沈阿根记”，名录里叫阿根的人有十几个，姓沈的有三个，没有一个对得上。", "她甚至在医院的走廊里，问过老先生的儿子沈浩。老先生也姓沈，她总觉得哪里不对。", "沈浩正在打电话，跟谁说着还款的事。他捂住话筒听完她的问题，皱着眉头说：“我爷爷？种地的，一辈子没出过明州。跑船？没听说过。”说完又去打电话了。", "范小满把这条线划掉了。", "“查不下去了？”吴老师在窗边问。", "“查不下去了。”", "“这个年代的事，”吴老师头也不抬，“你去问那个读旧账本的。”", "“我不认识什么读旧账本的。”", "“那个不喝奶茶的。”", "范小满手里的喷壶停了：“他？他是做财务的。”", "“他看那页修堤账的眼神，”吴老师说，“跟你看书的眼神，一模一样。”", "范小满不知道林衡住在哪里。她犹豫了两天，给林建国打了个电话。", "电话那头的大嗓门一听是她，音量又提高了一倍，像是要让整个冷箱堆场都听见。他不但报了地址，还报了楼层、门牌号，和楼下哪家早餐店的生煎最好吃。最后，他压低声音，郑重地叮嘱了一句：", "“别提前跟他说。他会跑。”", "周六上午十点，林衡打开门，看见范小满站在门口，手里拎着一袋生煎。", "他的第一反应是关门。第二反应是，自己居然有这种反应，太不像话了。第三反应是，门已经关了一半。", "“你家楼下这家，”范小满说，“你爸说最好吃。”", "林衡把门重新打开。", "“我爸，”他说，“还说什么了？”", "“说别提前告诉你，你会跑。”", "林衡没有否认。", "范小满走进屋，第一眼就看见了那面墙。", "整整一面墙的书架，从地板顶到天花板，上面没有一本小说，全是一排一排的档案盒。每个盒子上都贴着手写的标签：民国十八年，钱庄往来折；民国二十二年，田赋串票；民国二十五年，汇款簿；民国三十七年，金圆券兑换单……", "范小满站在书架前，眼睛都直了。", "“这些都是什么？”", "“旧账本。”林衡说，“旧书市场淘的，不值钱。”", "“你一个港口的财务，家里怎么跟档案馆似的？”", "林衡没接话。", "他还在想怎么回答，范小满已经自己抽出了一盒，打开，小心翼翼地翻开最上面那本。泛黄的纸上，是密密麻麻的毛笔小字，一行一行，全是数目和人名。", "“你看这一页，”林衡不知不觉凑了过去，“这是一家钱庄的汇款簿。这个人姓周，在上海的钱庄做事，每个月初五往明州老家汇两块钱，从民国二十三年起，一个月都没断过。”", "“学徒？”", "“不是学徒，是伙计。学徒三年满师，没有工钱，只管吃住，寄不出钱来。他能每月寄两块，说明已经满师了。你看他的字，”林衡指着那一行签名，“一笔一画，工工整整，是钱庄里练出来的。那时候钱庄的伙计，字写歪了是要挨骂的。”", "然后，林衡就停不下来了。", "他从钱庄伙计怎么记账，讲到那个年代的明州人在上海怎么讨生活；从一笔汇款要经过几道手，讲到为什么钱庄的汇票比邮局还靠得住；从一个伙计的薪水能买几斗米，讲到他自己是怎么在旧书市场的一堆废纸里，花三十块钱淘到了这本汇款簿。", "范小满尝试插话七次，成功零次。", "第八次，她张开嘴，还没出声，林衡忽然停下来，看着她：“你是不是嫌我话多？”", "“没有。”", "“那你为什么一直张嘴，又闭上？”", "范小满抿着嘴，没忍住，笑了。", "“我在找缝。”", "林衡先是没反应过来，跟着也笑了，笑得有点不好意思。那是范小满第一次见他笑。", "“你再看这一笔。”林衡翻到后面，指着一行字，“民国二十七年冬，腊月初五，他寄了二十块。”", "“二十块很多吗？”", "“很多。钱庄伙计吃住在店里，一个月的薪水不过三四块，大头指望年底那份花红。他每个月寄两块，寄了好几年，忽然有一个月，寄了二十块。小半年的薪水。”", "“为什么？”", "“不知道。”林衡说，“我猜，是家里出了事。账本不会告诉你为什么，它只告诉你，一个人在某一天，忽然拼尽了全力。”", "范小满的指尖悬在那行字上方，慢慢划了过去。", "“后来呢？”", "“民国二十九年以后，就没有了。”", "“为什么？”", "“账本也不知道。”", "就在这时，林衡的手机响了。", "是视频通话。他母亲。", "林衡手忙脚乱地想挂掉，手一滑，按成了接听，还按成了外放。", "他母亲的脸出现在屏幕上，背景是她家的厨房：“衡衡啊，你爸说今天……”她的目光越过儿子的肩膀，落在了后面那个捧着账本的姑娘身上。", "她停顿了一秒。", "然后，手机里传来一声尖叫。那声音的穿透力，大约相当于港区所有集卡同时鸣笛。", "“同事。”林衡说。", "“同事好！同事好！”他母亲的声音高了八度，“同事更要多来往！你们忙，你们忙，我不打扰了，我什么都没看见！”", "视频挂断了。", "屋子里安静了大约五秒钟。", "“你妈，”范小满说，“跟你爸挺像的。”", "“他们是夫妻。”", "“我是说，嗓门。”", "正事是在第二袋生煎吃完以后才谈的。", "范小满把日记最后几页的照片给他看，又把她查过的路一条一条讲给他听：县志，报纸，同乡名录，老先生的儿子。", "“查不到了，”她说，“他就像掉进了海里。”", "林衡把那几张照片放大，一张一张往后划，又划回来。", "“日记断了，”他说，“不等于人断了。”", "“什么意思？”", "“他在最后一篇里写：钱我照旧托人汇，你照旧收。”林衡指着那一行，“那个年代跑船的人，钱都是托钱庄往家里汇的。人会不写信，钱不会不寄。只要他还活着，还记得那个人，钱庄的账上，就一定有他。”", "范小满盯着他。", "“你能找到那家钱庄？”", "“不一定。”林衡说，“但我知道该去哪儿找。”", "范小满站起来，拍了拍衣服上的生煎渣，把手机收回口袋。", "“文化馆的事，”她说，“我还没原谅你。”", "“我知道。”", "“可你得帮我找到沈阿根。”", "林衡说：“好。”"], "recap": "民国二十六年正月十八，潮江起雾。阿根挑着铺盖上了船，秀英把一个绣着小船的荷包塞进他手里，船头朝里。秀英的弟弟阿宝在钱庄当伙计，在跳板边上塞给阿根两块钱：家里你放心，有我。"}, {"n": 7, "cn": "七", "title": "恒裕", "era": "", "chars": 2518, "mins": 7, "html": "<p data-p=\"0\"><b class=\"rn\" data-c=\"linheng\">林衡<\/b>说他知道该去哪儿找，这话有一半是真的。<\/p>\n<p data-p=\"1\">真的那一半是：他书架上那本汇款簿的封面上，盖着一方褪了色的朱印，“恒裕钱庄沪号”。为了弄清这个恒裕是什么来头，他几年前就查过一轮：总号在明州，上海有分号，香港有代理处，是那个年代明州帮在南洋做生意的人最常用的几家钱庄之一。一个在南洋跑船的明州人往家里寄钱，十有八九会走这几家。<\/p>\n<p data-p=\"2\">假的那一半是：恒裕早在几十年前就没了。它的账，有的烧了，有的散了，剩下的一点残本，据说躺在市档案馆的库房里，从来没人借过。<\/p>\n<p data-p=\"3\">“据说？”<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>问。<\/p>\n<p data-p=\"4\">“我去问过一次，”林衡说，“他们要介绍信。”<\/p>\n<p data-p=\"5\">“你没开？”<\/p>\n<p data-p=\"6\">“我找谁开？”林衡说，“跟单位说，我要去查一家民国钱庄的账，研究一个陌生人的汇款？”<\/p>\n<p data-p=\"7\">范小满想了想，从包里掏出一张盖着红章的纸。<\/p>\n<p data-p=\"8\">“一水阁的，”她说，“昨天开的。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"9\">市档案馆的查阅室在三楼，规矩比一水阁的修复室还多。<\/p>\n<p data-p=\"10\">门口贴着一张告示，一共十二条：凭介绍信查阅；只许用铅笔；不得拍照；不得在档案上写字、折角、压东西；不得饮食；不得大声喧哗；翻页须用指腹，不得用指尖……林衡一条一条看下来，心里涌起一股久违的亲切感，像在异乡听见了乡音。<\/p>\n<p data-p=\"11\">值班的管理员是个五十来岁的大姐，接过介绍信看了一眼，又抬头看了一眼范小满，眼睛忽然亮了。<\/p>\n<p data-p=\"12\">“你是不是那个……冻书的姑娘？”<\/p>\n<p data-p=\"13\">范小满往后退了半步：“啊？”<\/p>\n<p data-p=\"14\">“公众号上那个！台风夜，集装箱，三百本书！”大姐一拍桌子，又想起这里不能大声喧哗，赶紧压低声音，“我转发了三个群，我女儿还给我点了个赞，她从来不给我点赞。”<\/p>\n<p data-p=\"15\">她当场掏出手机，要跟范小满合影。拍完了，她这才注意到旁边还站着一个人。<\/p>\n<p data-p=\"16\">“这位是？”<\/p>\n<p data-p=\"17\">范小满看了林衡一眼。林衡张了张嘴，还没想好自己算什么，大姐已经替他想好了。<\/p>\n<p data-p=\"18\">“哦，你助理吧？”她把一张查阅登记表推到林衡面前，“小伙子，你来填。”<\/p>\n<p data-p=\"19\">林衡接过笔，在“查阅人”那一栏填上了范小满的名字，在“随同人员”那一栏，填上了自己。<\/p>\n<p data-p=\"20\">范小满在旁边憋着笑，憋得肩膀直抖。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"21\">恒裕的残本装在六只档案箱里，搬出来的时候，箱子上的灰厚得能写字。<\/p>\n<p data-p=\"22\">大姐把箱子往桌上一放，叹了口气：“这几箱，我在这儿上了十二年班，你们是第一个来借的。”<\/p>\n<p data-p=\"23\">范小满打开第一箱，手停在箱盖上。里面是一捆一捆的账册，有的发了霉，有的粘成了一坨，有的只剩半本，封皮上的字都看不清了。<\/p>\n<p data-p=\"24\">“这怎么找？”<\/p>\n<p data-p=\"25\">林衡戴上手套，蹲下来，一本一本地看封皮，看了十几本，又看了看账册的厚薄和装订的线。<\/p>\n<p data-p=\"26\">“这几本是存款，”他把几本挪到一边，“这几本是放款，这一捆是同行之间往来的。我们要找的是汇款，钱庄管这个叫汇划，账册上一般有个'汇'字，或者写着外埠的地名。”<\/p>\n<p data-p=\"27\">他从第四箱里抽出一本，封皮上隐约有个“港”字。<\/p>\n<p data-p=\"28\">“香港代理处的，”他说，“南洋来的钱，要先到这儿。”<\/p>\n<p data-p=\"29\">大姐在旁边看着，表情从“小助理”慢慢变成了“这孩子是个识货的”。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"30\">那本账比他们想的还难读。<\/p>\n<p data-p=\"31\">纸脆得像秋天的落叶，字是那个年代钱庄里通行的写法，数目用的是一种老式的码子，范小满一个也认不出来。她修了五年书，第一次在一本账面前，觉得自己是个文盲。<\/p>\n<p data-p=\"32\">林衡却读得很顺。他用铅笔在一张白纸上，一行一行地抄：日期，户名，汇往何处，交付何人，数目几何。<\/p>\n<p data-p=\"33\">他抄得很慢。他说，这种账不能快，快了会漏。漏一笔，就漏了一个人。<\/p>\n<p data-p=\"34\">翻到民国二十六年十月，他的铅笔停住了。<\/p>\n<p data-p=\"35\">“找到了。”<\/p>\n<p data-p=\"36\">范小满凑过去。那一行字很小，墨色发灰，但认得出来：<\/p>\n<p class=\"zhang\" data-p=\"37\"><b class=\"rn\" data-c=\"agen\">沈阿根<\/b>　星洲　汇明州江北　交<b class=\"rn\" data-c=\"xiuying\">周秀英<\/b>　国币叁元<\/p>\n<p data-p=\"38\">范小满盯着那一行，伸出去的手又收了回来。<\/p>\n<p data-p=\"39\">她修了几个月的日记，日记里的秀英，只有一个名字，没有姓，没有住处，像一个只活在信纸上的人。可这一行字里，她有姓，有地址，有人每个月往她手里送钱。她是真的，她就住在明州江北的一条巷子里。<\/p>\n<p data-p=\"40\">“周秀英。”范小满轻轻念了一遍。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"41\">林衡往下翻。<\/p>\n<p data-p=\"42\">民国二十六年十一月，沈阿根，叁元。十二月，叁元。民国二十七年正月，叁元。<\/p>\n<p data-p=\"43\">一个月一笔，一笔不落。<\/p>\n<p data-p=\"44\">民国二十七年下半年，账上的写法变了。原先写“星洲直汇”，后来写“经港号转”。<\/p>\n<p data-p=\"45\">“打仗了，”林衡说，“上海那条线断了，南洋的钱只能绕道香港，再从香港转回来。多一道手，多一笔费用，路上也多一份风险。”<\/p>\n<p data-p=\"46\">“他还是寄了？”<\/p>\n<p data-p=\"47\">“他还是寄了。”<\/p>\n<p data-p=\"48\">民国二十八年，叁元。民国二十九年，叁元。民国三十年，叁元。数目没变，路线变了两次，有一阵子写的是“经港号转沪，再转甬”，绕了大半个中国。<\/p>\n<p data-p=\"49\">中间有几笔的墨迹晕开了，有一处霉斑盖住了半行，林衡没顾上细看，手指一路往下走。<\/p>\n<p data-p=\"50\">范小满看着那一串一模一样的数字，忽然觉得眼睛有点发酸。<\/p>\n<p data-p=\"51\">日记在民国二十六年秋天就断了。她一直以为，那个人也就是在那时候断了。原来没有。他不写字了，但他一直在寄钱。四年，打着仗，换着路，一个月也没停。<\/p>\n<p data-p=\"52\">“他为什么不写信了？”她问。<\/p>\n<p data-p=\"53\">“也许写了，没寄到。也许寄到了，没留下来。也许他不知道该写什么。”林衡说，“打仗的年代，一个在海那边的人，能说什么呢？说我很好，你别担心？说了也没人信。”<\/p>\n<p data-p=\"54\">他用铅笔轻轻点了点那一串数字。<\/p>\n<p data-p=\"55\">“日记会写好听的话，账本不会。账本只记一个人到底做了什么。”<\/p>\n<p data-p=\"56\">范小满转过头，看着他。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"57\">还有一件事，是林衡抄到一半才发现的。<\/p>\n<p data-p=\"58\">他看着自己抄下的那个地址，“明州江北某巷某号，周宅”，觉得眼熟。他的笔尖在纸上点了两下，忽然想起来了。<\/p>\n<p data-p=\"59\">他从包里翻出手机，找到自己书架上那本汇款簿的照片，放大，看收款那一栏。<\/p>\n<p data-p=\"60\">明州江北某巷某号，周宅。<\/p>\n<p data-p=\"61\">一字不差。<\/p>\n<p data-p=\"62\">范小满看着两张图，半天才反应过来：“你那本汇款簿上，那个在上海钱庄做事的伙计……”<\/p>\n<p data-p=\"63\">“姓周，”林衡说，“往同一个地址寄钱。”<\/p>\n<p data-p=\"64\">“他是秀英的什么人？”<\/p>\n<p data-p=\"65\">“年纪对得上的话，”林衡说，“多半是弟弟。”<\/p>\n<p data-p=\"66\">两个人对视了一眼。<\/p>\n<p data-p=\"67\">林衡花三十块钱，从一堆废纸里淘回来的那本汇款簿，在他书架上放了好几年，他以为那是别人家的一个小故事。原来不是别人家，就是这一家。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"68\">下午四点半，大姐过来提醒，五点闭馆。<\/p>\n<p data-p=\"69\">林衡加快了速度。民国三十年过去了，他翻到了民国三十一年。<\/p>\n<p data-p=\"70\">正月，没有沈阿根。二月，没有。<\/p>\n<p data-p=\"71\">他往回翻了一页，又往后翻了一页。然后，他在三月那一栏的末尾，看见了一行字。<\/p>\n<p data-p=\"72\">那行字不是墨写的，是朱笔。钱庄里，朱笔是用来销账的。<\/p>\n<p data-p=\"73\">林衡的铅笔停在半空。<\/p>\n<p data-p=\"74\">范小满凑过来，看见了那行字。<\/p>\n<p class=\"zhang zhu\" data-p=\"75\">沈阿根殁。汇款止。<\/p>\n<p data-p=\"76\">查阅室里很安静。窗外的天快黑了，日光灯嗡嗡地响。<\/p>\n<p data-p=\"77\">大姐走过来，看了看他们，又看了看桌上那本摊开的账，没有催他们走。<\/p>", "paras": ["林衡说他知道该去哪儿找，这话有一半是真的。", "真的那一半是：他书架上那本汇款簿的封面上，盖着一方褪了色的朱印，“恒裕钱庄沪号”。为了弄清这个恒裕是什么来头，他几年前就查过一轮：总号在明州，上海有分号，香港有代理处，是那个年代明州帮在南洋做生意的人最常用的几家钱庄之一。一个在南洋跑船的明州人往家里寄钱，十有八九会走这几家。", "假的那一半是：恒裕早在几十年前就没了。它的账，有的烧了，有的散了，剩下的一点残本，据说躺在市档案馆的库房里，从来没人借过。", "“据说？”范小满问。", "“我去问过一次，”林衡说，“他们要介绍信。”", "“你没开？”", "“我找谁开？”林衡说，“跟单位说，我要去查一家民国钱庄的账，研究一个陌生人的汇款？”", "范小满想了想，从包里掏出一张盖着红章的纸。", "“一水阁的，”她说，“昨天开的。”", "市档案馆的查阅室在三楼，规矩比一水阁的修复室还多。", "门口贴着一张告示，一共十二条：凭介绍信查阅；只许用铅笔；不得拍照；不得在档案上写字、折角、压东西；不得饮食；不得大声喧哗；翻页须用指腹，不得用指尖……林衡一条一条看下来，心里涌起一股久违的亲切感，像在异乡听见了乡音。", "值班的管理员是个五十来岁的大姐，接过介绍信看了一眼，又抬头看了一眼范小满，眼睛忽然亮了。", "“你是不是那个……冻书的姑娘？”", "范小满往后退了半步：“啊？”", "“公众号上那个！台风夜，集装箱，三百本书！”大姐一拍桌子，又想起这里不能大声喧哗，赶紧压低声音，“我转发了三个群，我女儿还给我点了个赞，她从来不给我点赞。”", "她当场掏出手机，要跟范小满合影。拍完了，她这才注意到旁边还站着一个人。", "“这位是？”", "范小满看了林衡一眼。林衡张了张嘴，还没想好自己算什么，大姐已经替他想好了。", "“哦，你助理吧？”她把一张查阅登记表推到林衡面前，“小伙子，你来填。”", "林衡接过笔，在“查阅人”那一栏填上了范小满的名字，在“随同人员”那一栏，填上了自己。", "范小满在旁边憋着笑，憋得肩膀直抖。", "恒裕的残本装在六只档案箱里，搬出来的时候，箱子上的灰厚得能写字。", "大姐把箱子往桌上一放，叹了口气：“这几箱，我在这儿上了十二年班，你们是第一个来借的。”", "范小满打开第一箱，手停在箱盖上。里面是一捆一捆的账册，有的发了霉，有的粘成了一坨，有的只剩半本，封皮上的字都看不清了。", "“这怎么找？”", "林衡戴上手套，蹲下来，一本一本地看封皮，看了十几本，又看了看账册的厚薄和装订的线。", "“这几本是存款，”他把几本挪到一边，“这几本是放款，这一捆是同行之间往来的。我们要找的是汇款，钱庄管这个叫汇划，账册上一般有个'汇'字，或者写着外埠的地名。”", "他从第四箱里抽出一本，封皮上隐约有个“港”字。", "“香港代理处的，”他说，“南洋来的钱，要先到这儿。”", "大姐在旁边看着，表情从“小助理”慢慢变成了“这孩子是个识货的”。", "那本账比他们想的还难读。", "纸脆得像秋天的落叶，字是那个年代钱庄里通行的写法，数目用的是一种老式的码子，范小满一个也认不出来。她修了五年书，第一次在一本账面前，觉得自己是个文盲。", "林衡却读得很顺。他用铅笔在一张白纸上，一行一行地抄：日期，户名，汇往何处，交付何人，数目几何。", "他抄得很慢。他说，这种账不能快，快了会漏。漏一笔，就漏了一个人。", "翻到民国二十六年十月，他的铅笔停住了。", "“找到了。”", "范小满凑过去。那一行字很小，墨色发灰，但认得出来：", "沈阿根　星洲　汇明州江北　交周秀英　国币叁元", "范小满盯着那一行，伸出去的手又收了回来。", "她修了几个月的日记，日记里的秀英，只有一个名字，没有姓，没有住处，像一个只活在信纸上的人。可这一行字里，她有姓，有地址，有人每个月往她手里送钱。她是真的，她就住在明州江北的一条巷子里。", "“周秀英。”范小满轻轻念了一遍。", "林衡往下翻。", "民国二十六年十一月，沈阿根，叁元。十二月，叁元。民国二十七年正月，叁元。", "一个月一笔，一笔不落。", "民国二十七年下半年，账上的写法变了。原先写“星洲直汇”，后来写“经港号转”。", "“打仗了，”林衡说，“上海那条线断了，南洋的钱只能绕道香港，再从香港转回来。多一道手，多一笔费用，路上也多一份风险。”", "“他还是寄了？”", "“他还是寄了。”", "民国二十八年，叁元。民国二十九年，叁元。民国三十年，叁元。数目没变，路线变了两次，有一阵子写的是“经港号转沪，再转甬”，绕了大半个中国。", "中间有几笔的墨迹晕开了，有一处霉斑盖住了半行，林衡没顾上细看，手指一路往下走。", "范小满看着那一串一模一样的数字，忽然觉得眼睛有点发酸。", "日记在民国二十六年秋天就断了。她一直以为，那个人也就是在那时候断了。原来没有。他不写字了，但他一直在寄钱。四年，打着仗，换着路，一个月也没停。", "“他为什么不写信了？”她问。", "“也许写了，没寄到。也许寄到了，没留下来。也许他不知道该写什么。”林衡说，“打仗的年代，一个在海那边的人，能说什么呢？说我很好，你别担心？说了也没人信。”", "他用铅笔轻轻点了点那一串数字。", "“日记会写好听的话，账本不会。账本只记一个人到底做了什么。”", "范小满转过头，看着他。", "还有一件事，是林衡抄到一半才发现的。", "他看着自己抄下的那个地址，“明州江北某巷某号，周宅”，觉得眼熟。他的笔尖在纸上点了两下，忽然想起来了。", "他从包里翻出手机，找到自己书架上那本汇款簿的照片，放大，看收款那一栏。", "明州江北某巷某号，周宅。", "一字不差。", "范小满看着两张图，半天才反应过来：“你那本汇款簿上，那个在上海钱庄做事的伙计……”", "“姓周，”林衡说，“往同一个地址寄钱。”", "“他是秀英的什么人？”", "“年纪对得上的话，”林衡说，“多半是弟弟。”", "两个人对视了一眼。", "林衡花三十块钱，从一堆废纸里淘回来的那本汇款簿，在他书架上放了好几年，他以为那是别人家的一个小故事。原来不是别人家，就是这一家。", "下午四点半，大姐过来提醒，五点闭馆。", "林衡加快了速度。民国三十年过去了，他翻到了民国三十一年。", "正月，没有沈阿根。二月，没有。", "他往回翻了一页，又往后翻了一页。然后，他在三月那一栏的末尾，看见了一行字。", "那行字不是墨写的，是朱笔。钱庄里，朱笔是用来销账的。", "林衡的铅笔停在半空。", "范小满凑过来，看见了那行字。", "沈阿根殁。汇款止。", "查阅室里很安静。窗外的天快黑了，日光灯嗡嗡地响。", "大姐走过来，看了看他们，又看了看桌上那本摊开的账，没有催他们走。"], "recap": "冷战两周后，范小满拎着一袋生煎找到林衡家，看见一整墙的民国账本。阿根的日记在民国二十六年秋天断了，她查不下去。林衡说：人会不写信，钱不会不寄，钱庄的账上一定有他。他还翻出自己书架上一本汇款簿：一个姓周的钱庄伙计，民国二十七年腊月忽然往家里寄了二十块。"}, {"n": 8, "cn": "八", "title": "情敌", "era": "", "chars": 2461, "mins": 7, "html": "<p data-p=\"0\">档案馆出来，两个人沿着眉湖走了一整圈。<\/p>\n<p data-p=\"1\">那行朱笔字，两个人都没提。<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>说起一水阁新到的一批宣纸，<b class=\"rn\" data-c=\"linheng\">林衡<\/b>说起港区新来的一台龙门吊。<\/p>\n<p data-p=\"2\">走到她家巷口，范小满停下来。<\/p>\n<p data-p=\"3\">“日记我还会接着修。”她说。<\/p>\n<p data-p=\"4\">“后面都是空白页。”<\/p>\n<p data-p=\"5\">“空白页也要修。”她说，“人没了，纸还在。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"6\">接下来那几周，坏消息像排了队似的，一个接一个地来。<\/p>\n<p data-p=\"7\">第一个是一水阁的。<\/p>\n<p data-p=\"8\">年底预算下来，手工修复的经费砍了一半。馆里开会，领导讲了四十分钟数字化的战略意义，讲到扫描仪一天能扫三千页，讲到云端永久保存，讲到“让古籍活起来”。范小满坐在最后一排，听着，想起<b class=\"rn\" data-c=\"zhengzong\">郑总<\/b>那句“年轻人，图什么呢”。原来这句话，不只郑总一个人会说。<\/p>\n<p data-p=\"9\">会后，<b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>把她叫进修复室，关上了门。<\/p>\n<p data-p=\"10\">“我明年就退了。”<\/p>\n<p data-p=\"11\">“我知道。”<\/p>\n<p data-p=\"12\">“我退了，修复室只留一个编制。”吴老师看着她，“你是合同工。”<\/p>\n<p data-p=\"13\">范小满低头看着自己的手套。<\/p>\n<p data-p=\"14\">“我替你争过了，”吴老师说，“争不动。”<\/p>\n<p data-p=\"15\">窗外的银杏落了一地，黄得刺眼。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"16\">第二个消息，是<b class=\"rn\" data-c=\"luxingzhou\">陆行舟<\/b>带来的。<\/p>\n<p data-p=\"17\">他约她在眉湖边一家馆子吃饭，说有正事。菜上齐了，他开门见山：<\/p>\n<p data-p=\"18\">“嘉禾在上海开了一个修复中心，缺一个负责人。我推荐了你。”<\/p>\n<p data-p=\"19\">范小满的筷子停住了。<\/p>\n<p data-p=\"20\">“薪水是你现在的三倍。有自己的工作室，设备全是进口的，不用跟人抢一台透光台。你想修什么就修什么，不用看谁的预算。”<\/p>\n<p data-p=\"21\">“为什么是我？”<\/p>\n<p data-p=\"22\">“因为你是我见过的最好的修复师。”陆行舟说，“还有一个原因，我也说在前面，免得以后你觉得我藏着掖着。”<\/p>\n<p data-p=\"23\">他放下筷子，看着她。<\/p>\n<p data-p=\"24\">“我想追你。但这两件事，你可以分开看。你可以只要这份工作，不要我。工作还是你的。”<\/p>\n<p data-p=\"25\">范小满看着他。这种话，被他说得像在谈一份合同：条款清楚，退路留足，连违约责任都替她想好了。<\/p>\n<p data-p=\"26\">“我……”<\/p>\n<p data-p=\"27\">“不用现在回答。”陆行舟重新拿起筷子，给她夹了一块鱼，“这家的鱼不错，趁热吃。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"28\">第三个坏消息，是林衡自己制造的。<\/p>\n<p data-p=\"29\">那几天，<b class=\"rn\" data-c=\"xiaozhou\">小周<\/b>发现林衡状态很差。连着三天，他对着电脑上同一张图片发呆，图片是一行看不懂的毛笔字，午饭也没去吃。<\/p>\n<p data-p=\"30\">小周决定出手。<\/p>\n<p data-p=\"31\">“衡哥，”他把椅子滑到林衡旁边，“你是不是想安慰一个人，又不知道怎么说？”<\/p>\n<p data-p=\"32\">林衡没否认。<\/p>\n<p data-p=\"33\">小周掏出手机，打开一个收藏夹，里面是几十个短视频，标题一个比一个吓人：《三句话说到她心里》《高情商安慰十大金句》《学会这招，夸人夸到心坎里》。<\/p>\n<p data-p=\"34\">“我给你总结一下，”小周说，“核心就一条：夸人要具体，要用心。最好结合她的专业，再结合你自己的专业，显得你琢磨过。”<\/p>\n<p data-p=\"35\">林衡认真地记下了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"36\">机会是周五来的。<\/p>\n<p data-p=\"37\">一水阁又有一批书要送去港区冷箱，范小满跟车过来，林衡在堆场门口等着签字。手续办完，她站在冷箱边上，看着工人往里搬书，一句话也没说。<\/p>\n<p data-p=\"38\">林衡在心里把小周的话过了三遍：具体，用心，结合她的专业，结合自己的专业。<\/p>\n<p data-p=\"39\">然后，他开口了。<\/p>\n<p data-p=\"40\">“你就像，”他说，“民国二十四年的法币改革。”<\/p>\n<p data-p=\"41\">范小满慢慢转过头，看着他。<\/p>\n<p data-p=\"42\">“什么？”<\/p>\n<p data-p=\"43\">“就是……”林衡发现，自己是说出口以后，才开始想这句话是什么意思，“那之前，大家用的钱乱七八糟，银元、铜元、各家银行自己印的票子，谁也说不清哪个值多少。然后……”<\/p>\n<p data-p=\"44\">“然后？”<\/p>\n<p data-p=\"45\">“然后就统一了。”<\/p>\n<p data-p=\"46\">“统一了什么？”<\/p>\n<p data-p=\"47\">林衡张了张嘴。他想说的大概是，在她出现以前，他的日子也是这么乱七八糟的，然后……然后什么，他自己也不知道。<\/p>\n<p data-p=\"48\">“……我也不知道。”<\/p>\n<p data-p=\"49\">风从港区那边吹过来，带着一点海腥味。龙门吊在远处缓缓转了个身。一个工人抱着一摞书从他们旁边走过，看了他们一眼，又看了一眼，加快脚步走了。<\/p>\n<p data-p=\"50\">范小满把手里的签收单折了两折，什么也没说，转身上了车。<\/p>\n<p data-p=\"51\">林衡站在原地。他终于明白了一件事：小周的收藏夹里有几十个这样的视频，小周至今单身。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"52\">那天晚上，林衡没有坐车，绕着眉湖走回家。<\/p>\n<p data-p=\"53\">这是他的老毛病了。<\/p>\n<p data-p=\"54\">经过湖边那家馆子的时候，他看见靠窗的位子上，范小满和陆行舟面对面坐着。窗子开了一条缝，她的声音飘了出来。她在笑，在讲一个故事，讲得很投入，手指敲着桌面，敲的节奏像在打鼓。<\/p>\n<p data-p=\"55\">“……那个姑娘叫<b class=\"rn\" data-c=\"chengxiuyun\">程绣芸<\/b>，为了能看一水阁的书，嫁进了楼主家。结果呢，楼主家有规矩，女人不许登楼。她守着一座藏书楼守了一辈子，一本书也没摸到，最后郁郁而终。”<\/p>\n<p data-p=\"56\">“那你呢？”陆行舟笑着问，“你登得上吗？”<\/p>\n<p data-p=\"57\">“我？我现在天天在楼里。”范小满说，“不过我也有个规矩。”<\/p>\n<p data-p=\"58\">“什么规矩？”<\/p>\n<p data-p=\"59\">“书不出阁，我也不出阁。”她笑着说，“我长这么大，没离开过明州一个礼拜。”<\/p>\n<p data-p=\"60\">林衡站在湖边的柳树下，听完了这个故事。他没有进去，也没有走开。他就那样站着，像那天在修复室门口，等了三分钟，不敢出声。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"61\">先看见他的，是陆行舟。<\/p>\n<p data-p=\"62\">陆行舟跟范小满说了句什么，起身走了出来，在柳树下站定，笑着打了个招呼：“林先生，又绕路？”<\/p>\n<p data-p=\"63\">林衡没有回答。<\/p>\n<p data-p=\"64\">“她跟我说起过你，”陆行舟说，“说你懂旧账本，懂得吓人，那天在档案馆，一个人读完了半箱钱庄的账。”<\/p>\n<p data-p=\"65\">“她还说什么了？”<\/p>\n<p data-p=\"66\">“说你夸人夸得很别致。”陆行舟笑了，笑得很真诚，“法币改革，是吧？我回去也查了查。”<\/p>\n<p data-p=\"67\">林衡把手插进了口袋里。<\/p>\n<p data-p=\"68\">“我这个人，”陆行舟看着湖面，“想要什么，会说出来。说出来，不一定能得到；不说，一定得不到。这是我在拍卖行学到的唯一一条规矩。”<\/p>\n<p data-p=\"69\">“她想去哪儿，”林衡说，“是她自己的事。”<\/p>\n<p data-p=\"70\">“你真这么想？”<\/p>\n<p data-p=\"71\">“我真这么想。”<\/p>\n<p data-p=\"72\">陆行舟看着他，点点头，又笑了一下。这一次，他的笑里少了点客气。<\/p>\n<p data-p=\"73\">“那你比我想的还难对付。”<\/p>\n<p data-p=\"74\">他转身回了馆子。林衡站在柳树下，看着窗子里那两个人影，一直站到湖上的灯一盏一盏亮起来。<\/p>\n<p data-p=\"75\">他想，陆行舟说得对：不说，一定得不到。可他也知道，有些话一说出口，就成了要求。他没有资格向谁提要求，尤其是一个刚刚说过“书不出阁，我也不出阁”的人。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"76\">那天夜里，范小满躺在床上，翻来覆去睡不着。<\/p>\n<p data-p=\"77\">陆行舟的邀请，她还没有回。三倍的薪水，自己的工作室，进口的透光台。吴老师明年就退了，修复室只留一个编制。这些数字在她脑子里转来转去，像那本钱庄账上她一个也认不出的老式码子。<\/p>\n<p data-p=\"78\">半夜一点，她忽然坐起来，打开手机，搜了一行字：<\/p>\n<p class=\"search\" data-p=\"79\">民国二十四年，法币改革。<\/p>\n<p data-p=\"80\">她看了一个小时。她知道了那一年，全国的货币统一了；知道了银元退出了流通；知道了从那以后，一张纸就能代表一个国家的信用。<\/p>\n<p data-p=\"81\">她看到凌晨两点，还是没弄明白，这跟她有什么关系。<\/p>\n<p data-p=\"82\">可她也没有睡着。<\/p>", "paras": ["档案馆出来，两个人沿着眉湖走了一整圈。", "那行朱笔字，两个人都没提。范小满说起一水阁新到的一批宣纸，林衡说起港区新来的一台龙门吊。", "走到她家巷口，范小满停下来。", "“日记我还会接着修。”她说。", "“后面都是空白页。”", "“空白页也要修。”她说，“人没了，纸还在。”", "接下来那几周，坏消息像排了队似的，一个接一个地来。", "第一个是一水阁的。", "年底预算下来，手工修复的经费砍了一半。馆里开会，领导讲了四十分钟数字化的战略意义，讲到扫描仪一天能扫三千页，讲到云端永久保存，讲到“让古籍活起来”。范小满坐在最后一排，听着，想起郑总那句“年轻人，图什么呢”。原来这句话，不只郑总一个人会说。", "会后，吴老师把她叫进修复室，关上了门。", "“我明年就退了。”", "“我知道。”", "“我退了，修复室只留一个编制。”吴老师看着她，“你是合同工。”", "范小满低头看着自己的手套。", "“我替你争过了，”吴老师说，“争不动。”", "窗外的银杏落了一地，黄得刺眼。", "第二个消息，是陆行舟带来的。", "他约她在眉湖边一家馆子吃饭，说有正事。菜上齐了，他开门见山：", "“嘉禾在上海开了一个修复中心，缺一个负责人。我推荐了你。”", "范小满的筷子停住了。", "“薪水是你现在的三倍。有自己的工作室，设备全是进口的，不用跟人抢一台透光台。你想修什么就修什么，不用看谁的预算。”", "“为什么是我？”", "“因为你是我见过的最好的修复师。”陆行舟说，“还有一个原因，我也说在前面，免得以后你觉得我藏着掖着。”", "他放下筷子，看着她。", "“我想追你。但这两件事，你可以分开看。你可以只要这份工作，不要我。工作还是你的。”", "范小满看着他。这种话，被他说得像在谈一份合同：条款清楚，退路留足，连违约责任都替她想好了。", "“我……”", "“不用现在回答。”陆行舟重新拿起筷子，给她夹了一块鱼，“这家的鱼不错，趁热吃。”", "第三个坏消息，是林衡自己制造的。", "那几天，小周发现林衡状态很差。连着三天，他对着电脑上同一张图片发呆，图片是一行看不懂的毛笔字，午饭也没去吃。", "小周决定出手。", "“衡哥，”他把椅子滑到林衡旁边，“你是不是想安慰一个人，又不知道怎么说？”", "林衡没否认。", "小周掏出手机，打开一个收藏夹，里面是几十个短视频，标题一个比一个吓人：《三句话说到她心里》《高情商安慰十大金句》《学会这招，夸人夸到心坎里》。", "“我给你总结一下，”小周说，“核心就一条：夸人要具体，要用心。最好结合她的专业，再结合你自己的专业，显得你琢磨过。”", "林衡认真地记下了。", "机会是周五来的。", "一水阁又有一批书要送去港区冷箱，范小满跟车过来，林衡在堆场门口等着签字。手续办完，她站在冷箱边上，看着工人往里搬书，一句话也没说。", "林衡在心里把小周的话过了三遍：具体，用心，结合她的专业，结合自己的专业。", "然后，他开口了。", "“你就像，”他说，“民国二十四年的法币改革。”", "范小满慢慢转过头，看着他。", "“什么？”", "“就是……”林衡发现，自己是说出口以后，才开始想这句话是什么意思，“那之前，大家用的钱乱七八糟，银元、铜元、各家银行自己印的票子，谁也说不清哪个值多少。然后……”", "“然后？”", "“然后就统一了。”", "“统一了什么？”", "林衡张了张嘴。他想说的大概是，在她出现以前，他的日子也是这么乱七八糟的，然后……然后什么，他自己也不知道。", "“……我也不知道。”", "风从港区那边吹过来，带着一点海腥味。龙门吊在远处缓缓转了个身。一个工人抱着一摞书从他们旁边走过，看了他们一眼，又看了一眼，加快脚步走了。", "范小满把手里的签收单折了两折，什么也没说，转身上了车。", "林衡站在原地。他终于明白了一件事：小周的收藏夹里有几十个这样的视频，小周至今单身。", "那天晚上，林衡没有坐车，绕着眉湖走回家。", "这是他的老毛病了。", "经过湖边那家馆子的时候，他看见靠窗的位子上，范小满和陆行舟面对面坐着。窗子开了一条缝，她的声音飘了出来。她在笑，在讲一个故事，讲得很投入，手指敲着桌面，敲的节奏像在打鼓。", "“……那个姑娘叫程绣芸，为了能看一水阁的书，嫁进了楼主家。结果呢，楼主家有规矩，女人不许登楼。她守着一座藏书楼守了一辈子，一本书也没摸到，最后郁郁而终。”", "“那你呢？”陆行舟笑着问，“你登得上吗？”", "“我？我现在天天在楼里。”范小满说，“不过我也有个规矩。”", "“什么规矩？”", "“书不出阁，我也不出阁。”她笑着说，“我长这么大，没离开过明州一个礼拜。”", "林衡站在湖边的柳树下，听完了这个故事。他没有进去，也没有走开。他就那样站着，像那天在修复室门口，等了三分钟，不敢出声。", "先看见他的，是陆行舟。", "陆行舟跟范小满说了句什么，起身走了出来，在柳树下站定，笑着打了个招呼：“林先生，又绕路？”", "林衡没有回答。", "“她跟我说起过你，”陆行舟说，“说你懂旧账本，懂得吓人，那天在档案馆，一个人读完了半箱钱庄的账。”", "“她还说什么了？”", "“说你夸人夸得很别致。”陆行舟笑了，笑得很真诚，“法币改革，是吧？我回去也查了查。”", "林衡把手插进了口袋里。", "“我这个人，”陆行舟看着湖面，“想要什么，会说出来。说出来，不一定能得到；不说，一定得不到。这是我在拍卖行学到的唯一一条规矩。”", "“她想去哪儿，”林衡说，“是她自己的事。”", "“你真这么想？”", "“我真这么想。”", "陆行舟看着他，点点头，又笑了一下。这一次，他的笑里少了点客气。", "“那你比我想的还难对付。”", "他转身回了馆子。林衡站在柳树下，看着窗子里那两个人影，一直站到湖上的灯一盏一盏亮起来。", "他想，陆行舟说得对：不说，一定得不到。可他也知道，有些话一说出口，就成了要求。他没有资格向谁提要求，尤其是一个刚刚说过“书不出阁，我也不出阁”的人。", "那天夜里，范小满躺在床上，翻来覆去睡不着。", "陆行舟的邀请，她还没有回。三倍的薪水，自己的工作室，进口的透光台。吴老师明年就退了，修复室只留一个编制。这些数字在她脑子里转来转去，像那本钱庄账上她一个也认不出的老式码子。", "半夜一点，她忽然坐起来，打开手机，搜了一行字：", "民国二十四年，法币改革。", "她看了一个小时。她知道了那一年，全国的货币统一了；知道了银元退出了流通；知道了从那以后，一张纸就能代表一个国家的信用。", "她看到凌晨两点，还是没弄明白，这跟她有什么关系。", "可她也没有睡着。"], "recap": "在市档案馆，林衡从恒裕钱庄的残账里找到了沈阿根：每月三元，汇往明州江北，交周秀英。打着仗，绕道香港，四年没断。他书架上那本汇款簿，寄的也是同一个地址。翻到民国三十一年，账上出现一行朱笔：沈阿根殁，汇款止。"}, {"n": 9, "cn": "九", "title": "估值", "era": "", "chars": 3751, "mins": 10, "html": "<p data-p=\"0\">在港口集团，“估值”有一个不成文的解释：领导心里早有一个数，你的任务，是用二十页纸把这个数找出来。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"linheng\">林衡<\/b>用了三十七页，找出来的是另一个数。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"2\">任务是十二月初派下来的。<\/p>\n<p data-p=\"3\"><b class=\"rn\" data-c=\"sunzhuren\">孙主任<\/b>把林衡叫进办公室，亲手泡了一杯茶，推到他面前。孙主任给下属泡茶，在财务部是比年终奖还稀罕的事。上一次出现是三年前，喝茶的老刘，第二个月就外派去了非洲。<\/p>\n<p data-p=\"4\">“文化馆那批书，战略部要一份收购估值。<b class=\"rn\" data-c=\"zhengzong\">郑总<\/b>点了你的名，说你熟悉情况。”<\/p>\n<p data-p=\"5\">“好的。”<\/p>\n<p data-p=\"6\">入职六年，林衡在工作群里说得最多的两个词，是“好的”和“收到”。“不”字，他一次也没说过。<\/p>\n<p data-p=\"7\">“还有个事。”孙主任又往他杯里续了点水，“年底了，部门里有一个提拔的名额。<b class=\"rn\" data-c=\"hebuzhang\">何部长<\/b>跟郑总说得上话。这份报告，你写漂亮点。”<\/p>\n<p data-p=\"8\">“好的。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"9\">接下来的两个星期，林衡把自己埋进了那批书里。<\/p>\n<p data-p=\"10\">一水阁按合作协议送来一份清点目录：三百一十二件。明清刻本四十七册，是文化馆点名要的；其余是日记、账簿、契约、信札、票据，还有几张看不出用处的纸片，目录上统称“杂件”。<\/p>\n<p data-p=\"11\">战略部要的，是那四十七册的价钱。林衡把三百一十二件全看了。白天上班，晚上去一水阁对着实物核，周末泡在档案馆里查来历。他查出那几本账簿记的是一家明州米行三十年的生意，查出一沓票据是民国二十年代潮江上的船票，查出一张看着像废纸的契约，是眉湖边一家茶馆民国年间的租约，那家茶馆现在还开着。<\/p>\n<p data-p=\"12\">那天下午，<b class=\"rn\" data-c=\"xiaozhou\">小周<\/b>路过他的工位，看了一眼屏幕右下角的页码，又看了一眼他的脸。<\/p>\n<p data-p=\"13\">“衡哥，第三十七页了，你还在笑。”小周说，“我有点害怕。”<\/p>\n<p data-p=\"14\">报告的结论，和战略部想要的不一样。林衡把日记、账簿、票据列为核心藏品，刻本排在后面。那页嘉靖年间的修堤账，他照实写了一句备注：末页有后人补纸，补纸上的数目与底下原数不符，建议展出时注明。<\/p>\n<p data-p=\"15\">最后一页，他写了一句话。写完删了，删完又写上：<\/p>\n<p class=\"memo\" data-p=\"16\">这批书单拿出任何一册，都不是最好的。它们最值钱的地方，是还在一起。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"17\">报告交上去的第三天，从十九楼退了回来。<\/p>\n<p data-p=\"18\">报告上多了几处红笔字，字写得很大。孙主任说，是战略部何部长亲笔批的。<\/p>\n<p data-p=\"19\">修堤账那一页，红笔圈了一圈，旁边批着：放第一个。那句补纸的备注被一道红线划掉，旁边两个字：不写。<\/p>\n<p data-p=\"20\">日记那一页，批了三个字：没人看。<\/p>\n<p data-p=\"21\">最后一页那句话，没有批，只在底下画了一道波浪线。林衡把那道线来回看了几遍，没看懂是什么意思。<\/p>\n<p data-p=\"22\">孙主任把报告摊在桌上，手指在“没人看”三个字上点了点。<\/p>\n<p data-p=\"23\">“何部长的意思，日记、账簿这些，打包算杂件，不用单列。刻本往前放，估值往上走。”他说，“其实也有道理。博物馆里，一个人站在一件展品前面，听说平均不到十秒钟。十秒钟，人家要看的是金的、亮的、老的。一个跑船的写给对象的话，谁看？”<\/p>\n<p data-p=\"24\">林衡发现，自己又一次找不到这番话的错处。大部分人，确实只看十秒钟。<\/p>\n<p data-p=\"25\">“改一下，周五前给我。”<\/p>\n<p data-p=\"26\">林衡看着那份报告，没有伸手去拿。<\/p>\n<p data-p=\"27\">“孙主任，”他说，“这份报告，我不改。”<\/p>\n<p data-p=\"28\">这是他入职六年，第一次对领导说“不”。他说得很轻，像是怕把这个字摔坏了。<\/p>\n<p data-p=\"29\">孙主任看了他一会儿，没有生气，起身把门关上了。<\/p>\n<p data-p=\"30\">“小林，你听我说完。”他重新坐下，声音放低了，“文化馆开馆，头一个要讲的就是台风那晚的故事。宣传稿要过安全科，这是规矩。报告顺顺当当过了，项目往前走，那一段就是好人好事，没人会去细抠。报告卡住了，战略部要返工，所有材料都得从头再核一遍。”<\/p>\n<p data-p=\"31\">他把茶杯往林衡那边推了推。<\/p>\n<p data-p=\"32\">“你爸开的那只箱子，是待检修的。”<\/p>\n<p data-p=\"33\">林衡看着那杯茶，茶叶已经沉到了底。<\/p>\n<p data-p=\"34\">“我不是吓你。”孙主任说，“你是我看着进来的，你爸我也认识。他还有两年退休。”<\/p>\n<p data-p=\"35\">林衡知道，孙主任说这些，是真心替他着想。孙主任在这家公司待了二十年，知道一份报告往上走要过几道门，每道门后面坐着什么人。他只是习惯了，事情到了手里，就顺着最省力的角度往下走，像码头上的老师傅起吊。<\/p>\n<p data-p=\"36\">一只待检修的冷箱，私自启用，往轻里说是好人好事，往重里说是安全隐患。轻和重之间，隔着的，就是一份报告。<\/p>\n<p data-p=\"37\">“你再想想。”孙主任说。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"38\">那天晚上，林衡回到出租屋，没有开大灯。<\/p>\n<p data-p=\"39\">满墙的档案盒在台灯底下站成一排一排。民国十八年，民国二十二年，民国二十五年。那些年份里的人，早就做完了自己的选择。<\/p>\n<p data-p=\"40\">他想起孙主任那句话：写漂亮点。<\/p>\n<p data-p=\"41\">他掏出手机，打开相册，一张一张往回翻。翻过潮江边的夜色，翻过港区的冷箱，翻过档案馆门口那十二条规矩，一直翻到十月，翻到那页修堤账。<\/p>\n<p data-p=\"42\">照片拍得匆忙，有点歪。他放大，再放大。<\/p>\n<p data-p=\"43\">补纸的边上，靠近装订线的地方，有一行极小的字。小得像是怕人看见，又像是怕人看不见。那天在修复室，他光顾着看补纸底下的数，没有注意到它。<\/p>\n<p class=\"zhang\" data-p=\"44\">户房书吏<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>，照册誊录。<\/p>\n<p data-p=\"45\">照册誊录。照着册子抄的。<\/p>\n<p data-p=\"46\">林衡把手机凑到台灯底下，又放大了一档。<\/p>\n<p data-p=\"47\">他不知道这个人是谁，不知道他当年收了什么，怕的是什么，家里有几口人在等他吃饭。纸上都没写。纸上只写了：他照着抄了。他把这页账补得很漂亮，漂亮到四百多年都没有人看出来，然后在最不起眼的地方，留下了自己的名字。<\/p>\n<p data-p=\"48\">像一句认罪，也像一句辩解。<\/p>\n<p data-p=\"49\">林衡把手机扣在桌上。<\/p>\n<p data-p=\"50\">没有人让他造假。他们只是让他照着抄。<\/p>\n<div
