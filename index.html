根烟。", "“钱，我还是要还的。”他说，“下个月就到期，我没有别的办法。”", "林衡点点头。", "“可这批书，”沈浩把烟掐了，“不拆了。要卖就整批卖，谁买都行，一本也不许拆出去。”", "他想了想，又说：", "“那块布不卖。”", "当天晚上，陆行舟交出了一份新的估值。", "不是嘉禾的版本，是他用自己的名字签的。整批三百一十二件，连同那四十七册刻本，一起估。估值说明最后一页写着：此批藏品之价值，在于其完整；拆分出售，损失不可估量。", "这笔买卖里他自己的那份提成，他不要了。", "然后他去了整理室。", "范小满还在。她在给那块布做一个无酸纸的护套。", "陆行舟在门口站了一会儿。", "“上海那份合同，”他说，“你撕了吧。”", "范小满抬起头。", "“沈先生不拆了，整批卖。那个买家，也就用不着买了。”", "“那个买家……”", "“是我。”陆行舟说。", "他说得很轻松，像在说今天天气不错。", "“这些年攒了一点钱，刻本买不起，三百来件杂件，勉强够。我想，买下来，交给你修，修好了，总会有个去处。”他笑了一下，“现在用不着了。”", "范小满手里那张无酸纸，折到一半停住了。", "“你别这么看我。”陆行舟说，“我又不是做慈善。我想要什么，一直说得很清楚。”", "“上海那个位置，你想去，还是你的；不想去，就当我没说过。这一回，你自己选。”", "他转身要走，又回过头来。", "“范老师，有句话，本来轮不到我说。”", "“什么？”", "“他喜欢你。”陆行舟说，“我看得出来，吴老师也看得出来。就你们两个，看不出来。”", "他带上门走了。", "范小满一个人坐在整理室里。那块布铺在她面前：七十三道潮水，一只船头朝里的小船。", "她给人下结论，向来只要三句话。陆行舟的三句话，第一次见面她就下好了：会说话，懂行，替卖家办事。后来她添了一句：是个好人。也就添了这一句。", "林衡的三句话，她改了一回又一回，改到后来，原来那三句一句也不剩了。", "她想，大概就是这个缘故。陆行舟想买下那批书，是因为她在乎那批书；林衡在乎那批书，是在认识她以前。他花三十块钱买回一本别人家的汇款簿，读了好几年，那时候他还不知道世上有个范小满。", "一个人为了她去在乎，一个人本来就在乎。前一个，她要欠他一辈子；后一个，她只要站在他旁边。", "沈浩把整批出售的意向发给了港口集团战略部。按陆行舟的估值，整批的价钱，是那四十七册刻本的三倍还多。", "三天后，战略部回了话。", "沈浩在电话里把那句话念给林衡听，念得很慢：", "“文化馆预算只够四十七册。其余杂件，不收。”", "林衡挂了电话，打开企业微信。发给郑总的那条消息还停在那里：已读，没有回。"], "recap": "民国三十一年三月，恒裕的伙计冒雨来报信：阿根的船沉了。秀英说：晓得了，你进来擦擦头发。第二天，她过江，把卖绣活的钱推上柜台：照旧，记在他名下。那天夜里，她在那块蓝花布的一角，绣下了第一道潮水。"}, {"n": 18, "cn": "十八", "title": "越级", "era": "", "chars": 3192, "mins": 8, "html": "<p data-p=\"0\">在港口集团，越级汇报跟闯红灯差不多：人人都知道不能闯，人人也都知道，闯过去的人，通常不是赶时间，是不要命了。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"linheng\">林衡<\/b>准备了三个晚上。<\/p>\n<p data-p=\"2\">他没做PPT，也没写报告。三个晚上，他只写了一页A4纸。写满了，删掉一半，再写满，再删。最后剩下的，每一行都是一个数，或者一句他能当面答得上来的话。<\/p>\n<p data-p=\"3\">人怎么见，是父亲告诉他的。<\/p>\n<p data-p=\"4\">“<b class=\"rn\" data-c=\"zhengzong\">郑总<\/b>每礼拜一早上六点半，跟安全科走一趟码头。”<b class=\"rn\" data-c=\"linjianguo\">林建国<\/b>在电话里说，“雷打不动。我在港区三十年，换了四任领导，就他一个这样。”<\/p>\n<p data-p=\"5\">“你怎么知道？”<\/p>\n<p data-p=\"6\">“他从我吊底下走过去，走了五年了。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"7\">礼拜一早上，六点二十。<\/p>\n<p data-p=\"8\">码头上刚换完班，龙门吊一台一台亮着灯，集装箱卡车排着队往堆场里开。海面上浮着一层薄雾，远处一艘货轮正慢慢靠泊，拖轮在旁边推着，像几只小狗围着一头大象。<\/p>\n<p data-p=\"9\">六点半，郑总从泊位那头走过来，身边跟着安全科的两个人。<\/p>\n<p data-p=\"10\">林衡迎了上去。<\/p>\n<p data-p=\"11\">“郑总。”他说，“能不能给我十分钟。”<\/p>\n<p data-p=\"12\">郑总停下来，看了他一眼。<\/p>\n<p data-p=\"13\">“小林。”他认出来了，“你那条消息，我看到了。”<\/p>\n<p data-p=\"14\">“我知道。”林衡说，“显示已读。”<\/p>\n<p data-p=\"15\">安全科的一个年轻人没忍住，笑出了声，又赶紧咳嗽一下憋回去。<\/p>\n<p data-p=\"16\">郑总没笑。<\/p>\n<p data-p=\"17\">“文化馆的事归老何管。你找我，不合规矩。”<\/p>\n<p data-p=\"18\">“我知道，”林衡说，“所以我只要十分钟。”<\/p>\n<p data-p=\"19\">郑总看了看表，转身接着往前走。<\/p>\n<p data-p=\"20\">“走着说。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"21\">林衡跟在他旁边，把那页A4纸递了过去。<\/p>\n<p data-p=\"22\">“整批三百一十二件，连同四十七册刻本，一起收。”他说，“价钱按这份估值。估值人<b class=\"rn\" data-c=\"luxingzhou\">陆行舟<\/b>，是嘉禾的鉴定师，但这份是用他自己的名字签的，这笔买卖里他那份提成，他不要了。战略部之前用的那份，是卖家请的拍卖行给买家估的价。”<\/p>\n<p data-p=\"23\">郑总一边走一边看，没出声。<\/p>\n<p data-p=\"24\">“三倍。”他说，“钱从哪儿来？”<\/p>\n<p data-p=\"25\">“两块。”林衡说，“四十七册刻本的钱，文化馆的预算里本来就有。剩下的，走集团每年的对外捐赠。整批买下来，捐给一水阁永久保管，文化馆长期借展。一水阁是公立单位，按规定走公益性捐赠，符合条件的话，还能在税前扣除一部分。”<\/p>\n<p data-p=\"26\">郑总的脚步慢了一点。<\/p>\n<p data-p=\"27\">“老何要的是镇馆的刻本。你这三百件杂件，凭什么撑得起一个文化馆？”<\/p>\n<p data-p=\"28\">“刻本，别的馆也有。”林衡说，“这批杂件里，有一个明州海员十一年的日记，有他每个月寄回家的汇款，有他未婚妻的一本存折。抗战，南洋，钱庄，金圆券，全在里面。港口城市的文化馆，讲一个跑船的人和一个等在岸上的人，比四十七册刻本更像我们自己的东西。”<\/p>\n<p data-p=\"29\">他朝远处那艘正在靠泊的货轮看了一眼。<\/p>\n<p data-p=\"30\">“台风那篇文章，阅读量十万多。这个故事有没有人看，那时候就已经看过了。”<\/p>\n<p data-p=\"31\">郑总没有接话，接着往前走。<\/p>\n<p data-p=\"32\">前面就是冷箱堆场。东边第三排，那只箱子还在原地，箱门上已经没有“待检修”的标签了。<\/p>\n<p data-p=\"33\">“还有一件事。”林衡说，“冷箱那晚的事，展览里要原原本本写进去。”<\/p>\n<p data-p=\"34\">郑总停下了脚步。<\/p>\n<p data-p=\"35\">“那只箱子是待检修的，私自启用，是违规。”林衡说，“这件事现在压着，宣传稿里写成好人好事，看着干净。可这个故事传得越广，就越有人会去翻细节。哪天被人翻出来，标题就是'国企隐瞒安全违规'。”<\/p>\n<p data-p=\"36\">“不如自己写出来：那天晚上谁违了规，为什么违规，事后受了什么处分，集团又因此跟一水阁签了应急合作协议，以后台风天，古籍可以正规借用冷箱。违规写在明处，是一个隐患补上了；藏在暗处，是一颗雷。”<\/p>\n<p data-p=\"37\">郑总看着那只冷箱，把手背到了身后。<\/p>\n<p data-p=\"38\">“违规的是你爸吧。”<\/p>\n<p data-p=\"39\">“是。”<\/p>\n<p data-p=\"40\">“他知道你要这么写？”<\/p>\n<p data-p=\"41\">“他说，他自己扛。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"42\">郑总从口袋里掏出一支笔，在指间转了起来。<\/p>\n<p data-p=\"43\">笔在他指间转了一圈又一圈。林衡站在旁边，听着海浪一下一下拍在码头的岸壁上。<\/p>\n<p data-p=\"44\">“那页纸上，最后一行写的是什么？”郑总问。<\/p>\n<p data-p=\"45\">林衡把手机递过去。屏幕上是两张图，并排摆着。左边是那页嘉靖年间的修堤账，末页那条补纸，颜色和原纸一模一样，底下露出几个淡淡的数字；右边是<b class=\"rn\" data-c=\"xiuying\">秀英<\/b>的存折，最后一行歪歪扭扭：<b class=\"rn\" data-c=\"agen\">阿根<\/b>归，止。<\/p>\n<p data-p=\"46\">“我想把这两样放在一起展。”林衡说，“一个补在暗处，一个存在明处。存折旁边放一块小牌子，写清楚里面的钱为什么后来一文不值。”<\/p>\n<p data-p=\"47\">郑总看着那两张图，手里的笔停了。<\/p>\n<p data-p=\"48\">他把手机还给林衡。<\/p>\n<p data-p=\"49\">“材料礼拜三之前给我。”他说，“要正式的：估值，钱从哪里出，捐赠走什么口径，冷箱那段准备怎么写。先让法务过一遍。”<\/p>\n<p data-p=\"50\">林衡站在那里，一时没反应过来。<\/p>\n<p data-p=\"51\">“我拿去议，不是因为你讲得好。”郑总说，“是这笔账摆到桌面上，对集团划算。成不成，办公会说了算，不是我一个人。”<\/p>\n<p data-p=\"52\">他把笔收起来。<\/p>\n<p data-p=\"53\">“还有一条。你越过了两级。不管成不成，你在本部都待不下去了。不是我要罚你，是规矩。<b class=\"rn\" data-c=\"sunzhuren\">孙主任<\/b>和老何以后还要带人。”<\/p>\n<p data-p=\"54\">“外派的事，”他说，“我会跟人力说，一年改成三年。”<\/p>\n<p data-p=\"55\">码头上的风大了一点，把林衡手里那页A4纸吹得哗哗响。<\/p>\n<p data-p=\"56\">三年。<\/p>\n<p data-p=\"57\">他想起那间空了一半的修复室，想起整理室里那块绣满潮水的布。<\/p>\n<p data-p=\"58\">“我答应。”他说。<\/p>\n<p data-p=\"59\">郑总点点头，转身走了。走出去几步，又回过头来。<\/p>\n<p data-p=\"60\">“小林，你那份报告里那句话，我看过。”他说，“孙主任抽屉里那份。”<\/p>\n<p data-p=\"61\">他没说是哪句话，走了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"62\">林衡在礼拜三早上把材料交了上去。估值、捐赠口径、展览大纲、一笔三年的修复经费，还有冷箱那一段的写法，一共十一页，比上次那份报告短了二十六页。<\/p>\n<p data-p=\"63\">郑总没有回消息。礼拜四上午，陆行舟打来电话，说郑总那边的人找过他，把估值一项一项核了一遍，连他不要的那份提成，都让他写了一份书面说明。<\/p>\n<p data-p=\"64\">礼拜四下午，集团办公会。这件事排在议程最后一项，议了一个多钟头。<\/p>\n<p data-p=\"65\"><b class=\"rn\" data-c=\"hebuzhang\">何部长<\/b>第一个反对：预算是按四十七册报的，三百多件杂件，展不出分量；还把一件违规摆到台面上，开馆当天就是给自己找事。<\/p>\n<p data-p=\"66\">宣传部长没有接话，翻开手机，把台风那篇文章调了出来。十万多阅读，两千多条留言。好人好事的材料，年前就报到了市里。<\/p>\n<p data-p=\"67\">“现在大家记得的，是那位师傅。”他说，“开馆那天，只要评论区里有一个人问一句：那只箱子当时是不是待检修的？好人好事，就成了另一件事。”<\/p>\n<p data-p=\"68\">郑总没有替林衡说话。他只问了法务一个问题：冷箱这件事，要是哪天不是我们自己写出来的，是被人翻出来的，算什么？<\/p>\n<p data-p=\"69\">法务说：算瞒报。<\/p>\n<p data-p=\"70\">会议室里安静了一会儿。<\/p>\n<p data-p=\"71\">宣传部长想了想，说：“自己先写出来，就是另一个说法了。事发紧急，一线职工先行处置，事后受了处分，集团补上了制度。”他把手机扣在桌上，“制度和温度的结合。”<\/p>\n<p data-p=\"72\">半年前，在同一间会议室里，他也说过这句话。<\/p>\n<p data-p=\"73\">最后，何部长提了一个条件：开馆那天的主题，还叫“千年港城”。<\/p>\n<p data-p=\"74\">方案通过了。<\/p>\n<p data-p=\"75\">签约那天，何部长到场讲了话，讲千年港城，讲文化担当，讲集团高度重视古籍保护，讲得很好，掌声很响。林衡坐在最后一排，鼓了掌。<\/p>\n<p data-p=\"76\"><b class=\"rn\" data-c=\"shenhao\">沈浩<\/b>拿到钱的那个礼拜，把欠的账一笔一笔还清了。他给林衡发了一条消息，只有两个字：清了。<\/p>\n<p data-p=\"77\">孙主任没有再给他泡茶。<\/p>\n<p data-p=\"78\">展览大纲里，修堤账那一页的说明，用的是林衡当初写的那句备注：末页有后人补纸，补纸上的数目与底下原数不符。那句话曾经被红笔划掉过，后面跟着两个字：不写。现在它又回来了，一个字也没改。<\/p>\n<p data-p=\"79\">安全科的处理结果也下来了：港区职工林建国，未经审批启用待检修冷箱，违反设备管理规定，通报批评，扣当月绩效。考虑到事出紧急、未造成损失，退休待遇不受影响。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"80\">通报贴出来的那天，集团公众号也发了一篇文章，标题是《一批古籍的回家路》。配图是签约现场，最边上站着一个年轻人，只拍到半张脸，图片说明里写着：项目经办人，财务部林衡。<\/p>\n<p data-p=\"81\">那天下午，龙门吊上的对讲机里一直有人在说话。<\/p>\n<p data-p=\"82\">“老林，你上通报了。”<\/p>\n<p data-p=\"83\">“老林，公众号上那个财务部的小伙子，跟你一个姓啊。”<\/p>\n<p data-p=\"84\">四十米高的驾驶室里，林建国没吭声，手里的吊具稳稳地落下去，把一只集装箱放进了堆场。<\/p>\n<p data-p=\"85\">然后他按下对讲机。<\/p>\n<p data-p=\"86\">“那是我儿子。”<\/p>\n<p data-p=\"87\">对讲机里安静了几秒。<\/p>\n<p data-p=\"88\">全班组都听见了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"89\">那几天，<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>给林衡发过一条消息。<\/p>\n<p data-p=\"90\">“<b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>说，修复专项下来了，三年的。”<\/p>\n<p data-p=\"91\">他回：“嗯。”<\/p>\n<p data-p=\"92\">隔了几分钟，她又发：“是你吗？”<\/p>\n<p data-p=\"93\">他回：“是郑总批的。”<\/p>\n<p data-p=\"94\">这句话是实话。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"95\">月底，财务部来人去一水阁办交接。来的是<b class=\"rn\" data-c=\"xiaozhou\">小周<\/b>。林衡那摊事，从下个月起归他管了。<\/p>\n<p data-p=\"96\">材料签完，小周收拾着文件，随口说了一句：<\/p>\n<p data-p=\"97\">“范老师，以后这批书的事，您就找我。衡哥这一走就是三年，我得替他看着点。”<\/p>\n<p data-p=\"98\">范小满握着笔的手停住了。<\/p>\n<p data-p=\"99\">“三年？”<\/p>", "paras": ["在港口集团，越级汇报跟闯红灯差不多：人人都知道不能闯，人人也都知道，闯过去的人，通常不是赶时间，是不要命了。", "林衡准备了三个晚上。", "他没做PPT，也没写报告。三个晚上，他只写了一页A4纸。写满了，删掉一半，再写满，再删。最后剩下的，每一行都是一个数，或者一句他能当面答得上来的话。", "人怎么见，是父亲告诉他的。", "“郑总每礼拜一早上六点半，跟安全科走一趟码头。”林建国在电话里说，“雷打不动。我在港区三十年，换了四任领导，就他一个这样。”", "“你怎么知道？”", "“他从我吊底下走过去，走了五年了。”", "礼拜一早上，六点二十。", "码头上刚换完班，龙门吊一台一台亮着灯，集装箱卡车排着队往堆场里开。海面上浮着一层薄雾，远处一艘货轮正慢慢靠泊，拖轮在旁边推着，像几只小狗围着一头大象。", "六点半，郑总从泊位那头走过来，身边跟着安全科的两个人。", "林衡迎了上去。", "“郑总。”他说，“能不能给我十分钟。”", "郑总停下来，看了他一眼。", "“小林。”他认出来了，“你那条消息，我看到了。”", "“我知道。”林衡说，“显示已读。”", "安全科的一个年轻人没忍住，笑出了声，又赶紧咳嗽一下憋回去。", "郑总没笑。", "“文化馆的事归老何管。你找我，不合规矩。”", "“我知道，”林衡说，“所以我只要十分钟。”", "郑总看了看表，转身接着往前走。", "“走着说。”", "林衡跟在他旁边，把那页A4纸递了过去。", "“整批三百一十二件，连同四十七册刻本，一起收。”他说，“价钱按这份估值。估值人陆行舟，是嘉禾的鉴定师，但这份是用他自己的名字签的，这笔买卖里他那份提成，他不要了。战略部之前用的那份，是卖家请的拍卖行给买家估的价。”", "郑总一边走一边看，没出声。", "“三倍。”他说，“钱从哪儿来？”", "“两块。”林衡说，“四十七册刻本的钱，文化馆的预算里本来就有。剩下的，走集团每年的对外捐赠。整批买下来，捐给一水阁永久保管，文化馆长期借展。一水阁是公立单位，按规定走公益性捐赠，符合条件的话，还能在税前扣除一部分。”", "郑总的脚步慢了一点。", "“老何要的是镇馆的刻本。你这三百件杂件，凭什么撑得起一个文化馆？”", "“刻本，别的馆也有。”林衡说，“这批杂件里，有一个明州海员十一年的日记，有他每个月寄回家的汇款，有他未婚妻的一本存折。抗战，南洋，钱庄，金圆券，全在里面。港口城市的文化馆，讲一个跑船的人和一个等在岸上的人，比四十七册刻本更像我们自己的东西。”", "他朝远处那艘正在靠泊的货轮看了一眼。", "“台风那篇文章，阅读量十万多。这个故事有没有人看，那时候就已经看过了。”", "郑总没有接话，接着往前走。", "前面就是冷箱堆场。东边第三排，那只箱子还在原地，箱门上已经没有“待检修”的标签了。", "“还有一件事。”林衡说，“冷箱那晚的事，展览里要原原本本写进去。”", "郑总停下了脚步。", "“那只箱子是待检修的，私自启用，是违规。”林衡说，“这件事现在压着，宣传稿里写成好人好事，看着干净。可这个故事传得越广，就越有人会去翻细节。哪天被人翻出来，标题就是'国企隐瞒安全违规'。”", "“不如自己写出来：那天晚上谁违了规，为什么违规，事后受了什么处分，集团又因此跟一水阁签了应急合作协议，以后台风天，古籍可以正规借用冷箱。违规写在明处，是一个隐患补上了；藏在暗处，是一颗雷。”", "郑总看着那只冷箱，把手背到了身后。", "“违规的是你爸吧。”", "“是。”", "“他知道你要这么写？”", "“他说，他自己扛。”", "郑总从口袋里掏出一支笔，在指间转了起来。", "笔在他指间转了一圈又一圈。林衡站在旁边，听着海浪一下一下拍在码头的岸壁上。", "“那页纸上，最后一行写的是什么？”郑总问。", "林衡把手机递过去。屏幕上是两张图，并排摆着。左边是那页嘉靖年间的修堤账，末页那条补纸，颜色和原纸一模一样，底下露出几个淡淡的数字；右边是秀英的存折，最后一行歪歪扭扭：阿根归，止。", "“我想把这两样放在一起展。”林衡说，“一个补在暗处，一个存在明处。存折旁边放一块小牌子，写清楚里面的钱为什么后来一文不值。”", "郑总看着那两张图，手里的笔停了。", "他把手机还给林衡。", "“材料礼拜三之前给我。”他说，“要正式的：估值，钱从哪里出，捐赠走什么口径，冷箱那段准备怎么写。先让法务过一遍。”", "林衡站在那里，一时没反应过来。", "“我拿去议，不是因为你讲得好。”郑总说，“是这笔账摆到桌面上，对集团划算。成不成，办公会说了算，不是我一个人。”", "他把笔收起来。", "“还有一条。你越过了两级。不管成不成，你在本部都待不下去了。不是我要罚你，是规矩。孙主任和老何以后还要带人。”", "“外派的事，”他说，“我会跟人力说，一年改成三年。”", "码头上的风大了一点，把林衡手里那页A4纸吹得哗哗响。", "三年。", "他想起那间空了一半的修复室，想起整理室里那块绣满潮水的布。", "“我答应。”他说。", "郑总点点头，转身走了。走出去几步，又回过头来。", "“小林，你那份报告里那句话，我看过。”他说，“孙主任抽屉里那份。”", "他没说是哪句话，走了。", "林衡在礼拜三早上把材料交了上去。估值、捐赠口径、展览大纲、一笔三年的修复经费，还有冷箱那一段的写法，一共十一页，比上次那份报告短了二十六页。", "郑总没有回消息。礼拜四上午，陆行舟打来电话，说郑总那边的人找过他，把估值一项一项核了一遍，连他不要的那份提成，都让他写了一份书面说明。", "礼拜四下午，集团办公会。这件事排在议程最后一项，议了一个多钟头。", "何部长第一个反对：预算是按四十七册报的，三百多件杂件，展不出分量；还把一件违规摆到台面上，开馆当天就是给自己找事。", "宣传部长没有接话，翻开手机，把台风那篇文章调了出来。十万多阅读，两千多条留言。好人好事的材料，年前就报到了市里。", "“现在大家记得的，是那位师傅。”他说，“开馆那天，只要评论区里有一个人问一句：那只箱子当时是不是待检修的？好人好事，就成了另一件事。”", "郑总没有替林衡说话。他只问了法务一个问题：冷箱这件事，要是哪天不是我们自己写出来的，是被人翻出来的，算什么？", "法务说：算瞒报。", "会议室里安静了一会儿。", "宣传部长想了想，说：“自己先写出来，就是另一个说法了。事发紧急，一线职工先行处置，事后受了处分，集团补上了制度。”他把手机扣在桌上，“制度和温度的结合。”", "半年前，在同一间会议室里，他也说过这句话。", "最后，何部长提了一个条件：开馆那天的主题，还叫“千年港城”。", "方案通过了。", "签约那天，何部长到场讲了话，讲千年港城，讲文化担当，讲集团高度重视古籍保护，讲得很好，掌声很响。林衡坐在最后一排，鼓了掌。", "沈浩拿到钱的那个礼拜，把欠的账一笔一笔还清了。他给林衡发了一条消息，只有两个字：清了。", "孙主任没有再给他泡茶。", "展览大纲里，修堤账那一页的说明，用的是林衡当初写的那句备注：末页有后人补纸，补纸上的数目与底下原数不符。那句话曾经被红笔划掉过，后面跟着两个字：不写。现在它又回来了，一个字也没改。", "安全科的处理结果也下来了：港区职工林建国，未经审批启用待检修冷箱，违反设备管理规定，通报批评，扣当月绩效。考虑到事出紧急、未造成损失，退休待遇不受影响。", "通报贴出来的那天，集团公众号也发了一篇文章，标题是《一批古籍的回家路》。配图是签约现场，最边上站着一个年轻人，只拍到半张脸，图片说明里写着：项目经办人，财务部林衡。", "那天下午，龙门吊上的对讲机里一直有人在说话。", "“老林，你上通报了。”", "“老林，公众号上那个财务部的小伙子，跟你一个姓啊。”", "四十米高的驾驶室里，林建国没吭声，手里的吊具稳稳地落下去，把一只集装箱放进了堆场。", "然后他按下对讲机。", "“那是我儿子。”", "对讲机里安静了几秒。", "全班组都听见了。", "那几天，范小满给林衡发过一条消息。", "“吴老师说，修复专项下来了，三年的。”", "他回：“嗯。”", "隔了几分钟，她又发：“是你吗？”", "他回：“是郑总批的。”", "这句话是实话。", "月底，财务部来人去一水阁办交接。来的是小周。林衡那摊事，从下个月起归他管了。", "材料签完，小周收拾着文件，随口说了一句：", "“范老师，以后这批书的事，您就找我。衡哥这一走就是三年，我得替他看着点。”", "范小满握着笔的手停住了。", "“三年？”"], "recap": "林衡请陆行舟放手，让范小满自己选。沈浩认出存折上的户名是他奶奶，爷爷就是阿根。布上的潮水和存折上的“收现”，都是七十三。沈浩决定不拆了，整批卖，那块布不卖。陆行舟用自己的名字重估了整批藏品，也承认那个买家就是他。战略部却回话：预算只够四十七册。"}, {"n": 19, "cn": "十九", "title": "江边", "era": "", "chars": 2068, "mins": 6, "html": "<p data-p=\"0\">清明前后的明州，雨下得很有分寸：不大，也不停，刚好让每个人都觉得，自己该想念一个谁。<\/p>\n<p data-p=\"1\">四月四号下午，<b class=\"rn\" data-c=\"linheng\">林衡<\/b>去了一趟<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>家。<\/p>\n<p data-p=\"2\">自从<b class=\"rn\" data-c=\"xiaozhou\">小周<\/b>那句“三年”之后，她就没回过他的消息。他发了三条，一条比一条短：<\/p>\n<p class=\"msg l\" data-p=\"3\">明天走。<\/p>\n<p class=\"msg l\" data-p=\"4\">在修复室吗？<\/p>\n<p class=\"msg l\" data-p=\"5\">我下午过来一趟。<\/p>\n<p data-p=\"6\">三条都显示已读，一条也没回。上一回这样等一条回复，是等<b class=\"rn\" data-c=\"zhengzong\">郑总<\/b>。<\/p>\n<p data-p=\"7\">巷子很窄，两边是老墙门。他按了门铃，开门的是一个五十来岁的女人，头发剪得很短，围裙还没解。<\/p>\n<p data-p=\"8\">“阿姨好，我找范小满。我是……”<\/p>\n<p data-p=\"9\">“我晓得你是谁。”范小满的母亲说，“她在修复室，晚上才回来。”<\/p>\n<p data-p=\"10\">她解下围裙，搭在门边的椅背上。<\/p>\n<p data-p=\"11\">“你陪我去湖边坐坐。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"12\">茶馆在眉湖边上，开了快一百年。林衡知道它开了快一百年，是因为去年冬天，他在那批书里翻到过它民国年间的租约。<\/p>\n<p data-p=\"13\">他差一点就要开口讲这份租约，忍住了。<\/p>\n<p data-p=\"14\"><b class=\"rn\" data-c=\"fanmu\">范母<\/b>要了一壶龙井，两只杯子。她给他倒了一杯，自己没动，坐得很直。<\/p>\n<p data-p=\"15\">林衡也坐得很直。他面试过三回，没有一回这么紧张。<\/p>\n<p data-p=\"16\">范母只问了三个问题。<\/p>\n<p data-p=\"17\">“外派几年？”<\/p>\n<p data-p=\"18\">“三年。”<\/p>\n<p data-p=\"19\">“她知道吗？”<\/p>\n<p data-p=\"20\">“知道了。”林衡的手指在杯沿上停了停，“不是我跟她说的。”<\/p>\n<p data-p=\"21\">“那你打算怎么办？”<\/p>\n<p data-p=\"22\">林衡看着那杯茶。茶叶一片一片沉下去，又浮上来。<\/p>\n<p data-p=\"23\">“我不知道。”他说，“所以我什么也没跟她说。”<\/p>\n<p data-p=\"24\">范母拿起茶壶，给他续了水。<\/p>\n<p data-p=\"25\">她没有再问，端起自己那杯茶喝了一口，又放下。窗外的湖上起了一层薄雾，柳条刚冒出新芽，嫩得发黄。<\/p>\n<p data-p=\"26\">走的时候，她把茶钱付了，什么也没说。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"27\">那天晚上，范小满回到家，母亲在厨房里炒菜，背对着她说了一句：<\/p>\n<p data-p=\"28\">“那个港口的小林，下半日来过了。”<\/p>\n<p data-p=\"29\">范小满换鞋的手停了一下。<\/p>\n<p data-p=\"30\">“我问了他三个问题。”母亲说，“他说，他什么也没跟你说。”<\/p>\n<p data-p=\"31\">锅里的油响了一阵。<\/p>\n<p data-p=\"32\">“跟我倒是什么都说了。”<\/p>\n<p data-p=\"33\">范小满一只鞋还拎在手里，掏出了手机，发了一条消息：<\/p>\n<p class=\"msg r\" data-p=\"34\">九点，江北老码头。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"35\">江北老码头早就不走客船了。<\/p>\n<p data-p=\"36\">岸边的老仓库改成了咖啡馆和小酒馆，霓虹灯一闪一闪，映在潮江上。石头砌的岸还是老的，一级一级伸进水里，涨潮的时候，最底下那几级就看不见了。<\/p>\n<p class=\"echo\" data-p=\"37\">民国二十六年正月十八，这里起了雾，江边站满了送行的人。<\/p>\n<p data-p=\"38\">林衡到的时候，范小满已经坐在最底下那一级还干着的石阶上了。<\/p>\n<p class=\"echo\" data-p=\"39\"><b class=\"rn\" data-c=\"agen\">阿根<\/b>挑着铺盖，搪瓷缸挂在扁担头上，一晃一晃。<\/p>\n<p data-p=\"40\">他在她旁边坐下，中间隔着一个人的距离。<\/p>\n<p data-p=\"41\">“三年，”范小满开口就是这一句，“我是从小周嘴里听来的。”<\/p>\n<p data-p=\"42\">“我本来……”<\/p>\n<p data-p=\"43\">“小周！”她说，“你们部门那个小周！”<\/p>\n<p data-p=\"44\">林衡低头看着脚下的石阶。<\/p>\n<p data-p=\"45\">“文化馆的事，我是从郑总嘴里听来的。你顶撞领导，是<b class=\"rn\" data-c=\"luxingzhou\">陆行舟<\/b>告诉我的。你考上过研究生，是你妈告诉我的。三年，是小周。”她一件一件地数，“修复专项，<b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>说是港口集团给的。我问你，你说是郑总批的。”<\/p>\n<p data-p=\"46\">“是郑总批的。”<\/p>\n<p data-p=\"47\">“你又来了！”<\/p>\n<p class=\"echo\" data-p=\"48\"><b class=\"rn\" data-c=\"xiuying\">秀英<\/b>把荷包塞进他手里。荷包上绣着一只小船，船头朝里。<\/p>\n<p data-p=\"49\">“你什么事都替别人想好了，想好了就自己去做，做完了一个字也不说。”范小满说，“三年，你问过我一句吗？”<\/p>\n<p data-p=\"50\">“我问你什么？”<\/p>\n<p data-p=\"51\">林衡的声音第一次大了起来。<\/p>\n<p data-p=\"52\">“问你等不等我三年？我凭什么问？三年，我人在几千公里外，回来以后在哪儿上班都不知道。我问了，你怎么答？你说等，你就欠我三年；你说不等，你就成了那个不等的人。我不问，你就什么都不欠。”<\/p>\n<p data-p=\"53\">“你以为你不问，我就不欠了？”<\/p>\n<p data-p=\"54\">“至少你不用答。”<\/p>\n<p data-p=\"55\">“我答不答，凭什么由你来定？”<\/p>\n<p data-p=\"56\">她的声音低了下来：“你倒是一样都不欠。我呢？你爸那只箱子，你那份方案，还有那笔修复专项，我一笔一笔都记着。你连让我还的机会都不给。”<\/p>\n<p data-p=\"57\">林衡看着她。<\/p>\n<p data-p=\"58\">“那你呢？”他说，“你答应去上海，你告诉我了吗？”<\/p>\n<p data-p=\"59\">范小满别过脸去。<\/p>\n<p data-p=\"60\">“你为了那几页日记，把自己押给了嘉禾，跟我说过一个字吗？我是在嘉禾的库房里，听陆行舟说的。”<\/p>\n<p data-p=\"61\">江上很静。一艘渡轮从远处开过来，灯光在水面上拖出长长的一道。<\/p>\n<p data-p=\"62\">范小满张了张嘴，什么也没说出来。<\/p>\n<p class=\"echo\" data-p=\"63\">阿根说：明年清明，我回来。秀英没说话。<\/p>\n<p data-p=\"64\">江上那艘渡轮靠了岸。范小满说：“我不去上海了。”<\/p>\n<p data-p=\"65\">林衡转过头。<\/p>\n<p data-p=\"66\">“修复专项三年。”她说，“这三年，一水阁养得起我。”<\/p>\n<p data-p=\"67\">他走三年。她在一水阁，也是三年。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"68\">潮水在涨。最底下那一级石阶，已经没进了水里。<\/p>\n<p data-p=\"69\">林衡看着江面，开口了。<\/p>\n<p data-p=\"70\">“明年清明……”<\/p>\n<p data-p=\"71\">他停住了。<\/p>\n<p data-p=\"72\">明年清明，他在马六甲。外派的人，清明不一定回得来；回不回得来，他说了不算。说了不算的话，他不说。<\/p>\n<p data-p=\"73\">范小满等着。他没有说下去。<\/p>\n<p class=\"echo\" data-p=\"74\">船开了。雾把船吞了进去，秀英还站在岸上。<\/p>\n<p data-p=\"75\">范小满低着头，看着脚下那一级被潮水漫过的石阶。<\/p>\n<p data-p=\"76\">“那块布的颜色，”她说，“你还记得吗？”<\/p>\n<p data-p=\"77\">“比海水浅一点，”林衡说，“比天深一点。”<\/p>\n<p data-p=\"78\">“那边的海，”她说，“你帮我看看，是不是这个颜色。”<\/p>\n<p data-p=\"79\">林衡看着她。<\/p>\n<p data-p=\"80\">“好。”<\/p>\n<p data-p=\"81\">他们在那级石阶上坐到很晚，一直坐到潮水漫到了脚边，才站起来。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"82\">第二天，清明。<\/p>\n<p data-p=\"83\">早上七点四十，林衡的航班起飞。到吉隆坡，再坐两个钟头的车，就是马六甲。<\/p>\n<p data-p=\"84\">机场里，<b class=\"rn\" data-c=\"linmu\">林母<\/b>的眼泪就没停。语音是发不成了，她当面说了足足十分钟。<b class=\"rn\" data-c=\"linjianguo\">林建国<\/b>替儿子扛着行李，一直扛到安检口，把箱子往他手里一放，拍了拍他的肩膀，什么也没说。<\/p>\n<p data-p=\"85\">同一时刻，一水阁修复室的灯已经亮了。<\/p>\n<p data-p=\"86\">那批书是四月初回来的，三百一十二件，一件不少。那本日记摆在透光台上，最后那十几页，还粘在一起。<\/p>\n<p data-p=\"87\">范小满戴上手套，拿起竹起子，沿着纸边轻轻挑了进去。<\/p>\n<p data-p=\"88\">她开始揭下一页。<\/p>", "paras": ["清明前后的明州，雨下得很有分寸：不大，也不停，刚好让每个人都觉得，自己该想念一个谁。", "四月四号下午，林衡去了一趟范小满家。", "自从小周那句“三年”之后，她就没回过他的消息。他发了三条，一条比一条短：", "明天走。", "在修复室吗？", "我下午过来一趟。", "三条都显示已读，一条也没回。上一回这样等一条回复，是等郑总。", "巷子很窄，两边是老墙门。他按了门铃，开门的是一个五十来岁的女人，头发剪得很短，围裙还没解。", "“阿姨好，我找范小满。我是……”", "“我晓得你是谁。”范小满的母亲说，“她在修复室，晚上才回来。”", "她解下围裙，搭在门边的椅背上。", "“你陪我去湖边坐坐。”", "茶馆在眉湖边上，开了快一百年。林衡知道它开了快一百年，是因为去年冬天，他在那批书里翻到过它民国年间的租约。", "他差一点就要开口讲这份租约，忍住了。", "范母要了一壶龙井，两只杯子。她给他倒了一杯，自己没动，坐得很直。", "林衡也坐得很直。他面试过三回，没有一回这么紧张。", "范母只问了三个问题。", "“外派几年？”", "“三年。”", "“她知道吗？”", "“知道了。”林衡的手指在杯沿上停了停，“不是我跟她说的。”", "“那你打算怎么办？”", "林衡看着那杯茶。茶叶一片一片沉下去，又浮上来。", "“我不知道。”他说，“所以我什么也没跟她说。”", "范母拿起茶壶，给他续了水。", "她没有再问，端起自己那杯茶喝了一口，又放下。窗外的湖上起了一层薄雾，柳条刚冒出新芽，嫩得发黄。", "走的时候，她把茶钱付了，什么也没说。", "那天晚上，范小满回到家，母亲在厨房里炒菜，背对着她说了一句：", "“那个港口的小林，下半日来过了。”", "范小满换鞋的手停了一下。", "“我问了他三个问题。”母亲说，“他说，他什么也没跟你说。”", "锅里的油响了一阵。", "“跟我倒是什么都说了。”", "范小满一只鞋还拎在手里，掏出了手机，发了一条消息：", "九点，江北老码头。", "江北老码头早就不走客船了。", "岸边的老仓库改成了咖啡馆和小酒馆，霓虹灯一闪一闪，映在潮江上。石头砌的岸还是老的，一级一级伸进水里，涨潮的时候，最底下那几级就看不见了。", "民国二十六年正月十八，这里起了雾，江边站满了送行的人。", "林衡到的时候，范小满已经坐在最底下那一级还干着的石阶上了。", "阿根挑着铺盖，搪瓷缸挂在扁担头上，一晃一晃。", "他在她旁边坐下，中间隔着一个人的距离。", "“三年，”范小满开口就是这一句，“我是从小周嘴里听来的。”", "“我本来……”", "“小周！”她说，“你们部门那个小周！”", "林衡低头看着脚下的石阶。", "“文化馆的事，我是从郑总嘴里听来的。你顶撞领导，是陆行舟告诉我的。你考上过研究生，是你妈告诉我的。三年，是小周。”她一件一件地数，“修复专项，吴老师说是港口集团给的。我问你，你说是郑总批的。”", "“是郑总批的。”", "“你又来了！”", "秀英把荷包塞进他手里。荷包上绣着一只小船，船头朝里。", "“你什么事都替别人想好了，想好了就自己去做，做完了一个字也不说。”范小满说，“三年，你问过我一句吗？”", "“我问你什么？”", "林衡的声音第一次大了起来。", "“问你等不等我三年？我凭什么问？三年，我人在几千公里外，回来以后在哪儿上班都不知道。我问了，你怎么答？你说等，你就欠我三年；你说不等，你就成了那个不等的人。我不问，你就什么都不欠。”", "“你以为你不问，我就不欠了？”", "“至少你不用答。”", "“我答不答，凭什么由你来定？”", "她的声音低了下来：“你倒是一样都不欠。我呢？你爸那只箱子，你那份方案，还有那笔修复专项，我一笔一笔都记着。你连让我还的机会都不给。”", "林衡看着她。", "“那你呢？”他说，“你答应去上海，你告诉我了吗？”", "范小满别过脸去。", "“你为了那几页日记，把自己押给了嘉禾，跟我说过一个字吗？我是在嘉禾的库房里，听陆行舟说的。”", "江上很静。一艘渡轮从远处开过来，灯光在水面上拖出长长的一道。", "范小满张了张嘴，什么也没说出来。", "阿根说：明年清明，我回来。秀英没说话。", "江上那艘渡轮靠了岸。范小满说：“我不去上海了。”", "林衡转过头。", "“修复专项三年。”她说，“这三年，一水阁养得起我。”", "他走三年。她在一水阁，也是三年。", "潮水在涨。最底下那一级石阶，已经没进了水里。", "林衡看着江面，开口了。", "“明年清明……”", "他停住了。", "明年清明，他在马六甲。外派的人，清明不一定回得来；回不回得来，他说了不算。说了不算的话，他不说。", "范小满等着。他没有说下去。", "船开了。雾把船吞了进去，秀英还站在岸上。", "范小满低着头，看着脚下那一级被潮水漫过的石阶。", "“那块布的颜色，”她说，“你还记得吗？”", "“比海水浅一点，”林衡说，“比天深一点。”", "“那边的海，”她说，“你帮我看看，是不是这个颜色。”", "林衡看着她。", "“好。”", "他们在那级石阶上坐到很晚，一直坐到潮水漫到了脚边，才站起来。", "第二天，清明。", "早上七点四十，林衡的航班起飞。到吉隆坡，再坐两个钟头的车，就是马六甲。", "机场里，林母的眼泪就没停。语音是发不成了，她当面说了足足十分钟。林建国替儿子扛着行李，一直扛到安检口，把箱子往他手里一放，拍了拍他的肩膀，什么也没说。", "同一时刻，一水阁修复室的灯已经亮了。", "那批书是四月初回来的，三百一十二件，一件不少。那本日记摆在透光台上，最后那十几页，还粘在一起。", "范小满戴上手套，拿起竹起子，沿着纸边轻轻挑了进去。", "她开始揭下一页。"], "recap": "礼拜一早上六点半，林衡在码头上拦住郑总，把整批收购、捐给一水阁、冷箱违规写进展览的方案讲完。办公会通过了，林建国被通报批评。代价是林衡越过了两级，外派从一年改成三年。范小满是从小周嘴里听到“三年”的。"}, {"n": 20, "cn": "二十", "title": "潮信", "era": "", "chars": 4131, "mins": 11, "html": "<p data-p=\"0\"><b class=\"rn\" data-c=\"linheng\">林衡<\/b>到马六甲的第一个礼拜，给<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>发了一张照片。<\/p>\n<p data-p=\"1\">照片里是码头外面的海。傍晚的光斜斜地照下来，海面上浮着一层碎金。底下配了一行字：<\/p>\n<p class=\"msg l\" data-p=\"2\">今天的海，比那块布深一点。<\/p>\n<p data-p=\"3\">范小满回了一张照片：一页刚揭开的书页，摊在透光台上，纸边补了一条新纸，颜色比原纸浅一点。<\/p>\n<p data-p=\"4\">她什么字也没配。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"5\">这样的照片，后来攒了一整年。<\/p>\n<p class=\"msg l\" data-p=\"6\">今天下雨，海是灰的，不算。<\/p>\n<p class=\"msg l\" data-p=\"7\">今天的海，跟那块布差不多。可能是我记错了。<\/p>\n<p class=\"msg l\" data-p=\"8\">今天港池里进来一条船，船身漆成蓝的，比那块布浅。<\/p>\n<p class=\"msg l\" data-p=\"9\">今天又去了鸡场街的布店。没有。<\/p>\n<p data-p=\"10\">范小满问：“没有什么？”<\/p>\n<p data-p=\"11\">他没回。<\/p>\n<p data-p=\"12\">范小满回的，都是书页。有时候是一页揭开的日记，有时候是一个补好的书角，有时候只是一张吸水纸，上面印着一块水渍的形状。<\/p>\n<p data-p=\"13\">他们差不多天天说话。说马六甲一年到头三十多度，说他想吃一碗猪油汤圆，可这边超市里只有速冻的芝麻馅，说一水阁新来的实习生，说<b class=\"rn\" data-c=\"linjianguo\">林建国<\/b>在班组里又讲了一遍“那是我儿子”，说<b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>退休以后天天去公园跟人下象棋，把一个退休的中学校长骂哭了。<\/p>\n<p data-p=\"14\"><b class=\"rn\" data-c=\"linmu\">林母<\/b>的语音，也从“你别跟你爸说是我说的”，变成了“你跟小满说了没有”。<\/p>\n<p data-p=\"15\">林衡回：“说什么？”<\/p>\n<p data-p=\"16\">林母发来一条六十秒的语音，前五十九秒都是叹气。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"17\">六月，范小满揭开了日记的最后一页。<\/p>\n<p data-p=\"18\">那十几页粘在一起的纸，前面全是空白。<b class=\"rn\" data-c=\"agen\">阿根<\/b>在南洋那些年，一个字也没有写。只有最后一页有字，墨色比前面所有的字都新：<\/p>\n<blockquote class=\"xin\">\n<p class=\"to\" data-p=\"19\"><b class=\"rn\" data-c=\"xiuying\">秀英<\/b>：<\/p>\n<p data-p=\"20\">船过马六甲了。这回是往家开。<\/p>\n<p data-p=\"21\">十一年。我不晓得你还在不在江边。在不在，我都回来。<\/p>\n<p data-p=\"22\">老船工讲，船去船回总无期。他讲错了。<\/p>\n<p class=\"sign\" data-p=\"23\">阿根　民国三十七年二月十二<\/p>\n<\/blockquote>\n<p data-p=\"24\">字还是那么丑，有两个别字。范小满把这一页揭开、展平、补好，一个人在修复室里，把那两个别字看了一遍又一遍。<\/p>\n<p data-p=\"25\">她把这一页拍下来，发给了林衡。<\/p>\n<p data-p=\"26\">马六甲那边过了一个多钟头才回，只有四个字：船头朝里。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"27\">七月，农历六月初六，一水阁晒书。<\/p>\n<p data-p=\"28\">往年都是吴老师带着她上藏书楼。今年吴老师退休了，这件事头一回由她一个人做。<\/p>\n<p data-p=\"29\">楼梯很窄，木头踩上去吱呀吱呀地响。两百多年前，有个叫<b class=\"rn\" data-c=\"chengxiuyun\">程绣芸<\/b>的姑娘，为了这座楼嫁进来，守了一辈子，一级台阶也没能上去。<\/p>\n<p data-p=\"30\">范小满走到了楼上。她推开窗，眉湖上的风吹进来，带着水汽。<\/p>\n<p data-p=\"31\">她想起自己说过的那句玩笑：书不出阁，我也不出阁。<\/p>\n<p data-p=\"32\">书是不出阁的。人，总得出去看看。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"33\">十月，文化馆开馆。<\/p>\n<p data-p=\"34\">展厅正中，两只玻璃柜并排摆着。一只里面是那本日记，翻开在最后一页；一只里面是秀英的存折，翻开在最后一行：阿根归，止。存折旁边，是那页嘉靖年间的修堤账，末页那条补纸还贴在原处。<\/p>\n<p data-p=\"35\">存折底下有一块小牌子，讲这本存折里的钱为什么后来一文不值。一共两百来字，是林衡在马六甲写好发回来的。<\/p>\n<p data-p=\"36\">开馆那天来了很多人。<b class=\"rn\" data-c=\"hebuzhang\">何部长<\/b>讲了话，讲得很好。<\/p>\n<p data-p=\"37\"><b class=\"rn\" data-c=\"shenhao\">沈浩<\/b>也来了。他在存折前面站了一会儿，然后走到范小满旁边，递给她一个布包。<\/p>\n<p data-p=\"38\">是那块蓝花布。<\/p>\n<p data-p=\"39\">“不展。”他说，“你替我收着。我那屋子小，又潮，怕放坏了。”<\/p>\n<p data-p=\"40\">“哪天你要是去那边，带上它。替我奶奶，去看看那片海。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"41\">开馆以后，<b class=\"rn\" data-c=\"fanmu\">范母<\/b>一个人去过一趟。<\/p>\n<p data-p=\"42\">她没告诉女儿。是吴老师在展厅里碰见的：一个头发剪得很短的女人，站在存折那只玻璃柜前面，站了快一个钟头。<\/p>\n<p data-p=\"43\">那天晚上吃饭，母亲忽然问了一句：<\/p>\n<p data-p=\"44\">“那个小林，在那边吃得好吗？”<\/p>\n<p data-p=\"45\">范小满抬起头。<\/p>\n<p data-p=\"46\">“……还行。他说榴莲太臭。”<\/p>\n<p data-p=\"47\">母亲点点头，没再问。<\/p>\n<p data-p=\"48\">林建国是带着全班组去的。十几个穿工装的男人，在冷箱那块展板前站成一排。展板上写着台风那天夜里的事：谁开的箱子，为什么开，事后受了什么处分，集团后来跟一水阁签了什么协议。<\/p>\n<p data-p=\"49\">林建国的名字印在上面。通报批评，扣当月绩效，一个字也没少。<\/p>\n<p data-p=\"50\">班组里有人起哄：“老林，你这是上墙了啊。”<\/p>\n<p data-p=\"51\">林建国在展板前面站着，把自己的名字从头到尾看了一遍。<\/p>\n<p data-p=\"52\">“嗯，”他说，“上墙了。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"53\">十二月底有几天，马六甲那边一张照片也没发。<\/p>\n<p data-p=\"54\">第五天傍晚，他发来一行字：这几天没看海。看了几天书。<\/p>\n<p data-p=\"55\">范小满想问看什么书，打了几个字，又删了。<\/p>\n<p data-p=\"56\">她给人找缝找了这么多年，这是头一回，决定有一条缝先不去揭。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"57\">二月，范小满去办了一本护照。<\/p>\n<p data-p=\"58\">窗口的工作人员问她：去哪儿？<\/p>\n<p data-p=\"59\">她说：还没想好。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"60\">三月初，林衡在电话里说：“清明项目正忙，回不来。”<\/p>\n<p data-p=\"61\">这是实话。<\/p>\n<p data-p=\"62\">范小满说：“嗯。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"63\">四月一号晚上，林母给范小满发来一条语音：“小满啊，清明你在不在明州啊？阿姨做了青团，给你留几个。”<\/p>\n<p data-p=\"64\">范小满回：“在的，阿姨。”<\/p>\n<p data-p=\"65\">她说的是实话。那天晚上，她还没想过要去哪儿。<\/p>\n<p data-p=\"66\">可那条语音听完，她把手机放在枕头边，又拿起来听了一遍。<\/p>\n<p data-p=\"67\">清明。<\/p>\n<p data-p=\"68\">去年清明，他走了。今年清明，他说他回不来。八十多年前，有一个人在岸上，等了十一个清明。<\/p>\n<p data-p=\"69\">二月办的那本护照，一直压在抽屉最底下。<\/p>\n<p data-p=\"70\">第二天一早，她给吴老师打了个电话。<\/p>\n<p data-p=\"71\">“我想去一趟马六甲。”<\/p>\n<p data-p=\"72\">“去。”<\/p>\n<p data-p=\"73\">“我怕……”<\/p>\n<p data-p=\"74\">“怕什么？”<\/p>\n<p data-p=\"75\">“怕说出口，就不敢去了。”<\/p>\n<p data-p=\"76\">吴老师在电话那头笑了一声：“那就别跟他说。去了再说。”<\/p>\n<p data-p=\"77\">清明的墓，上个礼拜她已经陪母亲去扫过了。她订了四月三号的机票，明州飞吉隆坡。清明放三天，她又请了两天年假。<\/p>\n<p data-p=\"78\">晚上，她跟母亲说了。母亲正在剥毛豆，手停了一下，只问了一句：<\/p>\n<p data-p=\"79\">“钱够不够？”<\/p>\n<p data-p=\"80\">她又给林母回了一条消息：“阿姨，清明我临时有点急事，青团不用给我留了，谢谢阿姨。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"81\">范小满的双肩包里，是沈浩托付给她的那块蓝花布。手上另拎着一个保温袋，里面是二十个猪油汤圆。她一早去眉湖边那家老店排队买的，塞了四个冰袋。他说过想吃。<\/p>\n<p data-p=\"82\">四月三号上午，范小满的飞机从明州起飞，往南飞。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"83\">下午三点，马六甲，三十四度。<\/p>\n<p data-p=\"84\">范小满站在港口大门外，手里拎着一个空的保温袋。门卫用马来语问了她两遍，她听不懂。她掏出手机，打了一行字：<\/p>\n<p class=\"msg r\" data-p=\"85\">我在你港口门口。<\/p>\n<p data-p=\"86\">消息刚发出去，手机就震了一下。是他发来的，前后差了不到一分钟：<\/p>\n<p class=\"msg l\" data-p=\"87\">我在你家门口。<\/p>\n<p data-p=\"88\">范小满盯着屏幕，把那五个字从头又读了一遍。<\/p>\n<p data-p=\"89\">电话响了，是他打来的。接通了，两头都没说话，只听得见对方那边的动静：她这边是集卡的喇叭，他那边是巷子里有人在剁肉。<\/p>\n<p data-p=\"90\">范小满先开的口：“我给你带了汤圆。猪油的。”<\/p>\n<p data-p=\"91\">林衡那边静了一秒：“……化了吧？”<\/p>\n<p data-p=\"92\">“没化。”她说，“在吉隆坡海关，被扣下了。含猪肉制品，不让带。”<\/p>\n<p data-p=\"93\">布过了海关，汤圆没过。<\/p>\n<p data-p=\"94\">“我给你带了一块布。”林衡说。<\/p>\n<p data-p=\"95\">“什么布？”<\/p>\n<p data-p=\"96\">“蓝的。找了一年。”他说，“比海水浅一点，比天深一点。”<\/p>\n<p data-p=\"97\">范小满低下头，看着双肩包里露出来的那一角蓝花布。<\/p>\n<p data-p=\"98\">两个人隔着几千公里，笑得说不出话。<\/p>\n<p data-p=\"99\">她没问他回来做什么，他也没说。<\/p>\n<p data-p=\"100\">事后两个人对了一回账，才把这件事算清楚。<\/p>\n<p data-p=\"101\">四月一号林母那条问青团的语音，是替儿子打听的。她回了“在的”，第二天又回了一句“临时有点急事”。那时候他已经在明州了。三月底回来考的复试，名单挂出来之前，他不去敲她的门。她说有急事，他也没多想：急事也好，闲事也好，人在明州就行。名单一挂出来，就去她家门口等。<\/p>\n<p data-p=\"102\">她用不着打听，他自己说过：清明，项目忙，回不来。<\/p>\n<p data-p=\"103\">两边的话，说出口的时候都是实话。<\/p>\n<p data-p=\"104\">四月三号上午九点，名单挂了出来，第七行。她的飞机八点四十就起飞了。<\/p>\n<p data-p=\"105\">他那块布，是在鸡场街一家快要关门的老店里找到的。他问了一年。<\/p>\n<p data-p=\"106\">那天夜里，范小满在马六甲的旅馆里，才点开林母下午发来的那条六十秒语音。第一句是：“小满啊，阿姨跟你说件事，你千万别跟衡衡说是我说的。他回来好几天了，一直不让我跟你说。你急事办完了就回家，哪儿也别去……”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"107\">四月五号，清明。<\/p>\n<p data-p=\"108\">范小满一早去了海边。<\/p>\n<p data-p=\"109\">马六甲城边的海，跟她想的不一样。近岸的水是灰绿的，混着泥沙，海面上停满了等着进港的货轮，一艘挨着一艘，一直排到天边。<\/p>\n<p data-p=\"110\">她在岸边站了半个钟头。不是这个颜色。<\/p>\n<p data-p=\"111\">中午，她找了一条小船往海里开。开出去很远，岸边的灰绿慢慢褪了，水清了，也蓝了。太阳正当头，天上一点云也没有。<\/p>\n<p data-p=\"112\">她把那块布从包里拿出来，举在海和天的中间。<\/p>\n<p data-p=\"113\">布的蓝，比底下的海浅一点，比头顶的天深一点。<\/p>\n<p data-p=\"114\">她拍了一张照片，发给林衡：<\/p>\n<p class=\"msg r\" data-p=\"115\">颜色对的。<\/p>\n<p data-p=\"116\">同一时刻，明州，潮江边。<\/p>\n<p data-p=\"117\">林衡坐在江北老码头最底下那一级石阶上，把他找了一年的那块布摊在膝盖上，跟手机里那张照片比了又比。<\/p>\n<p data-p=\"118\">“我这块，”他回，“深了一点。”<\/p>\n<p data-p=\"119\">找了一年，还是差了一点。<\/p>\n<p data-p=\"120\">范小满回了三个字：<\/p>\n<p class=\"msg r\" data-p=\"121\">差一点好。<\/p>\n<p data-p=\"122\">林衡想起吴老师那句话：补纸的颜色，要和老纸差那么一点点。<\/p>\n<p data-p=\"123\">林衡把膝盖上那块布叠好。<\/p>\n<p data-p=\"124\">“那你多看两天，”他回，“我在这边等你。”<\/p>\n<p data-p=\"125\">八十多年前，是一个姑娘站在这里，看着一条船开进雾里。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"126\">四月六号下午，林衡又去了一趟范小满家。这回开门的是范母。<\/p>\n<p data-p=\"127\">她扶着门框：“她去找你了。你倒回来了。”<\/p>\n<p data-p=\"128\">她解下围裙：“你陪我去湖边坐坐。”<\/p>\n<p data-p=\"129\">还是那家茶馆，还是一壶龙井，两只杯子。这一回，范母只问了一个问题。<\/p>\n<p data-p=\"130\">“那你打算怎么办？”<\/p>\n<p data-p=\"131\">林衡没有看茶杯。<\/p>\n<p data-p=\"132\">“接下来三年，我有别的事要做。三年以后在哪儿上班，我还说不准。说得准的是，我在明州。”<\/p>\n<p data-p=\"133\">他又说：“这些，我还没跟她说。我想等她回来，当面说。”<\/p>\n<p data-p=\"134\">范母把茶壶的盖子转了转。<\/p>\n<p data-p=\"135\">“她爸当年，也是什么都没有。”<\/p>\n<p data-p=\"136\">林衡没敢接话。<\/p>\n<p data-p=\"137\">“我不怕穷。”范母端起茶喝了一口，“穷，我一个人还了十年债，也还过来了。我怕的是剩下一个人。”<\/p>\n<p data-p=\"138\">她把茶钱付了，起身走到门口，又回过头来。<\/p>\n<p data-p=\"139\">“她礼拜三晚上的飞机，”她说，“七点四十到。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"140\">四月七号上午，林衡去了一趟银行。<\/p>\n<p data-p=\"141\">四月七号晚上，范小满的航班落地明州。<\/p>\n<p data-p=\"142\">她推着行李从出口走出来，一眼就看见了他。他站在接机人群的最后面，没举牌子，也没招手，就那么站着。<\/p>\n<p data-p=\"143\">她走到他面前。<\/p>\n<p data-p=\"144\">林衡什么也没说，从口袋里拿出一样东西，双手递了过去。<\/p>\n<p data-p=\"145\">是一本存折。蓝色封皮，银行柜台办的那种。现在还用存折的人，不多了。<\/p>\n<p data-p=\"146\">范小满接过来，翻开。<\/p>\n<p data-p=\"147\">二〇二六年四月，存入。五月，存入。六月，存入。一个月一笔，一笔不少，一直到二〇二七年三月。每一行的摘要栏里，都印着两个字：工资。<\/p>\n<p data-p=\"148\">一整年的工资，一分没动。十二行字，墨色一样新，是一次补登出来的。<\/p>\n<p data-p=\"149\">最后一行底下，空着一格。<\/p>\n<p data-p=\"150\">空格旁边，是他自己的笔迹，一笔一画，写得很用力：<\/p>\n<p class=\"hand big\" data-p=\"151\">林衡归，止。<\/p>\n<p data-p=\"152\">范小满的拇指按在那行字旁边，没有动。<\/p>\n<p data-p=\"153\">她抬起头：“归？你不是还有两年？”<\/p>\n<p data-p=\"154\">“辞了。”林衡说，“交接到七月。九月开学，明州大学，经济史。”<\/p>\n<p data-p=\"155\">“十二月底，请了三天年假，回来考的初试。”他说，“三月底回来考的复试，考完没走。四月三号公示，在第七行。”<\/p>\n<p data-p=\"156\">他又说：“辞之前，我问过<b class=\"rn\" data-c=\"zhengzong\">郑总<\/b>。郑总说，去读书，也不在本部。”<\/p>\n<p data-p=\"157\">范小满想起十二月那句话：这几天没看海。看了几天书。原来那几天，他不在海边。<\/p>\n<p data-p=\"158\">范小满把存折合上，两只手拿着，拿得很稳。<\/p>\n<p data-p=\"159\">机场的广播一遍一遍地响，人从他们身边一个接一个地走过去。<\/p>\n<p data-p=\"160\">他们就那样站着。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p class=\"coda\" data-p=\"161\">后来很多人问他们，当年到底是谁先说的。<\/p>\n<p class=\"coda\" data-p=\"162\">两个人都想了很久，发现谁也没说过。<\/p>", "paras": ["林衡到马六甲的第一个礼拜，给范小满发了一张照片。", "照片里是码头外面的海。傍晚的光斜斜地照下来，海面上浮着一层碎金。底下配了一行字：", "今天的海，比那块布深一点。", "范小满回了一张照片：一页刚揭开的书页，摊在透光台上，纸边补了一条新纸，颜色比原纸浅一点。", "她什么字也没配。", "这样的照片，后来攒了一整年。", "今天下雨，海是灰的，不算。", "今天的海，跟那块布差不多。可能是我记错了。", "今天港池里进来一条船，船身漆成蓝的，比那块布浅。", "今天又去了鸡场街的布店。没有。", "范小满问：“没有什么？”", "他没回。", "范小满回的，都是书页。有时候是一页揭开的日记，有时候是一个补好的书角，有时候只是一张吸水纸，上面印着一块水渍的形状。", "他们差不多天天说话。说马六甲一年到头三十多度，说他想吃一碗猪油汤圆，可这边超市里只有速冻的芝麻馅，说一水阁新来的实习生，说林建国在班组里又讲了一遍“那是我儿子”，说吴老师退休以后天天去公园跟人下象棋，把一个退休的中学校长骂哭了。", "林母的语音，也从“你别跟你爸说是我说的”，变成了“你跟小满说了没有”。", "林衡回：“说什么？”", "林母发来一条六十秒的语音，前五十九秒都是叹气。", "六月，范小满揭开了日记的最后一页。", "那十几页粘在一起的纸，前面全是空白。阿根在南洋那些年，一个字也没有写。只有最后一页有字，墨色比前面所有的字都新：", "秀英：", "船过马六甲了。这回是往家开。", "十一年。我不晓得你还在不在江边。在不在，我都回来。", "老船工讲，船去船回总无期。他讲错了。", "阿根　民国三十七年二月十二", "字还是那么丑，有两个别字。范小满把这一页揭开、展平、补好，一个人在修复室里，把那两个别字看了一遍又一遍。", "她把这一页拍下来，发给了林衡。", "马六甲那边过了一个多钟头才回，只有四个字：船头朝里。", "七月，农历六月初六，一水阁晒书。", "往年都是吴老师带着她上藏书楼。今年吴老师退休了，这件事头一回由她一个人做。", "楼梯很窄，木头踩上去吱呀吱呀地响。两百多年前，有个叫程绣芸的姑娘，为了这座楼嫁进来，守了一辈子，一级台阶也没能上去。", "范小满走到了楼上。她推开窗，眉湖上的风吹进来，带着水汽。", "她想起自己说过的那句玩笑：书不出阁，我也不出阁。", "书是不出阁的。人，总得出去看看。", "十月，文化馆开馆。", "展厅正中，两只玻璃柜并排摆着。一只里面是那本日记，翻开在最后一页；一只里面是秀英的存折，翻开在最后一行：阿根归，止。存折旁边，是那页嘉靖年间的修堤账，末页那条补纸还贴在原处。", "存折底下有一块小牌子，讲这本存折里的钱为什么后来一文不值。一共两百来字，是林衡在马六甲写好发回来的。", "开馆那天来了很多人。何部长讲了话，讲得很好。", "沈浩也来了。他在存折前面站了一会儿，然后走到范小满旁边，递给她一个布包。", "是那块蓝花布。", "“不展。”他说，“你替我收着。我那屋子小，又潮，怕放坏了。”", "“哪天你要是去那边，带上它。替我奶奶，去看看那片海。”", "开馆以后，范母一个人去过一趟。", "她没告诉女儿。是吴老师在展厅里碰见的：一个头发剪得很短的女人，站在存折那只玻璃柜前面，站了快一个钟头。", "那天晚上吃饭，母亲忽然问了一句：", "“那个小林，在那边吃得好吗？”", "范小满抬起头。", "“……还行。他说榴莲太臭。”", "母亲点点头，没再问。", "林建国是带着全班组去的。十几个穿工装的男人，在冷箱那块展板前站成一排。展板上写着台风那天夜里的事：谁开的箱子，为什么开，事后受了什么处分，集团后来跟一水阁签了什么协议。", "林建国的名字印在上面。通报批评，扣当月绩效，一个字也没少。", "班组里有人起哄：“老林，你这是上墙了啊。”", "林建国在展板前面站着，把自己的名字从头到尾看了一遍。", "“嗯，”他说，“上墙了。”", "十二月底有几天，马六甲那边一张照片也没发。", "第五天傍晚，他发来一行字：这几天没看海。看了几天书。", "范小满想问看什么书，打了几个字，又删了。", "她给人找缝找了这么多年，这是头一回，决定有一条缝先不去揭。", "二月，范小满去办了一本护照。", "窗口的工作人员问她：去哪儿？", "她说：还没想好。", "三月初，林衡在电话里说：“清明项目正忙，回不来。”", "这是实话。", "范小满说：“嗯。”", "四月一号晚上，林母给范小满发来一条语音：“小满啊，清明你在不在明州啊？阿姨做了青团，给你留几个。”", "范小满回：“在的，阿姨。”", "她说的是实话。那天晚上，她还没想过要去哪儿。", "可那条语音听完，她把手机放在枕头边，又拿起来听了一遍。", "清明。", "去年清明，他走了。今年清明，他说他回不来。八十多年前，有一个人在岸上，等了十一个清明。", "二月办的那本护照，一直压在抽屉最底下。", "第二天一早，她给吴老师打了个电话。", "“我想去一趟马六甲。”", "“去。”", "“我怕……”", "“怕什么？”", "“怕说出口，就不敢去了。”", "吴老师在电话那头笑了一声：“那就别跟他说。去了再说。”", "清明的墓，上个礼拜她已经陪母亲去扫过了。她订了四月三号的机票，明州飞吉隆坡。清明放三天，她又请了两天年假。", "晚上，她跟母亲说了。母亲正在剥毛豆，手停了一下，只问了一句：", "“钱够不够？”", "她又给林母回了一条消息：“阿姨，清明我临时有点急事，青团不用给我留了，谢谢阿姨。”", "范小满的双肩包里，是沈浩托付给她的那块蓝花布。手上另拎着一个保温袋，里面是二十个猪油汤圆。她一早去眉湖边那家老店排队买的，塞了四个冰袋。他说过想吃。", "四月三号上午，范小满的飞机从明州起飞，往南飞。", "下午三点，马六甲，三十四度。", "范小满站在港口大门外，手里拎着一个空的保温袋。门卫用马来语问了她两遍，她听不懂。她掏出手机，打了一行字：", "我在你港口门口。", "消息刚发出去，手机就震了一下。是他发来的，前后差了不到一分钟：", "我在你家门口。", "范小满盯着屏幕，把那五个字从头又读了一遍。", "电话响了，是他打来的。接通了，两头都没说话，只听得见对方那边的动静：她这边是集卡的喇叭，他那边是巷子里有人在剁肉。", "范小满先开的口：“我给你带了汤圆。猪油的。”", "林衡那边静了一秒：“……化了吧？”", "“没化。”她说，“在吉隆坡海关，被扣下了。含猪肉制品，不让带。”", "布过了海关，汤圆没过。", "“我给你带了一块布。”林衡说。", "“什么布？”", "“蓝的。找了一年。”他说，“比海水浅一点，比天深一点。”", "范小满低下头，看着双肩包里露出来的那一角蓝花布。", "两个人隔着几千公里，笑得说不出话。", "她没问他回来做什么，他也没说。", "事后两个人对了一回账，才把这件事算清楚。", "四月一号林母那条问青团的语音，是替儿子打听的。她回了“在的”，第二天又回了一句“临时有点急事”。那时候他已经在明州了。三月底回来考的复试，名单挂出来之前，他不去敲她的门。她说有急事，他也没多想：急事也好，闲事也好，人在明州就行。名单一挂出来，就去她家门口等。", "她用不着打听，他自己说过：清明，项目忙，回不来。", "两边的话，说出口的时候都是实话。", "四月三号上午九点，名单挂了出来，第七行。她的飞机八点四十就起飞了。", "他那块布，是在鸡场街一家快要关门的老店里找到的。他问了一年。", "那天夜里，范小满在马六甲的旅馆里，才点开林母下午发来的那条六十秒语音。第一句是：“小满啊，阿姨跟你说件事，你千万别跟衡衡说是我说的。他回来好几天了，一直不让我跟你说。你急事办完了就回家，哪儿也别去……”", "四月五号，清明。", "范小满一早去了海边。", "马六甲城边的海，跟她想的不一样。近岸的水是灰绿的，混着泥沙，海面上停满了等着进港的货轮，一艘挨着一艘，一直排到天边。", "她在岸边站了半个钟头。不是这个颜色。", "中午，她找了一条小船往海里开。开出去很远，岸边的灰绿慢慢褪了，水清了，也蓝了。太阳正当头，天上一点云也没有。", "她把那块布从包里拿出来，举在海和天的中间。", "布的蓝，比底下的海浅一点，比头顶的天深一点。", "她拍了一张照片，发给林衡：", "颜色对的。", "同一时刻，明州，潮江边。", "林衡坐在江北老码头最底下那一级石阶上，把他找了一年的那块布摊在膝盖上，跟手机里那张照片比了又比。", "“我这块，”他回，“深了一点。”", "找了一年，还是差了一点。", "范小满回了三个字：", "差一点好。", "林衡想起吴老师那句话：补纸的颜色，要和老纸差那么一点点。", "林衡把膝盖上那块布叠好。", "“那你多看两天，”他回，“我在这边等你。”", "八十多年前，是一个姑娘站在这里，看着一条船开进雾里。", "四月六号下午，林衡又去了一趟范小满家。这回开门的是范母。", "她扶着门框：“她去找你了。你倒回来了。”", "她解下围裙：“你陪我去湖边坐坐。”", "还是那家茶馆，还是一壶龙井，两只杯子。这一回，范母只问了一个问题。", "“那你打算怎么办？”", "林衡没有看茶杯。", "“接下来三年，我有别的事要做。三年以后在哪儿上班，我还说不准。说得准的是，我在明州。”", "他又说：“这些，我还没跟她说。我想等她回来，当面说。”", "范母把茶壶的盖子转了转。", "“她爸当年，也是什么都没有。”", "林衡没敢接话。", "“我不怕穷。”范母端起茶喝了一口，“穷，我一个人还了十年债，也还过来了。我怕的是剩下一个人。”", "她把茶钱付了，起身走到门口，又回过头来。", "“她礼拜三晚上的飞机，”她说，“七点四十到。”", "四月七号上午，林衡去了一趟银行。", "四月七号晚上，范小满的航班落地明州。", "她推着行李从出口走出来，一眼就看见了他。他站在接机人群的最后面，没举牌子，也没招手，就那么站着。", "她走到他面前。", "林衡什么也没说，从口袋里拿出一样东西，双手递了过去。", "是一本存折。蓝色封皮，银行柜台办的那种。现在还用存折的人，不多了。", "范小满接过来，翻开。", "二〇二六年四月，存入。五月，存入。六月，存入。一个月一笔，一笔不少，一直到二〇二七年三月。每一行的摘要栏里，都印着两个字：工资。", "一整年的工资，一分没动。十二行字，墨色一样新，是一次补登出来的。", "最后一行底下，空着一格。", "空格旁边，是他自己的笔迹，一笔一画，写得很用力：", "林衡归，止。", "范小满的拇指按在那行字旁边，没有动。", "她抬起头：“归？你不是还有两年？”", "“辞了。”林衡说，“交接到七月。九月开学，明州大学，经济史。”", "“十二月底，请了三天年假，回来考的初试。”他说，“三月底回来考的复试，考完没走。四月三号公示，在第七行。”", "他又说：“辞之前，我问过郑总。郑总说，去读书，也不在本部。”", "范小满想起十二月那句话：这几天没看海。看了几天书。原来那几天，他不在海边。", "范小满把存折合上，两只手拿着，拿得很稳。", "机场的广播一遍一遍地响，人从他们身边一个接一个地走过去。", "他们就那样站着。", "后来很多人问他们，当年到底是谁先说的。", "两个人都想了很久，发现谁也没说过。"], "recap": "清明前一天，范母约林衡去湖边喝茶，问了三个问题。夜里，两人在江北老码头吵了一架：你倒是一样都不欠，你连让我还的机会都不给。她说不去上海了；他说到“明年清明”，没有说下去。她说：那边的海，你帮我看看，是不是这个颜色。第二天，他飞往马六甲。"}]}</script>
