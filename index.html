class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"51\">第二天，林衡没有改报告。<\/p>\n<p data-p=\"52\">他把原样的报告放回孙主任桌上，上面贴了一张便签：报告未作修改。<\/p>\n<p data-p=\"53\">孙主任看着那张便签，把茶杯盖子拿起来，又盖回去，然后把报告收进了抽屉。<\/p>\n<p data-p=\"54\">那一周，<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>给他发过几次消息，问日记里一个看不清的地名，问民国二十六年一斤米多少钱。他回得又快又细，还附上了出处。关于报告，一个字也没有提。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"55\">报告在孙主任的抽屉里躺着。战略部的开馆宣传稿，倒是先送到了安全科。<\/p>\n<p data-p=\"56\">安全科照规矩核实，找<b class=\"rn\" data-c=\"linjianguo\">林建国<\/b>谈话，让他补一份台风那晚的情况说明。<\/p>\n<p data-p=\"57\">林建国在龙门吊上干了三十年，这辈子写过最长的东西，是年轻时给<b class=\"rn\" data-c=\"linmu\">林母<\/b>写的一份检讨书。他憋了一下午，交上去三行：<\/p>\n<p data-p=\"58\">那天风很大。书很湿。我就开了。<\/p>\n<p data-p=\"59\">安全科的年轻人看了半天，为难地说：林师傅，您这个……写得太简单了。<\/p>\n<p data-p=\"60\">林建国回家想了一个晚上，没想明白：一件过去三个月的事，怎么又翻了出来。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"61\">星期天，林衡回家吃饭。<\/p>\n<p data-p=\"62\">林母做了一桌子菜：雪菜大汤黄鱼，葱烤鲫鱼，一盘年糕炒青菜。林家有个规矩，天大的事，先吃饭。<\/p>\n<p data-p=\"63\">吃到一半，林建国开口了。<\/p>\n<p data-p=\"64\">“安全科找我了，”林建国说，“让我补台风那晚的说明，说是文化馆开馆要用。三个月前的事，怎么又翻出来了？”<\/p>\n<p data-p=\"65\">林衡夹菜的手停住了。他把筷子横放在碗上：“是因为我。”<\/p>\n<p data-p=\"66\">他把估值报告的事说了，三句话就说完了。<\/p>\n<p data-p=\"67\">林建国听完，只问了一句：“改了没有？”<\/p>\n<p data-p=\"68\">“没改。”<\/p>\n<p data-p=\"69\">“去改了。”<\/p>\n<p data-p=\"70\">“爸——”<\/p>\n<p data-p=\"71\">“我叫你去改了！”<\/p>\n<p data-p=\"72\">林母赶紧往两个人碗里各夹了一块鱼：“吃饭，吃饭，鱼要冷了。”<\/p>\n<p data-p=\"73\">林衡低着头，把碗里那块鱼翻了个面，说：“冷箱那晚的事，该说清楚的，我去说。那天晚上是我先拒绝了她，你才……”<\/p>\n<p data-p=\"74\">啪的一声，林建国把筷子拍在桌上。一根弹起来，翻了个身，掉进了黄鱼汤里。<\/p>\n<p data-p=\"75\">“你去说？你说什么说？你一说，你在公司还待不待了？”他嗓门大，半栋楼都听得见，“我两年就退了！通报就通报，扣钱就扣钱，我认。你别拿你的前途替我赌！”<\/p>\n<p data-p=\"76\">“那你的两年，就不是两年？”<\/p>\n<p data-p=\"77\">林建国瞪着儿子，嘴唇动了半天。<\/p>\n<p data-p=\"78\">“那年，”他说，“你已经替我让过一回了。”<\/p>\n<p data-p=\"79\">饭桌上一下子安静了。林母低下头，林衡看着父亲，父亲看着那碗汤。<\/p>\n<p data-p=\"80\">“这一回，”林建国说，“轮不到你。”<\/p>\n<p data-p=\"81\">林衡站起来，把自己的碗筷收进厨房，洗干净，放回碗柜，然后拿了外套出门。<\/p>\n<p data-p=\"82\">林母坐在桌边，用汤勺把那根筷子从黄鱼汤里捞出来。<\/p>\n<p data-p=\"83\">“两个犟头，”她说，“一个模子里刻出来的。”<\/p>\n<p data-p=\"84\">林建国没吭声，去阳台抽烟。抽了一半就掐了，扶着栏杆往楼下看。儿子的背影走过一盏路灯，又走过一盏，一次也没有回头。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"85\">同一个星期，<b class=\"rn\" data-c=\"luxingzhou\">陆行舟<\/b>来了一水阁。<\/p>\n<p data-p=\"86\">他给修复室带了咖啡，给<b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>带的是一杯热龙井。吴老师看了他一眼，收下了，说：“你这个人，可惜了。”<\/p>\n<p data-p=\"87\">陆行舟笑笑，没问可惜在哪里。<\/p>\n<p data-p=\"88\">他等范小满揭完手里那一页，才开口：“战略部让我重新出一份估值。只估那四十七册刻本，剩下的三百来件，打包算杂件。”<\/p>\n<p data-p=\"89\">范小满手里的镊子停住了。<\/p>\n<p data-p=\"90\">“我出了。按市场，这么估没有错，刻本好卖，杂件不值钱。”陆行舟说，“不过在我之前，你们港口那位林先生，已经交过一份。”<\/p>\n<p data-p=\"91\">“他交了什么？”<\/p>\n<p data-p=\"92\">“三十七页。日记、账簿、票据，全列成核心藏品，写得比我们拍卖行的图录还细。”陆行舟低头看了一眼手里的咖啡，“最后一页有一句话，我看了好几遍：这批书单拿出任何一册，都不是最好的；它们最值钱的地方，是还在一起。”<\/p>\n<p data-p=\"93\">范小满把镊子放回了托盘里。<\/p>\n<p data-p=\"94\">“战略部让他改，他不改，报告现在卡在他们财务部。开馆的宣传稿正在过安全科，台风那晚的冷箱也在里面。”陆行舟说，“他父亲，还有两年退休。”<\/p>\n<p data-p=\"95\">“他没跟我说过。”<\/p>\n<p data-p=\"96\">“他大概不会说。”<\/p>\n<p data-p=\"97\">修复室里很静，透光台嗡嗡地响。<\/p>\n<p data-p=\"98\">“你为什么告诉我？”范小满问，“你本来可以不说的。”<\/p>\n<p data-p=\"99\">陆行舟想了想。<\/p>\n<p data-p=\"100\">“我说过，我想要什么，会说出来。”他说，“可我不想你是因为不知道，才选了我。”<\/p>\n<p data-p=\"101\">他走了以后，吴老师端起那杯龙井，喝了一口。<\/p>\n<p data-p=\"102\">“茶不错，”她说，“可惜了。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"103\">那天夜里，范小满没有直接回家。<\/p>\n<p data-p=\"104\">她从一水阁出来，沿着眉湖走，走过老墙门，走过台风那天他们搬书的那条巷子，一直走到港口集团楼下。<\/p>\n<p data-p=\"105\">快十一点了。整栋楼黑着，只剩一扇窗还亮着。<\/p>\n<p data-p=\"106\">她给人下结论，向来只要三句话，下了就很少改。这个人，她已经改过好几回了：死板，冷漠，公司的人，一个读旧账本的。这一回，又是从别人嘴里，才知道自己又错了。<\/p>\n<p data-p=\"107\">台风那天夜里，她觉得他像一扇关严的窗，挡风，也挡光。<\/p>\n<p data-p=\"108\">她仰起头，一层一层往上数。<\/p>\n<p data-p=\"109\">数到第十七层，那扇窗还关着。<\/p>\n<p data-p=\"110\">可是灯亮着。<\/p>", "paras": ["在港口集团，“估值”有一个不成文的解释：领导心里早有一个数，你的任务，是用二十页纸把这个数找出来。", "林衡用了三十七页，找出来的是另一个数。", "任务是十二月初派下来的。", "孙主任把林衡叫进办公室，亲手泡了一杯茶，推到他面前。孙主任给下属泡茶，在财务部是比年终奖还稀罕的事。上一次出现是三年前，喝茶的老刘，第二个月就外派去了非洲。", "“文化馆那批书，战略部要一份收购估值。郑总点了你的名，说你熟悉情况。”", "“好的。”", "入职六年，林衡在工作群里说得最多的两个词，是“好的”和“收到”。“不”字，他一次也没说过。", "“还有个事。”孙主任又往他杯里续了点水，“年底了，部门里有一个提拔的名额。何部长跟郑总说得上话。这份报告，你写漂亮点。”", "“好的。”", "接下来的两个星期，林衡把自己埋进了那批书里。", "一水阁按合作协议送来一份清点目录：三百一十二件。明清刻本四十七册，是文化馆点名要的；其余是日记、账簿、契约、信札、票据，还有几张看不出用处的纸片，目录上统称“杂件”。", "战略部要的，是那四十七册的价钱。林衡把三百一十二件全看了。白天上班，晚上去一水阁对着实物核，周末泡在档案馆里查来历。他查出那几本账簿记的是一家明州米行三十年的生意，查出一沓票据是民国二十年代潮江上的船票，查出一张看着像废纸的契约，是眉湖边一家茶馆民国年间的租约，那家茶馆现在还开着。", "那天下午，小周路过他的工位，看了一眼屏幕右下角的页码，又看了一眼他的脸。", "“衡哥，第三十七页了，你还在笑。”小周说，“我有点害怕。”", "报告的结论，和战略部想要的不一样。林衡把日记、账簿、票据列为核心藏品，刻本排在后面。那页嘉靖年间的修堤账，他照实写了一句备注：末页有后人补纸，补纸上的数目与底下原数不符，建议展出时注明。", "最后一页，他写了一句话。写完删了，删完又写上：", "这批书单拿出任何一册，都不是最好的。它们最值钱的地方，是还在一起。", "报告交上去的第三天，从十九楼退了回来。", "报告上多了几处红笔字，字写得很大。孙主任说，是战略部何部长亲笔批的。", "修堤账那一页，红笔圈了一圈，旁边批着：放第一个。那句补纸的备注被一道红线划掉，旁边两个字：不写。", "日记那一页，批了三个字：没人看。", "最后一页那句话，没有批，只在底下画了一道波浪线。林衡把那道线来回看了几遍，没看懂是什么意思。", "孙主任把报告摊在桌上，手指在“没人看”三个字上点了点。", "“何部长的意思，日记、账簿这些，打包算杂件，不用单列。刻本往前放，估值往上走。”他说，“其实也有道理。博物馆里，一个人站在一件展品前面，听说平均不到十秒钟。十秒钟，人家要看的是金的、亮的、老的。一个跑船的写给对象的话，谁看？”", "林衡发现，自己又一次找不到这番话的错处。大部分人，确实只看十秒钟。", "“改一下，周五前给我。”", "林衡看着那份报告，没有伸手去拿。", "“孙主任，”他说，“这份报告，我不改。”", "这是他入职六年，第一次对领导说“不”。他说得很轻，像是怕把这个字摔坏了。", "孙主任看了他一会儿，没有生气，起身把门关上了。", "“小林，你听我说完。”他重新坐下，声音放低了，“文化馆开馆，头一个要讲的就是台风那晚的故事。宣传稿要过安全科，这是规矩。报告顺顺当当过了，项目往前走，那一段就是好人好事，没人会去细抠。报告卡住了，战略部要返工，所有材料都得从头再核一遍。”", "他把茶杯往林衡那边推了推。", "“你爸开的那只箱子，是待检修的。”", "林衡看着那杯茶，茶叶已经沉到了底。", "“我不是吓你。”孙主任说，“你是我看着进来的，你爸我也认识。他还有两年退休。”", "林衡知道，孙主任说这些，是真心替他着想。孙主任在这家公司待了二十年，知道一份报告往上走要过几道门，每道门后面坐着什么人。他只是习惯了，事情到了手里，就顺着最省力的角度往下走，像码头上的老师傅起吊。", "一只待检修的冷箱，私自启用，往轻里说是好人好事，往重里说是安全隐患。轻和重之间，隔着的，就是一份报告。", "“你再想想。”孙主任说。", "那天晚上，林衡回到出租屋，没有开大灯。", "满墙的档案盒在台灯底下站成一排一排。民国十八年，民国二十二年，民国二十五年。那些年份里的人，早就做完了自己的选择。", "他想起孙主任那句话：写漂亮点。", "他掏出手机，打开相册，一张一张往回翻。翻过潮江边的夜色，翻过港区的冷箱，翻过档案馆门口那十二条规矩，一直翻到十月，翻到那页修堤账。", "照片拍得匆忙，有点歪。他放大，再放大。", "补纸的边上，靠近装订线的地方，有一行极小的字。小得像是怕人看见，又像是怕人看不见。那天在修复室，他光顾着看补纸底下的数，没有注意到它。", "户房书吏沈默，照册誊录。", "照册誊录。照着册子抄的。", "林衡把手机凑到台灯底下，又放大了一档。", "他不知道这个人是谁，不知道他当年收了什么，怕的是什么，家里有几口人在等他吃饭。纸上都没写。纸上只写了：他照着抄了。他把这页账补得很漂亮，漂亮到四百多年都没有人看出来，然后在最不起眼的地方，留下了自己的名字。", "像一句认罪，也像一句辩解。", "林衡把手机扣在桌上。", "没有人让他造假。他们只是让他照着抄。", "第二天，林衡没有改报告。", "他把原样的报告放回孙主任桌上，上面贴了一张便签：报告未作修改。", "孙主任看着那张便签，把茶杯盖子拿起来，又盖回去，然后把报告收进了抽屉。", "那一周，范小满给他发过几次消息，问日记里一个看不清的地名，问民国二十六年一斤米多少钱。他回得又快又细，还附上了出处。关于报告，一个字也没有提。", "报告在孙主任的抽屉里躺着。战略部的开馆宣传稿，倒是先送到了安全科。", "安全科照规矩核实，找林建国谈话，让他补一份台风那晚的情况说明。", "林建国在龙门吊上干了三十年，这辈子写过最长的东西，是年轻时给林母写的一份检讨书。他憋了一下午，交上去三行：", "那天风很大。书很湿。我就开了。", "安全科的年轻人看了半天，为难地说：林师傅，您这个……写得太简单了。", "林建国回家想了一个晚上，没想明白：一件过去三个月的事，怎么又翻了出来。", "星期天，林衡回家吃饭。", "林母做了一桌子菜：雪菜大汤黄鱼，葱烤鲫鱼，一盘年糕炒青菜。林家有个规矩，天大的事，先吃饭。", "吃到一半，林建国开口了。", "“安全科找我了，”林建国说，“让我补台风那晚的说明，说是文化馆开馆要用。三个月前的事，怎么又翻出来了？”", "林衡夹菜的手停住了。他把筷子横放在碗上：“是因为我。”", "他把估值报告的事说了，三句话就说完了。", "林建国听完，只问了一句：“改了没有？”", "“没改。”", "“去改了。”", "“爸——”", "“我叫你去改了！”", "林母赶紧往两个人碗里各夹了一块鱼：“吃饭，吃饭，鱼要冷了。”", "林衡低着头，把碗里那块鱼翻了个面，说：“冷箱那晚的事，该说清楚的，我去说。那天晚上是我先拒绝了她，你才……”", "啪的一声，林建国把筷子拍在桌上。一根弹起来，翻了个身，掉进了黄鱼汤里。", "“你去说？你说什么说？你一说，你在公司还待不待了？”他嗓门大，半栋楼都听得见，“我两年就退了！通报就通报，扣钱就扣钱，我认。你别拿你的前途替我赌！”", "“那你的两年，就不是两年？”", "林建国瞪着儿子，嘴唇动了半天。", "“那年，”他说，“你已经替我让过一回了。”", "饭桌上一下子安静了。林母低下头，林衡看着父亲，父亲看着那碗汤。", "“这一回，”林建国说，“轮不到你。”", "林衡站起来，把自己的碗筷收进厨房，洗干净，放回碗柜，然后拿了外套出门。", "林母坐在桌边，用汤勺把那根筷子从黄鱼汤里捞出来。", "“两个犟头，”她说，“一个模子里刻出来的。”", "林建国没吭声，去阳台抽烟。抽了一半就掐了，扶着栏杆往楼下看。儿子的背影走过一盏路灯，又走过一盏，一次也没有回头。", "同一个星期，陆行舟来了一水阁。", "他给修复室带了咖啡，给吴老师带的是一杯热龙井。吴老师看了他一眼，收下了，说：“你这个人，可惜了。”", "陆行舟笑笑，没问可惜在哪里。", "他等范小满揭完手里那一页，才开口：“战略部让我重新出一份估值。只估那四十七册刻本，剩下的三百来件，打包算杂件。”", "范小满手里的镊子停住了。", "“我出了。按市场，这么估没有错，刻本好卖，杂件不值钱。”陆行舟说，“不过在我之前，你们港口那位林先生，已经交过一份。”", "“他交了什么？”", "“三十七页。日记、账簿、票据，全列成核心藏品，写得比我们拍卖行的图录还细。”陆行舟低头看了一眼手里的咖啡，“最后一页有一句话，我看了好几遍：这批书单拿出任何一册，都不是最好的；它们最值钱的地方，是还在一起。”", "范小满把镊子放回了托盘里。", "“战略部让他改，他不改，报告现在卡在他们财务部。开馆的宣传稿正在过安全科，台风那晚的冷箱也在里面。”陆行舟说，“他父亲，还有两年退休。”", "“他没跟我说过。”", "“他大概不会说。”", "修复室里很静，透光台嗡嗡地响。", "“你为什么告诉我？”范小满问，“你本来可以不说的。”", "陆行舟想了想。", "“我说过，我想要什么，会说出来。”他说，“可我不想你是因为不知道，才选了我。”", "他走了以后，吴老师端起那杯龙井，喝了一口。", "“茶不错，”她说，“可惜了。”", "那天夜里，范小满没有直接回家。", "她从一水阁出来，沿着眉湖走，走过老墙门，走过台风那天他们搬书的那条巷子，一直走到港口集团楼下。", "快十一点了。整栋楼黑着，只剩一扇窗还亮着。", "她给人下结论，向来只要三句话，下了就很少改。这个人，她已经改过好几回了：死板，冷漠，公司的人，一个读旧账本的。这一回，又是从别人嘴里，才知道自己又错了。", "台风那天夜里，她觉得他像一扇关严的窗，挡风，也挡光。", "她仰起头，一层一层往上数。", "数到第十七层，那扇窗还关着。", "可是灯亮着。"], "recap": "一水阁手工修复的经费砍了一半，吴老师明年退休，修复室只留一个编制。陆行舟请范小满去上海的嘉禾修复中心，也说了想追她。林衡照小周的“高情商”教程夸她：你就像民国二十四年的法币改革。半夜一点，她还在搜法币改革是什么。"}, {"n": 10, "cn": "十", "title": "当票", "era": "", "chars": 3538, "mins": 9, "html": "<p data-p=\"0\">明州人管年前那一个来月叫“年夜边”。年夜边有年夜边的规矩：欠的钱要还清，吵的架要和好；实在和不好的，到了年三十，也得坐到一张桌子上，把一顿饭吃完。<\/p>\n<p data-p=\"1\">离年三十还有一个多月。<b class=\"rn\" data-c=\"linheng\">林衡<\/b>和他父亲离那张桌子，还差得很远。<\/p>\n<p data-p=\"2\">自从那顿饭以后，父子俩一句话也没说过。<b class=\"rn\" data-c=\"linmu\">林母<\/b>成了这个家唯一的信使。她的语音从每天三条涨到了六条。前三条的开头都是“你爸让我问你”：问他出租屋冷不冷，电热毯插了没有，年货要不要带点回去。后三条的开头都是“你别跟你爸说是我说的”：说他爸半夜起来抽烟，说他爸把那顶安全帽擦了三遍，说他爸在阳台上一站就是一个钟头。<\/p>\n<p data-p=\"3\">林衡每一条都听完了，回一个字：嗯。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"4\">那几天，<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>也在打一条消息。<\/p>\n<p data-p=\"5\">那天夜里，她在港口集团楼下站到十一点半，十七楼的灯一直没灭，她也一直没上去。回家以后，她在对话框里打了很多句话，又一句一句删掉。“我都知道了”，太像审犯人；“谢谢你”，不知道谢的是哪一件；“你爸还好吗”，问出口，就等于把<b class=\"rn\" data-c=\"luxingzhou\">陆行舟<\/b>卖了。<\/p>\n<p data-p=\"6\">三天后，她发出去的是：<\/p>\n<p data-p=\"7\">“你那本汇款簿，书脊是不是快断了？”<\/p>\n<p data-p=\"8\">那边回得很快：“你怎么知道？”<\/p>\n<p data-p=\"9\">“上次在你家，你翻它的时候，用三根手指托着书脊。”<\/p>\n<p data-p=\"10\">隔了两分钟，那边又问：“修复费怎么算？”<\/p>\n<p data-p=\"11\">“上回那盒生煎，你还没还。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"12\">周六上午，林衡抱着一只鞋盒进了一水阁。汇款簿躺在鞋盒里，底下垫着三层宣纸。宣纸是他头天晚上去文具店买的。店员问他写什么字，他说不写字，垫东西用。店员看他的眼神，像在看一个败家子。<\/p>\n<p data-p=\"13\"><b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>从老花镜上方看了他一眼。<\/p>\n<p data-p=\"14\">“又是你。”<\/p>\n<p data-p=\"15\">“吴老师好。”<\/p>\n<p data-p=\"16\">“上一个让小满免费修东西的，是我们馆长。”吴老师说，“修完，她跟馆长吵了一架。”<\/p>\n<p data-p=\"17\">“为什么？”<\/p>\n<p data-p=\"18\">“馆长想在封面上贴一张标签。”<\/p>\n<p data-p=\"19\">林衡默默把鞋盒往怀里收了收。<\/p>\n<p data-p=\"20\">范小满戴上手套，把汇款簿放到透光台上。装订线断了两处，封皮的衬纸起了翘，每一页的纸边都被翻得发了毛。<\/p>\n<p data-p=\"21\">“这本簿子，”她说，“被人翻过很多年。”<\/p>\n<p data-p=\"22\">“我买的时候就这样了。”<\/p>\n<p data-p=\"23\">“不是你。”她用镊子轻轻拨开一页，“是他自己。前面后面，每一页旧得一样，说明他一直是从头翻到尾，翻了不知道多少遍。”<\/p>\n<p data-p=\"24\">这本簿子林衡翻了好几年，从来没想过，在他之前，还有一个人也这样一页一页地翻过：翻到哪一页会停住，在哪一页会叹一口气。<\/p>\n<p data-p=\"25\">修到一半，范小满头也不抬地问：“档案馆那天，那几行霉斑底下，你看清了吗？”<\/p>\n<p data-p=\"26\">林衡没有马上回答。<\/p>\n<p data-p=\"27\">那天在档案馆，他们一页一页往后翻，翻到民国三十一年那行朱笔字，就再也翻不动了。前面那几行洇了墨、长了霉的，他扫了一眼，记得是每月一笔，没断过，就翻过去了。<\/p>\n<p data-p=\"28\">“没有。”他说，“我只看了个大概。”<\/p>\n<p data-p=\"29\">“读旧账本的人，”范小满说，“也有只看个大概的时候？”<\/p>\n<p data-p=\"30\">林衡被噎得说不出话。吴老师在窗边翻过一页报纸，翻得很响。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"31\">下周二下午，林衡请了半天假。<\/p>\n<p data-p=\"32\">入职六年，这是他第一次为一件跟工作无关的事请假。“事由”一栏，他写了两个字：查账。<b class=\"rn\" data-c=\"sunzhuren\">孙主任<\/b>批的时候，多看了他一眼。<\/p>\n<p data-p=\"33\">档案馆的管理员一眼就认出了他们。<\/p>\n<p data-p=\"34\">“冻书的姑娘！”她又惊又喜，又看了林衡一眼，“小助理也来啦。”<\/p>\n<p data-p=\"35\">林衡这回没有解释。他发现当助理也有当助理的好处：不用说话，也没人问你是谁。<\/p>\n<p data-p=\"36\">恒裕的总账又摆到了桌上。翻到民国二十七年，那块霉斑还在，铜钱大小，灰绿色，正好压在两行字中间。墨被霉吃掉了一半，剩下的笔画，像一群走散了的人。<\/p>\n<p data-p=\"37\">范小满向管理员借了一盏台灯，把灯头压得很低，斜着照过去。<\/p>\n<p data-p=\"38\">“毛笔写字有轻有重，”她说，“墨没了，纸上还留着笔压下去的印子。正着照看不见，侧着光，字的影子就出来了。”<\/p>\n<p data-p=\"39\">灯光贴着纸面扫过去。霉斑底下，一行字慢慢浮了出来。<\/p>\n<p class=\"zhang\" data-p=\"40\">民国二十七年十二月。<\/p>\n<p data-p=\"41\">林衡往上看，上一行是十月。<\/p>\n<p data-p=\"42\">十一月，没有。<\/p>\n<p data-p=\"43\">他又往下翻。正月，叁元。二月，那一行写的是国币陆元，后面跟着一行小字：<\/p>\n<p class=\"zhang\" data-p=\"44\">内补上年十一月份。<\/p>\n<p data-p=\"45\">“没断。”林衡说，“十一月的钱，在路上走了三个月。”<\/p>\n<p data-p=\"46\">他说，那年秋天广州丢了，南边的船期乱成一团，香港那边的汇款常常一压就是几个月；他说香港代理处跟上海、明州怎么往来，一笔钱从星洲到江北要过几道手。说到第四道手的时候，范小满打断了他。<\/p>\n<p data-p=\"47\">“说重点。”<\/p>\n<p data-p=\"48\">“……重点是，他没断。”<\/p>\n<p data-p=\"49\">范小满低头看着那行小字：“可是<b class=\"rn\" data-c=\"xiuying\">秀英<\/b>不知道。”<\/p>\n<p data-p=\"50\">“她不知道。”林衡说，“她只知道，十一月，钱没来。”<\/p>\n<p data-p=\"51\">他没有翻汇款簿，汇款簿还在修复室里。他不用翻。<\/p>\n<p data-p=\"52\">“民国二十七年，腊月初五，汇明州，贰拾元。”<\/p>\n<p data-p=\"53\">范小满看着他：“你背下来了？”<\/p>\n<p data-p=\"54\">“那一页，我看过很多遍。”<\/p>\n<p data-p=\"55\">十一月，姐姐没收到钱。腊月初五，弟弟寄回来二十元。平常是两元，这一回，是十倍。<\/p>\n<p data-p=\"56\">“就为了三块钱？”<\/p>\n<p data-p=\"57\">“不是三块钱的事。”林衡说，“那年月，从南洋往明州寄一封信，要走两三个月，还常常寄丢。钱不一样，钱是每个月都到的。对她来说，钱就是信。钱没来……”<\/p>\n<p data-p=\"58\">“她会以为他出事了。”<\/p>\n<p data-p=\"59\">林衡点点头。<\/p>\n<p data-p=\"60\">“<b class=\"rn\" data-c=\"abao\">阿宝<\/b>在上海，隔着几百里，他怎么知道的？家里一定写信告诉他了。”他想了想，“那年月江北的女人，信多半是请人代写的。代写的信，一个字都不会慌。”<\/p>\n<p data-p=\"61\">“可他看出来了。”<\/p>\n<p data-p=\"62\">“他看出来了。”<\/p>\n<p data-p=\"63\">范小满问：“一个钱庄伙计，一个月挣多少？”<\/p>\n<p data-p=\"64\">林衡在心里把那几年的钱价过了一遍：三四块，吃住在店里，年底另有一份花红。<\/p>\n<p data-p=\"65\">“二十元，”他说，“他拿不出来。”<\/p>\n<p data-p=\"66\">“那剩下的，是从哪儿来的？”<\/p>\n<p data-p=\"67\">林衡答不上来。汇款簿只记钱寄去了哪里，不记钱是从哪里来的。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"68\">从档案馆出来，天已经黑了，下起了小雨。两人打车回了一水阁。<\/p>\n<p data-p=\"69\">吴老师早下班了，楼里只剩值班室亮着一盏灯。范小满说，汇款簿的封皮今晚就能弄好。林衡就在旁边坐着，看她干活。<\/p>\n<p data-p=\"70\">她用竹起子沿着封皮的边，一点一点挑开衬纸。衬纸是后来糊上去的，两层，比封皮本身还厚一点。挑到一半，她停住了。<\/p>\n<p data-p=\"71\">两层衬纸中间，夹着一张折成小方块的薄纸。<\/p>\n<p data-p=\"72\">她用镊子把它夹出来，在透光台上慢慢展开。纸是黄的，一半印着字，一半是手写的。写的是一种她从来没见过的草书，每一个字都像被人揉过。<\/p>\n<p data-p=\"73\">她认过不少草书，这一种，一个字也认不出来。<\/p>\n<p data-p=\"74\">“这是什么字？”<\/p>\n<p data-p=\"75\">“当票。”林衡说，“当铺的字，是故意写得让外人认不出的。”<\/p>\n<p data-p=\"76\">他俯下身，一个字一个字地念：<\/p>\n<p class=\"zhang\" data-p=\"77\">上海，公顺典。民国二十七年，腊月初三。破旧呢大衣一件，虫蛀，光板。当洋拾贰元。限期十八个月。<\/p>\n<p data-p=\"78\">修复室里只剩下雨打窗户的声音。<\/p>\n<p data-p=\"79\">“腊月初三。”范小满说。<\/p>\n<p data-p=\"80\">“他每个月初五汇钱。”林衡说，“那个月，他初三去了当铺。”<\/p>\n<p data-p=\"81\">“破旧的？”<\/p>\n<p data-p=\"82\">“当铺的规矩。东西拿进去，再新也要写成破的：虫蛀、光板、缺扣子。写得越破，当铺越不吃亏。”林衡的声音低了下去，“一个站柜台的伙计，一件呢大衣，大概是他最体面的一件衣裳了。”<\/p>\n<p data-p=\"83\">“剩下的八块，”林衡说，“大概是跟掌柜预支的花红。花红，加上一件大衣，正好二十。”<\/p>\n<p data-p=\"84\">范小满没有碰那张当票。<\/p>\n<p data-p=\"85\">“赎当的时候，”林衡说，“要把当票交回去。”<\/p>\n<p data-p=\"86\">她抬起头。<\/p>\n<p data-p=\"87\">“这张当票，还在。”<\/p>\n<p data-p=\"88\">那件大衣，他没有赎回来。<\/p>\n<p data-p=\"89\">那年冬天他是怎么过的，账上没写，当票上也没写。只有这张票，被折成一个小方块，糊在封皮里，一直没有扔。<\/p>\n<p data-p=\"90\">范小满的第一个动作，是把当票往远处挪了挪。<\/p>\n<p data-p=\"91\">那是修复师的本能：眼泪不能掉在纸上。<\/p>\n<p data-p=\"92\">然后她才转过身去。<\/p>\n<p data-p=\"93\">林衡在修复室里找了一圈，没有找到纸巾。他从工作台上抽了一张纸，递了过去。<\/p>\n<p data-p=\"94\">范小满接过来，看了一眼，眼泪还挂在脸上，又忍不住笑了出来。<\/p>\n<p data-p=\"95\">“这是吸水纸。”她说，“进口的，很贵的。”<\/p>\n<p data-p=\"96\">“……对不起。”<\/p>\n<p data-p=\"97\">“没关系，”她用那张很贵的纸擦了擦眼睛，“它本来就是干这个的。”<\/p>\n<p data-p=\"98\">她把那张吸水纸叠成一个小方块，问：“他为什么不说？他姐姐到死都不知道吧。”<\/p>\n<p data-p=\"99\">“说了，”林衡说，“他姐姐就不肯收了。”<\/p>\n<p data-p=\"100\">范小满转过头看着他，眼睛还红着。<\/p>\n<p data-p=\"101\">“你们这种人……”<\/p>\n<p data-p=\"102\">“哪种人？”<\/p>\n<p data-p=\"103\">她看着他，嘴唇动了一下。<\/p>\n<p data-p=\"104\">“没什么。”<\/p>\n<p data-p=\"105\">封皮重新糊好，已经九点多了。她把汇款簿和当票放回鞋盒，又在外面裹了两层塑料袋，交还给他。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"106\">雨还没停。范小满走到门口才想起来，自己的伞落在出租车上了。<\/p>\n<p data-p=\"107\">林衡撑开了他的伞。<\/p>\n<p data-p=\"108\">两个人走在一把伞底下，中间还能再站一个人。伞往她那边歪着，林衡的左肩湿了一大片，他假装没有发觉。<\/p>\n<p data-p=\"109\">走上湖心那道长堤的时候，一阵风从湖面上扑过来，伞“嘭”的一声整个翻了过去，伞骨朝天，像一朵开过了头的花。<\/p>\n<p data-p=\"110\">这是林衡半年里阵亡的第二把伞。上一把死在台风夜，死得其所；这一把死在一个平平常常的冬夜，死得莫名其妙。<\/p>\n<p data-p=\"111\">两个人在雨里抢那把伞。林衡往这边拽，风往那边拽，范小满在中间掰伞骨，掰回来一根，又翻过去两根。雨打在脸上，头发全湿了。两个人站在长堤正中间，越抢越狼狈，越狼狈越想笑，最后笑得直不起腰。<\/p>\n<p data-p=\"112\">一个骑电瓶车的大爷从旁边经过，特地放慢了车速，一边骑一边回头看，摇着头走了。<\/p>\n<p data-p=\"113\">伞终于收拢了，只剩半边还能撑。两个人就这么半湿半干地，走到了她家巷口。<\/p>\n<p data-p=\"114\">范小满停下来。<\/p>\n<p data-p=\"115\">“文化馆那件事……”<\/p>\n<p data-p=\"116\">林衡看着她，等她说下去。<\/p>\n<p data-p=\"117\">“算了。”她说。<\/p>\n<p data-p=\"118\">就两个字。林衡站在雨里，半边破伞上的水顺着伞骨往下滴。<\/p>\n<p data-p=\"119\">他把怀里那只鞋盒递过去。塑料袋裹了两层，一滴雨也没进。里面垫着三层宣纸，宣纸上躺着修好的汇款簿，和那张当票。<\/p>\n<p data-p=\"120\">“它该回家了。”他说。<\/p>", "paras": ["明州人管年前那一个来月叫“年夜边”。年夜边有年夜边的规矩：欠的钱要还清，吵的架要和好；实在和不好的，到了年三十，也得坐到一张桌子上，把一顿饭吃完。", "离年三十还有一个多月。林衡和他父亲离那张桌子，还差得很远。", "自从那顿饭以后，父子俩一句话也没说过。林母成了这个家唯一的信使。她的语音从每天三条涨到了六条。前三条的开头都是“你爸让我问你”：问他出租屋冷不冷，电热毯插了没有，年货要不要带点回去。后三条的开头都是“你别跟你爸说是我说的”：说他爸半夜起来抽烟，说他爸把那顶安全帽擦了三遍，说他爸在阳台上一站就是一个钟头。", "林衡每一条都听完了，回一个字：嗯。", "那几天，范小满也在打一条消息。", "那天夜里，她在港口集团楼下站到十一点半，十七楼的灯一直没灭，她也一直没上去。回家以后，她在对话框里打了很多句话，又一句一句删掉。“我都知道了”，太像审犯人；“谢谢你”，不知道谢的是哪一件；“你爸还好吗”，问出口，就等于把陆行舟卖了。", "三天后，她发出去的是：", "“你那本汇款簿，书脊是不是快断了？”", "那边回得很快：“你怎么知道？”", "“上次在你家，你翻它的时候，用三根手指托着书脊。”", "隔了两分钟，那边又问：“修复费怎么算？”", "“上回那盒生煎，你还没还。”", "周六上午，林衡抱着一只鞋盒进了一水阁。汇款簿躺在鞋盒里，底下垫着三层宣纸。宣纸是他头天晚上去文具店买的。店员问他写什么字，他说不写字，垫东西用。店员看他的眼神，像在看一个败家子。", "吴老师从老花镜上方看了他一眼。", "“又是你。”", "“吴老师好。”", "“上一个让小满免费修东西的，是我们馆长。”吴老师说，“修完，她跟馆长吵了一架。”", "“为什么？”", "“馆长想在封面上贴一张标签。”", "林衡默默把鞋盒往怀里收了收。", "范小满戴上手套，把汇款簿放到透光台上。装订线断了两处，封皮的衬纸起了翘，每一页的纸边都被翻得发了毛。", "“这本簿子，”她说，“被人翻过很多年。”", "“我买的时候就这样了。”", "“不是你。”她用镊子轻轻拨开一页，“是他自己。前面后面，每一页旧得一样，说明他一直是从头翻到尾，翻了不知道多少遍。”", "这本簿子林衡翻了好几年，从来没想过，在他之前，还有一个人也这样一页一页地翻过：翻到哪一页会停住，在哪一页会叹一口气。", "修到一半，范小满头也不抬地问：“档案馆那天，那几行霉斑底下，你看清了吗？”", "林衡没有马上回答。", "那天在档案馆，他们一页一页往后翻，翻到民国三十一年那行朱笔字，就再也翻不动了。前面那几行洇了墨、长了霉的，他扫了一眼，记得是每月一笔，没断过，就翻过去了。", "“没有。”他说，“我只看了个大概。”", "“读旧账本的人，”范小满说，“也有只看个大概的时候？”", "林衡被噎得说不出话。吴老师在窗边翻过一页报纸，翻得很响。", "下周二下午，林衡请了半天假。", "入职六年，这是他第一次为一件跟工作无关的事请假。“事由”一栏，他写了两个字：查账。孙主任批的时候，多看了他一眼。", "档案馆的管理员一眼就认出了他们。", "“冻书的姑娘！”她又惊又喜，又看了林衡一眼，“小助理也来啦。”", "林衡这回没有解释。他发现当助理也有当助理的好处：不用说话，也没人问你是谁。", "恒裕的总账又摆到了桌上。翻到民国二十七年，那块霉斑还在，铜钱大小，灰绿色，正好压在两行字中间。墨被霉吃掉了一半，剩下的笔画，像一群走散了的人。", "范小满向管理员借了一盏台灯，把灯头压得很低，斜着照过去。", "“毛笔写字有轻有重，”她说，“墨没了，纸上还留着笔压下去的印子。正着照看不见，侧着光，字的影子就出来了。”", "灯光贴着纸面扫过去。霉斑底下，一行字慢慢浮了出来。", "民国二十七年十二月。", "林衡往上看，上一行是十月。", "十一月，没有。", "他又往下翻。正月，叁元。二月，那一行写的是国币陆元，后面跟着一行小字：", "内补上年十一月份。", "“没断。”林衡说，“十一月的钱，在路上走了三个月。”", "他说，那年秋天广州丢了，南边的船期乱成一团，香港那边的汇款常常一压就是几个月；他说香港代理处跟上海、明州怎么往来，一笔钱从星洲到江北要过几道手。说到第四道手的时候，范小满打断了他。", "“说重点。”", "“……重点是，他没断。”", "范小满低头看着那行小字：“可是秀英不知道。”", "“她不知道。”林衡说，“她只知道，十一月，钱没来。”", "他没有翻汇款簿，汇款簿还在修复室里。他不用翻。", "“民国二十七年，腊月初五，汇明州，贰拾元。”", "范小满看着他：“你背下来了？”", "“那一页，我看过很多遍。”", "十一月，姐姐没收到钱。腊月初五，弟弟寄回来二十元。平常是两元，这一回，是十倍。", "“就为了三块钱？”", "“不是三块钱的事。”林衡说，“那年月，从南洋往明州寄一封信，要走两三个月，还常常寄丢。钱不一样，钱是每个月都到的。对她来说，钱就是信。钱没来……”", "“她会以为他出事了。”", "林衡点点头。", "“阿宝在上海，隔着几百里，他怎么知道的？家里一定写信告诉他了。”他想了想，“那年月江北的女人，信多半是请人代写的。代写的信，一个字都不会慌。”", "“可他看出来了。”", "“他看出来了。”", "范小满问：“一个钱庄伙计，一个月挣多少？”", "林衡在心里把那几年的钱价过了一遍：三四块，吃住在店里，年底另有一份花红。", "“二十元，”他说，“他拿不出来。”", "“那剩下的，是从哪儿来的？”", "林衡答不上来。汇款簿只记钱寄去了哪里，不记钱是从哪里来的。", "从档案馆出来，天已经黑了，下起了小雨。两人打车回了一水阁。", "吴老师早下班了，楼里只剩值班室亮着一盏灯。范小满说，汇款簿的封皮今晚就能弄好。林衡就在旁边坐着，看她干活。", "她用竹起子沿着封皮的边，一点一点挑开衬纸。衬纸是后来糊上去的，两层，比封皮本身还厚一点。挑到一半，她停住了。", "两层衬纸中间，夹着一张折成小方块的薄纸。", "她用镊子把它夹出来，在透光台上慢慢展开。纸是黄的，一半印着字，一半是手写的。写的是一种她从来没见过的草书，每一个字都像被人揉过。", "她认过不少草书，这一种，一个字也认不出来。", "“这是什么字？”", "“当票。”林衡说，“当铺的字，是故意写得让外人认不出的。”", "他俯下身，一个字一个字地念：", "上海，公顺典。民国二十七年，腊月初三。破旧呢大衣一件，虫蛀，光板。当洋拾贰元。限期十八个月。", "修复室里只剩下雨打窗户的声音。", "“腊月初三。”范小满说。", "“他每个月初五汇钱。”林衡说，“那个月，他初三去了当铺。”", "“破旧的？”", "“当铺的规矩。东西拿进去，再新也要写成破的：虫蛀、光板、缺扣子。写得越破，当铺越不吃亏。”林衡的声音低了下去，“一个站柜台的伙计，一件呢大衣，大概是他最体面的一件衣裳了。”", "“剩下的八块，”林衡说，“大概是跟掌柜预支的花红。花红，加上一件大衣，正好二十。”", "范小满没有碰那张当票。", "“赎当的时候，”林衡说，“要把当票交回去。”", "她抬起头。", "“这张当票，还在。”", "那件大衣，他没有赎回来。", "那年冬天他是怎么过的，账上没写，当票上也没写。只有这张票，被折成一个小方块，糊在封皮里，一直没有扔。", "范小满的第一个动作，是把当票往远处挪了挪。", "那是修复师的本能：眼泪不能掉在纸上。", "然后她才转过身去。", "林衡在修复室里找了一圈，没有找到纸巾。他从工作台上抽了一张纸，递了过去。", "范小满接过来，看了一眼，眼泪还挂在脸上，又忍不住笑了出来。", "“这是吸水纸。”她说，“进口的，很贵的。”", "“……对不起。”", "“没关系，”她用那张很贵的纸擦了擦眼睛，“它本来就是干这个的。”", "她把那张吸水纸叠成一个小方块，问：“他为什么不说？他姐姐到死都不知道吧。”", "“说了，”林衡说，“他姐姐就不肯收了。”", "范小满转过头看着他，眼睛还红着。", "“你们这种人……”", "“哪种人？”", "她看着他，嘴唇动了一下。", "“没什么。”", "封皮重新糊好，已经九点多了。她把汇款簿和当票放回鞋盒，又在外面裹了两层塑料袋，交还给他。", "雨还没停。范小满走到门口才想起来，自己的伞落在出租车上了。", "林衡撑开了他的伞。", "两个人走在一把伞底下，中间还能再站一个人。伞往她那边歪着，林衡的左肩湿了一大片，他假装没有发觉。", "走上湖心那道长堤的时候，一阵风从湖面上扑过来，伞“嘭”的一声整个翻了过去，伞骨朝天，像一朵开过了头的花。", "这是林衡半年里阵亡的第二把伞。上一把死在台风夜，死得其所；这一把死在一个平平常常的冬夜，死得莫名其妙。", "两个人在雨里抢那把伞。林衡往这边拽，风往那边拽，范小满在中间掰伞骨，掰回来一根，又翻过去两根。雨打在脸上，头发全湿了。两个人站在长堤正中间，越抢越狼狈，越狼狈越想笑，最后笑得直不起腰。", "一个骑电瓶车的大爷从旁边经过，特地放慢了车速，一边骑一边回头看，摇着头走了。", "伞终于收拢了，只剩半边还能撑。两个人就这么半湿半干地，走到了她家巷口。", "范小满停下来。", "“文化馆那件事……”", "林衡看着她，等她说下去。", "“算了。”她说。", "就两个字。林衡站在雨里，半边破伞上的水顺着伞骨往下滴。", "他把怀里那只鞋盒递过去。塑料袋裹了两层，一滴雨也没进。里面垫着三层宣纸，宣纸上躺着修好的汇款簿，和那张当票。", "“它该回家了。”他说。"], "recap": "林衡写的估值报告把日记、账簿列为核心藏品，被战略部红笔退回，他第一次对领导说了“不”。安全科开始翻台风那晚的冷箱。饭桌上父子吵翻，林建国说：那年你已经替我让过一回了。陆行舟把这一切告诉了范小满。那天夜里，她站在港口集团楼下，十七楼的灯一直亮着。"}, {"n": 11, "cn": "十一", "title": "大衣", "era": "民国二十七年", "chars": 3045, "mins": 8, "html": "<p data-p=\"0\">民国二十七年的冬天，上海冷得早。<\/p>\n<p data-p=\"1\">苏州河那边的炮声，已经停了一年多。租界成了一座孤岛，四面都是别人的地界，岛上的人照旧开店、吃饭、算账。只是街上的人多了。屋檐底下，弄堂口上，到处蹲着逃难过来的人，裹着棉被，一家挨着一家。<\/p>\n<p data-p=\"2\">恒裕钱庄的上海分号，开在租界里一条窄街上。门面不大，一排柜台，七八个伙计。<b class=\"rn\" data-c=\"abao\">阿宝<\/b>站在最靠门的那一格。<\/p>\n<p data-p=\"3\">他二十一岁，进恒裕七年了。十四岁来当学徒，扫地，倒痰盂，替先生们温黄酒。三年满了师，才站上柜台。<\/p>\n<p data-p=\"4\">站柜台要体面，这是掌柜说的。满师那年冬天，阿宝攒了半年的钱，在弄堂口的裁缝铺做了一件呢大衣。藏青色，双排扣，领子立起来，能挡到耳朵根。<\/p>\n<p data-p=\"5\">那是他身上最值钱的东西。四个冬天穿下来，一个虫眼也没有。每天夜里，他都拿刷子把它从上到下刷一遍，挂在床头，挂得端端正正。<\/p>\n<p data-p=\"6\">阿宝的手快。一副算盘在他手底下噼噼啪啪，像落雨。别人家的钱从他手里进进出出，十块，一百块，一千块，他算得清清楚楚，一个铜板也不差。<\/p>\n<p data-p=\"7\">他自己的钱，也算得清楚。每个月初五，汇两元回明州江北，给母亲，给姐姐。满师以后，没有一个月断过。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"8\">十一月廿三，家里来了一封信。<\/p>\n<p data-p=\"9\">阿宝拿到信，翻过来看了看封口。<\/p>\n<p data-p=\"10\">姐姐的信，向来一个月一封，十五前后到。信是请江北街口的代书先生写的，每一封都差不多：前接手书并洋贰元，均已收悉；家慈康健；南洋款已收，勿念。<\/p>\n<p data-p=\"11\">“南洋款”是根哥的钱。根哥的钱走的是恒裕，打仗以后上海那条路断了，改走香港代理处，也是阿宝托的人。根哥出海以后，姐姐每一封信里都有这一句。<\/p>\n<p data-p=\"12\">十一月十五那一封，没有。只多了一句：今冬绣庄活计稍减，然家用尚敷。<\/p>\n<p data-p=\"13\">廿三这一封，是这个月的第二封。<\/p>\n<p data-p=\"14\">代书先生写一封，两角钱。两角钱，够家里吃两天的米。姐姐从来不肯多花这两角钱。<\/p>\n<p data-p=\"15\">他拆开来。<\/p>\n<blockquote class=\"xin\">\n<p data-p=\"16\">立诚吾弟如晤：别来数旬，念甚。家中一切如常，家慈康健，姊亦安好，勿以为念。天寒，望弟珍摄。<\/p>\n<\/blockquote>\n<p data-p=\"17\">还是代书先生那一手端正的小楷，还是那几句话，一个字也不慌。<\/p>\n<p data-p=\"18\">信纸最底下，另有一行字，歪歪扭扭，墨色比上面淡，是后添的：<\/p>\n<p class=\"hand\" data-p=\"19\">上海冷，多穿衣裳。<\/p>\n<p data-p=\"20\">阿宝把信看了三遍。<\/p>\n<p data-p=\"21\">一切如常。家里要是真的一切如常，姐姐不会多花两角钱，专门写一封信来告诉他。<\/p>\n<p data-p=\"22\">他把信折好，揣进怀里，去了后面的账房。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"23\">账房的顾先生正对着一沓香港来的单子。阿宝站在旁边，等他对完一页，才开口：<\/p>\n<p data-p=\"24\">“顾先生，香港那边，十一月份南洋来的汇款，解过来没有？”<\/p>\n<p data-p=\"25\">顾先生从眼镜上方看了他一眼。<\/p>\n<p data-p=\"26\">“还没有。广州一丢，南边的船期全乱了套。香港来信说，十一月份的单子都压着，一笔还没解出来。”<\/p>\n<p data-p=\"27\">“一笔也没有？”<\/p>\n<p data-p=\"28\">“一笔也没有。”顾先生又低下头去，“你问这个做啥？”<\/p>\n<p data-p=\"29\">“没啥。”<\/p>\n<p data-p=\"30\">阿宝回到柜台上，站了一下午。<\/p>\n<p data-p=\"31\">根哥的钱，在不在那一批里，他不知道。也许在，压在香港，过些日子就到了。也许不在。也许根哥那条船出了什么事，隔着一片海，谁也不知道。<\/p>\n<p data-p=\"32\">他只知道，江北的那间屋子里，姐姐在等。等过了月半，钱还没来；她去街口找了代书先生，花了两角钱，写了一句“一切如常”。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"33\">那天晚上，阿宝没有刷他的大衣。<\/p>\n<p data-p=\"34\">他坐在床沿上，把年关要用的钱一笔一笔想了一遍。江北的规矩，米店、柴爿店、隔壁的南货店，平常都是赊着的，到腊月底一并结清。房东的租，也是年底收。母亲的腿一到冬天就疼。姐姐信上说“活计稍减”，那就是减了一大半。往年这时候，他把年底的花红寄回去，再加上姐姐的绣活钱，年关刚好过得去。<\/p>\n<p data-p=\"35\">今年不够。<\/p>\n<p data-p=\"36\">家里其实是有钱的。根哥寄回来的钱，姐姐从第一笔起就存进了恒裕的折子，一个铜板也没动过。她说过，那本折子，要等根哥回来一起打开。<\/p>\n<p data-p=\"37\">阿宝知道姐姐的脾气。年关再难，她宁可去借，宁可夜里点着油灯多绣两块，也不会去碰那本折子。可是这个月，根哥的钱没来。年底的账一到，她要是撑不住，还是去动了它……<\/p>\n<p data-p=\"38\">动了，那本折子在她心里就不是一个家了。就成了一个人回不来以后，剩下的东西。<\/p>\n<p data-p=\"39\">所以要寄够。够到年关不用借，不用熬夜，不用去碰那本折子。米店的账，柴爿，房租，母亲请郎中抓药，再置办一点年货。二十元。<\/p>\n<p data-p=\"40\">第二天，他去问掌柜，能不能先支一点。<\/p>\n<p data-p=\"41\">掌柜把算盘往旁边推了推，看着他。掌柜也是明州人，跟他死去的父亲是一个乡里出来的。<\/p>\n<p data-p=\"42\">“家里有事？”<\/p>\n<p data-p=\"43\">“没事。”阿宝说，“想早点寄回去，过年用。”<\/p>\n<p data-p=\"44\">掌柜没再问，从抽屉里点出八块钱给他。<\/p>\n<p data-p=\"45\">“多的没有了。”<\/p>\n<p data-p=\"46\">“够了。”<\/p>\n<p data-p=\"47\">这个月的工钱，初五已经汇走了两元，剩下的吃饭、房钱、剃头，口袋里只剩一块三角，要撑到月底。还差十二块。<\/p>\n<p data-p=\"48\">他抬起头，看着床头挂着的那件大衣。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"49\">腊月初三，天阴着，江上的风一阵一阵往弄堂里灌。<\/p>\n<p data-p=\"50\">公顺典离分号隔着两条街，门口一堵粉墙，墙上一个斗大的“当”字。阿宝每天上工都从这门口过，从来没往里看过一眼。<\/p>\n<p data-p=\"51\">当铺的柜台比人还高。站在底下要仰着头，把东西举过头顶，才递得上去。柜台后头的朝奉接过大衣，抖开来，翻过去，看了领子，又看了里子。<\/p>\n<p data-p=\"52\">“破旧呢大衣一件——”朝奉拖着长腔，冲后头喊，“虫蛀——光板——”<\/p>\n<p data-p=\"53\">阿宝站在底下，没有作声。<\/p>\n<p data-p=\"54\">他知道当铺的规矩，就像他知道钱庄的规矩。东西进了这道门，再新也是破的。<\/p>\n<p data-p=\"55\">“当洋十二元，十八个月为期。当不当？”<\/p>\n<p data-p=\"56\">“当。”<\/p>\n<p data-p=\"57\">一张当票从柜台上飘下来。阿宝接住，一个字一个字看了一遍。上头的字，外人认不得，他认得。在钱庄七年，什么样的字他都见过。<\/p>\n<p data-p=\"58\">开春，他想。开春就赎回来。<\/p>\n<p data-p=\"59\">出了当铺，风一下子就钻进来了。夹袄是薄的，风从领口灌进去，从袖口灌进去，从后背的每一道缝里灌进去。阿宝缩着脖子，两只手揣在袖筒里，沿着墙根往回走。<\/p>\n<p data-p=\"60\">走过一个弄堂口，屋檐底下挤着一家逃难的人。一个女人搂着两个孩子，三个人合盖一条破棉被。<\/p>\n<p data-p=\"61\">阿宝看了一眼，把脖子缩得更紧了些，走了过去。<\/p>\n<p data-p=\"62\">上海的冬天，比他冷的人多得是。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"63\">回到分号，同乡的伙计阿发看了他半天。<\/p>\n<p data-p=\"64\">“阿宝，侬大衣呢？”<\/p>\n<p data-p=\"65\">“热煞了，”阿宝说，“穿不牢。”<\/p>\n<p data-p=\"66\">阿发看看门外阴沉沉的天，又看看他，张了张嘴，什么也没问。<\/p>\n<p data-p=\"67\">傍晚上排门板的时候，掌柜把阿宝叫到了后头。<\/p>\n<p data-p=\"68\">“大衣呢？”<\/p>\n<p data-p=\"69\">“热煞了，”阿宝又说了一遍，“穿不牢。”<\/p>\n<p data-p=\"70\">掌柜没笑。他看了看阿宝身上那件薄夹袄，转身从衣架上取下一件旧驼绒袍子，袖口磨得发白，领子也塌了。<\/p>\n<p data-p=\"71\">“我那件旧的，穿不着了。”他把袍子往阿宝怀里一放，“站柜台要体面。明朝穿上。”<\/p>\n<p data-p=\"72\">阿宝抱着袍子，手指在磨白的袖口上捻了捻，说不出话。<\/p>\n<p data-p=\"73\">“还站着做啥？”掌柜说，“排门板上好了没有？”<\/p>\n<p data-p=\"74\">那天夜里，阿宝打了一小碗浆糊，揭开汇款簿封皮里的衬纸，把那张当票折成一个小方块，放进去。又剪了一张纸，严严实实糊在上面，压在枕头底下。<\/p>\n<p data-p=\"75\">这样谁也看不见。等开春赎了，再揭出来。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"76\">腊月初五。<\/p>\n<p data-p=\"77\">阿宝站在自己的柜台上，给自己填了一张汇单。收款处：明州江北周宅。数目：国币贰拾元。<\/p>\n<p data-p=\"78\">他往家里汇了四年钱，没汇过这么多。他写得很慢，一笔一画，像是怕写错一个字，这二十块钱就到不了。<\/p>\n<p data-p=\"79\">然后他翻开汇款簿，在最新的一行写下：<\/p>\n<p class=\"zhang\" data-p=\"80\">腊月初五，汇明州，贰拾元。<\/p>\n<p data-p=\"81\">随汇单一起走的，还有一封家信。是他自己写的。在钱庄练了七年尺牍，这种信，用不着请人：<\/p>\n<blockquote class=\"xin\">\n<p data-p=\"82\">母亲大人膝下：敬禀者，儿在沪一切安好，勿念。本月薪金已领，连同年终花红，一并随函汇上国币贰拾元，到时查收。天寒，母亲腿疾，务请延医，切勿省此。<\/p>\n<p class=\"sign\" data-p=\"83\">儿立诚叩禀　腊月初五<\/p>\n<\/blockquote>\n<p data-p=\"84\">一切安好。写这四个字的时候，他身上穿着掌柜那件旧袍子。<\/p>\n<p data-p=\"85\">汇单的背面，有一小格，是留给汇款人写附言的。钱到了明州，总号的伙计会把这几个字原样抄在取款的条子上，交到收款人手里。<\/p>\n<p data-p=\"86\">阿宝拿起笔，停在那一小格上头。<\/p>\n<p data-p=\"87\">他想写：南洋的汇款都压在香港，根哥的钱，过些日子就到。<\/p>\n<p data-p=\"88\">他没有写。根哥的钱在不在那一批里，他不知道。万一不在呢？不知道的事，他不能替根哥应承。<\/p>\n<p data-p=\"89\">他想写：家里缺什么，跟我说。<\/p>\n<p data-p=\"90\">也没有写。姐姐信上说一切如常，他就当一切如常。<\/p>\n<p data-p=\"91\">最后，他只写了五个字：<\/p>\n<p class=\"hand\" data-p=\"92\">姐，莫慌，有我。<\/p>", "paras": ["民国二十七年的冬天，上海冷得早。", "苏州河那边的炮声，已经停了一年多。租界成了一座孤岛，四面都是别人的地界，岛上的人照旧开店、吃饭、算账。只是街上的人多了。屋檐底下，弄堂口上，到处蹲着逃难过来的人，裹着棉被，一家挨着一家。", "恒裕钱庄的上海分号，开在租界里一条窄街上。门面不大，一排柜台，七八个伙计。阿宝站在最靠门的那一格。", "他二十一岁，进恒裕七年了。十四岁来当学徒，扫地，倒痰盂，替先生们温黄酒。三年满了师，才站上柜台。", "站柜台要体面，这是掌柜说的。满师那年冬天，阿宝攒了半年的钱，在弄堂口的裁缝铺做了一件呢大衣。藏青色，双排扣，领子立起来，能挡到耳朵根。", "那是他身上最值钱的东西。四个冬天穿下来，一个虫眼也没有。每天夜里，他都拿刷子把它从上到下刷一遍，挂在床头，挂得端端正正。", "阿宝的手快。一副算盘在他手底下噼噼啪啪，像落雨。别人家的钱从他手里进进出出，十块，一百块，一千块，他算得清清楚楚，一个铜板也不差。", "他自己的钱，也算得清楚。每个月初五，汇两元回明州江北，给母亲，给姐姐。满师以后，没有一个月断过。", "十一月廿三，家里来了一封信。", "阿宝拿到信，翻过来看了看封口。", "姐姐的信，向来一个月一封，十五前后到。信是请江北街口的代书先生写的，每一封都差不多：前接手书并洋贰元，均已收悉；家慈康健；南洋款已收，勿念。", "“南洋款”是根哥的钱。根哥的钱走的是恒裕，打仗以后上海那条路断了，改走香港代理处，也是阿宝托的人。根哥出海以后，姐姐每一封信里都有这一句。", "十一月十五那一封，没有。只多了一句：今冬绣庄活计稍减，然家用尚敷。", "廿三这一封，是这个月的第二封。", "代书先生写一封，两角钱。两角钱，够家里吃两天的米。姐姐从来不肯多花这两角钱。", "他拆开来。", "立诚吾弟如晤：别来数旬，念甚。家中一切如常，家慈康健，姊亦安好，勿以为念。天寒，望弟珍摄。", "还是代书先生那一手端正的小楷，还是那几句话，一个字也不慌。", "信纸最底下，另有一行字，歪歪扭扭，墨色比上面淡，是后添的：", "上海冷，多穿衣裳。", "阿宝把信看了三遍。", "一切如常。家里要是真的一切如常，姐姐不会多花两角钱，专门写一封信来告诉他。", "他把信折好，揣进怀里，去了后面的账房。", "账房的顾先生正对着一沓香港来的单子。阿宝站在旁边，等他对完一页，才开口：", "“顾先生，香港那边，十一月份南洋来的汇款，解过来没有？”", "顾先生从眼镜上方看了他一眼。", "“还没有。广州一丢，南边的船期全乱了套。香港来信说，十一月份的单子都压着，一笔还没解出来。”", "“一笔也没有？”", "“一笔也没有。”顾先生又低下头去，“你问这个做啥？”", "“没啥。”", "阿宝回到柜台上，站了一下午。", "根哥的钱，在不在那一批里，他不知道。也许在，压在香港，过些日子就到了。也许不在。也许根哥那条船出了什么事，隔着一片海，谁也不知道。", "他只知道，江北的那间屋子里，姐姐在等。等过了月半，钱还没来；她去街口找了代书先生，花了两角钱，写了一句“一切如常”。", "那天晚上，阿宝没有刷他的大衣。", "他坐在床沿上，把年关要用的钱一笔一笔想了一遍。江北的规矩，米店、柴爿店、隔壁的南货店，平常都是赊着的，到腊月底一并结清。房东的租，也是年底收。母亲的腿一到冬天就疼。姐姐信上说“活计稍减”，那就是减了一大半。往年这时候，他把年底的花红寄回去，再加上姐姐的绣活钱，年关刚好过得去。", "今年不够。", "家里其实是有钱的。根哥寄回来的钱，姐姐从第一笔起就存进了恒裕的折子，一个铜板也没动过。她说过，那本折子，要等根哥回来一起打开。", "阿宝知道姐姐的脾气。年关再难，她宁可去借，宁可夜里点着油灯多绣两块，也不会去碰那本折子。可是这个月，根哥的钱没来。年底的账一到，她要是撑不住，还是去动了它……", "动了，那本折子在她心里就不是一个家了。就成了一个人回不来以后，剩下的东西。", "所以要寄够。够到年关不用借，不用熬夜，不用去碰那本折子。米店的账，柴爿，房租，母亲请郎中抓药，再置办一点年货。二十元。", "第二天，他去问掌柜，能不能先支一点。", "掌柜把算盘往旁边推了推，看着他。掌柜也是明州人，跟他死去的父亲是一个乡里出来的。", "“家里有事？”", "“没事。”阿宝说，“想早点寄回去，过年用。”", "掌柜没再问，从抽屉里点出八块钱给他。", "“多的没有了。”", "“够了。”", "这个月的工钱，初五已经汇走了两元，剩下的吃饭、房钱、剃头，口袋里只剩一块三角，要撑到月底。还差十二块。", "他抬起头，看着床头挂着的那件大衣。", "腊月初三，天阴着，江上的风一阵一阵往弄堂里灌。", "公顺典离分号隔着两条街，门口一堵粉墙，墙上一个斗大的“当”字。阿宝每天上工都从这门口过，从来没往里看过一眼。", "当铺的柜台比人还高。站在底下要仰着头，把东西举过头顶，才递得上去。柜台后头的朝奉接过大衣，抖开来，翻过去，看了领子，又看了里子。", "“破旧呢大衣一件——”朝奉拖着长腔，冲后头喊，“虫蛀——光板——”", "阿宝站在底下，没有作声。", "他知道当铺的规矩，就像他知道钱庄的规矩。东西进了这道门，再新也是破的。", "“当洋十二元，十八个月为期。当不当？”", "“当。”", "一张当票从柜台上飘下来。阿宝接住，一个字一个字看了一遍。上头的字，外人认不得，他认得。在钱庄七年，什么样的字他都见过。", "开春，他想。开春就赎回来。", "出了当铺，风一下子就钻进来了。夹袄是薄的，风从领口灌进去，从袖口灌进去，从后背的每一道缝里灌进去。阿宝缩着脖子，两只手揣在袖筒里，沿着墙根往回走。", "走过一个弄堂口，屋檐底下挤着一家逃难的人。一个女人搂着两个孩子，三个人合盖一条破棉被。", "阿宝看了一眼，把脖子缩得更紧了些，走了过去。", "上海的冬天，比他冷的人多得是。", "回到分号，同乡的伙计阿发看了他半天。", "“阿宝，侬大衣呢？”", "“热煞了，”阿宝说，“穿不牢。”", "阿发看看门外阴沉沉的天，又看看他，张了张嘴，什么也没问。", "傍晚上排门板的时候，掌柜把阿宝叫到了后头。", "“大衣呢？”", "“热煞了，”阿宝又说了一遍，“穿不牢。”", "掌柜没笑。他看了看阿宝身上那件薄夹袄，转身从衣架上取下一件旧驼绒袍子，袖口磨得发白，领子也塌了。", "“我那件旧的，穿不着了。”他把袍子往阿宝怀里一放，“站柜台要体面。明朝穿上。”", "阿宝抱着袍子，手指在磨白的袖口上捻了捻，说不出话。", "“还站着做啥？”掌柜说，“排门板上好了没有？”", "那天夜里，阿宝打了一小碗浆糊，揭开汇款簿封皮里的衬纸，把那张当票折成一个小方块，放进去。又剪了一张纸，严严实实糊在上面，压在枕头底下。", "这样谁也看不见。等开春赎了，再揭出来。", "腊月初五。", "阿宝站在自己的柜台上，给自己填了一张汇单。收款处：明州江北周宅。数目：国币贰拾元。", "他往家里汇了四年钱，没汇过这么多。他写得很慢，一笔一画，像是怕写错一个字，这二十块钱就到不了。", "然后他翻开汇款簿，在最新的一行写下：", "腊月初五，汇明州，贰拾元。", "随汇单一起走的，还有一封家信。是他自己写的。在钱庄练了七年尺牍，这种信，用不着请人：", "母亲大人膝下：敬禀者，儿在沪一切安好，勿念。本月薪金已领，连同年终花红，一并随函汇上国币贰拾元，到时查收。天寒，母亲腿疾，务请延医，切勿省此。", "儿立诚叩禀　腊月初五", "一切安好。写这四个字的时候，他身上穿着掌柜那件旧袍子。", "汇单的背面，有一小格，是留给汇款人写附言的。钱到了明州，总号的伙计会把这几个字原样抄在取款的条子上，交到收款人手里。", "阿宝拿起笔，停在那一小格上头。", "他想写：南洋的汇款都压在香港，根哥的钱，过些日子就到。", "他没有写。根哥的钱在不在那一批里，他不知道。万一不在呢？不知道的事，他不能替根哥应承。", "他想写：家里缺什么，跟我说。", "也没有写。姐姐信上说一切如常，他就当一切如常。", "最后，他只写了五个字：", "姐，莫慌，有我。"], "recap": "范小满替林衡修那本汇款簿。两人回档案馆，用侧光照出霉斑下的字：民国二十七年十一月，阿根的钱没到，三个月后才补上。就在那个月，阿宝往家里汇了二十元。汇款簿的封皮里，揭出一张当票：腊月初三，破旧呢大衣一件，当洋拾贰元。"}, {"n": 12, "cn": "十二", "title": "春节", "era": "", "chars": 3000, "mins": 8, "html": "<p data-p=\"0\">明州人过年，桌上摆十碗头，桌下摆一张看不见的表格：在哪里上班，一个月多少，有没有对象，房子买在哪里。一顿年夜饭吃下来，菜吃完了，表格也填完了。<\/p>\n<p data-p=\"1\">林家今年的表格，填不下去。<\/p>\n<p data-p=\"2\"><b class=\"rn\" data-c=\"linheng\">林衡<\/b>和他父亲从十二月那顿饭起，五十多天没说过一句话。<b class=\"rn\" data-c=\"linmu\">林母<\/b>的语音从六条涨到了九条，翻来覆去还是那两种开头：“你爸让我问你”，“你别跟你爸说是我说的”。她当了三十年的家，第一次觉得这个信使当不下去了。<\/p>\n<p data-p=\"3\">腊月二十，她想出了一个办法。<\/p>\n<p data-p=\"4\">她知道，两个人冷战，最怕的不是吵架，是饭桌上多一个外人。有外人在，谁也不好意思摆脸色；脸色摆不出来，话就总有一句要说。<\/p>\n<p data-p=\"5\">这个外人，她早就选好了。<\/p>\n<p data-p=\"6\">“你给小范打个电话，”她对<b class=\"rn\" data-c=\"linjianguo\">林建国<\/b>说，“请她初三来家里吃饭。”<\/p>\n<p data-p=\"7\">“我不打。”<\/p>\n<p data-p=\"8\">“那你儿子过年就别回来了。”<\/p>\n<p data-p=\"9\">林建国打了。<\/p>\n<p data-p=\"10\">他在电话里清了三次嗓子，才把话说出口：“小范啊，初三来家里吃顿饭。你阿姨烧了一桌子，吃不完。”<\/p>\n<p data-p=\"11\">电话那头没了声音。<\/p>\n<p data-p=\"12\">“叔叔，这……不太方便吧。”<\/p>\n<p data-p=\"13\">“有什么不方便的？”林建国说，“就当……就当是那只箱子。”<\/p>\n<p data-p=\"14\"><b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>没话说了。那只箱子的人情，她到现在也没还上。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"15\">腊月廿八，范小满去了一趟医院。<\/p>\n<p data-p=\"16\"><b class=\"rn\" data-c=\"laoxiansheng\">老先生<\/b>入冬就住进了市一院，一直没出来。她每个月去一次，把那批书的修复进度讲给他听：哪一本揭完了，哪一本还留着水泡过的皱。老先生听得很仔细，从不插话。<\/p>\n<p data-p=\"17\">这一回，他大部分时间在睡。她在床边等了一个多钟头，手机里存着日记的照片，想等他醒了，问问他认不认得一个叫<b class=\"rn\" data-c=\"agen\">沈阿根<\/b>的人。<\/p>\n<p data-p=\"18\">老先生醒过来一回。眼睛睁开，眼珠慢慢转到她脸上，像是费了很大的力气才认出她来。<\/p>\n<p data-p=\"19\">“樟木箱里的，”他说，“都好吗？”<\/p>\n<p data-p=\"20\">“都好。”<\/p>\n<p data-p=\"21\">他点点头，又闭上了眼睛。<\/p>\n<p data-p=\"22\">她没有问出口。过了年再问吧，她想。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"23\">除夕夜，范家的饭桌上只有两副碗筷。二十多年了，一直是两副。<\/p>\n<p data-p=\"24\">母亲是外地人，十九岁进明州的纺织厂，二十三岁嫁给了厂里一个修机器的小伙子。那人没房，没存款，家里还有一个病着的老娘。娘家不同意，她还是嫁了，从此跟娘家断了来往。<\/p>\n<p data-p=\"25\">小满七岁那年，父亲走了，留下一间租来的房子和一笔给奶奶看病欠下的债。债主里有好几家是父亲那边的亲戚。母亲一家一家地还，还了十年。还完了，跟那几家人也就不怎么走动了。<\/p>\n<p data-p=\"26\">所以每年除夕，都是母女两个人，一条鱼，几个菜，一台吵吵闹闹的电视。<\/p>\n<p data-p=\"27\">母亲把鱼肚上最嫩的那一块夹到她碗里，夹完了才开口。整顿年夜饭，她只问了一个问题：<\/p>\n<p data-p=\"28\">“那个港口的小林，家里什么条件？”<\/p>\n<p data-p=\"29\">范小满夹着鱼的筷子停了。母亲是从哪儿听来的？她想了想，想起那天夜里下雨，她和林衡半湿半干地站在巷口，巷子里的阿姨们大概全看见了。<\/p>\n<p data-p=\"30\">“不知道。”她说。<\/p>\n<p data-p=\"31\">母亲没有再问。她给自己也夹了一筷子鱼，说：“我嫁给你爸那年，你外婆也问过我这一句。”<\/p>\n<p data-p=\"32\">后面的话，母亲没说，范小满也知道。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"33\">初三上午十点，范小满按响了林家的门铃。<\/p>\n<p data-p=\"34\">开门的是林母。她穿着一件新织的羊毛衫，头发是年前刚烫的，屋里的地拖得能照出人影。茶几上摆着瓜子、花生、橘子，还有一本摊开的相册。<\/p>\n<p data-p=\"35\">“来来来，坐坐坐。”林母把她按在沙发上，“衡衡十一点到，我们先聊。”<\/p>\n<p data-p=\"36\">这一个钟头里，她知道了很多事：林衡小时候只吃鱼肚，林建国这辈子就好一口蟹钳；林衡五岁那年在海边光着屁股；林衡上初中，为了一本旧书跟人打过一架。<\/p>\n<p data-p=\"37\">十一点，林衡推开家门，看见范小满坐在自家沙发上，左边是他妈，右边是他爸，三个人正低着头，看他五岁那年在海边的照片。<\/p>\n<p data-p=\"38\">林衡在门口换鞋，一只脚还没换完，就那么站住了。<\/p>\n<p data-p=\"39\">“妈，”他说，“你跟我说的是中午回来吃饭。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"40\">午饭是十碗头。<\/p>\n<p data-p=\"41\">有客人在，父子俩都很体面。林建国给范小满倒饮料，林衡给她递纸巾，两个人都在笑，都在说话，只是谁也没跟对方说一句。林建国想让儿子尝尝那道烤菜，说的是：“小范，你让他尝尝这个，他小时候抢着吃。”林衡想让父亲少喝点酒，说的是：“妈，爸今天第三杯了。”<\/p>\n<p data-p=\"42\">范小满坐在中间，听了一会儿就听明白了。这两个人隔着一张桌子，谁也不肯先叫对方一声。<\/p>\n<p data-p=\"43\">吃到一半，林建国伸出筷子，夹下黄鱼肚上那一块，最嫩，没有刺。他朝儿子的碗看了一眼，筷子在半空停了一下，拐了个弯，放进了范小满碗里：“小范，吃鱼。”<\/p>\n<p data-p=\"44\">林衡也伸出筷子，挑出最大的那只蟹钳，朝父亲那边看了一眼，也放进了范小满碗里：“……吃蟹。”<\/p>\n<p data-p=\"45\">范小满看着碗里的鱼肚和蟹钳，想起上午那一个钟头里听来的话。<\/p>\n<p data-p=\"46\">她把鱼肚夹起来，放进林衡碗里：“我不吃鱼肚。”<\/p>\n<p data-p=\"47\">又把蟹钳夹起来，放进林建国碗里：“叔叔，这个我咬不动。”<\/p>\n<p data-p=\"48\">父子俩低头看着各自碗里的东西，谁也没放回去。两个人都吃了。<\/p>\n<p data-p=\"49\">林母低着头扒饭，肩膀抖了好一阵。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"50\">饭后，范小满抢着去洗碗。林母没拦她，跟进厨房，顺手把门带上了。<\/p>\n<p data-p=\"51\">水龙头哗哗地响。林母站在她旁边，擦一只已经擦干了的盘子。<\/p>\n<p data-p=\"52\">“他爸跟我说，你那天在电话里，说他死板。”<\/p>\n<p data-p=\"53\">范小满的手停了：“阿姨，那是……”<\/p>\n<p data-p=\"54\">“没事，他是死板。”林母说，“可他不光是死板。”<\/p>\n<p data-p=\"55\">林母说话向来快，六十秒的语音一秒钟都不浪费。这一回，她说得很慢。<\/p>\n<p data-p=\"56\">“他大学毕业那年，考上研究生了。读的就是他天天看的那些，民国的钱，民国的账。开学前一个月，他爸在码头上摔了，伤了腰，躺了大半年，家里一下子没了进项。”<\/p>\n<p data-p=\"57\">她把那只盘子放下，又拿起另一只。<\/p>\n<p data-p=\"58\">“他把通知书收起来，去港口上班了，一个字也没跟我们提。是我后来给他收拾房间，在抽屉最底下看见的。他爸知道以后，在阳台上坐了一夜。”<\/p>\n<p data-p=\"59\">“这么多年，父子俩谁也没提过这件事。就年前吵架那回，他爸提了一句。”<\/p>\n<p data-p=\"60\">水一直开着，范小满手里那只碗，冲了一遍又一遍。<\/p>\n<p data-p=\"61\">“阿姨跟你说这个，不是要你怎么样。”林母关上水龙头，“就是觉得，总得有个人知道。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"62\">下午，林母搬出了麻将桌。<\/p>\n<p data-p=\"63\">四个人刚好一桌。父子俩面对面坐着。牌桌上说话不用看人，“碰”“吃”“杠”，倒比饭桌上自在些。<\/p>\n<p data-p=\"64\">范小满打牌又快又准，摸一张，看一眼，就扔出去，像在修复室里挑一根纸纤维。她小时候，母亲在纺织厂三班倒，下了班就去活动室打两圈，她趴在旁边的桌子上写作业，一写就是好多年。<\/p>\n<p data-p=\"65\">一个下午，她把林家父母赢了个精光。<\/p>\n<p data-p=\"66\">林建国把最后几个筹码推过去，大笑：“小范，你这是来我们家打劫的。”<\/p>\n<p data-p=\"67\">三个人一边打牌一边聊，从龙门吊聊到藏书楼，从台风夜聊到书页里能揭出来的几百年前的头发和花瓣。林母说起儿子二十九岁相亲十四次，第十四次跟人家姑娘讲了四十分钟的民国田赋。<\/p>\n<p data-p=\"68\">“四十分钟？”范小满转头看林衡。<\/p>\n<p data-p=\"69\">“……三十八分钟。”林衡说。<\/p>\n<p data-p=\"70\">三个人笑成一团。<\/p>\n<p data-p=\"71\">林衡摸牌，打牌，输钱。他试着插了三次话，一次也没插进去。<\/p>\n<p data-p=\"72\">他也不急，把输掉的筹码一个一个码整齐，推过去。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"73\">傍晚，林衡送她下楼。<\/p>\n<p data-p=\"74\">两个人走到小区门口。街上有人在放烟花，一朵一朵炸开，又一朵一朵落下去。<\/p>\n<p data-p=\"75\">“今天，”林衡说，“我妈要是说了什么不该说的……”<\/p>\n<p data-p=\"76\">“她说你三十八分钟。”<\/p>\n<p data-p=\"77\">“那确实是三十八分钟。”<\/p>\n<p data-p=\"78\">范小满笑了一下，没有说别的。<\/p>\n<p data-p=\"79\">回家的公交车上，她靠着车窗，想起除夕夜母亲问的那句话。<\/p>\n<p data-p=\"80\">那个港口的小林，家里什么条件？<\/p>\n<p data-p=\"81\">现在她知道了。父亲开龙门吊，还有两年退休；母亲在家，一天发九条语音；他自己租房子住，满墙都是民国的档案盒。<\/p>\n<p data-p=\"82\">她还知道了一件母亲问不出来、也不会去问的事。<\/p>\n<p data-p=\"83\">她给人下结论，向来只要三句话。这个人，她改了一回又一回。这一回，她不打算再改了。<\/p>\n<p data-p=\"84\">这一家人，连夹一块鱼都要绕一个弯。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"85\">初五早上，范小满的手机响了，是个陌生号码。<\/p>\n<p data-p=\"86\">“请问是范小满吗？这里是市一院护士站。沈老先生的紧急联系人，第一个号码打不通，第二个填的是你。”<\/p>\n<p data-p=\"87\">她站在窗前，听电话那头一句一句地说。<\/p>\n<p data-p=\"88\">老先生凌晨走了。<\/p>\n<p data-p=\"89\">她想起腊月廿八那天，手机里存着的那张照片。她本来是想问的。<\/p>\n<p data-p=\"90\">过了年再问吧，她那天这样想。她以为还有的是时间。<\/p>", "paras": ["明州人过年，桌上摆十碗头，桌下摆一张看不见的表格：在哪里上班，一个月多少，有没有对象，房子买在哪里。一顿年夜饭吃下来，菜吃完了，表格也填完了。", "林家今年的表格，填不下去。", "林衡和他父亲从十二月那顿饭起，五十多天没说过一句话。林母的语音从六条涨到了九条，翻来覆去还是那两种开头：“你爸让我问你”，“你别跟你爸说是我说的”。她当了三十年的家，第一次觉得这个信使当不下去了。", "腊月二十，她想出了一个办法。", "她知道，两个人冷战，最怕的不是吵架，是饭桌上多一个外人。有外人在，谁也不好意思摆脸色；脸色摆不出来，话就总有一句要说。", "这个外人，她早就选好了。", "“你给小范打个电话，”她对林建国说，“请她初三来家里吃饭。”", "“我不打。”", "“那你儿子过年就别回来了。”", "林建国打了。", "他在电话里清了三次嗓子，才把话说出口：“小范啊，初三来家里吃顿饭。你阿姨烧了一桌子，吃不完。”", "电话那头没了声音。", "“叔叔，这……不太方便吧。”", "“有什么不方便的？”林建国说，“就当……就当是那只箱子。”", "范小满没话说了。那只箱子的人情，她到现在也没还上。", "腊月廿八，范小满去了一趟医院。", "老先生入冬就住进了市一院，一直没出来。她每个月去一次，把那批书的修复进度讲给他听：哪一本揭完了，哪一本还留着水泡过的皱。老先生听得很仔细，从不插话。", "这一回，他大部分时间在睡。她在床边等了一个多钟头，手机里存着日记的照片，想等他醒了，问问他认不认得一个叫沈阿根的人。", "老先生醒过来一回。眼睛睁开，眼珠慢慢转到她脸上，像是费了很大的力气才认出她来。", "“樟木箱里的，”他说，“都好吗？”", "“都好。”", "他点点头，又闭上了眼睛。", "她没有问出口。过了年再问吧，她想。", "除夕夜，范家的饭桌上只有两副碗筷。二十多年了，一直是两副。", "母亲是外地人，十九岁进明州的纺织厂，二十三岁嫁给了厂里一个修机器的小伙子。那人没房，没存款，家里还有一个病着的老娘。娘家不同意，她还是嫁了，从此跟娘家断了来往。", "小满七岁那年，父亲走了，留下一间租来的房子和一笔给奶奶看病欠下的债。债主里有好几家是父亲那边的亲戚。母亲一家一家地还，还了十年。还完了，跟那几家人也就不怎么走动了。", "所以每年除夕，都是母女两个人，一条鱼，几个菜，一台吵吵闹闹的电视。", "母亲把鱼肚上最嫩的那一块夹到她碗里，夹完了才开口。整顿年夜饭，她只问了一个问题：", "“那个港口的小林，家里什么条件？”", "范小满夹着鱼的筷子停了。母亲是从哪儿听来的？她想了想，想起那天夜里下雨，她和林衡半湿半干地站在巷口，巷子里的阿姨们大概全看见了。", "“不知道。”她说。", "母亲没有再问。她给自己也夹了一筷子鱼，说：“我嫁给你爸那年，你外婆也问过我这一句。”", "后面的话，母亲没说，范小满也知道。", "初三上午十点，范小满按响了林家的门铃。", "开门的是林母。她穿着一件新织的羊毛衫，头发是年前刚烫的，屋里的地拖得能照出人影。茶几上摆着瓜子、花生、橘子，还有一本摊开的相册。", "“来来来，坐坐坐。”林母把她按在沙发上，“衡衡十一点到，我们先聊。”", "这一个钟头里，她知道了很多事：林衡小时候只吃鱼肚，林建国这辈子就好一口蟹钳；林衡五岁那年在海边光着屁股；林衡上初中，为了一本旧书跟人打过一架。", "十一点，林衡推开家门，看见范小满坐在自家沙发上，左边是他妈，右边是他爸，三个人正低着头，看他五岁那年在海边的照片。", "林衡在门口换鞋，一只脚还没换完，就那么站住了。", "“妈，”他说，“你跟我说的是中午回来吃饭。”", "午饭是十碗头。", "有客人在，父子俩都很体面。林建国给范小满倒饮料，林衡给她递纸巾，两个人都在笑，都在说话，只是谁也没跟对方说一句。林建国想让儿子尝尝那道烤菜，说的是：“小范，你让他尝尝这个，他小时候抢着吃。”林衡想让父亲少喝点酒，说的是：“妈，爸今天第三杯了。”", "范小满坐在中间，听了一会儿就听明白了。这两个人隔着一张桌子，谁也不肯先叫对方一声。", "吃到一半，林建国伸出筷子，夹下黄鱼肚上那一块，最嫩，没有刺。他朝儿子的碗看了一眼，筷子在半空停了一下，拐了个弯，放进了范小满碗里：“小范，吃鱼。”", "林衡也伸出筷子，挑出最大的那只蟹钳，朝父亲那边看了一眼，也放进了范小满碗里：“……吃蟹。”", "范小满看着碗里的鱼肚和蟹钳，想起上午那一个钟头里听来的话。", "她把鱼肚夹起来，放进林衡碗里：“我不吃鱼肚。”", "又把蟹钳夹起来，放进林建国碗里：“叔叔，这个我咬不动。”", "父子俩低头看着各自碗里的东西，谁也没放回去。两个人都吃了。", "林母低着头扒饭，肩膀抖了好一阵。", "饭后，范小满抢着去洗碗。林母没拦她，跟进厨房，顺手把门带上了。", "水龙头哗哗地响。林母站在她旁边，擦一只已经擦干了的盘子。", "“他爸跟我说，你那天在电话里，说他死板。”", "范小满的手停了：“阿姨，那是……”", "“没事，他是死板。”林母说，“可他不光是死板。”", "林母说话向来快，六十秒的语音一秒钟都不浪费。这一回，她说得很慢。", "“他大学毕业那年，考上研究生了。读的就是他天天看的那些，民国的钱，民国的账。开学前一个月，他爸在码头上摔了，伤了腰，躺了大半年，家里一下子没了进项。”", "她把那只盘子放下，又拿起另一只。", "“他把通知书收起来，去港口上班了，一个字也没跟我们提。是我后来给他收拾房间，在抽屉最底下看见的。他爸知道以后，在阳台上坐了一夜。”", "“这么多年，父子俩谁也没提过这件事。就年前吵架那回，他爸提了一句。”", "水一直开着，范小满手里那只碗，冲了一遍又一遍。", "“阿姨跟你说这个，不是要你怎么样。”林母关上水龙头，“就是觉得，总得有个人知道。”", "下午，林母搬出了麻将桌。", "四个人刚好一桌。父子俩面对面坐着。牌桌上说话不用看人，“碰”“吃”“杠”，倒比饭桌上自在些。", "范小满打牌又快又准，摸一张，看一眼，就扔出去，像在修复室里挑一根纸纤维。她小时候，母亲在纺织厂三班倒，下了班就去活动室打两圈，她趴在旁边的桌子上写作业，一写就是好多年。", "一个下午，她把林家父母赢了个精光。", "林建国把最后几个筹码推过去，大笑：“小范，你这是来我们家打劫的。”", "三个人一边打牌一边聊，从龙门吊聊到藏书楼，从台风夜聊到书页里能揭出来的几百年前的头发和花瓣。林母说起儿子二十九岁相亲十四次，第十四次跟人家姑娘讲了四十分钟的民国田赋。", "“四十分钟？”范小满转头看林衡。", "“……三十八分钟。”林衡说。", "三个人笑成一团。", "林衡摸牌，打牌，输钱。他试着插了三次话，一次也没插进去。", "他也不急，把输掉的筹码一个一个码整齐，推过去。", "傍晚，林衡送她下楼。", "两个人走到小区门口。街上有人在放烟花，一朵一朵炸开，又一朵一朵落下去。", "“今天，”林衡说，“我妈要是说了什么不该说的……”", "“她说你三十八分钟。”", "“那确实是三十八分钟。”", "范小满笑了一下，没有说别的。", "回家的公交车上，她靠着车窗，想起除夕夜母亲问的那句话。", "那个港口的小林，家里什么条件？", "现在她知道了。父亲开龙门吊，还有两年退休；母亲在家，一天发九条语音；他自己租房子住，满墙都是民国的档案盒。", "她还知道了一件母亲问不出来、也不会去问的事。", "她给人下结论，向来只要三句话。这个人，她改了一回又一回。这一回，她不打算再改了。", "这一家人，连夹一块鱼都要绕一个弯。", "初五早上，范小满的手机响了，是个陌生号码。", "“请问是范小满吗？这里是市一院护士站。沈老先生的紧急联系人，第一个号码打不通，第二个填的是你。”", "她站在窗前，听电话那头一句一句地说。", "老先生凌晨走了。", "她想起腊月廿八那天，手机里存着的那张照片。她本来是想问的。", "过了年再问吧，她那天这样想。她以为还有的是时间。"], "recap": "民国二十七年冬，上海。十一月的南洋汇款压在香港，姐姐多花两角钱，请人写了一封“一切如常”。阿宝知道她宁可借钱也不会动那本存着阿根钱的折子。他向掌柜预支了八块，又当掉了那件呢大衣，凑够二十元。汇单的附言只有五个字：姐，莫慌，有我。"}, {"n": 13, "cn": "十三", "title": "遗产", "era": "", "chars": 3389, "mins": 9, "html": "<p data-p=\"0\">明州人送老人，讲究个热闹：来的人越多，花圈越多，说明这个人这辈子活得越体面。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"laoxiansheng\">老先生<\/b>的告别厅里，花圈只有七个。<\/p>\n<p data-p=\"2\">一个是一水阁送的，一个是旧书市场几个老摊主凑钱送的，剩下五个，挽联上的名字，<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>一个也不认识。来的人更少，稀稀拉拉站了两排，大半是头发全白的老人，彼此点个头，不怎么说话。<\/p>\n<p data-p=\"3\"><b class=\"rn\" data-c=\"shenhao\">沈浩<\/b>站在家属的位置上，戴着黑袖箍，脸色发灰。仪式进行到一半，他口袋里的手机响了，是一首很欢快的流行歌。他手忙脚乱地掐掉，没过一分钟，又响了。<\/p>\n<p data-p=\"4\">他一共掐了三次，始终没有关机。范小满想起，初五那天，医院的第一个电话就是打给他的。那一回，他没接。<\/p>\n<p data-p=\"5\"><b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>站在她旁边，看着灵堂正中那张黑白照片，手里的眼镜盒开了又合上。<\/p>\n<p data-p=\"6\">“他年轻时候，天天来一水阁门口的旧书摊。”吴老师说，“看中一本书，钱不够，就站在那儿看，一看一下午。摊主赶他，他也不走。”<\/p>\n<p data-p=\"7\">“别人淘刻本，他专淘没人要的：账本，契约，旧信，当票。那时候废品站收来的旧纸，论斤卖，什么都有。我问过他，淘这些做什么。他说，一张纸上，是一家人的日子。”<\/p>\n<p data-p=\"8\">“您认识他？”<\/p>\n<p data-p=\"9\">“那时候我也年轻。”吴老师说，“认识谁不认识谁，有什么要紧。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"10\">告别仪式后的第三天，沈浩来了一水阁。<\/p>\n<p data-p=\"11\">他没进修复室，直接去了馆长办公室。半个钟头以后，馆长把范小满和吴老师叫了过去。<\/p>\n<p data-p=\"12\">事情说起来很简单。台风那年秋天，老先生签过一份捐赠意向书，说这批书修好以后捐给一水阁。可意向书不是捐赠协议。正式的协议要等清点和修复做完，由老先生本人签字，再经馆里论证。修复还没做完，老先生先住进了医院，一直没能签。<\/p>\n<p data-p=\"13\">“我爸签的是意向，不是协议。”沈浩说，“我问过律师了，书现在是遗产。”<\/p>\n<p data-p=\"14\">他说话的时候没看任何人，像在背一段准备了很久的话。<\/p>\n<p data-p=\"15\">“我知道你们修了半年。修复的费用，你们开个数，我认。可书我得拿回去。我欠的钱，下个月就到期了。”<\/p>\n<p data-p=\"16\">馆长没有说话。年前的预算会上，手工修复的经费刚砍了一半。馆里没钱买，也没有理由不放。<\/p>\n<p data-p=\"17\">“沈先生，”范小满开口了，“那本日记，最后几页还粘在一起，没有揭开。能不能再给我两个礼拜？”<\/p>\n<p data-p=\"18\">沈浩看了她一眼。这是他头一回正眼看她。<\/p>\n<p data-p=\"19\">“嘉禾春拍的图录，三月中旬就要定稿。”他说，“范老师，我等不起。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"20\">书是三月初拉走的。<\/p>\n<p data-p=\"21\">嘉禾来了一辆厢式货车，四个搬运工，还有<b class=\"rn\" data-c=\"luxingzhou\">陆行舟<\/b>。<\/p>\n<p data-p=\"22\">按规矩，交接要一件一件点。一水阁这边负责点数的，是范小满。<\/p>\n<p data-p=\"23\">她站在修复室门口，手里一张清单，一共三百一十二行。搬运工抱出一箱，她念一行，核一件，打一个勾。<\/p>\n<p data-p=\"24\">明刻本，四十七册。她打了四十七个勾。<\/p>\n<p data-p=\"25\">账簿，契约，信札，票据。勾，勾，勾。<\/p>\n<p data-p=\"26\">那页嘉靖年间的修堤账夹在一块透明保护板里，被人小心地抬了出去。补纸还贴在原处，四百多年的老位置。勾。<\/p>\n<p data-p=\"27\">老先生收了它几十年。要不是那场台风，他大概到死也不会知道，那条补纸底下另有一个数。<\/p>\n<p data-p=\"28\">最后是那只樟木箱。清单上那一行写着：樟木箱一只，内日记一册（残）、织物一件、杂件若干。<\/p>\n<p data-p=\"29\">她看着那只箱子被抬上货车，在那一行后面打了一个勾。<\/p>\n<p data-p=\"30\">这是她做修复师的第五年。她给很多东西打过勾：入库的，出库的，修好的，修不好的。头一回觉得，一个勾这么难打。<\/p>\n<p data-p=\"31\">吴老师一直站在窗边，没过来帮忙，也没说话。最后一箱抬出门的时候，她说了一句：<\/p>\n<p data-p=\"32\">“修了半年，修好了，人家来拉走。”<\/p>\n<p data-p=\"33\">“吴老师……”<\/p>\n<p data-p=\"34\">“我不是说他。”吴老师说，“我是说咱们这行。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"35\">货车开走以后，陆行舟没有走。<\/p>\n<p data-p=\"36\">他等搬运工都上了车，才走过来。<\/p>\n<p data-p=\"37\">“刻本那四十七册，战略部已经谈妥了，走定向洽购，不上拍。”他说，“剩下的，沈先生要拆成三十几个标的，上春拍。”<\/p>\n<p data-p=\"38\">“拆开卖。”<\/p>\n<p data-p=\"39\">“拆开卖，价钱高一点，钱也来得快。他等不起。”<\/p>\n<p data-p=\"40\">范小满在清单最后一行底下，画了一道横线。<\/p>\n<p data-p=\"41\">“不过，”陆行舟说，“我这边有一个买家，愿意按估价把那三百来件杂件整批收下，一件不拆。”<\/p>\n<p data-p=\"42\">范小满抬起头。<\/p>\n<p data-p=\"43\">“他只有一个条件：这批东西要有人修，他要你来修。在嘉禾上海的修复中心，就是我年前跟你说的那个位置。”<\/p>\n<p data-p=\"44\">“他是谁？”<\/p>\n<p data-p=\"45\">“他不愿意露面。”陆行舟把车钥匙在手里转了一圈，“是个懂书的人。”<\/p>\n<p data-p=\"46\">范小满看着空了一半的书架。架子上还留着书箱压出来的印子，一个方块挨着一个方块。<\/p>\n<p data-p=\"47\">“最后那几页日记，”她问，“我能修吗？”<\/p>\n<p data-p=\"48\">“整批都是你的活。想怎么修，就怎么修。”<\/p>\n<p data-p=\"49\">她没有回答。<\/p>\n<p data-p=\"50\">“图录三月十五号定稿。”陆行舟说，“在那之前告诉我就行。”<\/p>\n<p data-p=\"51\">陆行舟走了以后，范小满在空了一半的修复室里，把那张清单从头到尾又看了一遍。<\/p>\n<p data-p=\"52\">按道理，这件事没什么好想的。<\/p>\n<p data-p=\"53\">她是五年前以编外合同工的身份进的一水阁。那一年馆里没有编制名额，她为了跟吴老师学手艺，还是来了。合同一年一签，工资从修复经费里出。如今经费砍了一半，等吴老师一退休，她那份合同还续不续得上，谁也说不准。嘉禾那边，薪水是现在的三倍，设备是进口的，还能亲手修完那本日记。<\/p>\n<p data-p=\"54\">年前她跟母亲提过一句嘉禾。母亲正在擦桌子，头也没抬：“去。三倍呢。高铁两个钟头，礼拜天就回来了。”<\/p>\n<p data-p=\"55\">连母亲都这么说。<\/p>\n<p data-p=\"56\">可她想起年前陆行舟给她看过的照片。嘉禾修复中心修好的书，补得干干净净，一点痕迹也看不出来。那是拍卖行的修法：书要卖钱，就不能让人看出它破过。那是吴老师说的第一种补法。<\/p>\n<p data-p=\"57\">她还想起吴老师。吴老师一退休，一水阁的修复室就只剩她一个会揭页的人。她要是走了，这间屋子里四十年的手艺，就断在她手上。<\/p>\n<p data-p=\"58\">还有那个不露面的买家。书修好了，进的是他家的柜子。那本日记，往后还有谁能看见？<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"59\">同一个星期，<b class=\"rn\" data-c=\"sunzhuren\">孙主任<\/b>又给<b class=\"rn\" data-c=\"linheng\">林衡<\/b>泡了一杯茶。<\/p>\n<p data-p=\"60\">林衡看着那杯茶，想起了三年前的老刘。<\/p>\n<p data-p=\"61\">“集团在马六甲海峡边上参股了一个港口，财务那边缺人，要派一个过去，一年。”孙主任说，“我推荐了你。”<\/p>\n<p data-p=\"62\">他把一份通知推过来。出发时间：四月初。派驻地点那一栏，写着一个林衡读过很多遍的地名。<\/p>\n<p data-p=\"63\">民国二十六年三月初九，船过马六甲。那是<b class=\"rn\" data-c=\"agen\">阿根<\/b>日记的第一页。<\/p>\n<p data-p=\"64\">集团这些年在海外参股的港口有好几个，偏偏缺人的是这一个。林衡想，这也说不上巧：马六甲海峡就那么窄，明州人往南走，八十多年前要从这里过，现在也要从这里过。<\/p>\n<p data-p=\"65\">“文化馆那份估值，战略部用了嘉禾的版本。”孙主任说，“你那份，就先放着吧。”<\/p>\n<p data-p=\"66\">林衡想说：嘉禾是卖家请的拍卖行，卖家请的人给买家估价，这在哪儿都说不过去。他没有说。<\/p>\n<p data-p=\"67\">“孙主任，”他说，“我能想一天吗？”<\/p>\n<p data-p=\"68\">孙主任端茶的手停了停。<\/p>\n<p data-p=\"69\">“想吧。”孙主任端起自己那杯茶，吹了吹，“不过小林，我跟你说句实话。你那份报告卡在我这儿，战略部憋着一口气；你爸那份说明，安全科也还压着没结。你在这儿一天，两件事就都挂着一天。你出去一年，风头过了，报告没人提，说明也就是一张纸。”<\/p>\n<p data-p=\"70\">他把茶杯放下。<\/p>\n<p data-p=\"71\">“外派补贴是本部的两倍。你家里，用得上。”<\/p>\n<p data-p=\"72\">那天夜里，林衡在出租屋里坐到很晚。<\/p>\n<p data-p=\"73\">他把这件事从头想了一遍。不去，报告接着卡，父亲的说明接着压，安全科哪天想起来，翻出来就是一个通报，而父亲离退休只剩两年。去，一年，风头就过了，父亲能平平安安退休，补贴还能给家里攒下一笔。<\/p>\n<p data-p=\"74\">这件事，怎么想都只有一个答案。<\/p>\n<p data-p=\"75\">只有一件事，他没想明白。<\/p>\n<p data-p=\"76\">他拿起手机，翻到范小满的对话框。上一条消息是她几天前发来的一张照片：日记里揭开的一页空白纸，对着光，什么也没有。<\/p>\n<p data-p=\"77\">他打了一行字：我四月可能要去马六甲，一年。<\/p>\n<p data-p=\"78\">又删了。<\/p>\n<p data-p=\"79\">他们之间什么也没说过。没说过，就没什么好商量的。他人要走一年，连自己在这家公司还能待几年都说不准，凭什么让一个人为他的一年改什么主意？<\/p>\n<p data-p=\"80\">一年不长，他想。她在明州修她的书，等他回来，她还在一水阁。<\/p>\n<p data-p=\"81\">第二天早上，他走进孙主任的办公室。<\/p>\n<p data-p=\"82\">“好的。”他说。<\/p>\n<p data-p=\"83\">这一回，他是想好了才说的。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"84\">那天晚上，林衡去了一水阁。<\/p>\n<p data-p=\"85\">修复室的灯还亮着。范小满一个人坐在透光台前，台子上什么也没有，灯光照着一块空玻璃，白得晃眼。<\/p>\n<p data-p=\"86\">“书走了。”她说。<\/p>\n<p data-p=\"87\">林衡在她对面坐下。架子空了一半，地上还留着搬运工踩出来的鞋印。<\/p>\n<p data-p=\"88\">她把这几天的事讲了一遍：意向书，遗产，三百一十二个勾，四十七册刻本和三十几个标的。她讲得很平，像在念一张清单。<\/p>\n<p data-p=\"89\">讲完了，透光台还在嗡嗡地响。<\/p>\n<p data-p=\"90\">“我四月要外派。”林衡说，“一年。”<\/p>\n<p data-p=\"91\">范小满看着他。<\/p>\n<p data-p=\"92\">“马六甲。”<\/p>\n<p data-p=\"93\">她的手从透光台上拿了下来，轻轻地说：“船过马六甲。”<\/p>\n<p data-p=\"94\">“嗯。”<\/p>\n<p data-p=\"95\">“你答应了？”<\/p>\n<p data-p=\"96\">“答应了。”<\/p>\n<p data-p=\"97\">她没有问为什么。<\/p>\n<p data-p=\"98\">透光台照着那块空玻璃，白得晃眼。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"99\">第二天一早，范小满去了嘉禾的库房。<\/p>\n<p data-p=\"100\">库房在城东的一个园区里，恒温恒湿，铁门，指纹锁。隔着一面玻璃墙，她看见那只樟木箱放在角落的货架上，箱盖上贴着一张白色标签，写着一个编号。<\/p>\n<p data-p=\"101\">那本日记就在里面。最后几页还粘在一起，没有人揭过。<\/p>\n<p data-p=\"102\">陆行舟从里面走出来，看见她，没有说话，等着。<\/p>\n<p data-p=\"103\">范小满把手掌贴在玻璃墙上。<\/p>\n<p data-p=\"104\">“给我三天。”她说。<\/p>", "paras": ["明州人送老人，讲究个热闹：来的人越多，花圈越多，说明这个人这辈子活得越体面。", "老先生的告别厅里，花圈只有七个。", "一个是一水阁送的，一个是旧书市场几个老摊主凑钱送的，剩下五个，挽联上的名字，范小满一个也不认识。来的人更少，稀稀拉拉站了两排，大半是头发全白的老人，彼此点个头，不怎么说话。", "沈浩站在家属的位置上，戴着黑袖箍，脸色发灰。仪式进行到一半，他口袋里的手机响了，是一首很欢快的流行歌。他手忙脚乱地掐掉，没过一分钟，又响了。", "他一共掐了三次，始终没有关机。范小满想起，初五那天，医院的第一个电话就是打给他的。那一回，他没接。", "吴老师站在她旁边，看着灵堂正中那张黑白照片，手里的眼镜盒开了又合上。", "“他年轻时候，天天来一水阁门口的旧书摊。”吴老师说，“看中一本书，钱不够，就站在那儿看，一看一下午。摊主赶他，他也不走。”", "“别人淘刻本，他专淘没人要的：账本，契约，旧信，当票。那时候废品站收来的旧纸，论斤卖，什么都有。我问过他，淘这些做什么。他说，一张纸上，是一家人的日子。”", "“您认识他？”", "“那时候我也年轻。”吴老师说，“认识谁不认识谁，有什么要紧。”", "告别仪式后的第三天，沈浩来了一水阁。", "他没进修复室，直接去了馆长办公室。半个钟头以后，馆长把范小满和吴老师叫了过去。", "事情说起来很简单。台风那年秋天，老先生签过一份捐赠意向书，说这批书修好以后捐给一水阁。可意向书不是捐赠协议。正式的协议要等清点和修复做完，由老先生本人签字，再经馆里论证。修复还没做完，老先生先住进了医院，一直没能签。", "“我爸签的是意向，不是协议。”沈浩说，“我问过律师了，书现在是遗产。”", "他说话的时候没看任何人，像在背一段准备了很久的话。", "“我知道你们修了半年。修复的费用，你们开个数，我认。可书我得拿回去。我欠的钱，下个月就到期了。”", "馆长没有说话。年前的预算会上，手工修复的经费刚砍了一半。馆里没钱买，也没有理由不放。", "“沈先生，”范小满开口了，“那本日记，最后几页还粘在一起，没有揭开。能不能再给我两个礼拜？”", "沈浩看了她一眼。这是他头一回正眼看她。", "“嘉禾春拍的图录，三月中旬就要定稿。”他说，“范老师，我等不起。”", "书是三月初拉走的。", "嘉禾来了一辆厢式货车，四个搬运工，还有陆行舟。", "按规矩，交接要一件一件点。一水阁这边负责点数的，是范小满。", "她站在修复室门口，手里一张清单，一共三百一十二行。搬运工抱出一箱，她念一行，核一件，打一个勾。", "明刻本，四十七册。她打了四十七个勾。", "账簿，契约，信札，票据。勾，勾，勾。", "那页嘉靖年间的修堤账夹在一块透明保护板里，被人小心地抬了出去。补纸还贴在原处，四百多年的老位置。勾。", "老先生收了它几十年。要不是那场台风，他大概到死也不会知道，那条补纸底下另有一个数。", "最后是那只樟木箱。清单上那一行写着：樟木箱一只，内日记一册（残）、织物一件、杂件若干。", "她看着那只箱子被抬上货车，在那一行后面打了一个勾。", "这是她做修复师的第五年。她给很多东西打过勾：入库的，出库的，修好的，修不好的。头一回觉得，一个勾这么难打。", "吴老师一直站在窗边，没过来帮忙，也没说话。最后一箱抬出门的时候，她说了一句：", "“修了半年，修好了，人家来拉走。”", "“吴老师……”", "“我不是说他。”吴老师说，“我是说咱们这行。”", "货车开走以后，陆行舟没有走。", "他等搬运工都上了车，才走过来。", "“刻本那四十七册，战略部已经谈妥了，走定向洽购，不上拍。”他说，“剩下的，沈先生要拆成三十几个标的，上春拍。”", "“拆开卖。”", "“拆开卖，价钱高一点，钱也来得快。他等不起。”", "范小满在清单最后一行底下，画了一道横线。", "“不过，”陆行舟说，“我这边有一个买家，愿意按估价把那三百来件杂件整批收下，一件不拆。”", "范小满抬起头。", "“他只有一个条件：这批东西要有人修，他要你来修。在嘉禾上海的修复中心，就是我年前跟你说的那个位置。”", "“他是谁？”", "“他不愿意露面。”陆行舟把车钥匙在手里转了一圈，“是个懂书的人。”", "范小满看着空了一半的书架。架子上还留着书箱压出来的印子，一个方块挨着一个方块。", "“最后那几页日记，”她问，“我能修吗？”", "“整批都是你的活。想怎么修，就怎么修。”", "她没有回答。", "“图录三月十五号定稿。”陆行舟说，“在那之前告诉我就行。”", "陆行舟走了以后，范小满在空了一半的修复室里，把那张清单从头到尾又看了一遍。", "按道理，这件事没什么好想的。", "她是五年前以编外合同工的身份进的一水阁。那一年馆里没有编制名额，她为了跟吴老师学手艺，还是来了。合同一年一签，工资从修复经费里出。如今经费砍了一半，等吴老师一退休，她那份合同还续不续得上，谁也说不准。嘉禾那边，薪水是现在的三倍，设备是进口的，还能亲手修完那本日记。", "年前她跟母亲提过一句嘉禾。母亲正在擦桌子，头也没抬：“去。三倍呢。高铁两个钟头，礼拜天就回来了。”", "连母亲都这么说。", "可她想起年前陆行舟给她看过的照片。嘉禾修复中心修好的书，补得干干净净，一点痕迹也看不出来。那是拍卖行的修法：书要卖钱，就不能让人看出它破过。那是吴老师说的第一种补法。", "她还想起吴老师。吴老师一退休，一水阁的修复室就只剩她一个会揭页的人。她要是走了，这间屋子里四十年的手艺，就断在她手上。", "还有那个不露面的买家。书修好了，进的是他家的柜子。那本日记，往后还有谁能看见？", "同一个星期，孙主任又给林衡泡了一杯茶。", "林衡看着那杯茶，想起了三年前的老刘。", "“集团在马六甲海峡边上参股了一个港口，财务那边缺人，要派一个过去，一年。”孙主任说，“我推荐了你。”", "他把一份通知推过来。出发时间：四月初。派驻地点那一栏，写着一个林衡读过很多遍的地名。", "民国二十六年三月初九，船过马六甲。那是阿根日记的第一页。", "集团这些年在海外参股的港口有好几个，偏偏缺人的是这一个。林衡想，这也说不上巧：马六甲海峡就那么窄，明州人往南走，八十多年前要从这里过，现在也要从这里过。", "“文化馆那份估值，战略部用了嘉禾的版本。”孙主任说，“你那份，就先放着吧。”", "林衡想说：嘉禾是卖家请的拍卖行，卖家请的人给买家估价，这在哪儿都说不过去。他没有说。", "“孙主任，”他说，“我能想一天吗？”", "孙主任端茶的手停了停。", "“想吧。”孙主任端起自己那杯茶，吹了吹，“不过小林，我跟你说句实话。你那份报告卡在我这儿，战略部憋着一口气；你爸那份说明，安全科也还压着没结。你在这儿一天，两件事就都挂着一天。你出去一年，风头过了，报告没人提，说明也就是一张纸。”", "他把茶杯放下。", "“外派补贴是本部的两倍。你家里，用得上。”", "那天夜里，林衡在出租屋里坐到很晚。", "他把这件事从头想了一遍。不去，报告接着卡，父亲的说明接着压，安全科哪天想起来，翻出来就是一个通报，而父亲离退休只剩两年。去，一年，风头就过了，父亲能平平安安退休，补贴还能给家里攒下一笔。", "这件事，怎么想都只有一个答案。", "只有一件事，他没想明白。", "他拿起手机，翻到范小满的对话框。上一条消息是她几天前发来的一张照片：日记里揭开的一页空白纸，对着光，什么也没有。", "他打了一行字：我四月可能要去马六甲，一年。", "又删了。", "他们之间什么也没说过。没说过，就没什么好商量的。他人要走一年，连自己在这家公司还能待几年都说不准，凭什么让一个人为他的一年改什么主意？", "一年不长，他想。她在明州修她的书，等他回来，她还在一水阁。", "第二天早上，他走进孙主任的办公室。", "“好的。”他说。", "这一回，他是想好了才说的。", "那天晚上，林衡去了一水阁。", "修复室的灯还亮着。范小满一个人坐在透光台前，台子上什么也没有，灯光照着一块空玻璃，白得晃眼。", "“书走了。”她说。", "林衡在她对面坐下。架子空了一半，地上还留着搬运工踩出来的鞋印。", "她把这几天的事讲了一遍：意向书，遗产，三百一十二个勾，四十七册刻本和三十几个标的。她讲得很平，像在念一张清单。", "讲完了，透光台还在嗡嗡地响。", "“我四月要外派。”林衡说，“一年。”", "范小满看着他。", "“马六甲。”", "她的手从透光台上拿了下来，轻轻地说：“船过马六甲。”", "“嗯。”", "“你答应了？”", "“答应了。”", "她没有问为什么。", "透光台照着那块空玻璃，白得晃眼。", "第二天一早，范小满去了嘉禾的库房。", "库房在城东的一个园区里，恒温恒湿，铁门，指纹锁。隔着一面玻璃墙，她看见那只樟木箱放在角落的货架上，箱盖上贴着一张白色标签，写着一个编号。", "那本日记就在里面。最后几页还粘在一起，没有人揭过。", "陆行舟从里面走出来，看见她，没有说话，等着。", "范小满把手掌贴在玻璃墙上。", "“给我三天。”她说。"], "recap": "林母请范小满初三来家里吃饭，好让冷战的父子坐到一张桌上。范小满把父子俩互相夹不出去的鱼肚和蟹钳各自放了回去。洗碗时，林母讲了一件旧事：林衡考上过研究生，读民国的钱和账，因为父亲摔伤了腰，他把通知书收进了抽屉。大年初五，老先生走了。"}, {"n": 14, "cn": "十四", "title": "龙门吊", "era": "", "chars": 2373, "mins": 6, "html": "<p data-p=\"0\">三月初的一个早上，港区起了大雾。<\/p>\n<p data-p=\"1\">明州的雾是从海上来的，不声不响，一夜之间就把整个港区吞了进去。早上六点，港调中心发了通知：能见度不足五十米，全港停止作业。<\/p>\n<p data-p=\"2\">龙门吊一台一台停在原地，像一排站着睡着了的巨人。<\/p>\n<p data-p=\"3\"><b class=\"rn\" data-c=\"linheng\">林衡<\/b>是七点钟到的。<\/p>\n<p data-p=\"4\">他在港区大门口给班长老胡打了个电话。老胡在电话里嗓门一下子高了：“财务部的上龙门吊？你上来查账啊？”<\/p>\n<p data-p=\"5\">“我找我爸。”<\/p>\n<p data-p=\"6\">老胡那头咳了一声，说：“你等着。”<\/p>\n<p data-p=\"7\">上龙门吊要登记，要戴安全帽，要系安全带，还要有人带着。老胡一样一样办了，又从工具间里翻出一顶旧安全帽，扣在他头上。帽子大了一号，一低头就往下滑。<\/p>\n<p data-p=\"8\">“你爸在上面坐了一早上了。”老胡说，“停机了也不下来，说是点检。点什么检，他就是不想下来。”<\/p>\n<p data-p=\"9\">林衡抬头看。那台龙门吊的上半截全埋在雾里，只看得见底下的钢腿和一截梯子，往上，往上，消失在一片白里。<\/p>\n<p data-p=\"10\">父亲在这台吊上开了三十年，他一次也没上去过。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"11\">四十米的梯子，他爬了二十分钟。<\/p>\n<p data-p=\"12\">爬到一半，他犯了一个错误：往下看了一眼。雾在脚底下，地面已经看不见了，只有一截一截的铁梯伸进白茫茫里，像是从来没有过底。<\/p>\n<p data-p=\"13\">他抓着扶手，手心里全是汗，在半空停了一分多钟。<\/p>\n<p data-p=\"14\">父亲说过，这梯子他闭着眼睛都能爬。林衡一直以为那是吹牛。现在他知道了，那是真的。他还知道了，人闭着眼睛爬，大概是因为不敢睁开。<\/p>\n<p data-p=\"15\">驾驶室的门开着一条缝。<\/p>\n<p data-p=\"16\"><b class=\"rn\" data-c=\"linjianguo\">林建国<\/b>坐在里面，面前摆着一个保温杯和一个铝饭盒，饭盒里是<b class=\"rn\" data-c=\"linmu\">林母<\/b>装的年糕。安全帽挂在一旁，那张贴纸还在：安全第一，老婆第二。<\/p>\n<p data-p=\"17\">他看见儿子从门口探进半个身子，脸白得跟窗外的雾一个颜色，手里那块年糕停在了嘴边。<\/p>\n<p data-p=\"18\">“你上来做啥？”<\/p>\n<p data-p=\"19\">“……看看。”<\/p>\n<p data-p=\"20\">“看什么？雾这么大，啥也看不见。”<\/p>\n<p data-p=\"21\">林衡挤进来，在旁边那张小折叠凳上坐下。驾驶室很窄，两个男人坐着，膝盖几乎碰在一起。<\/p>\n<p data-p=\"22\">在家里，父亲看见他进门，会起身去阳台抽烟。在这里，四十米高，父亲哪儿也去不了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"23\">两个人对着窗外的雾坐着。保温杯上的热气，一缕一缕往上冒。<\/p>\n<p data-p=\"24\">林建国的手机响了一声，是林母的一条语音。他手指一滑，点成了外放。<\/p>\n<p data-p=\"25\">“老林，衡衡今天一早去港区了，八成是去找你的。你别跟他吵啊，你别跟他说是我说的……”<\/p>\n<p data-p=\"26\">驾驶室里安静了。<\/p>\n<p data-p=\"27\">林衡看着父亲，父亲看着手机。<\/p>\n<p data-p=\"28\">林建国把手机扣在仪表台上，咳了一声。<\/p>\n<p data-p=\"29\">“你妈，”他说，“两头传话，传了三个月了。”<\/p>\n<p data-p=\"30\">“我知道。”林衡说，“她跟我也是这么说的。”<\/p>\n<p data-p=\"31\">父子俩对视了一眼，都没忍住，笑了一下。笑得很短，可总归是笑了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"32\">“你外派的事，”林建国先开了口，“你妈跟我说了。”<\/p>\n<p data-p=\"33\">“嗯。”<\/p>\n<p data-p=\"34\">“<b class=\"rn\" data-c=\"sunzhuren\">孙主任<\/b>让你出去的？”<\/p>\n<p data-p=\"35\">“我自己答应的。”<\/p>\n<p data-p=\"36\">林建国看了他一眼。<\/p>\n<p data-p=\"37\">“你答应，是为了我那张说明。”<\/p>\n<p data-p=\"38\">林衡低头看着自己的鞋。<\/p>\n<p data-p=\"39\">“我在港区干了三十年，什么事是怎么回事，我还看不明白？”林建国说，“你出去一年，报告没人提了，安全科那张纸也就压箱底了。你是这么想的。”<\/p>\n<p data-p=\"40\">窗外的雾动了一下，露出远处一截集装箱的边角，又合上了。<\/p>\n<p data-p=\"41\">“你小时候就这样。家里没钱，你从来不要东西。人家孩子过年要新衣裳，你说旧的还能穿。你妈逢人就说你懂事。”<\/p>\n<p data-p=\"42\">他拿起保温杯喝了一口。<\/p>\n<p data-p=\"43\">“懂什么事。就是什么都替别人想好了，自己那份，从来不要。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"44\">雾慢慢散了一些。底下的港区一点一点露出来：一排排集装箱，红的、蓝的、灰的，码得整整齐齐；远处的泊位上停着一艘巨轮，船身大得像一堵墙。<\/p>\n<p data-p=\"45\">林建国看着那些集装箱，忽然说：“台风那天晚上，我就在这上面。”<\/p>\n<p data-p=\"46\">“我知道。”<\/p>\n<p data-p=\"47\">“你不知道。”<\/p>\n<p data-p=\"48\">他把保温杯拧开，又拧上。<\/p>\n<p data-p=\"49\">“那天晚上群里发了几张照片，一摞一摞的旧书，泡了水，摊在台阶上。我本来没想管。台风天，谁家的东西不泡水？”<\/p>\n<p data-p=\"50\">“后来我把照片放大了。有一本是摊开的，里面是红格子，毛笔字，一行一行的数目。”<\/p>\n<p data-p=\"51\">他看着窗外。<\/p>\n<p data-p=\"52\">“跟你屋里那一墙的东西，一个样。”<\/p>\n<p data-p=\"53\">林衡转过头看着他。<\/p>\n<p data-p=\"54\">“我那时候想，这要是你的书，泡成这样，你得心疼成什么样。”林建国说，“我就开了那只箱子。箱子其实早修好了，就是单子没走完。我还是怕它半夜停机，下了班，在箱子边上守了一夜。”<\/p>\n<p data-p=\"55\">“你那张通知书，你妈收拾屋子翻出来的那天，我在阳台上坐了一夜。经济史，明州大学。你考上了，没去，因为我那年摔了腰。”<\/p>\n<p data-p=\"56\">“爸——”<\/p>\n<p data-p=\"57\">“这些年，我一直觉得欠你一样东西。”林建国说，“开那只箱子的时候我就想，还一点是一点。”<\/p>\n<p data-p=\"58\">林衡看着父亲。父亲没看他，看着窗外。雾里透出来的光照在他的侧脸上，皱纹很深，鬓角全白了。林衡忽然发现，他已经很多年没有这样仔细看过父亲了。<\/p>\n<p data-p=\"59\">“我不后悔。”林衡说。<\/p>\n<p data-p=\"60\">“你不后悔，我后悔。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"61\">雾散得差不多了。太阳出来，照在海面上，一片白亮。远处响起第一声汽笛，港调的广播跟着响了：能见度恢复，各单位准备复工。<\/p>\n<p data-p=\"62\">林建国把饭盒收起来，盖好盖子。<\/p>\n<p data-p=\"63\">“你这辈子，”他说，“替别人想够了。小时候替你妈想，上班替领导想，那年替我想，现在又替我想。”<\/p>\n<p data-p=\"64\">他转过头，第一次正正地看着儿子。<\/p>\n<p data-p=\"65\">“这回替你自己想一回。我那两年，我自己扛。”<\/p>\n<p data-p=\"66\">林衡张了张嘴。<\/p>\n<p data-p=\"67\">“通报就通报，扣钱就扣钱，我五十八了，还怕这个？”林建国说，“你别为了我，躲到马六甲去。”<\/p>\n<p data-p=\"68\">他把饭盒塞进包里，拉上拉链。<\/p>\n<p data-p=\"69\">“你自己想要什么？”<\/p>\n<p data-p=\"70\">林衡没有马上回答。<\/p>\n<p data-p=\"71\">他想起那间空了一半的修复室，地上的鞋印，架子上一个挨一个的方块印。他想起自己那份报告最后一页上的那句话。他想起四十七个勾，和三十几个标的。<\/p>\n<p data-p=\"72\">“那批书，”他说，“不该拆开卖。”<\/p>\n<p data-p=\"73\">“那就去说。”<\/p>\n<p data-p=\"74\">“说给谁？孙主任不会往上送，<b class=\"rn\" data-c=\"hebuzhang\">何部长<\/b>不会批。”<\/p>\n<p data-p=\"75\">“谁说了算，就说给谁。”林建国说，“你讲你那些旧账本的时候，你妈都插不上嘴。拿出那个劲儿来。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"76\">下梯子比上梯子快。林衡发现，往下走的时候，只要不往下看就行了。<\/p>\n<p data-p=\"77\">走到港区大门口，他掏出手机，在企业微信里往下翻，翻过几十个群，翻到一个名字：<b class=\"rn\" data-c=\"zhengzong\">郑总<\/b>。<\/p>\n<p data-p=\"78\">他跟郑总说过的话加起来不超过二十句，最长的一句，是郑总拍着他的肩膀说“小林，讲得不错”。<\/p>\n<p data-p=\"79\">他打了一行字，删了，又打。改了七遍，最后发出去的是：<\/p>\n<p class=\"msg l\" data-p=\"80\">郑总您好，我是财务部林衡。关于文化馆那批书，能不能给我十分钟。<\/p>\n<p data-p=\"81\">发送。<\/p>\n<p data-p=\"82\">身后，龙门吊一台一台地动了起来。<\/p>", "paras": ["三月初的一个早上，港区起了大雾。", "明州的雾是从海上来的，不声不响，一夜之间就把整个港区吞了进去。早上六点，港调中心发了通知：能见度不足五十米，全港停止作业。", "龙门吊一台一台停在原地，像一排站着睡着了的巨人。", "林衡是七点钟到的。", "他在港区大门口给班长老胡打了个电话。老胡在电话里嗓门一下子高了：“财务部的上龙门吊？你上来查账啊？”", "“我找我爸。”", "老胡那头咳了一声，说：“你等着。”", "上龙门吊要登记，要戴安全帽，要系安全带，还要有人带着。老胡一样一样办了，又从工具间里翻出一顶旧安全帽，扣在他头上。帽子大了一号，一低头就往下滑。", "“你爸在上面坐了一早上了。”老胡说，“停机了也不下来，说是点检。点什么检，他就是不想下来。”", "林衡抬头看。那台龙门吊的上半截全埋在雾里，只看得见底下的钢腿和一截梯子，往上，往上，消失在一片白里。", "父亲在这台吊上开了三十年，他一次也没上去过。", "四十米的梯子，他爬了二十分钟。", "爬到一半，他犯了一个错误：往下看了一眼。雾在脚底下，地面已经看不见了，只有一截一截的铁梯伸进白茫茫里，像是从来没有过底。", "他抓着扶手，手心里全是汗，在半空停了一分多钟。", "父亲说过，这梯子他闭着眼睛都能爬。林衡一直以为那是吹牛。现在他知道了，那是真的。他还知道了，人闭着眼睛爬，大概是因为不敢睁开。", "驾驶室的门开着一条缝。", "林建国坐在里面，面前摆着一个保温杯和一个铝饭盒，饭盒里是林母装的年糕。安全帽挂在一旁，那张贴纸还在：安全第一，老婆第二。", "他看见儿子从门口探进半个身子，脸白得跟窗外的雾一个颜色，手里那块年糕停在了嘴边。", "“你上来做啥？”", "“……看看。”", "“看什么？雾这么大，啥也看不见。”", "林衡挤进来，在旁边那张小折叠凳上坐下。驾驶室很窄，两个男人坐着，膝盖几乎碰在一起。", "在家里，父亲看见他进门，会起身去阳台抽烟。在这里，四十米高，父亲哪儿也去不了。", "两个人对着窗外的雾坐着。保温杯上的热气，一缕一缕往上冒。", "林建国的手机响了一声，是林母的一条语音。他手指一滑，点成了外放。", "“老林，衡衡今天一早去港区了，八成是去找你的。你别跟他吵啊，你别跟他说是我说的……”", "驾驶室里安静了。", "林衡看着父亲，父亲看着手机。", "林建国把手机扣在仪表台上，咳了一声。", "“你妈，”他说，“两头传话，传了三个月了。”", "“我知道。”林衡说，“她跟我也是这么说的。”", "父子俩对视了一眼，都没忍住，笑了一下。笑得很短，可总归是笑了。", "“你外派的事，”林建国先开了口，“你妈跟我说了。”", "“嗯。”", "“孙主任让你出去的？”", "“我自己答应的。”", "林建国看了他一眼。", "“你答应，是为了我那张说明。”", "林衡低头看着自己的鞋。", "“我在港区干了三十年，什么事是怎么回事，我还看不明白？”林建国说，“你出去一年，报告没人提了，安全科那张纸也就压箱底了。你是这么想的。”", "窗外的雾动了一下，露出远处一截集装箱的边角，又合上了。", "“你小时候就这样。家里没钱，你从来不要东西。人家孩子过年要新衣裳，你说旧的还能穿。你妈逢人就说你懂事。”", "他拿起保温杯喝了一口。", "“懂什么事。就是什么都替别人想好了，自己那份，从来不要。”", "雾慢慢散了一些。底下的港区一点一点露出来：一排排集装箱，红的、蓝的、灰的，码得整整齐齐；远处的泊位上停着一艘巨轮，船身大得像一堵墙。", "林建国看着那些集装箱，忽然说：“台风那天晚上，我就在这上面。”", "“我知道。”", "“你不知道。”", "他把保温杯拧开，又拧上。", "“那天晚上群里发了几张照片，一摞一摞的旧书，泡了水，摊在台阶上。我本来没想管。台风天，谁家的东西不泡水？”", "“后来我把照片放大了。有一本是摊开的，里面是红格子，毛笔字，一行一行的数目。”", "他看着窗外。", "“跟你屋里那一墙的东西，一个样。”", "林衡转过头看着他。", "“我那时候想，这要是你的书，泡成这样，你得心疼成什么样。”林建国说，“我就开了那只箱子。箱子其实早修好了，就是单子没走完。我还是怕它半夜停机，下了班，在箱子边上守了一夜。”", "“你那张通知书，你妈收拾屋子翻出来的那天，我在阳台上坐了一夜。经济史，明州大学。你考上了，没去，因为我那年摔了腰。”", "“爸——”", "“这些年，我一直觉得欠你一样东西。”林建国说，“开那只箱子的时候我就想，还一点是一点。”", "林衡看着父亲。父亲没看他，看着窗外。雾里透出来的光照在他的侧脸上，皱纹很深，鬓角全白了。林衡忽然发现，他已经很多年没有这样仔细看过父亲了。", "“我不后悔。”林衡说。", "“你不后悔，我后悔。”", "雾散得差不多了。太阳出来，照在海面上，一片白亮。远处响起第一声汽笛，港调的广播跟着响了：能见度恢复，各单位准备复工。", "林建国把饭盒收起来，盖好盖子。", "“你这辈子，”他说，“替别人想够了。小时候替你妈想，上班替领导想，那年替我想，现在又替我想。”", "他转过头，第一次正正地看着儿子。", "“这回替你自己想一回。我那两年，我自己扛。”", "林衡张了张嘴。", "“通报就通报，扣钱就扣钱，我五十八了，还怕这个？”林建国说，“你别为了我，躲到马六甲去。”", "他把饭盒塞进包里，拉上拉链。", "“你自己想要什么？”", "林衡没有马上回答。", "他想起那间空了一半的修复室，地上的鞋印，架子上一个挨一个的方块印。他想起自己那份报告最后一页上的那句话。他想起四十七个勾，和三十几个标的。", "“那批书，”他说，“不该拆开卖。”", "“那就去说。”", "“说给谁？孙主任不会往上送，何部长不会批。”", "“谁说了算，就说给谁。”林建国说，“你讲你那些旧账本的时候，你妈都插不上嘴。拿出那个劲儿来。”", "下梯子比上梯子快。林衡发现，往下走的时候，只要不往下看就行了。", "走到港区大门口，他掏出手机，在企业微信里往下翻，翻过几十个群，翻到一个名字：郑总。", "他跟郑总说过的话加起来不超过二十句，最长的一句，是郑总拍着他的肩膀说“小林，讲得不错”。", "他打了一行字，删了，又打。改了七遍，最后发出去的是：", "郑总您好，我是财务部林衡。关于文化馆那批书，能不能给我十分钟。", "发送。", "身后，龙门吊一台一台地动了起来。"], "recap": "老先生的儿子沈浩说书是遗产，要拿回去还债。三百一十二件书被拉去嘉禾，准备拆成三十几个标的上春拍。陆行舟说有个买家愿意整批收下杂件，条件是范小满去上海修。林衡答应外派马六甲一年。范小满对陆行舟说：给我三天。"}, {"n": 15, "cn": "十五", "title": "存折", "era": "", "chars": 2546, "mins": 7, "html": "<p data-p=\"0\">第三天，<b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>起得很早。<\/p>\n<p data-p=\"1\">她先去了一水阁。<b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>已经在修复室里了，戴着老花镜，在补一本县志的书角。<\/p>\n<p data-p=\"2\">“吴老师，”她说，“我想去嘉禾。”<\/p>\n<p data-p=\"3\">吴老师手上没停。<\/p>\n<p data-p=\"4\">“那批杂件，有人要整批收，不拆，条件是我去修。”范小满说，“日记最后那几页，我想自己揭开。”<\/p>\n<p data-p=\"5\">吴老师把一小片补纸按平，用镊子压了压，才抬起头。<\/p>\n<p data-p=\"6\">“想好了？”<\/p>\n<p data-p=\"7\">“想好了。”<\/p>\n<p data-p=\"8\">“那就去。”吴老师又低下头，“修书的人跟着书走，没什么丢人的。”<\/p>\n<p data-p=\"9\">范小满站着没走。<\/p>\n<p data-p=\"10\">“还有事？”<\/p>\n<p data-p=\"11\">“您那四十年的手艺……”<\/p>\n<p data-p=\"12\">“手艺在你手上，又不在这间屋子里。”吴老师说，“去了上海，补纸的颜色给我调得差一点。听见没有？”<\/p>\n<p data-p=\"13\">“听见了。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"14\">嘉禾的库房里，<b class=\"rn\" data-c=\"luxingzhou\">陆行舟<\/b>已经在等她了。<\/p>\n<p data-p=\"15\">她只说了两个字：“我去。”<\/p>\n<p data-p=\"16\">陆行舟看着她，没有马上说话。他脸上的神情，不太像高兴。<\/p>\n<p data-p=\"17\">“五月一号到上海报到。”他说，“在那之前，库房里给你腾一间整理室，那批杂件，你先修着。沈先生那边，我去说。”<\/p>\n<p data-p=\"18\"><b class=\"rn\" data-c=\"shenhao\">沈浩<\/b>那边没费什么口舌。有人按估价整批收，钱比春拍来得还快，他没有不答应的道理。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"19\">整理室不大，一张工作台，一盏灯，墙上挂着一只温湿度计。范小满把自己的工具一样一样摆开：竹起子，镊子，排笔，喷壶，吸水纸。<\/p>\n<p data-p=\"20\">那本日记放在工作台正中。后面那十几页被水泡过又阴干，粘成了一整块，摸上去像一块纸做的砖。<\/p>\n<p data-p=\"21\">她先揭后封皮。<\/p>\n<p data-p=\"22\">封皮的衬纸早就松了，边上翘起一条缝。她用竹起子沿着那条缝一点一点挑进去，挑到一半，觉得底下有东西，硬硬的，比纸厚。<\/p>\n<p data-p=\"23\">她把衬纸慢慢掀开。<\/p>\n<p data-p=\"24\">一本小册子从封皮的夹层里滑出来，落在吸水纸上。<\/p>\n<p data-p=\"25\">蓝布面，巴掌大，边角磨得发白。封面贴着一张印好的签条：恒裕钱庄，存摺。签条底下，是毛笔写的户名：<\/p>\n<p class=\"zhang\" data-p=\"26\"><b class=\"rn\" data-c=\"xiuying\">周秀英<\/b>。<\/p>\n<p data-p=\"27\">范小满用镊子把签条翘起的一角压平，然后掏出手机，拨了<b class=\"rn\" data-c=\"linheng\">林衡<\/b>的号码。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"28\">林衡来的时候，带了一个笔记本。<\/p>\n<p data-p=\"29\">档案馆不让拍照。从一月起，他每个周末去一趟，用铅笔把恒裕总账里<b class=\"rn\" data-c=\"agen\">沈阿根<\/b>那几页一笔一笔抄下来。抄了七个周末，抄满了半本。<\/p>\n<p data-p=\"30\">进门前，他又看了一眼手机。发给<b class=\"rn\" data-c=\"zhengzong\">郑总<\/b>的那条消息，两天了，显示已读，没有回。<\/p>\n<p data-p=\"31\">嘉禾库房的规矩比档案馆还多：换鞋套，戴手套，不许带水，只许用铅笔。林衡一样一样照办，戴着一副大了一号的白手套走进整理室，觉得自己这半年进的地方，一个比一个规矩多。<\/p>\n<p data-p=\"32\">存折摊在工作台上。范小满把它往他那边推了推。<\/p>\n<p data-p=\"33\">“我看不懂。”她说，“数字都是些竖杠杠。”<\/p>\n<p data-p=\"34\">“苏州码子，钱庄记数用的。”<\/p>\n<p data-p=\"35\">他俯下身，一行一行往下看。<\/p>\n<p class=\"zhang\" data-p=\"36\">民国二十六年四月，收汇，沈阿根，叁元。<\/p>\n<p class=\"zhang\" data-p=\"37\">五月，收汇，叁元。六月，收汇，叁元。<\/p>\n<p data-p=\"38\">“阿根寄回来的钱，”他说，“她一分没动，全存在这里了。”<\/p>\n<p data-p=\"39\">他翻开笔记本，一行一行地对。恒裕总账上每一笔汇入，存折上都有一笔一样的。民国二十七年十一月，两边都空着；第二年二月，两边都是陆元。<\/p>\n<p data-p=\"40\">“对得上。”<\/p>\n<p data-p=\"41\">他往后翻。民国二十八年，二十九年，三十年。每个月一笔，一笔不少。<\/p>\n<p data-p=\"42\">翻到民国三十一年，他停住了。<\/p>\n<p data-p=\"43\">总账上，那一年正月以后，只有一行朱笔字：沈阿根殁，汇款止。<\/p>\n<p data-p=\"44\">存折上，三月还有一笔。<\/p>\n<p data-p=\"45\">四月，还有。五月，还有。<\/p>\n<p data-p=\"46\">“这不对。”范小满说，“总账上都写了止，钱是从哪儿来的？”<\/p>\n<p data-p=\"47\">林衡没有马上回答。他把存折凑到灯底下，指着每一行开头的两个字。<\/p>\n<p data-p=\"48\">“前面这些年，每一笔写的都是'收汇'，钱是从香港汇过来的。”他的手指往下移，“从民国三十一年三月起，写的是'收现'。”<\/p>\n<p data-p=\"49\">“什么意思？”<\/p>\n<p data-p=\"50\">“现钱。”林衡说，“是有人拿着钱，自己走到柜台上，存进去的。”<\/p>\n<p data-p=\"51\">户名是周秀英。每一笔后面，照旧写着三个字：沈阿根。<\/p>\n<p data-p=\"52\">范小满明白了。<\/p>\n<p data-p=\"53\">死讯传来以后，秀英没有停。她每个月拿自己挣的钱，走到恒裕的柜台上，存一笔，记在他的名下。只看这本存折，看不出断过。<\/p>\n<p data-p=\"54\">工作台上很静。墙上温湿度计的指针轻轻抖了一下。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"55\">林衡往后翻。<\/p>\n<p data-p=\"56\">民国三十二年，三十三年，三十四年。一个月一笔，从来没断。抗战胜利以后，每一笔后面的零越来越多，一个比一个长。<\/p>\n<p data-p=\"57\">“这些零，”范小满问，“是她存得越来越多了？”<\/p>\n<p data-p=\"58\">“是钱越来越不值钱了。”<\/p>\n<p data-p=\"59\">林衡讲旧账本，向来停不下来。这一回，他说一句，停一句。<\/p>\n<p data-p=\"60\">“民国二十六年，阿根寄回来的叁元，够一家人吃上一阵子的米。打仗那几年，钞票换过一回；胜利以后又换一回，两百换一块。后来物价一天一个样。到民国三十七年八月出了金圆券，三百万换一块。”<\/p>\n<p data-p=\"61\">“她存了十一年。到最后，这一本折子里的钱，换不来一盒火柴。”<\/p>\n<p data-p=\"62\">范小满看着那些越来越长的零，看着那些一个月也没空过的格子，眼睛红了。这一回她没有把存折挪开，也没有转过身去。她就那样看着。<\/p>\n<p data-p=\"63\">林衡翻到了最后一页。<\/p>\n<p data-p=\"64\">最后一笔是民国三十七年三月，收现。<\/p>\n<p data-p=\"65\">再往下，格子空了。空格旁边有一行字，不是钱庄伙计那种端正的小楷，是另一个人写的，歪歪扭扭，一笔一画都很用力：<\/p>\n<p class=\"hand big\" data-p=\"66\">阿根归，止。<\/p>\n<p data-p=\"67\">林衡的手停在那一页上。<\/p>\n<p data-p=\"68\">范小满凑过来，看了一遍，又看了一遍。<\/p>\n<p data-p=\"69\">“阿根……归？”<\/p>\n<p data-p=\"70\">“归，”林衡说，“就是回来了。”<\/p>\n<p data-p=\"71\">“他没死？”<\/p>\n<p data-p=\"72\">“他没死。”<\/p>\n<p data-p=\"73\">林衡把笔记本翻回民国三十一年那一页，那行朱笔字还在：沈阿根殁，汇款止。他看看总账，又看看存折。两本账，一本说殁，一本说归。<\/p>\n<p data-p=\"74\">“总账记错了。”他说。<\/p>\n<p data-p=\"75\">他读了这么多年旧账本，头一回这样高兴，一本账记错了。<\/p>\n<p data-p=\"76\">“那这六年，他在哪儿？”范小满问。<\/p>\n<p data-p=\"77\">“账上没有。”林衡说，“星洲沦陷那三年多，南洋往国内的汇路全断了，人就算活着，也寄不出一个铜板。再往后的事，这本账也不知道。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"78\">是范小满先开的口。<\/p>\n<p data-p=\"79\">“她等到了。”<\/p>\n<p data-p=\"80\">“等了十一年。”林衡说。<\/p>\n<p data-p=\"81\">“是'止'，不是'取'。”范小满说，“她没把钱取出来。”<\/p>\n<p data-p=\"82\">“取出来也没用了。”<\/p>\n<p data-p=\"83\">“不是这个意思。”她摇摇头，“她只是不用再等了。”<\/p>\n<p data-p=\"84\">林衡没有接话。<\/p>\n<p data-p=\"85\">再过一个月，他就要去马六甲了。一年。<\/p>\n<p data-p=\"86\">他没有说。<\/p>\n<p data-p=\"87\">范小满把那本存折轻轻合上，用一张吸水纸包好，放在日记旁边。<\/p>\n<p data-p=\"88\">两样东西并排躺在灯底下。<\/p>\n<p data-p=\"89\">范小满忽然说：“<b class=\"rn\" data-c=\"laoxiansheng\">老先生<\/b>也姓沈。”<\/p>\n<p data-p=\"90\">林衡抬起头。<\/p>\n<p data-p=\"91\">林衡想起了台风那天夜里，老先生在电话里说的那一句：樟木箱里的，务必先救。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"92\">门上响了两下。陆行舟推门进来，手里拿着一个文件袋。<\/p>\n<p data-p=\"93\">“范老师，打扰一下。”他看见林衡，点了点头，“上海那边人事来电话了，入职材料下礼拜寄过去，五月一号报到。合同我先放这儿，你有空看看。”<\/p>\n<p data-p=\"94\">他把文件袋搁在门口的小桌上，又看了一眼工作台上那本存折，什么也没问，带上门走了。<\/p>\n<p data-p=\"95\">整理室里很静。<\/p>\n<p data-p=\"96\">林衡看着那个文件袋。范小满看着那本存折。<\/p>\n<p data-p=\"97\">他想起她在空修复室里说的那句“书走了”，想起这间库房，凭什么会给一水阁的修复师腾出一间屋子。<\/p>\n<p data-p=\"98\">林衡这才知道，她为了这几页纸，已经答应去上海了。<\/p>", "paras": ["第三天，范小满起得很早。", "她先去了一水阁。吴老师已经在修复室里了，戴着老花镜，在补一本县志的书角。", "“吴老师，”她说，“我想去嘉禾。”", "吴老师手上没停。", "“那批杂件，有人要整批收，不拆，条件是我去修。”范小满说，“日记最后那几页，我想自己揭开。”", "吴老师把一小片补纸按平，用镊子压了压，才抬起头。", "“想好了？”", "“想好了。”", "“那就去。”吴老师又低下头，“修书的人跟着书走，没什么丢人的。”", "范小满站着没走。", "“还有事？”", "“您那四十年的手艺……”", "“手艺在你手上，又不在这间屋子里。”吴老师说，“去了上海，补纸的颜色给我调得差一点。听见没有？”", "“听见了。”", "嘉禾的库房里，陆行舟已经在等她了。", "她只说了两个字：“我去。”", "陆行舟看着她，没有马上说话。他脸上的神情，不太像高兴。", "“五月一号到上海报到。”他说，“在那之前，库房里给你腾一间整理室，那批杂件，你先修着。沈先生那边，我去说。”", "沈浩那边没费什么口舌。有人按估价整批收，钱比春拍来得还快，他没有不答应的道理。", "整理室不大，一张工作台，一盏灯，墙上挂着一只温湿度计。范小满把自己的工具一样一样摆开：竹起子，镊子，排笔，喷壶，吸水纸。", "那本日记放在工作台正中。后面那十几页被水泡过又阴干，粘成了一整块，摸上去像一块纸做的砖。", "她先揭后封皮。", "封皮的衬纸早就松了，边上翘起一条缝。她用竹起子沿着那条缝一点一点挑进去，挑到一半，觉得底下有东西，硬硬的，比纸厚。", "她把衬纸慢慢掀开。", "一本小册子从封皮的夹层里滑出来，落在吸水纸上。", "蓝布面，巴掌大，边角磨得发白。封面贴着一张印好的签条：恒裕钱庄，存摺。签条底下，是毛笔写的户名：", "周秀英。", "范小满用镊子把签条翘起的一角压平，然后掏出手机，拨了林衡的号码。", "林衡来的时候，带了一个笔记本。", "档案馆不让拍照。从一月起，他每个周末去一趟，用铅笔把恒裕总账里沈阿根那几页一笔一笔抄下来。抄了七个周末，抄满了半本。", "进门前，他又看了一眼手机。发给郑总的那条消息，两天了，显示已读，没有回。", "嘉禾库房的规矩比档案馆还多：换鞋套，戴手套，不许带水，只许用铅笔。林衡一样一样照办，戴着一副大了一号的白手套走进整理室，觉得自己这半年进的地方，一个比一个规矩多。", "存折摊在工作台上。范小满把它往他那边推了推。", "“我看不懂。”她说，“数字都是些竖杠杠。”", "“苏州码子，钱庄记数用的。”", "他俯下身，一行一行往下看。", "民国二十六年四月，收汇，沈阿根，叁元。", "五月，收汇，叁元。六月，收汇，叁元。", "“阿根寄回来的钱，”他说，“她一分没动，全存在这里了。”", "他翻开笔记本，一行一行地对。恒裕总账上每一笔汇入，存折上都有一笔一样的。民国二十七年十一月，两边都空着；第二年二月，两边都是陆元。", "“对得上。”", "他往后翻。民国二十八年，二十九年，三十年。每个月一笔，一笔不少。", "翻到民国三十一年，他停住了。", "总账上，那一年正月以后，只有一行朱笔字：沈阿根殁，汇款止。", "存折上，三月还有一笔。", "四月，还有。五月，还有。", "“这不对。”范小满说，“总账上都写了止，钱是从哪儿来的？”", "林衡没有马上回答。他把存折凑到灯底下，指着每一行开头的两个字。", "“前面这些年，每一笔写的都是'收汇'，钱是从香港汇过来的。”他的手指往下移，“从民国三十一年三月起，写的是'收现'。”", "“什么意思？”", "“现钱。”林衡说，“是有人拿着钱，自己走到柜台上，存进去的。”", "户名是周秀英。每一笔后面，照旧写着三个字：沈阿根。", "范小满明白了。", "死讯传来以后，秀英没有停。她每个月拿自己挣的钱，走到恒裕的柜台上，存一笔，记在他的名下。只看这本存折，看不出断过。", "工作台上很静。墙上温湿度计的指针轻轻抖了一下。", "林衡往后翻。", "民国三十二年，三十三年，三十四年。一个月一笔，从来没断。抗战胜利以后，每一笔后面的零越来越多，一个比一个长。", "“这些零，”范小满问，“是她存得越来越多了？”", "“是钱越来越不值钱了。”", "林衡讲旧账本，向来停不下来。这一回，他说一句，停一句。", "“民国二十六年，阿根寄回来的叁元，够一家人吃上一阵子的米。打仗那几年，钞票换过一回；胜利以后又换一回，两百换一块。后来物价一天一个样。到民国三十七年八月出了金圆券，三百万换一块。”", "“她存了十一年。到最后，这一本折子里的钱，换不来一盒火柴。”", "范小满看着那些越来越长的零，看着那些一个月也没空过的格子，眼睛红了。这一回她没有把存折挪开，也没有转过身去。她就那样看着。", "林衡翻到了最后一页。", "最后一笔是民国三十七年三月，收现。", "再往下，格子空了。空格旁边有一行字，不是钱庄伙计那种端正的小楷，是另一个人写的，歪歪扭扭，一笔一画都很用力：", "阿根归，止。", "林衡的手停在那一页上。", "范小满凑过来，看了一遍，又看了一遍。", "“阿根……归？”", "“归，”林衡说，“就是回来了。”", "“他没死？”", "“他没死。”", "林衡把笔记本翻回民国三十一年那一页，那行朱笔字还在：沈阿根殁，汇款止。他看看总账，又看看存折。两本账，一本说殁，一本说归。", "“总账记错了。”他说。", "他读了这么多年旧账本，头一回这样高兴，一本账记错了。", "“那这六年，他在哪儿？”范小满问。", "“账上没有。”林衡说，“星洲沦陷那三年多，南洋往国内的汇路全断了，人就算活着，也寄不出一个铜板。再往后的事，这本账也不知道。”", "是范小满先开的口。", "“她等到了。”", "“等了十一年。”林衡说。", "“是'止'，不是'取'。”范小满说，“她没把钱取出来。”", "“取出来也没用了。”", "“不是这个意思。”她摇摇头，“她只是不用再等了。”", "林衡没有接话。", "再过一个月，他就要去马六甲了。一年。", "他没有说。", "范小满把那本存折轻轻合上，用一张吸水纸包好，放在日记旁边。", "两样东西并排躺在灯底下。", "范小满忽然说：“老先生也姓沈。”", "林衡抬起头。", "林衡想起了台风那天夜里，老先生在电话里说的那一句：樟木箱里的，务必先救。", "门上响了两下。陆行舟推门进来，手里拿着一个文件袋。", "“范老师，打扰一下。”他看见林衡，点了点头，“上海那边人事来电话了，入职材料下礼拜寄过去，五月一号报到。合同我先放这儿，你有空看看。”", "他把文件袋搁在门口的小桌上，又看了一眼工作台上那本存折，什么也没问，带上门走了。", "整理室里很静。", "林衡看着那个文件袋。范小满看着那本存折。", "他想起她在空修复室里说的那句“书走了”，想起这间库房，凭什么会给一水阁的修复师腾出一间屋子。", "林衡这才知道，她为了这几页纸，已经答应去上海了。"], "recap": "大雾停工的早上，林衡爬上父亲的龙门吊。林建国讲了台风那晚开箱子的原因，讲了那张通知书：这回替你自己想一回，我那两年，我自己扛。下了梯子，林衡给分管的郑总发了一条消息：能不能给我十分钟。"}, {"n": 16, "cn": "十六", "title": "潮水", "era": "民国三十一年", "chars": 1639, "mins": 5, "html": "<p data-p=\"0\">民国三十一年，三月初三。<\/p>\n<p data-p=\"1\">那天江北下着小雨。<\/p>\n<p data-p=\"2\">恒裕的伙计是午后来的。十七八岁，穿一件洗白了的长衫，没打伞，头发湿了一半。他在周家门口来回走了两趟，才敲门。<\/p>\n<p data-p=\"3\"><b class=\"rn\" data-c=\"xiuying\">秀英<\/b>开的门。<\/p>\n<p data-p=\"4\">伙计叫了一声“周家阿姐”，就不说话了。他从怀里掏出一张纸，又塞回去，又掏出来。<\/p>\n<p data-p=\"5\">秀英看着他手里那张纸。<\/p>\n<p data-p=\"6\">她认得的字不多。可有些事，用不着认字。<\/p>\n<p data-p=\"7\">“香港那边转过来的信。”伙计说，“正月里，星洲打下来那几天，<b class=\"rn\" data-c=\"agen\">阿根<\/b>哥那条船在外海叫炸沉了。同船有人逃出来，辗转到了香港，在代理处说……没看见阿根哥上岸。”<\/p>\n<p data-p=\"8\">他低下头。<\/p>\n<p data-p=\"9\">“掌柜让我来说一声。账上，要记了。”<\/p>\n<p data-p=\"10\">秀英站在门口，雨落在门槛上。<\/p>\n<p data-p=\"11\">她没有哭。<\/p>\n<p data-p=\"12\">“晓得了。”她说，“你进来擦擦头发。”<\/p>\n<p data-p=\"13\">伙计不肯进，鞠了一躬，走了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"14\">那天夜里，母亲在里屋咳嗽。<\/p>\n<p data-p=\"15\">秀英坐在灯底下，绣一块别人订的被面。鸳鸯戏水，一只鸳鸯绣好了，另一只才绣了半个头。<\/p>\n<p data-p=\"16\">她绣得很稳，一针是一针。<\/p>\n<p data-p=\"17\">母亲隔着门帘问：“阿英，下半日来的是啥人？”<\/p>\n<p data-p=\"18\">“恒裕的。”<\/p>\n<p data-p=\"19\">“啥事体？”<\/p>\n<p data-p=\"20\">秀英的针停了一下。<\/p>\n<p data-p=\"21\">“没啥，”她说，“问问账。”<\/p>\n<p data-p=\"22\">她把那半只鸳鸯绣完，已经是后半夜了。<\/p>\n<p data-p=\"23\">她想起民国二十六年正月十八，潮江上起了雾，他挑着铺盖站在船头，搪瓷缸挂在扁担上，一晃一晃。他说，明年清明回来。<\/p>\n<p data-p=\"24\">那年清明，他没回来。打仗了，船回不来，她不怪他。<\/p>\n<p data-p=\"25\">他寄钱。每个月一笔，没断过。打仗了，绕道香港，也没断过。有一回迟了三个月，她慌了，请代书先生多写了一封信。<b class=\"rn\" data-c=\"abao\">阿宝<\/b>寄回来二十块，说，莫慌，有我。后来那三个月的钱也到了，一个铜板也没少。<\/p>\n<p data-p=\"26\">他这个人，说话是算数的。<\/p>\n<p data-p=\"27\">他寄来的钱，她一个铜板也没动，全存在恒裕的折子上。旁人问她存这个做啥，她不说。<\/p>\n<p data-p=\"28\">她心里晓得做啥。<\/p>\n<p data-p=\"29\">那是一个家。等他回来，拿这笔钱置两张椅子，一张床，租一间朝南的屋。他坐在门口抽烟，她在窗底下绣花。<\/p>\n<p data-p=\"30\">折子上一个月一笔，一笔一笔，那个家就一点一点搭起来了。<\/p>\n<p data-p=\"31\">现在他们说，那条船沉了。<\/p>\n<p data-p=\"32\">秀英把绣绷放下，把灯芯拨小了一点。<\/p>\n<p data-p=\"33\">折子一断，那个家就搭不起来了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"34\">第二天一早，秀英换了一件干净衣裳，把这个月卖绣活的钱数了一遍，包在手帕里。<\/p>\n<p data-p=\"35\">恒裕总号在城里，要过江。桥头上有东洋兵设的卡子，过桥的人排成一长队，一个一个掏良民证。秀英排在队里，手帕包贴着胸口，一步一步往前挪。<\/p>\n<p data-p=\"36\">轮到她，东洋兵看了一眼证，又看了一眼她，挥挥手。<\/p>\n<p data-p=\"37\">她过了桥，没有回头。<\/p>\n<p data-p=\"38\">恒裕的柜台很高，要仰着头说话。柜台后头站着的，正是昨天那个伙计。<\/p>\n<p data-p=\"39\">他看见她，手里的笔掉在了柜台上。<\/p>\n<p data-p=\"40\">秀英把手帕包打开，把钱推上柜台。<\/p>\n<p data-p=\"41\">“存折子。”她说。<\/p>\n<p data-p=\"42\">伙计接过钱，又接过那本蓝布面的存摺，翻开，提起笔，又停住了。<\/p>\n<p data-p=\"43\">“阿姐，”他小声说，“户头上，昨天已经记了。”<\/p>\n<p data-p=\"44\">“我晓得。”<\/p>\n<p data-p=\"45\">“阿根哥他……”伙计的声音更低了，“人都没了。这个钱，你留着自己用吧。”<\/p>\n<p data-p=\"46\">秀英看着他。<\/p>\n<p data-p=\"47\">“照旧，”她说，“记在他名下。”<\/p>\n<p data-p=\"48\">伙计握着笔，笔尖上的墨滴下来一滴，洇在了吸墨纸上。<\/p>\n<p data-p=\"49\">然后他低下头，一笔一画地写：三月初四，收现，沈阿根。<\/p>\n<p data-p=\"50\">字写得很端正。写完，他把存摺递还给她。<\/p>\n<p data-p=\"51\">“阿姐，”他说，“下个月还来吗？”<\/p>\n<p data-p=\"52\">“来。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"53\">回江北的路上，雨停了。<\/p>\n<p data-p=\"54\">秀英走到潮江边，站了一会儿。江上有雾，跟那年正月一样，看不见对岸。<\/p>\n<p data-p=\"55\">她没站多久。母亲还等着吃午饭。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"56\">夜里，母亲睡下了。<\/p>\n<p data-p=\"57\">秀英从箱子底下翻出那块布。<\/p>\n<p data-p=\"58\">布是阿根托人从星洲带回来的，民国二十六年春天到的。一块蓝花布，不大，叠得方方正正，包在油纸里。随布来的信，是码头上的先生代写的，满纸套话，说“附上花布一方，聊表寸心”。布是什么颜色，他为什么偏偏买这一块，信上一个字也没有。<\/p>\n<p data-p=\"59\">她当时就回了信。信也是请代书先生写的，只在最底下，她自己歪歪扭扭添了一行：<\/p>\n<p class=\"hand\" data-p=\"60\">布收到了，没舍得做，等你回来再做。<\/p>\n<p data-p=\"61\">布一直没舍得做。五年了，还是那么新。<\/p>\n<p data-p=\"62\">她把布铺在桌上，用手掌一点一点抚平。<\/p>\n<p data-p=\"63\">海她是见过的。小时候跟父亲去潮江口外看过一回，海是黄的，浑的，跟江水差不多一个颜色，浪头一层一层推过来，带着泥腥气。阿根走之前跟她说过，南洋的海不一样，是蓝的，蓝得透亮，能看见水底下的鱼。<\/p>\n<p data-p=\"64\">那样的海，她没见过。<\/p>\n<p data-p=\"65\">她想，那边的海，大概就是这个颜色。<\/p>\n<p data-p=\"66\">她穿好针，挑了一根白丝线，在布的一角，绣下了第一道潮水。<\/p>", "paras": ["民国三十一年，三月初三。", "那天江北下着小雨。", "恒裕的伙计是午后来的。十七八岁，穿一件洗白了的长衫，没打伞，头发湿了一半。他在周家门口来回走了两趟，才敲门。", "秀英开的门。", "伙计叫了一声“周家阿姐”，就不说话了。他从怀里掏出一张纸，又塞回去，又掏出来。", "秀英看着他手里那张纸。", "她认得的字不多。可有些事，用不着认字。", "“香港那边转过来的信。”伙计说，“正月里，星洲打下来那几天，阿根哥那条船在外海叫炸沉了。同船有人逃出来，辗转到了香港，在代理处说……没看见阿根哥上岸。”", "他低下头。", "“掌柜让我来说一声。账上，要记了。”", "秀英站在门口，雨落在门槛上。", "她没有哭。", "“晓得了。”她说，“你进来擦擦头发。”", "伙计不肯进，鞠了一躬，走了。", "那天夜里，母亲在里屋咳嗽。", "秀英坐在灯底下，绣一块别人订的被面。鸳鸯戏水，一只鸳鸯绣好了，另一只才绣了半个头。", "她绣得很稳，一针是一针。", "母亲隔着门帘问：“阿英，下半日来的是啥人？”", "“恒裕的。”", "“啥事体？”", "秀英的针停了一下。", "“没啥，”她说，“问问账。”", "她把那半只鸳鸯绣完，已经是后半夜了。", "她想起民国二十六年正月十八，潮江上起了雾，他挑着铺盖站在船头，搪瓷缸挂在扁担上，一晃一晃。他说，明年清明回来。", "那年清明，他没回来。打仗了，船回不来，她不怪他。", "他寄钱。每个月一笔，没断过。打仗了，绕道香港，也没断过。有一回迟了三个月，她慌了，请代书先生多写了一封信。阿宝寄回来二十块，说，莫慌，有我。后来那三个月的钱也到了，一个铜板也没少。", "他这个人，说话是算数的。", "他寄来的钱，她一个铜板也没动，全存在恒裕的折子上。旁人问她存这个做啥，她不说。", "她心里晓得做啥。", "那是一个家。等他回来，拿这笔钱置两张椅子，一张床，租一间朝南的屋。他坐在门口抽烟，她在窗底下绣花。", "折子上一个月一笔，一笔一笔，那个家就一点一点搭起来了。", "现在他们说，那条船沉了。", "秀英把绣绷放下，把灯芯拨小了一点。", "折子一断，那个家就搭不起来了。", "第二天一早，秀英换了一件干净衣裳，把这个月卖绣活的钱数了一遍，包在手帕里。", "恒裕总号在城里，要过江。桥头上有东洋兵设的卡子，过桥的人排成一长队，一个一个掏良民证。秀英排在队里，手帕包贴着胸口，一步一步往前挪。", "轮到她，东洋兵看了一眼证，又看了一眼她，挥挥手。", "她过了桥，没有回头。", "恒裕的柜台很高，要仰着头说话。柜台后头站着的，正是昨天那个伙计。", "他看见她，手里的笔掉在了柜台上。", "秀英把手帕包打开，把钱推上柜台。", "“存折子。”她说。", "伙计接过钱，又接过那本蓝布面的存摺，翻开，提起笔，又停住了。", "“阿姐，”他小声说，“户头上，昨天已经记了。”", "“我晓得。”", "“阿根哥他……”伙计的声音更低了，“人都没了。这个钱，你留着自己用吧。”", "秀英看着他。", "“照旧，”她说，“记在他名下。”", "伙计握着笔，笔尖上的墨滴下来一滴，洇在了吸墨纸上。", "然后他低下头，一笔一画地写：三月初四，收现，沈阿根。", "字写得很端正。写完，他把存摺递还给她。", "“阿姐，”他说，“下个月还来吗？”", "“来。”", "回江北的路上，雨停了。", "秀英走到潮江边，站了一会儿。江上有雾，跟那年正月一样，看不见对岸。", "她没站多久。母亲还等着吃午饭。", "夜里，母亲睡下了。", "秀英从箱子底下翻出那块布。", "布是阿根托人从星洲带回来的，民国二十六年春天到的。一块蓝花布，不大，叠得方方正正，包在油纸里。随布来的信，是码头上的先生代写的，满纸套话，说“附上花布一方，聊表寸心”。布是什么颜色，他为什么偏偏买这一块，信上一个字也没有。", "她当时就回了信。信也是请代书先生写的，只在最底下，她自己歪歪扭扭添了一行：", "布收到了，没舍得做，等你回来再做。", "布一直没舍得做。五年了，还是那么新。", "她把布铺在桌上，用手掌一点一点抚平。", "海她是见过的。小时候跟父亲去潮江口外看过一回，海是黄的，浑的，跟江水差不多一个颜色，浪头一层一层推过来，带着泥腥气。阿根走之前跟她说过，南洋的海不一样，是蓝的，蓝得透亮，能看见水底下的鱼。", "那样的海，她没见过。", "她想，那边的海，大概就是这个颜色。", "她穿好针，挑了一根白丝线，在布的一角，绣下了第一道潮水。"], "recap": "范小满答应去嘉禾，在日记的封皮夹层里揭出秀英的存折。总账上写着阿根殁，存折上却从民国三十一年三月起每月还有一笔，写的是“收现”：有人自己走到柜台上存进去的。最后一页，一行歪歪扭扭的字：阿根归，止。林衡这才知道，她为了这几页纸已经答应去上海了。"}, {"n": 17, "cn": "十七", "title": "后人", "era": "", "chars": 2736, "mins": 7, "html": "<p data-p=\"0\"><b class=\"rn\" data-c=\"linheng\">林衡<\/b>约<b class=\"rn\" data-c=\"luxingzhou\">陆行舟<\/b>，是在第二天晚上。<\/p>\n<p data-p=\"1\">地方是陆行舟定的，眉湖边那家馆子。林衡到的时候，陆行舟已经坐在靠窗那张桌子边了。就是那张桌子。去年冬天，林衡在窗外的柳树底下站过一个晚上。<\/p>\n<p data-p=\"2\">陆行舟给他倒了一杯茶。<\/p>\n<p data-p=\"3\">“上回给你买拿铁，你一口没喝。”他说，“后来我想，你大概是喝美式的。”<\/p>\n<p data-p=\"4\">“……我喝茶。”<\/p>\n<p data-p=\"5\">陆行舟笑了：“这家的茶不错。”<\/p>\n<p data-p=\"6\">林衡没有绕弯子。<\/p>\n<p data-p=\"7\">“她答应去上海，”他说，“是为了那几页日记。”<\/p>\n<p data-p=\"8\">“我知道。”<\/p>\n<p data-p=\"9\">“那不是她选的，是你给她的条件。”<\/p>\n<p data-p=\"10\">陆行舟没有否认。<\/p>\n<p data-p=\"11\">“我不是来求你的。”林衡说，“我只是想说，她该自己选。去上海也好，留在一水阁也好，都该是她自己想去，不是拿几页纸换的。”<\/p>\n<p data-p=\"12\">陆行舟把茶杯转了半圈。<\/p>\n<p data-p=\"13\">“你来找我，是要我放了她。”他说，“可你不求我把她让给你？”<\/p>\n<p data-p=\"14\">“她不是谁的。”林衡说，“谁也让不了谁。”<\/p>\n<p data-p=\"15\">窗外的湖上起了一点风，柳条在灯底下晃。<\/p>\n<p data-p=\"16\">“还有一件事。”林衡说，“你给战略部的那份估值，只估了四十七册刻本。”<\/p>\n<p data-p=\"17\">“那是他们要的。”<\/p>\n<p data-p=\"18\">“嘉禾是沈先生请的拍卖行。卖家请的人，给买家估价。”林衡说，“那份估值，你自己信吗？”<\/p>\n<p data-p=\"19\">陆行舟没有回答。他转过头，看着窗外的湖。<\/p>\n<p data-p=\"20\">“这批书真正值钱的地方在哪儿，”林衡说，“你比我懂。”<\/p>\n<p data-p=\"21\">那顿饭，两个人都没怎么动筷子。<\/p>\n<p data-p=\"22\">走的时候，陆行舟叫住他。<\/p>\n<p data-p=\"23\">“林先生，”他说，“你这个人，真的很难对付。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"24\">第二天下午，<b class=\"rn\" data-c=\"shenhao\">沈浩<\/b>来了嘉禾的库房。<\/p>\n<p data-p=\"25\">是陆行舟打的电话，只说是那批书的事，得他本人来看一看。沈浩来得很不情愿，在门口套鞋套的时候，嘴里一直嘟囔，说他下午还约了人谈事。<\/p>\n<p data-p=\"26\">整理室的工作台上摆着三样东西：一本日记，一本蓝布面的存摺，一本汇款簿。<\/p>\n<p data-p=\"27\"><b class=\"rn\" data-c=\"fanxiaoman\">范小满<\/b>把存摺翻开，推到他面前。<\/p>\n<p data-p=\"28\">“沈先生，您看看这个户名。”<\/p>\n<p data-p=\"29\">沈浩低头扫了一眼，正要开口，忽然停住了。<\/p>\n<p class=\"zhang\" data-p=\"30\"><b class=\"rn\" data-c=\"xiuying\">周秀英<\/b>。<\/p>\n<p data-p=\"31\">他弯下腰，凑近了看。<\/p>\n<p data-p=\"32\">“这是我奶奶。”他说。<\/p>\n<p data-p=\"33\">“写日记的那个人，叫<b class=\"rn\" data-c=\"agen\">沈阿根<\/b>。”范小满说。<\/p>\n<p data-p=\"34\">沈浩直起身，手在裤子上擦了擦。<\/p>\n<p data-p=\"35\">“我爷爷大名叫沈根生。”他说，“小时候，奶奶叫他……”<\/p>\n<p data-p=\"36\">他没说下去，嘴唇动了动，学着一个老太太的调子，很轻地拖了一声：“阿根——吃饭了——”<\/p>\n<p data-p=\"37\">“可他从来没说过跑船的事。问他，他就说是种地的。他一条腿不利索，问起来，也说是年轻时候种地摔的。”<\/p>\n<p data-p=\"38\">林衡想了想：“那些年，跟南洋沾边的事，能不提就不提。”<\/p>\n<p data-p=\"39\">林衡把这十一年讲给他听。他讲得很短：民国二十六年的正月，马六甲，每个月一笔的叁元，当掉的那件大衣，那行朱笔字，存折上的“收现”，最后那一行：阿根归，止。<\/p>\n<p data-p=\"40\">听到“收现”的时候，沈浩从口袋里摸出一根烟，想起这里不能抽，又放了回去。<\/p>\n<p data-p=\"41\">他问：“当大衣的那个，是我舅公？”<\/p>\n<p data-p=\"42\">林衡点点头。<\/p>\n<p data-p=\"43\">“我小时候见过他一回，过年来的，话很少，给我包了个红包。奶奶送他走，在门口站了很久。”沈浩说，“他一个人过了一辈子，在上海的银行里做到退休。”<\/p>\n<p data-p=\"44\">“他那本汇款簿，”林衡说，“是我在旧书市场买的。”<\/p>\n<p data-p=\"45\">沈浩抬起头看着他。<\/p>\n<p data-p=\"46\">“舅公走了以后，东西寄回明州，在老屋阁楼上堆了二十来年。老屋拆迁那年，我嫌占地方，一箱旧纸，论斤卖给了收旧货的。”他低着头，“我爸知道了，跟我吵了一架，骑着车把全城的旧书摊跑了一遍，买回来大半箱。”<\/p>\n<p data-p=\"47\">他把那根没点的烟在手里捏了捏。<\/p>\n<p data-p=\"48\">“没买全。”<\/p>\n<p data-p=\"49\">林衡想起那个花了三十块钱的下午。他在一堆废纸里翻出来的，原来是一个老人骑着车满城找、没有找回来的那一本。<\/p>\n<p data-p=\"50\">范小满打开樟木箱，从最底下捧出那块布。<\/p>\n<p data-p=\"51\">布铺在工作台上。蓝的，比海水浅一点，比天深一点。上面绣满了白色的潮水，一道挨着一道，从布的一角，一直绣到另一角。最后一道潮水旁边，绣着一只小船。<\/p>\n<p data-p=\"52\">船头朝里。<\/p>\n<p data-p=\"53\">沈浩盯着那只小船。<\/p>\n<p data-p=\"54\">“这块布我见过。”他说，“小时候奶奶的箱子，谁都不许碰。有一回我偷偷打开，被她打了一顿。那是她唯一一回打我。”<\/p>\n<p data-p=\"55\">“她跟我讲过一句话，我那时候听不懂。她说，往家开的船，船头朝里。”<\/p>\n<p data-p=\"56\">范小满在数那些潮水。她数得很慢，一道一道，指尖悬在布面上方，一点也不碰到。<\/p>\n<p data-p=\"57\">林衡在翻存摺，数那些写着“收现”的格子。<\/p>\n<p data-p=\"58\">两个人差不多同时停了下来。<\/p>\n<p data-p=\"59\">“七十三。”范小满说。<\/p>\n<p data-p=\"60\">“七十三。”林衡说。<\/p>\n<p data-p=\"61\">沈浩看看布，又看看存摺，没有问七十三是什么。<\/p>\n<p data-p=\"62\">整理室里很静。沈浩的手机又响了，还是那首很欢快的歌。<\/p>\n<p data-p=\"63\">这一回，他没有掐。<\/p>\n<p data-p=\"64\">手机响到最后一声，自己停了。<\/p>\n<p data-p=\"65\">沈浩低着头，肩膀一抽一抽的。父亲的告别会上，他掐了三次电话，一滴眼泪也没掉。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"66\">后来，三个人在库房门口站了一会儿。沈浩终于抽上了那根烟。<\/p>\n<p data-p=\"67\">“钱，我还是要还的。”他说，“下个月就到期，我没有别的办法。”<\/p>\n<p data-p=\"68\">林衡点点头。<\/p>\n<p data-p=\"69\">“可这批书，”沈浩把烟掐了，“不拆了。要卖就整批卖，谁买都行，一本也不许拆出去。”<\/p>\n<p data-p=\"70\">他想了想，又说：<\/p>\n<p data-p=\"71\">“那块布不卖。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"72\">当天晚上，陆行舟交出了一份新的估值。<\/p>\n<p data-p=\"73\">不是嘉禾的版本，是他用自己的名字签的。整批三百一十二件，连同那四十七册刻本，一起估。估值说明最后一页写着：此批藏品之价值，在于其完整；拆分出售，损失不可估量。<\/p>\n<p data-p=\"74\">这笔买卖里他自己的那份提成，他不要了。<\/p>\n<p data-p=\"75\">然后他去了整理室。<\/p>\n<p data-p=\"76\">范小满还在。她在给那块布做一个无酸纸的护套。<\/p>\n<p data-p=\"77\">陆行舟在门口站了一会儿。<\/p>\n<p data-p=\"78\">“上海那份合同，”他说，“你撕了吧。”<\/p>\n<p data-p=\"79\">范小满抬起头。<\/p>\n<p data-p=\"80\">“沈先生不拆了，整批卖。那个买家，也就用不着买了。”<\/p>\n<p data-p=\"81\">“那个买家……”<\/p>\n<p data-p=\"82\">“是我。”陆行舟说。<\/p>\n<p data-p=\"83\">他说得很轻松，像在说今天天气不错。<\/p>\n<p data-p=\"84\">“这些年攒了一点钱，刻本买不起，三百来件杂件，勉强够。我想，买下来，交给你修，修好了，总会有个去处。”他笑了一下，“现在用不着了。”<\/p>\n<p data-p=\"85\">范小满手里那张无酸纸，折到一半停住了。<\/p>\n<p data-p=\"86\">“你别这么看我。”陆行舟说，“我又不是做慈善。我想要什么，一直说得很清楚。”<\/p>\n<p data-p=\"87\">“上海那个位置，你想去，还是你的；不想去，就当我没说过。这一回，你自己选。”<\/p>\n<p data-p=\"88\">他转身要走，又回过头来。<\/p>\n<p data-p=\"89\">“范老师，有句话，本来轮不到我说。”<\/p>\n<p data-p=\"90\">“什么？”<\/p>\n<p data-p=\"91\">“他喜欢你。”陆行舟说，“我看得出来，<b class=\"rn\" data-c=\"wulaoshi\">吴老师<\/b>也看得出来。就你们两个，看不出来。”<\/p>\n<p data-p=\"92\">他带上门走了。<\/p>\n<p data-p=\"93\">范小满一个人坐在整理室里。那块布铺在她面前：七十三道潮水，一只船头朝里的小船。<\/p>\n<p data-p=\"94\">她给人下结论，向来只要三句话。陆行舟的三句话，第一次见面她就下好了：会说话，懂行，替卖家办事。后来她添了一句：是个好人。也就添了这一句。<\/p>\n<p data-p=\"95\">林衡的三句话，她改了一回又一回，改到后来，原来那三句一句也不剩了。<\/p>\n<p data-p=\"96\">她想，大概就是这个缘故。陆行舟想买下那批书，是因为她在乎那批书；林衡在乎那批书，是在认识她以前。他花三十块钱买回一本别人家的汇款簿，读了好几年，那时候他还不知道世上有个范小满。<\/p>\n<p data-p=\"97\">一个人为了她去在乎，一个人本来就在乎。前一个，她要欠他一辈子；后一个，她只要站在他旁边。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"98\">沈浩把整批出售的意向发给了港口集团战略部。按陆行舟的估值，整批的价钱，是那四十七册刻本的三倍还多。<\/p>\n<p data-p=\"99\">三天后，战略部回了话。<\/p>\n<p data-p=\"100\">沈浩在电话里把那句话念给林衡听，念得很慢：<\/p>\n<p data-p=\"101\">“文化馆预算只够四十七册。其余杂件，不收。”<\/p>\n<p data-p=\"102\">林衡挂了电话，打开企业微信。发给<b class=\"rn\" data-c=\"zhengzong\">郑总<\/b>的那条消息还停在那里：已读，没有回。<\/p>", "paras": ["林衡约陆行舟，是在第二天晚上。", "地方是陆行舟定的，眉湖边那家馆子。林衡到的时候，陆行舟已经坐在靠窗那张桌子边了。就是那张桌子。去年冬天，林衡在窗外的柳树底下站过一个晚上。", "陆行舟给他倒了一杯茶。", "“上回给你买拿铁，你一口没喝。”他说，“后来我想，你大概是喝美式的。”", "“……我喝茶。”", "陆行舟笑了：“这家的茶不错。”", "林衡没有绕弯子。", "“她答应去上海，”他说，“是为了那几页日记。”", "“我知道。”", "“那不是她选的，是你给她的条件。”", "陆行舟没有否认。", "“我不是来求你的。”林衡说，“我只是想说，她该自己选。去上海也好，留在一水阁也好，都该是她自己想去，不是拿几页纸换的。”", "陆行舟把茶杯转了半圈。", "“你来找我，是要我放了她。”他说，“可你不求我把她让给你？”", "“她不是谁的。”林衡说，“谁也让不了谁。”", "窗外的湖上起了一点风，柳条在灯底下晃。", "“还有一件事。”林衡说，“你给战略部的那份估值，只估了四十七册刻本。”", "“那是他们要的。”", "“嘉禾是沈先生请的拍卖行。卖家请的人，给买家估价。”林衡说，“那份估值，你自己信吗？”", "陆行舟没有回答。他转过头，看着窗外的湖。", "“这批书真正值钱的地方在哪儿，”林衡说，“你比我懂。”", "那顿饭，两个人都没怎么动筷子。", "走的时候，陆行舟叫住他。", "“林先生，”他说，“你这个人，真的很难对付。”", "第二天下午，沈浩来了嘉禾的库房。", "是陆行舟打的电话，只说是那批书的事，得他本人来看一看。沈浩来得很不情愿，在门口套鞋套的时候，嘴里一直嘟囔，说他下午还约了人谈事。", "整理室的工作台上摆着三样东西：一本日记，一本蓝布面的存摺，一本汇款簿。", "范小满把存摺翻开，推到他面前。", "“沈先生，您看看这个户名。”", "沈浩低头扫了一眼，正要开口，忽然停住了。", "周秀英。", "他弯下腰，凑近了看。", "“这是我奶奶。”他说。", "“写日记的那个人，叫沈阿根。”范小满说。", "沈浩直起身，手在裤子上擦了擦。", "“我爷爷大名叫沈根生。”他说，“小时候，奶奶叫他……”", "他没说下去，嘴唇动了动，学着一个老太太的调子，很轻地拖了一声：“阿根——吃饭了——”", "“可他从来没说过跑船的事。问他，他就说是种地的。他一条腿不利索，问起来，也说是年轻时候种地摔的。”", "林衡想了想：“那些年，跟南洋沾边的事，能不提就不提。”", "林衡把这十一年讲给他听。他讲得很短：民国二十六年的正月，马六甲，每个月一笔的叁元，当掉的那件大衣，那行朱笔字，存折上的“收现”，最后那一行：阿根归，止。", "听到“收现”的时候，沈浩从口袋里摸出一根烟，想起这里不能抽，又放了回去。", "他问：“当大衣的那个，是我舅公？”", "林衡点点头。", "“我小时候见过他一回，过年来的，话很少，给我包了个红包。奶奶送他走，在门口站了很久。”沈浩说，“他一个人过了一辈子，在上海的银行里做到退休。”", "“他那本汇款簿，”林衡说，“是我在旧书市场买的。”", "沈浩抬起头看着他。", "“舅公走了以后，东西寄回明州，在老屋阁楼上堆了二十来年。老屋拆迁那年，我嫌占地方，一箱旧纸，论斤卖给了收旧货的。”他低着头，“我爸知道了，跟我吵了一架，骑着车把全城的旧书摊跑了一遍，买回来大半箱。”", "他把那根没点的烟在手里捏了捏。", "“没买全。”", "林衡想起那个花了三十块钱的下午。他在一堆废纸里翻出来的，原来是一个老人骑着车满城找、没有找回来的那一本。", "范小满打开樟木箱，从最底下捧出那块布。", "布铺在工作台上。蓝的，比海水浅一点，比天深一点。上面绣满了白色的潮水，一道挨着一道，从布的一角，一直绣到另一角。最后一道潮水旁边，绣着一只小船。", "船头朝里。", "沈浩盯着那只小船。", "“这块布我见过。”他说，“小时候奶奶的箱子，谁都不许碰。有一回我偷偷打开，被她打了一顿。那是她唯一一回打我。”", "“她跟我讲过一句话，我那时候听不懂。她说，往家开的船，船头朝里。”", "范小满在数那些潮水。她数得很慢，一道一道，指尖悬在布面上方，一点也不碰到。", "林衡在翻存摺，数那些写着“收现”的格子。", "两个人差不多同时停了下来。", "“七十三。”范小满说。", "“七十三。”林衡说。", "沈浩看看布，又看看存摺，没有问七十三是什么。", "整理室里很静。沈浩的手机又响了，还是那首很欢快的歌。", "这一回，他没有掐。", "手机响到最后一声，自己停了。", "沈浩低着头，肩膀一抽一抽的。父亲的告别会上，他掐了三次电话，一滴眼泪也没掉。", "后来，三个人在库房门口站了一会儿。沈浩终于抽上了那
